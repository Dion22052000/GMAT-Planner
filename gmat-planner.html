f the people who responded to a company\u2019s advertisement for a job opening\nwere interviewed over the phone. Twenty percent of those interviewed over the phone, that\nis, 3 people, were asked to come to the company for a personal interview. How many people\nresponded to the advertisement?","opts":{"A":"16","B":"20"},"ans":"C","exp":"Since 20% of the 60% who responded were the 3 people who were asked to come for an\ninterview, it follows that 12% of those who responded were the 3 people who were asked to\ncome for an interview. Therefore, the number of those who responded is 3 \u00f7 0.12 = 25.\nThe correct answer is C."},{"n":92,"s":"Quan","t":"Problem Solving","d":"E","topic":"Arithmetic Interpretation of Graphs and Tables; Statistics","q":"For the 5 days shown in the graph, how many kilowatt-hours greater was the median daily\nelectricity use than the average (arithmetic mean) daily electricity use?","opts":{"A":"1","B":"2","C":"3","D":"4","E":"5"},"ans":"A","exp":"From the table, it follows that the list of the 5 daily numbers of kilowatt-hours in ascending\norder is 19, 24, 27, 29, 31. The median of this list is the middle number, which is 27. The\naverage of this list is the sum of the numbers in this list divided by 5, which is\n\n.\n\nTherefore, the amount by which the median of this list is greater than the average of this list is\n27 \u2013 26 = 1.\nThe correct answer is A."},{"n":93,"s":"Quan","t":"Problem Solving","d":"E","topic":"Arithmetic Applied Problems; Percents","q":"Of the 2,500 tons of ore mined daily at a quarry, 0.4 percent results in a certain pure metal. In\nhow many days of mining will the total amount of pure metal produced at the quarry be equal\nto the daily amount of ore mined?\nA.\n\n10\n\nB. 100\nC. 250\nD. 400\nE. 1,000","opts":{"B":"100","C":"250","D":"400","E":"1,000"},"ans":"C","exp":"Each day 0.4% of 2,500 tons, or (0.004)(2,500) = 10 tons of the pure metal is produced by\nmining ore at the quarry. At this rate, it will take\n\ndays to produce 2,500 tons of\n\nthe pure metal.\n\n\f\nThe correct answer is C."},{"n":94,"s":"Quan","t":"Problem Solving","d":"E","topic":"Arithmetic Applied Problems; Statistics","q":"An investor purchased 20 shares of a certain stock at a price of $45.75 per share. Later this\ninvestor purchased 30 more shares at a price of $46.25 per share. What was the average\n(arithmetic mean) price per share that this investor paid for the 50 shares?","opts":{"A":"$45.80","B":"$45.95","C":"$46.00","D":"$46.05","E":"$46.20"},"ans":"D","exp":"The average price per share paid for the 50 shares is the total price paid for the 50 shares\ndivided by 50. Since the total price paid is the price of 20 shares at $45.75 each plus the price\nof 30 shares at $46.25 each, the average price per share is\n, which is equal to\n\n.\n\nThe correct answer is D."},{"n":96,"s":"Quan","t":"Problem Solving","d":"E","topic":"Algebra Applied Problems; First-Degree Equations","q":"Mark bought a set of 6 flowerpots of different sizes at a total cost of $8.25. Each pot cost $0.25\nmore than the next one below it in size. What was the cost, in dollars, of the largest pot?","opts":{"A":"$1.75","B":"$1.85","C":"$2.00","D":"$2.15","E":"$2.30"},"ans":"C","exp":"Let C be the cost of the largest pot in dollars. Then, in dollars, the total cost 8.25 is equal to C +\n(C \u2212 0.25) + (C \u2212 0.50) + (C \u2212 0.75) + (C \u2212 1.00) + (C \u2212 1.25), or 6C \u2212 3.75. Therefore, 6C \u2212 3.75\n= 8.25, which when solved gives C = 2.\nThe correct answer is C."},{"n":97,"s":"Quan","t":"Problem Solving","d":"E","topic":"Arithmetic Order","q":"If r and s are positive integers and r \u2013 s = 6, which of the following has the greatest value?","opts":{"A":"2r","B":"2s","C":"r + s","D":"2r \u2013 s","E":"2s \u2013 r"},"ans":"A","exp":"Since we can assume that only one of the answer choices has the greatest value, any two\npositive integers r and s such that r \u2212 s = 6 can be used to identify that answer choice. The\ntable below shows the values of the answer choices for r = 7 and s = 1.\nanswer choice value when r = 7 and s = 1\n2r\n\n14\n\n2s\n\n2\n\nr+s\n\n8\n\n2r \u2013 s\n\n13\n\n2s \u2013 r\n\n\u22125\n\nFrom the table it follows that the first answer choice has the greatest value.\nAlternatively, an algebraic approach can be used to identify the greatest value without making\nthe assumption that only one of the answer choices always has the greatest value. First, using\ns = r \u2212 6, express each of the answer choices in terms of r. For example, in terms of r the\nanswer choice 2s \u2212 r is equal to 2(r \u2212 6) \u2212 r = r \u2013 12. The table below shows the answer\nchoices in terms of r.\nanswer choice answer choice in terms of r\n2r\n\n2r\n\n2s\n\n2r \u2212 12\n\nr+s\n\n2r \u2212 6\n\n2r \u2212 s\n\nr+6\n\n2s \u2212 r\n\nr \u2212 12\n\nFrom the second column of the table, it follows that, for each possible value of r, the first\nanswer choice 2r is the greatest of the first three answer choices and the fourth answer\nchoice 2r \u2212 s = r + 6 is the greater of the remaining two answer choices. Therefore, the greater\n"},{"n":98,"s":"Quan","t":"Problem Solving","d":"E","topic":"Arithmetic Applied Problems; Percents","q":"An auction house charges a commission of 15 percent on the first $50,000 of the sale price of\nan item, plus 10 percent on the amount of the sale price in excess of $50,000. What was the\nsale price of a painting for which the auction house charged a total commission of $24,000?","opts":{"A":"$115,000","B":"$160,000","C":"$215,000","D":"$240,000","E":"$365,000"},"ans":"C","exp":"Since the commission on $50,000 is (0.15)($50,000) = $7,500 and the total commission of\n$24,000 is $16,500 greater than $7,500, it follows that $16,500 of the total commission arises\nfrom the sale price in excess of $50,000. Therefore, 10% of the sale price in excess of $50,000\nis equal to $16,500, and hence the sale price in excess of $50,000 is $165,000 (because 10%\nof $165,000 is $16,500). Thus, the sale price is $50,000 + $165,000 = $215,000.\nAlternatively, let P be the sale price in dollars. Then the given information can be expressed as\na first-degree equation which can be solved for the value of P.\n24,000 = 0.15(50,000) + 0.10(P \u2212 50,000)\n24,000 = 7,500 + 0.10P \u2212 5,000\n21,500 = 0.10P\nP = 215,000\nThe correct answer is C."},{"n":99,"s":"Quan","t":"Problem Solving","d":"E","topic":"Algebra Ratios","q":"At a certain college there are twice as many English majors as history majors and three times\nas many English majors as mathematics majors. What is the ratio of the number of history\nmajors to the number of mathematics majors?","opts":{"A":"6 to 1","B":"3 to 2","C":"2 to 3","D":"1 to 5","E":"1 to 6"},"ans":"B","exp":"Let E, H, and M denote, respectively, the number of English, history, and mathematics majors.\nFrom the given information, it follows that E = 2H and E = 3M, or equivalently, H =\nand M =\n. Therefore,\n\n=\n\n=\n\n, and hence the ratio of the number of history majors to the\n\nnumber of mathematics majors is 3 to 2.\n\n\f\nThe correct answer is B."},{"n":100,"s":"Quan","t":"Problem Solving","d":"E","topic":"Algebra Formulas","q":"A certain method for calculating pediatric drug dosages states that if d is the adult dosage, in\nmilligrams, and y is the child\u2019s age, in years, then the child\u2019s dosage, in milligrams, is\n\n.\n\nIf the adult dosage for a particular drug is 800 milligrams, what is an 8-year-old child\u2019s\ndosage, in milligrams, according to this method?","opts":{"A":"200"},"ans":"E","exp":"From the given information, we know that d = 800 and y = 8. Therefore, the dosage, in\nmilligrams, for the 8-year-old child is\n\n.\n\nThe correct answer is E."},{"n":101,"s":"Quan","t":"Problem Solving","d":"M","topic":"Arithmetic Measurement Conversion","q":"The average distance between the Sun and a certain planet is approximately 2.3 \u00d7 1014 inches.\nWhich of the following is closest to the average distance between the Sun and the planet, in\nkilometers? (1 kilometer is approximately 3.9 \u00d7 104 inches.)","opts":{"A":"7.1 \u00d7 108","B":"5.9 \u00d7 109","C":"1.6 \u00d7 1010","D":"1.6 \u00d7 1011","E":"5.9 \u00d7 1011"},"ans":"B","exp":"Convert to kilometers and then estimate.\n(2.3 \u00d7 1014 in)\n\n=\n\n=\n\u2248\n\nkm\n\u00d7 1014 \u2013 4 km\n\u00d7 1010\n\n= 0.5 \u00d7 1010\n= 5 \u00d7 109\n\n\f\nThe correct answer is B."},{"n":102,"s":"Quan","t":"Problem Solving","d":"M","topic":"Arithmetic Statistics","q":"If m is the average (arithmetic mean) of the first 10 positive multiples of 5 and if M is the\nmedian of the first 10 positive multiples of 5, what is the value of M \u2013 m?","opts":{"A":"\u20135","B":"0","C":"5","D":"25","E":"27.5"},"ans":"B","exp":"The first 10 positive multiples of 5 are 5, 10, 15, 20, 25, 30, 35, 40, 45, and 50. From this, the\naverage of the 10 multiples, that is,\n\n, can be calculated:\n\nSince there is an even number of multiples, the median, M, is the average of the middle two\nnumbers, 25 and 30:\n.\nTherefore, the median minus the average is:\n.\nThis problem can also be solved as follows. Since the values can be grouped in pairs (i.e., 5\nand 50, 10 and 45, 15 and 40, etc.), each of which is symmetric with respect to the median, it\nfollows that the mean and median are equal.\nThe correct answer is B."},{"n":103,"s":"Quan","t":"Problem Solving","d":"M","topic":"Algebra Sets","q":"According to a survey of 200 people, 60 enjoy skiing and 80 enjoy skating. If the number of\npeople who enjoy neither skiing nor skating is 2 times the number of people who enjoy both\nskiing and skating, how many people surveyed enjoy neither skiing nor skating?","opts":{"A":"20","B":"40","C":"50","D":"80","E":"120"},"ans":"E","exp":"Determine the number of people who enjoy neither skiing nor skating.\n\n\f\nConsider the Venn diagram on the previous page, where A represents the number of people\nwho enjoy skiing only, B represents the number of people who enjoy skating only, and x is the\nnumber of people who enjoy both skiing and skating. As stated, the number of people who\nenjoy neither is twice the number who enjoy both, so 2x represents the number of people\nwho enjoy neither skiing nor skating. From the given information, it follows that 60 = A + x,\n80 = B + x, and 200 = A + x + B + 2x = (A + x) + (B + x) + x. By substitution, 200 = 60 + 80 + x,\nso x = 60 and 2x = 120.\nThe correct answer is E."},{"n":104,"s":"Quan","t":"Problem Solving","d":"M","topic":"Algebra Formulas","q":"If the relations shown hold for the operation \u2295 and the numbers m, n, p, q, and r, then","opts":{"A":"m","B":"n","C":"p","D":"q","E":"r"},"ans":"E","exp":"[(m \u2295 p) \u2295 q] \u2295 p\n\ngiven\n\n[n \u2295 q] \u2295 p\n\nm\u2295p=n\n\nq\u2295p\n\nn\u2295q=q\n\nr\n\nq\u2295p=r\n\n\f\nThe correct answer is E."},{"n":105,"s":"Quan","t":"Problem Solving","d":"M","topic":"Algebra Algebraic Expressions","q":"To rent a tractor, it costs a total of x dollars for the first 24 hours, plus y dollars per hour for\neach hour in excess of 24 hours. Which of the following represents the cost, in dollars, to rent\na tractor for 36 hours?","opts":{"A":"x + 12y","B":"x + 36y","C":"12x + y","D":"24x + 12y","E":"24x + 36y"},"ans":"A","exp":"Determine the cost to rent a tractor for 36 hours if the cost is x dollars for the first 24 hours\nand y dollars for each hour in excess of 24 hours.\nThe cost will be x dollars for the first 24 hours plus y dollars for each of 36 \u2212 24 = 12 hours.\nThus, the total cost of renting the tractor for 36 hours is (x + 12y) dollars.\nThe correct answer is A."},{"n":106,"s":"Quan","t":"Problem Solving","d":"M","topic":"Arithmetic Measurement Conversion","q":"If the mass of 1 cubic centimeter of a certain substance is 7.3 grams, what is the mass, in\nkilograms, of 1 cubic meter of this substance? (1 cubic meter = 1,000,000 cubic centimeters;\n1 kilogram = 1,000 grams)","opts":{"A":"0.0073","B":"0.73","C":"7.3","D":"7,300","E":"7,300,000"},"ans":"D","exp":"Determine the mass, in kilograms, of 1 cubic meter of a substance if the mass of 1 cubic\ncentimeter of this substance is 7.3 grams.\n1 cubic meter is 1,000,000 cubic centimeters and each cubic centimeter has a mass of\n7.3 grams, so 1 cubic meter has a mass of 7.3(1,000,000) = 7,300,000 grams. Then, since\n1 kilogram = 1,000 grams, 7,300,000 grams =\n\n= 7,300 kilograms.\n\nThe correct answer is D."},{"n":107,"s":"Quan","t":"Problem Solving","d":"M","topic":"Algebra Simplifying Algebraic Expressions","q":"If z \u2260 0 and z +\n\n, then w =","opts":{"A":"z + 1","B":"z2 + 1","C":"\u2212z2 + 1","D":"\u2212z2 + z + 1","E":"\u22122z2 + 1"},"ans":"C","exp":"Multiplying both sides of\n\n=z+\n\n= z2 + (1 \u2212\n\nby z gives w =\n\n2z2) = 1 \u2212 z2.\nThe correct answer is C."},{"n":108,"s":"Quan","t":"Problem Solving","d":"M","topic":"Algebra Formulas","q":"For all real numbers a, b, c, d, e, and f, the operation \u0398 is defined by the equation\n(a, b, c) \u0398 (d, e, f) = ad + be + cf. What is the value of (1, \u22122, 3) \u0398\n\n?","opts":{"A":"\u22121","C":"1"},"ans":"E","exp":"By definition, (1, \u22122, 3) \u0398\n\n= (1)(1) + (\u22122)\n\n+ (3)\n\n= 1 + 1 + 1 = 3.\n\nThe correct answer is E."},{"n":109,"s":"Quan","t":"Problem Solving","d":"M","topic":"Arithmetic Operations with Integers","q":"If m and p are positive integers and m2 + p2 < 100, what is the greatest possible value of mp?","opts":{"A":"36","B":"42","C":"48","D":"49","E":"51"},"ans":"D","exp":"Trying various integer values for m and corresponding values of p that satisfy m2 + p2 < 100\nmight be the quickest way to solve this problem. First, m < 10 and p < 10; otherwise,\nm2 + p2 < 100 is not true.\nIf m = 9, then for m2 + p2 < 100 to be true, p <\n\n=\n\n, so p \u2264 4, and the greatest\n\npossible value for mp is (9)(4) = 36.\nSimilarly, if m = 8, then p <\n\n=\n\n, so p \u2264 5, and the greatest possible value for mp\n\nis (8)(5) = 40.\nIf m = 7, then p <\n\n=\n\n, so p \u2264 7, and the greatest possible value for mp is (7)\n\n=\n\n, so p \u2264 7, and the greatest possible value for mp is (6)\n\n(7) = 49.\nIf m = 6, then p <\n(7) = 42.\n\n\f\nIf m \u2264 5 and p \u2264 9, it follows that mp \u2264 45.\nThus, the greatest possible value for mp is 49.\nThe correct answer is D."},{"n":110,"s":"Quan","t":"Problem Solving","d":"M","topic":"Algebra Ratio and Proportion","q":"If\n\n, which of the following must be true?\nI.\nII.\nIII.","opts":{"A":"I only","B":"II only","C":"I and II only","D":"I and III only","E":"I, II, and III"},"ans":"C","exp":"Equation I is true:\ngiven\ntake reciprocals\ngiven\nuse last two equations\nEquation II is true:\nEquation I (shown true)\ny=\n\nmultiply both sides by x\ndivide both sides by b\n\nEquation III is false, since otherwise it would follow that:\ny=\n\nfrom earlier\ndivide both sides by a\nuse Equation III (assumed true)\nmultiply both sides by b\n\n\f\nFrom this it follows that Equation III will hold only if\n\n= 1, which can be false. For example,\n\nif x = a = c = 1 and y = b = d = 2 (a choice of values for which\n\u2260 1 and Equation III is\n\nand\n\nare true), then\n\n, which is false.\n\nThe correct answer is C."},{"n":111,"s":"Quan","t":"Problem Solving","d":"M","topic":"Arithmetic Properties of Numbers","q":"If k is an integer and (0.0025)(0.025)(0.00025) \u00d7 10k is an integer, what is the least possible\nvalue of k?","opts":{"A":"\u201312","B":"\u20136","E":"12"},"ans":"E","exp":"Let N = (0.0025)(0.025)(0.00025) \u00d7 10k. Rewriting each of the decimals as an integer times a\npower of 10 gives N = (25 \u00d7 10\u22124)(25 \u00d7 10\u22123)(25 \u00d7 10\u22125) \u00d7 10k = (25)3 \u00d7 10k \u2212 12. Since the\nunits digit of (25)3 is 5, it follows that if k = 11, then the tenths digit of N would be 5, and thus\nN would not be an integer; and if k = 12, then N would be (25)3 \u00d7 100 = (25)3, which is an\ninteger. Therefore, the least value of k such that N is an integer is 12.\nThe correct answer is E."},{"n":112,"s":"Quan","t":"Problem Solving","d":"M","topic":"Algebra Second-Degree Equations","q":"If a(a + 2) = 24 and b(b + 2) = 24, where a \u2260 b, then a + b =","opts":{"A":"\u201348","B":"\u20132","D":"46","E":"48"},"ans":"B","exp":"a(a + 2) = 24\n\ngiven\n\na2 + 2a = 24\n\nuse distributive property\n\na2 + 2a \u2013 24 = 0\n\nsubtract 24 from both sides\n\n(a + 6)(a \u2013 4) = 0\n\nfactor\n\nSo, a + 6 = 0, which means that a = \u20136, or a \u2013 4 = 0, which means a = 4. The equation with the\nvariable b has the same solutions, and so b = \u20136 or b = 4.\nSince a \u2260 b, then a = \u20136 and b = 4, which means a + b = \u22126 + 4 = \u22122, or a = 4 and b = \u22126, which\nmeans that a + b = 4 + (\u22126) = \u22122\nThe correct answer is B."},{"n":113,"s":"Quan","t":"Problem Solving","d":"M","topic":"Algebra Percents","q":"In a recent election, Ms. Robbins received 8,000 votes cast by independent voters, that is,\nvoters not registered with a specific political party. She also received 10 percent of the votes\ncast by those voters registered with a political party. If N is the total number of votes cast in","opts":{},"ans":"E","exp":"If N represents the total number of votes cast and 40% of the votes cast were cast by\nindependent voters, then 60% of the votes cast, or 0.6N votes, were cast by voters registered\nwith a political party. Ms. Robbins received 10% of these, and so Ms. Robbins received (0.10)\n(0.6N) = 0.06N votes cast by voters registered with a political party. Thus, Ms. Robbins\nreceived 0.06N votes cast by voters registered with a political party and 8,000 votes cast by\nindependent voters, so she received 0.06N + 8,000 votes in all.\nThe correct answer is E."},{"n":114,"s":"Quan","t":"Problem Solving","d":"M","topic":"Arithmetic Applied Problems","q":"The profit P, in dollars, for any given month at a certain company is defined by P = I \u2212 C,\nwhere I represents total income, in dollars, and C represents total costs, in dollars, for the\nmonth. For each of the first 4 months of the year, C = I + 32,000; and for each of the next\n3 months, I = C + 36,000. If I = C + 10,000 for each of the 5 remaining months of the year,\nwhat was the company\u2019s total profit for the 12-month year?","opts":{"A":"$10,000","B":"$30,000","C":"$40,000","D":"$50,000","E":"$70,000"},"ans":"B","exp":"For each of the first 4 months, total costs exceeded total income by $32,000, and hence for\neach of 4 months total profit was \u2212$32,000. Also, for each of the next 3 months, total income\nexceeded total costs by $36,000, and hence for each of 3 months total profit was $36,000.\nFinally, for each of the remaining 5 months, total income exceeded total costs by $10,000, and\nhence for each of 5 months total profit was $10,000. Therefore, the total profit for the 12month year was 4(\u2212$32,000) + 3($36,000) + 5($10,000) = $30,000.\nAlternatively, the given equations can be easily manipulated to obtain the values of I \u2212 C for\neach month, as shown below.\n\n\f\nGiven\nEquation\n\nNumber\nof\nValue of I \u2212 C Months Net Profit\n\nC = I + 32,000 I \u2212 C = \u221232,000\n\n4\n\n\u2212$128,000\n\nI = C + 36,000 I \u2212 C = 36,000\n\n3\n\n$108,000\n\nI = C + 10,000 I \u2212 C = 10,000\n\n5\n\n$50,000\n\nAdding the values in the right-most column gives the total profit for the 12-month year: \u2212\n$128,000 + $108,000 + $50,000 = $30,000.\nThe correct answer is B."},{"n":115,"s":"Quan","t":"Problem Solving","d":"M","topic":"Arithmetic Statistics","q":"A manufacturer makes and sells 2 products, P and Q. The revenue from the sale of each unit of\nP is $20.00 and the revenue from the sale of each unit of Q is $17.00. Last year the\nmanufacturer sold twice as many units of Q as P. What was the manufacturer\u2019s average\n(arithmetic mean) revenue per unit sold of these 2 products last year?","opts":{"A":"$28.50","B":"$27.00","C":"$19.00","D":"$18.50","E":"$18.00"},"ans":"E","exp":"Let x represent the number of units of Product P the manufacturer sold last year. Then 2x\nrepresents the number of units of Product Q the manufacturer sold, and x + 2x = 3x\nrepresents the total number of units of Products P and Q the manufacturer sold. The total\nrevenue from the sale of Products P and Q was $(20x) + $(17(2x)) = $(54x), so the average\nrevenue per unit sold was\n\n= $18.\n\nThe correct answer is E."},{"n":116,"s":"Quan","t":"Problem Solving","d":"M","topic":"Arithmetic Remainders","q":"A worker carries jugs of liquid soap from a production line to a packing area, carrying 4 jugs\nper trip. If the jugs are packed into cartons that hold 7 jugs each, how many jugs are needed\nto fill the last partially filled carton after the worker has made 17 trips?","opts":{"A":"1","B":"2","C":"4","D":"5","E":"6"},"ans":"B","exp":"Carrying 4 jugs per trip, the worker carries a total of 4(17) = 68 jugs in 17 trips. At 7 jugs per\ncarton, these jugs will completely fill 9 cartons with 5 jugs left over since (9)(7) + 5 = 68. To fill\nthe 10th carton, 7 \u2013 5 = 2 jugs are needed.\n\n\f\nThe correct answer is B."},{"n":117,"s":"Quan","t":"Problem Solving","d":"M","topic":"Algebra First-Degree Equations","q":"Last year a state senate consisting of only Republican and Democrat members had 20 more\nRepublican members than Democrat members. This year the senate has the same number of\nmembers as last year, but it has 2 fewer Republican members than last year. If this year the\nnumber of Republican members is\n\nthe number of senate members, how many members\n\ndoes the senate have this year?","opts":{"A":"33"},"ans":"E","exp":"Let D be the number of Democrat members last year. Then D + 20 is the number of\nRepublican members last year and (D + 20) \u2212 2 = D + 18 is the number of Republican\nmembers this year. Since the total number of members this year is the same as last year, it\nfollows that there are 2 more Democrat members this year than last year, and so the number\nof Democrat members this year is D + 2 and the total number of members this year is 2D +\n20. Using the fact that this year the number of Republican members is\n\nthe total number of\n\nmembers, the value of D can be found.\nD + 18 =\n\n(2D + 20)\n\n3(D + 18) = 2(2D + 20)\n3D + 54 = 4D + 40\nD = 14\n\ngiven\n\nmultiply both sides by 3\ndistributive law\nsubtract both 3D and 40 from both sides\n\nTherefore, the total number of members this year is 2D + 20 = 2(14) + 20 = 48.\nThe correct answer is E."},{"n":118,"s":"Quan","t":"Problem Solving","d":"M","topic":"Arithmetic Series and Sequences","q":"Sam has $800 in his account. He will deposit $1 in his account one week from now, $2 two\nweeks from now, and each week thereafter he will deposit an amount that is $1 greater than\nthe amount that he deposited one week before. If there are no other transactions, how much\nmoney will Sam have in his account 50 weeks from now?","opts":{"A":"$850","B":"$1,200","C":"$1,675","D":"$2,075","E":"$3,350"},"ans":"D","exp":"Determine the amount Sam will have in his account after 50 weeks if the account starts with\n$800 and Sam deposits $1 more each week than he deposited the week before.\nSam\u2019s deposits over the 50-week period will be 1 + 2 + 3 + \u2026 + 48 + 49 + 50 = (1 + 50) + (2 +\n49) + (3 + 48) + \u2026 + (25 + 26) = (25)(51) = $1,275. Thus, after 50 weeks Sam will have $800 +\n$1,275 = $2,075.\nThe correct answer is D."},{"n":119,"s":"Quan","t":"Problem Solving","d":"M","topic":"Arithmetic Measurement Conversion","q":"A certain state\u2019s milk production was 980 million pounds in 2007 and 2.7 billion pounds in\n2014. Approximately how many more million gallons of milk did the state produce in 2014\nthan in 2007? (1 billion = 109 and 1 gallon = 8.6 pounds.)\nA.\n\n100\n\nB.\n\n200\n\nC. 1,700\nD. 8,200\nE. 14,800","opts":{"C":"1,700","D":"8,200","E":"14,800"},"ans":"B","exp":"Using 2.7 billion = 2,700 million, the amount of increase in millions of gallons can be\ncalculated as follows.\nThe amount of increase is: (2,700 \u2013 980) million pounds = 1,720 million pounds\nTo convert pounds into gallons: (1,720 million pounds)\n\n= 200 million gallons\n\nThe correct answer is B."},{"n":120,"s":"Quan","t":"Problem Solving","d":"M","topic":"Algebra Applied Problems","q":"Working simultaneously and independently at an identical constant rate, four machines of a\ncertain type can produce a total of x units of Product P in 6 days. How many of these\nmachines, working simultaneously and independently at this constant rate, can produce a total\nof 3x units of Product P in 4 days?","opts":{"A":"24","B":"18","C":"16","D":"12","E":"8"},"ans":"B","exp":"Define a machine day as 1 machine working for 1 day. Then 4 machines each working 6 days is\nequivalent to (4)(6) = 24 machine days. Thus, x units of Product P were produced in 24\nmachine days, and 3x units of Product P will require (3)(24) = 72 machine days, which is\nequivalent to\n\nmachines working independently and simultaneously for 4 days.\n\nThe correct answer is B."},{"n":121,"s":"Quan","t":"Problem Solving","d":"M","topic":"Arithmetic Operations with Integers","q":"The symbol \u0394 denotes one of the four arithmetic operations: addition, subtraction,\nmultiplication, or division. If 6 \u0394 3 \u2264 3, which of the following must be true?\nI. 2 \u0394 2 = 0\nII. 2 \u0394 2 = 1\nIII. 4 \u0394 2 = 2","opts":{"A":"I only","B":"II only","C":"III only","D":"I and II only"},"ans":"C","exp":"If \u0394 represents addition, subtraction, multiplication, or division, then 6 \u0394 3 is equal to either\n6 + 3 = 9, or 6 \u2013 3 = 3, or 6 \u00d7 3 = 18, or 6 \u00f7 3 = 2. Since it is given that 6 \u0394 3 \u2264 3, \u0394 represents\neither subtraction or division.\nStatement I is true for subtraction since 2 \u2013 2 = 0 but not true for division since 2 \u00f7 2 = 1.\nStatement II is not true for subtraction since 2 \u2013 2 = 0 but is true for division since 2 \u00f7 2 = 1.\nStatement III is true for subtraction since 4 \u2013 2 = 2 and is true for division since 4 \u00f7 2 = 2.\nTherefore, only Statement III must be true.\nThe correct answer is C."},{"n":122,"s":"Quan","t":"Problem Solving","d":"M","topic":"Algebra Percents; First-Degree Equations","q":"If mn \u2260 0 and 25 percent of n equals 37 percent of m, what is the value of\n\n?","opts":{"A":"18","C":"8","D":"3"},"ans":"A","exp":"It is given that (25%)n = (37.5%)m, or 0.25n = 0.375m. The value of\nfirst finding the value of\n\ncan be found by\n\nand then multiplying the result by 12. Doing this gives\n\n=\n\n(12) = 18. Alternatively, the numbers involved allow for a series of simple equation\ntransformations to be carried out, such as the following:\n\n\f\n0.25n = 0.375m\n\ngiven\n\n25n = 37.5m\n\nmultiply both sides by 100\n\n50n = 75m\n\nmultiply both sides by 2\n\n2n = 3m\n\ndivide both sides by 25\n\n12n = 18m\n\nmultiply both sides by 6\n\n= 18\n\ndivide both sides by m\n\nThe correct answer is A."},{"n":123,"s":"Quan","t":"Problem Solving","d":"M","topic":"Arithmetic Percents","q":"Last year Joe grew 1 inch and Sally grew 200 percent more than Joe grew. How many inches\ndid Sally grow last year?","opts":{"A":"0","B":"1","C":"2","D":"3","E":"4"},"ans":"D","exp":"Joe grew 1 inch last year and Sally grew 200 percent more than Joe grew, so Sally grew 1 inch\nplus 200 percent of 1 inch or 1 + 2(1) = 3 inches.\nThe correct answer is D."},{"n":124,"s":"Quan","t":"Problem Solving","d":"M","topic":"Arithmetic Percents; Ratio and Proportion","q":"The table shows partial results of a survey in which consumers were asked to indicate which\none of six promotional techniques most influenced their decision to buy a new food product.\nOf those consumers who indicated one of the four techniques listed, what fraction indicated\neither coupons or store displays?\nA.\nB.\nC.\nD.","opts":{},"ans":"D","exp":"Let T be the total number of consumers who were asked. Then the table shows 35% + 22% +\n18% + 15% = 90% of this total, or 0.9T consumers. Also, the number of consumers who\nindicated either coupons or store displays was 0.22T + 0.18T = 0.4T. Therefore, the number of\nconsumers who indicated either coupons or store displays divided by the number of\nconsumers shown in the table is\n\n.\n\nThe correct answer is D."},{"n":125,"s":"Quan","t":"Problem Solving","d":"M","topic":"Algebra Simultaneous Equations","q":"If 65 percent of a certain firm\u2019s employees are full-time and if there are 5,100 more full-time\nemployees than part-time employees, how many employees does the firm have?","opts":{"A":"8,250","B":"10,200","C":"11,050","D":"16,500","E":"17,000"},"ans":"E","exp":"Let T represent the total number of employees the firm has; F, the number of full-time\nemployees; and P, the number of part-time employees. Since 65 percent of the firm\u2019s\nemployees are full-time, it follows that 35 percent are part-time. Thus, F = 0.65T and\nP = 0.35T. However, F = P + 5,100, so 0.65T = 0.35T + 5,100, so 0.30T = 5,100, and T =\n= 17,000.\nThe correct answer is E."},{"n":126,"s":"Quan","t":"Problem Solving","d":"M","topic":"Algebra; Arithmetic Simplifying Algebraic Expressions; Operations on Rational Numbers","q":"The cost C, in dollars, to remove p percent of a certain pollutant from a pond is estimated by\nusing the formula C =\n\n. According to this estimate, how much more would it cost to\n\nremove 90 percent of the pollutant from the pond than it would cost to remove 80 percent of\nthe pollutant?","opts":{"A":"$500,000","B":"$100,000","C":"$50,000","D":"$10,000"},"ans":"A","exp":"Removing 90% of the pollutant from the pond would cost\n\n=\n\n900,000 dollars, and removing 80% of the pollutant would cost\ndollars. The difference is, then, $900,000 \u2212 $400,000 = $500,000.\nThe correct answer is A."},{"n":127,"s":"Quan","t":"Problem Solving","d":"M","topic":"Algebra Second-Degree Equations","q":"If xy \u2260 0 and x2y2 \u2013 xy = 6, which of the following could be y in terms of x?\nI.\nII.\nIII.","opts":{"A":"I only","B":"II only","C":"I and II","D":"I and III","E":"II and III"},"ans":"E","exp":"x2y2 \u2013 xy = 6\nx2y2 \u2013 xy \u2013 6 = 0\n(xy + 2)(xy \u2013 3) = 0\n\ngiven\nsubtract 6 from both sides\nfactor\n\nSo, xy + 2 = 0, which means xy = \u20132 and\n\n, or xy \u2013 3 = 0, which means that xy = 3 and\n\n. Thus, y in terms of x could be given by the expressions in II or III.\nThe correct answer is E."},{"n":129,"s":"Quan","t":"Problem Solving","d":"M","topic":"Arithmetic Sets","q":"In a certain high school, 80 percent of the seniors are taking calculus, and 60 percent of the\nseniors who are taking calculus are also taking physics. If 10 percent of the seniors are taking\nneither calculus nor physics, what percent of the seniors are taking physics?","opts":{"A":"40%","B":"42%","C":"48%","D":"58%","E":"80%"},"ans":"D","exp":"Determine what percent of the seniors at a certain high school are taking physics.\n\nConsider the Venn diagram on the previous page, where A represents the percent of the\nseniors who are taking calculus only, B represents the percent of the seniors who are taking\nphysics only, and x is the percent of the seniors who are taking both calculus and physics. As\nstated, 80 percent of the seniors are taking calculus, so A + x = 0.8, and 60 percent of the\nseniors taking calculus are taking physics, so x = (0.8)(0.6) = 0.48. Also, A + x + B = 0.9 since\n10 percent of the seniors are taking neither calculus nor physics. It follows that B = 0.9 \u2212 (A +\nx) = 0.9 \u2212 0.8 = 0.1. Therefore, the percent of the seniors who are taking physics is given by B\n+ x = 0.1 + 0.48 = 0.58 or 58 percent.\nThe correct answer is D."},{"n":130,"s":"Quan","t":"Problem Solving","d":"M","topic":"Arithmetic Exponents","q":"If the units digit of\n\nis 6, what is the value of k?","opts":{"A":"3","B":"2","C":"1","D":"\u22121","E":"\u22122"},"ans":"B","exp":"As shown in the table below, the units digit of\n\nis 6 when k = 2.\n\n=\n\n= 561,037\n\n=\n\n= 56,103.7\n\n=\n\n= 5,610.37\n\n=\n\n= 561.037\n\n=\n\n= 56.1037\n\n=\n\n= 5.61037\n\nThe correct answer is B."},{"n":131,"s":"Quan","t":"Problem Solving","d":"M","topic":"Algebra Applied Problems","q":"Three printing presses, R, S, and T, working together at their respective constant rates, can do\na certain printing job in 4 hours. S and T, working together at their respective constant rates,\ncan do the same job in 5 hours. How many hours would it take R, working alone at its\nconstant rate, to do the same job?","opts":{"A":"8","B":"10","C":"12","D":"15","E":"20"},"ans":"E","exp":"Let r be the portion of the job that printing press R, working alone, completes in 1 hour, and\nlet s and t be the corresponding portions, respectively, for printing press S and printing\n\n\f\npress T. From the given information, it follows that r + s + t =\nthese two equations gives r =\ncomplete\n\n=\n\nand s + t =\n\n. Subtracting\n\n. It follows that printing press R, working alone, will\n\nof the job in 1 hour, and therefore printing press R, working alone, will complete\n\nthe job in 20 hours.\nThe correct answer is E."},{"n":132,"s":"Quan","t":"Problem Solving","d":"M","topic":"Arithmetic Sets; Interpretation of Tables","q":"In a poll, 200 subscribers to Financial Magazine X indicated which of five specific companies\nthey own stock in. The results are shown in the table above. If 15 of the 200 own stock in both\nIBM and AT&T, how many of those polled own stock in neither company?","opts":{},"ans":"E","exp":"Since 48 of the 200 subscribers polled own stock in IBM and 15 of these 48 subscribers also\nown stock in AT&T, it follows that 48 \u2212 15 = 33 subscribers own stock in IBM but not in AT&T,\nas shown in the Venn diagram below. Similarly, 30 \u2212 15 = 15 of the 200 subscribers own stock\nin AT&T but not in IBM. Therefore, if n is the number of those polled who do not own stock in\neither IBM or AT&T, then 33 + 15 + 15 + n = 200, or n = 137.\n\n\f\nThe correct answer is E."},{"n":133,"s":"Quan","t":"Problem Solving","d":"M","topic":"Arithmetic Operations on Integers","q":"The sum of all the integers k such that \u201326 < k < 24 is\nA.\n\n0\n\nB. \u20132\nC. \u201325\nD. \u201349\nE. \u201351","opts":{"B":"\u20132","C":"\u201325","D":"\u201349","E":"\u201351"},"ans":"D","exp":"In the sum of all integers k such that \u221226 < k < 24, the positive integers from 1 through 23 can\nbe paired with the negative integers from \u22121 through \u221223. The sum of these pairs is 0 because\na + (\u2212a) = 0 for all integers a. Therefore, the sum of all integers k such that \u221226 < k < 24 is\n\u221225 + (\u221224) + (23)(0) = \u221249.\nThe correct answer is D."},{"n":134,"s":"Quan","t":"Problem Solving","d":"M","topic":"Arithmetic Absolute Value; Number Line","q":"The number line shown contains three points R, S, and T, whose coordinates have absolute\nvalues r, s, and t, respectively. Which of the following equals the average (arithmetic mean) of\nthe coordinates of the points R, S, and T?\nA.\nB.\nC.\nD.\nE.","opts":{},"ans":"E","exp":"Because point R is to the left of 0 on the number line, the coordinate of R is negative. It is given\nthat r is the absolute value of the coordinate of R, and so the coordinate of R is \u2212r. Because\npoints S and T are to the right of 0 on the number line, their coordinates are positive. It is\n\n\f\ngiven that s and t are the absolute values of the coordinates of S and T, and so the coordinates\nof S and T are s and t. The arithmetic mean of the coordinates of R, S, and T is\n\n.\n\nThe correct answer is E."},{"n":135,"s":"Quan","t":"Problem Solving","d":"M","topic":"Algebra Inequalities","q":"Mark and Ann together were allocated n boxes of cookies to sell for a club project. Mark sold\n10 boxes less than n and Ann sold 2 boxes less than n. If Mark and Ann have each sold at least\none box of cookies, but together they have sold less than n boxes, what is the value of n?","opts":{"A":"11","B":"12","C":"13","D":"14","E":"15"},"ans":"A","exp":"Mark sold n \u2212 10 boxes and Ann sold n \u2212 2 boxes. Because each person sold at least one box,\nit follows that n \u2212 10 \u2265 1 and n \u2212 2 \u2265 1, which implies that n \u2265 11. On the other hand, together\nthey sold less than n boxes, so (n \u2212 10) + (n \u2212 2) < n, which implies that n < 12. Therefore, n is\nan integer such that n \u2265 11 and n < 12, which implies that n = 11.\nThe correct answer is A."},{"n":136,"s":"Quan","t":"Problem Solving","d":"M","topic":"Arithmetic Place Value","q":"In the correctly worked addition problem shown, P, Q, R, and S are digits. If Q = 2P, which of\nthe following could be the value of S?","opts":{},"ans":"A","exp":"Step 1: Analysis of the units column.\nBy considering the sum of the unit digits, 5 + R = 4 or 5 + R = 14. Since R \u2265 0, we have\n5 + R \u2265 5, and thus 5 + R = 4 is not possible. Therefore, 5 + R = 14. It follows that R = 9 and 1 is\ncarried to the tens column.\nStep 2: Analysis of the tens and hundreds columns.\nSince 3 + 4 = 7 and the hundreds digit of 8S4 is 8, it follows that 1 must have been carried\nfrom the tens column to the hundreds column. Therefore, the sum of the tens digits must be\nS + 10, and hence 1 + P + Q = S + 10, where the 1 was carried from the units column.\nStep 3: Apply the assumption Q = 2P to rule out answer choices B, C, and D.\n\n\f\nSubstituting 2P for Q in the equation 1 + P + Q = S + 10 gives 1 + P + 2P = S + 10, which can be\nrewritten as S = 3P \u2013 9 = 3(P \u2013 3). This shows that S is divisible by 3, and therefore, answer\nchoices B, C, and D CANNOT be correct.\nStep 4: Show that S = 9 is not possible.\nIf S = 9, then we have 9 = 3(P \u2013 3). Solving this equation gives P = 6. However, from Q = 2P, it\nfollows that Q = 12, which is not a digit. Therefore, S = 9 is not possible and answer choice E is\nNOT correct.\nThe only possibility remaining is S = 3. Although it is not nece"},{"n":137,"s":"Quan","t":"Problem Solving","d":"M","topic":"Algebra Sets","q":"A certain high school has 5,000 students. Of these students, x are taking music, y are taking\nart, and z are taking both music and art. How many students are taking neither music nor art?","opts":{"A":"5,000 \u2013 z","B":"5,000 \u2013 x \u2013 y","C":"5,000 \u2013 x + z","D":"5,000 \u2013 x \u2013 y \u2013 z","E":"5,000 \u2013 x \u2013 y + z"},"ans":"E","exp":"Since x students are taking music, y students are taking art, and z students are taking both\nmusic and art, the number of students taking only music is x \u2212 z, and the number of students\ntaking only art is y \u2212 z, as illustrated by the Venn diagram below.\n\nTherefore, the number of students taking neither music nor art is 5,000 \u2212 [(x \u2212 z) + z + (y \u2212\nz)] = 5,000 \u2212 x \u2212 y + z.\nThe correct answer is E."},{"n":138,"s":"Quan","t":"Problem Solving","d":"M","topic":"Arithmetic Sets","q":"Each person who attended a company meeting was either a stockholder in the company, an\nemployee of the company, or both. If 62 percent of those who attended the meeting were\nstockholders and 47 percent were employees, what percent were stockholders who were NOT\nemployees?","opts":{"A":"34%","B":"38%","C":"45%","D":"53%","E":"62%"},"ans":"D","exp":"Let M represent the number of meeting attendees. Then, since 62% of M or 0.62M were\nstockholders and 47% of M or 0.47M were employees, it follows that 0.62M + 0.47M = 1.09M\nwere either stockholders, employees, or both. Since 1.09M exceeds M, the excess 1.09M \u2212 M =\n0.09M must be the number of attendees who were both stockholders and employees, leaving\nthe rest 0.62M \u2212 0.09M = 0.53M, or 53%, of the meeting attendees to be stockholders but not\nemployees.\nThe correct answer is D."},{"n":139,"s":"Quan","t":"Problem Solving","d":"M","topic":"Arithmetic Percents","q":"The table shows the amount budgeted and the amount spent for each of three accounts in a\ncertain company. For which of these accounts did the amount spent differ from the amount\nbudgeted by more than 6 percent of the amount budgeted?","opts":{"A":"Payroll only","B":"Taxes only","C":"Insurance only","D":"Payroll and Insurance","E":"Taxes and Insurance"},"ans":"D","exp":"For Payroll, 6% of the budgeted amount is (0.06)($110,000) = $6,600. Since $117,000 \u2013\n$110,000 = $7,000 > $6,600, the amount spent differed from the amount budgeted by more\nthan 6%.\nFor Taxes, 6% of the budgeted amount is (0.06)($40,000) = $2,400. Since $42,000 \u2013 $40,000 =\n$2,000 < $2,400, the amount spent did not differ from the amount budgeted by more than 6%.\nFor Insurance, 6% of the budgeted amount is (0.06)($2,500) = $150. Since $2,500 \u2013 $2,340 =\n$160 > $150, the amount spent differed from the amount budgeted by more than 6%.\nThus, the amount spent differed from the amount budgeted by more than 6% for Payroll and\nInsurance.\nThe correct answer is D."},{"n":140,"s":"Quan","t":"Problem Solving","d":"M","topic":"Arithmetic Percents","q":"The graph shows the number of computers assembled during each of 6 consecutive days.\nFrom what day to the next day was the percent change in the number of computers\nassembled the greatest in magnitude?","opts":{"A":"From Day 1 to Day 2","B":"From Day 2 to Day 3","C":"From Day 3 to Day 4","D":"From Day 4 to Day 5","E":"From Day 5 to Day 6"},"ans":"D","exp":"The following table shows the percent change from each day to the next and the magnitude of\nthe percent change.\n\n\f\nTime Period\n\nPercent Change\n\nMagnitude of Percent\nChange\n\nFrom Day 1 to\nDay 2\n\n40\n\nFrom Day 2 to\nDay 3\n\n50\n\nFrom Day 3 to\nDay 4\n\n44\n\nFrom Day 4 to\nDay 5\n\n60\n\nFrom Day 5 to\nDay 6\n\n50\n\nThe correct answer is D."},{"n":141,"s":"Quan","t":"Problem Solving","d":"M","topic":"Arithmetic Properties of Numbers","q":"If n = 20! + 17, then n is divisible by which of the following?\nI. 15\nII. 17\nIII. 19","opts":{"A":"None","B":"I only","C":"II only","D":"I and II","E":"II and III"},"ans":"C","exp":"Because 20! is the product of all integers from 1 through 20, it follows that 20! is divisible by\neach integer from 1 through 20. In particular, 20! is divisible by each of the integers 15, 17,\nand 19. Since 20! and 17 are both divisible by 17, their sum is divisible by 17, and hence the\ncorrect answer will include Statement II. If n were divisible by 15, then n \u2212 20! would be\ndivisible by 15. But n \u2212 20! = 17, and 17 is not divisible by 15.\nTherefore, the correct answer does not include Statement I. If n were divisible by 19, then n \u2212\n20! would be divisible by 19. But n \u2212 20! = 17, and 17 is not divisible by 19. Therefore, the\ncorrect answer does not include Statement III.\nThe correct answer is C."},{"n":142,"s":"Quan","t":"Problem Solving","d":"M","topic":"Arithmetic Measurement Conversion","q":"Exchange Rates in a Particular Year\n$1 = 5.3 francs\n$1 = 1.6 marks\nAn American dealer bought a table in Germany for 480 marks and sold the same table in\nFrance for 2,385 francs. What was the dealer\u2019s gross profit on the two transactions in dollars?\nA.\n\n$0\n\nB. $50\nC. $100","opts":{"B":"$50","C":"$100"},"ans":"D","exp":"Given that $1 = 1.6 marks, it follows that\n\n= 1 mark and 480 marks = 480\n\nSimilarly, given that $1 = 5.3 francs, it follows that\n\n= $300.\n\n= 1 franc and 2,385 francs = 2,385\n\n= $450. The gross profit on the two transactions is $450 \u2212 $300 = $150.\nThe correct answer is D."},{"n":143,"s":"Quan","t":"Problem Solving","d":"M","topic":"Algebra Second-Degree Equations","q":"The product of two negative numbers is 160. If the lesser of the two numbers is 4 less than\ntwice the greater, what is the greater number?","opts":{"A":"\u201320","B":"\u201316","C":"\u201310","D":"\u20138","E":"\u20134"},"ans":"D","exp":"Let x and y be the two numbers, where x is the lesser of the two numbers and y is the number\ndesired. From the given information, it follows that xy = 160 and x = 2y \u2013 4, from which it\nfollows that (2y \u2013 4)y = 160. Dividing both sides of the last equation by 2 gives (y \u2013 2)y = 80.\nThus, 80 is to be written as a product of two negative numbers, one that is 2 less than the\nother. Trying simple factorizations of 80 quickly leads to the value of y: (\u201340)(\u20132) = 80, (\u201320)\n(\u20134) = 80, (\u201310)(\u20138) = 80. Therefore, y = \u20138. Note that because \u20138 is one of the answer\nchoices, it is not necessary to ensure there are no other negative solutions to the equation (y \u2013\n2)y = 80.\nAlternatively, (y \u2013 2)y = 80 can be written as y2 \u2013 2y \u2013 80 = 0. Factoring the left side gives\n(y + 8)(y \u2013 10) = 0, and y = \u20138 is the only negative solution.\nThe correct answer is D."},{"n":144,"s":"Quan","t":"Problem Solving","d":"M","topic":"Algebra Functions","q":"According to a certain estimate, the depth N(t), in centimeters, of the water in a certain tank at\nt hours past 2:00 in the morning is given by N(t) = \u201320(t \u2013 5)2 + 500 for 0 \u2264 t \u2264 10. According\nto this estimate, at what time in the morning does the depth of the water in the tank reach its\nmaximum?","opts":{"A":"5:30","B":"7:00","C":"7:30","D":"8:00","E":"9:00"},"ans":"B","exp":"When t = 5, the value of \u221220(t \u2212 5)2 + 500 is 500. For all values of t between 0 and 10,\ninclusive, except t = 5, the value of \u221220(t \u2212 5)2 is negative and \u221220(t \u2212 5)2 + 500 < 500.\nTherefore, the tank reaches its maximum depth 5 hours after 2:00 in the morning, which is\n7:00 in the morning.\nThe correct answer is B."},{"n":145,"s":"Quan","t":"Problem Solving","d":"M","topic":"Algebra Applied Problems","q":"After driving to a riverfront parking lot, Bob plans to run south along the river, turn around,\nand return to the parking lot, running north along the same path. After running 3.25 miles\nsouth, he decides to run for only 50 minutes more. If Bob runs at a constant rate of 8 minutes\nper mile, how many miles farther south can he run and still be able to return to the parking\nlot in 50 minutes?","opts":{"A":"1.5","B":"2.25","C":"3.0","D":"3.25","E":"4.75"},"ans":"A","exp":"After running 3.25 miles south, Bob has been running for\n\n26\n\nminutes. Thus, if t is the number of additional minutes that Bob can run south before turning\naround, then the number of minutes that Bob will run north, after turning around, will be t +\n26. Since Bob will be running a total of 50 minutes after the initial 26 minutes of running, it\nfollows that t + (t + 26) = 50, or t = 12. Therefore, Bob can run south an additional\n= 1.5 miles before turning around.\nThe correct answer is A."},{"n":146,"s":"Quan","t":"Problem Solving","d":"M","topic":"Algebra Applied Problems","q":"Alex deposited x dollars into a new account that earned 8 percent annual interest,\ncompounded annually. One year later Alex deposited an additional x dollars into the account.\nIf there were no other transactions and if the account contained w dollars at the end of two\nyears, which of the following expresses x in terms of w?\nA.\nB.\nC.\nD.","opts":{},"ans":"D","exp":"At the end of the first year, the value of Alex\u2019s initial investment was x(1.08) dollars, and after\nhe deposited an additional x dollars into the account, its value was [x(1.08) + x] dollars. At the\nend of the second year, the value was w dollars, where w = [x(1.08) + x](1.08) = x(1.08)2 +\nx(1.08) = x[(1.08)2 + 1.08]. Thus,\n\n.\n\nThe correct answer is D."},{"n":147,"s":"Quan","t":"Problem Solving","d":"M","topic":"Arithmetic Estimation","q":"M is the sum of the reciprocals of the consecutive integers from 201 to 300, inclusive. Which\nof the following is true?\nA.\nB.\nC.\nD.\nE.","opts":{},"ans":"A","exp":"M =\n\n+\n\n+\n\n+\u2026+\n\n+\n\n+\n\nGiven\n\n>\n\n+\n\n+\n\n+\u2026+\n\n+\n\n+\n\nSee Note 1 below\n\nNote 1: 300 is greater th ans":"E","exp":"There are 6 pieces of fruit in the first basket and 8 pieces of fruit in the second basket. By the\nmultiplication principle, the number of selections of a piece of fruit from the first basket and a\npiece of fruit from the second basket is (6)(8) = 48. Of these selections, (4)(5) = 20 are such\nthat an apple is selected from the first basket and an orange is selected from the second\nbasket, and (2)(3) = 6 are such that an orange is selected from the first basket and an apple is\nselected from the second basket. Therefore, there is a total of 20 + 6 = 26 selections in which\none apple is chosen and one orange is chosen, and hence the probability of such a selection is\n.\nAlternatively, the desired probability is the sum of the probabilities of two disjoint events. In\nthe first event, an apple is selected from the first basket and an orange is selected from the\nsecond basket; the probability of this event is\n\n. In the second event, an orange\n\nis selected from the first basket and an apple is selected from the second basket; the\nprobability of this event is\n\n. Therefore, the desired probability is\n\n.\nThe correct answer is E."},{"n":150,"s":"Quan","t":"Problem Solving","d":"M","topic":"Arithmetic Estimation; Exponents","q":"Last year Brand X shoes were sold by dealers in 403 different regions worldwide, with an\naverage (arithmetic mean) of 98 dealers per region. If last year these dealers sold an average\nof 2,488 pairs of Brand X shoes per dealer, which of the following is closest to the total\nnumber of pairs of Brand X shoes sold last year by the dealers worldwide?","opts":{"A":"104","B":"105","C":"106","D":"107","E":"108"},"ans":"E","exp":"Since the average number of dealers per region is 98, it follows that\n\n= 98,\n\nand thus the number of dealers is (98)(403). Also, since the average number of pairs sold per\ndealer is 2,488, it follows that\n\n= 2,488, and thus the number of pairs sold\n\nis (98)(403)(2,488), which is approximately (100)(400)(2500) = (102)(4 \u00d7 102)(25 \u00d7 102).\nTherefore, the total number of pairs sold is approximately (4)(25) \u00d7 102 + 2 + 2\n= 100 \u00d7 106 = 108.\nThe correct answer is E."},{"n":151,"s":"Quan","t":"Problem Solving","d":"M","topic":"Arithmetic Statistics","q":"What is the median of the numbers shown above?","opts":{"A":"10","B":"13","C":"14","D":"15","E":"16"},"ans":"B","exp":"To find the median of these 4 numbers, put the numbers in numerical order in a list and\ndetermine the average of the two middle values in the list:\n4, 10, 16, 26\nFrom this list it follows that the median is the average of 10 and 16, which is\nThe correct answer is B."},{"n":152,"s":"Quan","t":"Problem Solving","d":"M","topic":"Algebra Percents","q":"If\n\nBag P\n\n37\n\n10.8%\n\nBag Q\n\nx\n\n66.7%\n\nBag R\n\n32\n\n50.0%\n\nof the total number of marbles in the three bags listed in the table above are blue, how\n\nmany marbles are there in Bag Q?","opts":{"A":"5","B":"9","C":"12","D":"23","E":"46"},"ans":"B","exp":"What is the value of x, the number of marbles in Bag Q? From the given information and\nrounded to the nearest integer, Bag P has (37)(0.108) = 4 blue marbles, Bag Q has (x)\n(0.667) =\n\nx blue marbles, and Bag R has (32)(0.5) = 16 blue marbles. Therefore, the total\n\nnumber of blue marbles is equal to 4 +\n\nx + 16 = 20 +\n\nx. It is given that\n\nof the total\n\n\f\nnumber of marbles are blue, so the total number of blue marbles is also equal to\n(37 + x + 32) =\n\nx + 23. It follows that 20 +\n\nx=\n\nx + 23, or\n\nx = 3, or x = 9.\n\nThe correct answer is B."},{"n":153,"s":"Quan","t":"Problem Solving","d":"M","topic":"Arithmetic Statistics","q":"The table above gives the age categories of the 161 employees at Company X and the number\nof employees in each category. According to the table, if m is the median age, in years, of the\nemployees at Company X, then m must satisfy which of the following?","opts":{"A":"20 \u2264 m \u2264 29","B":"25 \u2264 m \u2264 34","C":"30 \u2264 m \u2264 39","D":"35 \u2264 m \u2264 44","E":"40 \u2264 m \u2264 49"},"ans":"A","exp":"The median of 161 ages is the 81st age when the ages are listed in order. Since 29 of the ages\nare less than 20, the median age must be greater than or equal to 20. Since 58 of the ages are\nbetween 20 and 29, a total of 29 + 58 = 87 of the ages are less than or equal to 29, and thus\nthe median age is less than or equal to 29. Therefore, the median age is greater than or equal\nto 20 and less than or equal to 29.\nThe correct answer is A."},{"n":154,"s":"Quan","t":"Problem Solving","d":"M","topic":"Algebra Simplifying Algebraic Expressions","q":"If k and n are positive integers such that n > k, then k! + (n \u2212 k) \u22c5 (k \u2212 1)! is equivalent to which\nof the following?","opts":{"A":"k \u22c5 n!","B":"k! \u22c5 n","C":"(n \u2212 k)!","D":"n \u22c5 (k + 1)!","E":"n \u22c5 (k \u2212 1)!"},"ans":"E","exp":"k! + (n \u2013 k) \u22c5 (k \u2013 1)!\n\ngiven\n\nk \u00b7 (k \u2013 1)! + (n \u2013 k) \u22c5 (k \u2013 1)!\n\nk! = k \u22c5 (k \u2013 1)!\n\n[k + (n \u2013 k)] \u22c5 (k \u20131)!\n\nfactor out (k \u2013 1)!\n\nn \u22c5 (k \u2013 1)!\n\ncombine like terms\n\nThe correct answer is E."},{"n":155,"s":"Quan","t":"Problem Solving","d":"M","topic":"Arithmetic Operations with Integers","q":"Ron is 4 inches taller than Amy, and Barbara is 1 inch taller than Ron. If Barbara\u2019s height is 65\ninches, what is the median height, in inches, of these three people?","opts":{"A":"60","B":"61","C":"62","D":"63","E":"64"},"ans":"E","exp":"Let R, A, and B be the heights, respectively and in inches, of Ron, Amy, and Barbara. It is given\nthat R = 4 + A, B = 1 + R, and B = 65. Therefore, R = B \u2013 1 = 65 \u2013 1 = 64 and A = R \u2013 4 = 64 \u2013\n4 = 60. From this it follows that the three heights, in inches, are 60, 64, and 65. The median of\nthese three heights is 64.\nThe correct answer is E."},{"n":156,"s":"Quan","t":"Problem Solving","d":"M","topic":"Algebra Simultaneous Equations; Inequalities","q":"If x and y are positive numbers such that x + y = 1, which of the following could be the value of\n100x + 200y?","opts":{},"ans":"E","exp":"Since x + y = 1, then y = 1 \u2212 x and 100x + 200y can be expressed as 100x + 200(1 \u2212 x) = 200 \u2212\n100x. Test each value.\n\n\f\nI. If 200 \u2212 100x = 80, then x =\n\n= 1.2 and y = 1 \u2212 1.2 = \u22120.2.\n\nSince y must be positive, 80 cannot be a value of 100x + 200y.\nII. If 200 \u2212 100x = 140, then x =\n\n= 0.6 and y = 1 \u2212 0.6 = 0.4, so 140 can be a value\n\nof 100x + 200y.\nIII. If 200 \u2212 100x = 199, then x =\n\n= 0.01 and y = 1 \u2212 0.01 = 0.99, so 199 can be a\n\nvalue of 100x + 200y.\nThe correct answer is E."},{"n":157,"s":"Quan","t":"Problem Solving","d":"M","topic":"Arithmetic Operations with Decimals; Place Value","q":"If X is the hundredths digit in the decimal 0.1X and if Y is the thousandths digit in the decimal\n0.02Y, where X and Y are nonzero digits, which of the following is closest to the greatest\npossible value of\n\n?","opts":{"A":"4","B":"5","C":"6","D":"9","E":"10"},"ans":"D","exp":"The greatest possible value of\n\nwill occur when 0.1X has the greatest possible value\n\nand 0.02Y has the least possible value. Since X and Y are nonzero digits, this means that X\nmust be 9 and Y must be 1. The greatest possible value of\n\nis then\n\n\u2248 9.05,\n\nwhich is closest to 9.\nThe correct answer is D."},{"n":158,"s":"Quan","t":"Problem Solving","d":"M","topic":"Arithmetic Elementary Combinatorics","q":"If each of the 12 teams participating in a certain tournament plays exactly one game with each\nof the other teams, how many games will be played?","opts":{"A":"144","B":"132","C":"66","D":"33","E":"23"},"ans":"C","exp":"Since each of the 12 teams will play exactly one game with each of the other teams, the\nnumber of games that will be played is equal to the number of selections of 2 teams, without\n\n\f\nregard to order, from 12 teams. This is the number of combinations of 12 teams taken 2 at a\ntime, which is equal to\n\n= 66.\n\nAlternatively, each of the 12 teams will play each of the 11 other teams. The product (12)(11)\ncounts each of the games twice since, for example, this product separately counts \u201cTeam A\nplays Team B\u201d and \u201cTeam B plays Team A.\u201d Therefore, the number of games that will be played\nis\n\n= 66.\n\nThe correct answer is C."},{"n":159,"s":"Quan","t":"Problem Solving","d":"M","topic":"Algebra Applied Problems; Average","q":"The average (arithmetic mean) cost per book for the 12 books on a certain table is k dollars. If\na book that costs 18 dollars is removed from the table and replaced by a book that costs 42\ndollars, then in terms of k, what will be the average cost per book, in dollars, for the books on\nthe table?","opts":{"A":"k + 2","B":"k \u2212 2","E":"12k \u2212 6"},"ans":"A","exp":"Since the average cost per book for the 12 books before the replacement is $k, it follows that\nthe sum of the costs of the 12 books before the replacement is $12k. After replacing a book\nthat costs $18 with a book that costs $42, the sum, in dollars, of the costs of the 12 books after\nthe replacement will be 12k \u2212 18 + 42 = 12k + 24. Therefore, the average cost per book, in\ndollars, for the 12 books after the replacement will be\n\n.\n\nThe correct answer is A."},{"n":160,"s":"Quan","t":"Problem Solving","d":"M","topic":"Arithmetic Properties of Integers; Series and Sequences","q":"What is the remainder when 319 is divided by 10?","opts":{"A":"1","B":"3","C":"5"},"ans":"D","exp":"When a positive integer is divided by 10, the remainder is the units digit of that positive\ninteger. For example, when 584 is divided by 10, the quotient is 58 and the remainder is 4.\nThus, the remainder when 319 is divided by 10 is the units digit when 319 is written as a\ndecimal numeral. The table shows the units digits for the first few powers of 3.\n\n\f\nnumber decimal numeral units digit\n31\n\n3\n\n3\n\n32\n\n9\n\n9\n\n33\n\n27\n\n7\n\n34\n\n81\n\n1\n\n35\n\n243\n\n3\n\n36\n\n729\n\n9\n\n37\n\n2,187\n\n7\n\n38\n\n6,561\n\n1\n\nThe table, along with thinking about the standard method for multiplying decimal numerals by\nhand, shows that the units digits of the powers of 3 form a sequence in which the digits 3, 9, 7,\nand 1 repeat indefinitely in that order. By following this pattern, the units digit of 319 is seen\nto be 7.\nThe correct answer is D."},{"n":161,"s":"Quan","t":"Problem Solving","d":"M","topic":"Algebra Sets (Venn Diagrams)","q":"Of 200 people surveyed, 80 percent own a cellular phone and 45 percent own a pager. If all\n200 people surveyed own a cellular phone, or a pager, or both, what percent of those\nsurveyed either do not own a cellular phone or do not own a pager?","opts":{"A":"35%","B":"45%","C":"55%","D":"65%","E":"75%"},"ans":"E","exp":"From the given information, (0.8)(200) = 160 of the people surveyed own a cellular phone\nand (0.45)(200) = 90 of the people surveyed own a pager. The Venn diagram shows this\ninformation, where N denotes the number of people who own both.\n\n\f\nSince a total of 200 people were surveyed, it follows that (160 \u2212 N) + N + (90 \u2212 N) = 200, or N\n= 50. Therefore, the number of people surveyed who do not own a cellular phone is 90 \u2212 50 =\n40 and the number of people surveyed who do not own a pager is 160 \u2212 50 = 110, which\ntogether account for 40 + 110 = 150 of the 200 people surveyed, or\n\nof\n\nthe people surveyed.\nThe correct answer is E."},{"n":162,"s":"Quan","t":"Problem Solving","d":"M","topic":"Arithmetic Applied Problems; Percents","q":"At the end of the first quarter, the share price of a certain mutual fund was 20 percent higher\nthan it was at the beginning of the year. At the end of the second quarter, the share price was\n50 percent higher than it was at the beginning of the year. What was the percent increase in\nthe share price from the end of ,"B":"9","C":"10","D":"11","E":"12"},"ans":"D","exp":"For convenience, let N represent the product of all integers from 1 through n. Then, since N is\ndivisible by 990, every prime factor of 990 must also be a factor of N. The prime factorization\nof 990 is 2 \u00d7 32 \u00d7 5 \u00d7 11, and therefore, 11 must be a factor of N. Then the least possible value\nof N with factors of 2, 5, 32, and 11 is 1 \u00d7 2 \u00d7 3 \u00d7 \u2026 \u00d7 11, and the least possible value of n is\n11.\nThe correct answer is D."},{"n":180,"s":"Quan","t":"Problem Solving","d":"H","topic":"Arithmetic Probability","q":"The probability that event M will NOT occur is 0.8 and the probability that event R will NOT\noccur is 0.6. If events M and R CANNOT both occur, which of the following is the probability\nthat either event M or event R will occur?\nA.\nB.\nC.\nD.\nE.","opts":{},"ans":"C","exp":"Let P(M) be the probability that event M will occur, let P(R) be the probability that event R will\noccur, and let P(M and R) be the probability that events M and R both occur. Then the\nprobability that either event M or event R will occur is P(M) + P(R) \u2013 P(M and R). From the\ngiven information, it follows that P(M) = 1.0 \u2013 0.8 = 0.2, P(R) = 1.0 \u2013 0.6 = 0.4, and\nP(M and R) = 0. Therefore, the probability that either event M or event R will occur is\n0.2 + 0.4 \u2013 0 = 0.6 =\n\n.\n\nThe correct answer is C."},{"n":181,"s":"Quan","t":"Problem Solving","d":"H","topic":"Arithmetic Applied Problems","q":"The total cost for Company X to produce a batch of tools is $10,000 plus $3 per tool. Each tool\nsells for $8. The gross profit earned from producing and selling these tools is the total income\nfrom sales minus the total production cost. If a batch of 20,000 tools is produced and sold,\nthen Company X\u2019s gross profit per tool is","opts":{"A":"$3.00","B":"$3.75","C":"$4.50","D":"$5.00","E":"$5.50"},"ans":"C","exp":"The total cost to produce 20,000 tools is $10,000 + $3(20,000) =
