rs of collisions and collision-related injuries in 1966? The passage says\nthat power steering helps to prevent collisions and that safety belts help to\nprevent collision-related injuries. Since most Morodian cars previously lacked\nthese features, and one-seventh of them were replaced with new cars in 1966,\nthe proportion of cars with these features must have increased that year. This\nshould have reduced the numbers of collisions and collision-related injuries\nunless some other factor counteracted the reductions. Evidence of any such\ncountervailing factor would help to explain why the numbers did not decrease.\n\nA. Increased usage of safety belts should have reduced the number of collision-related\ninjuries, so it would not help explain why this number did not decrease.\nB. If the new cars bought in 1966 were mostly purchased early in the year, the increased\nproportion of ca"},{"n":651,"s":"Verb","t":"Critical Reasoning","d":"E","topic":"Critical Reasoning \u2014 Inference","q":"Manufacturers of mechanical pencils make most of their profit on pencil leads rather than on\nthe pencils themselves. The Write Company, which cannot sell its leads as cheaply as other\nmanufacturers can, plans to alter the design of its mechanical pencil so that it will accept only\na newly designed Write Company lead, which will be sold at the same price as the\nWrite Company\u2019s current lead.\nWhich of the following, if true, most strongly supports the Write Company\u2019s projection that its\nplan will l","opts":{"A":"The new Write Company pencil will be introduced at a price higher than the price the","B":"In the foreseeable future, manufacturers of mechanical pencils will probably have to raise","C":"The newly designed Write Company lead will cost somewhat more to manufacture than","D":"A rival manufacturer recently announced similar plans to introduce a mechanical pencil","E":"In extensive test marketing, mechanical-pencil users found the new Write Company pencil"},"ans":"E","exp":"Argument Evaluation\nSituation\n\nThe Write Company makes mechanical pencils and pencil-lead refills.\nCompanies in this type of business make most of their profits from selling the\nleads, but the Write Company\u2019s leads cost more than leads made by other\nfirms, so the refills are not selling well. The company plans to alter the design\nof its pencil and leads so that only the company\u2019s leads will fit. The new leads\nwill be sold at the same price as the existing ones. The company projects that\nits plan will lead to an increase in the sale of its leads.\n\nReasoning\n\nWhich of the stated pieces of additional information most strongly supports the\ncompany\u2019s projection of an increase in sales of leads? Presumably, because of the\nprice difference, users of Write Company pencils are often refilling them with\ncompetitors\u2019 cheaper leads instead of Write Company leads. If the number of\nsales of the company\u2019s redesigned pencil did not drop significantly below the\nnumber of sales for its original pencil, a likely consequence would be a\nsignificant increase in refill sales for the redesigned pencil, because users\nwould no longer have the option of using competitors\u2019 leads. The pencil would\nhave to be p"},{"n":652,"s":"Verb","t":"Critical Reasoning","d":"E","topic":"Critical Reasoning \u2014 Inference","q":"Enterprise Bank currently requires customers with checking accounts to maintain a minimum\nbalance or pay a monthly fee. Enterprise plans to offer accounts with no monthly fee and no\nminimum-balance requirement; to cover their projected administrative costs of $3 per\naccount per month, they plan to charge $30 for overdrawing an account. Since each month on\naverage slightly more than 10 percent of Enterprise\u2019s customers overdraw their accounts,\nbank officials predict the new accounts will generate","opts":{"A":"Some of Enterprise Bank\u2019s current checking account customers are expected to switch to","B":"One-third of Enterprise Bank\u2019s revenues are currently derived from monthly fees tied to","C":"Many checking account customers who occasionally pay a fee for not maintaining a","D":"Customers whose checking accounts do not have a minimum-balance requirement are","E":"Customers whose checking accounts do not have a minimum-balance requirement are"},"ans":"D","exp":"Situation\n\nEnterprise Bank gives customers checking accounts with no monthly fee\nprovided they maintain a certain minimum balance. However, the bank plans to\noffer accounts with no minimum-balance requirement and no monthly fee. It\nplans to cover the bank\u2019s $3 per account per month administrative cost by\ncharging a $30 penalty for overdrafts. Only slightly more than 10 percent of\ncustomers, on average, overdraw their accounts in a month. The bank officials\npredict the new accounts will generate a profit.\n\nReasoning\n\nWhat new information, if accurate, would most strongly support the prediction? If\nabout only one customer in ten, on average, currently has an overdraft in a\n\n\f\nmonth, and if this trend continues among customers who sign up for the new\naccount, then the proposed $30 penalty per overdraft will cover the $30 cost\nof maintaining checking accounts for 10 customers per month. Would\nremoving the minimum-balance requirement significantly increase the 10\npercent overdraft rate? If so, then significantly more than one in ten\ncustomers, on average, would pay a $30 penalty. If this were so, then the new\nplan would yield a profit, as predicted.\nA. \u201cSome\u201d might mean only a few, and "},{"n":653,"s":"Verb","t":"Critical Reasoning","d":"E","topic":"Critical Reasoning \u2014 Inference","q":"Highway official: When resurfacing our concrete bridges, we should use electrically\nconductive concrete (ECC) rather than standard concrete. In the winter, ECC can be heated by\npassing an electric current through it, thereby preventing ice buildup. The cost of the\nelectricity needed is substantially lower than the cost of the deicing salt we currently use.\nTaxpayer: But ECC is vastly more expensive than standard concrete, so your proposal is\nprobably not justifiable on economic grounds.\nWhich of","opts":{"A":"The use of deicing salt causes corrosion of reinforcing steel in concrete bridge decks and"},"ans":"A","exp":"Situation\n\nA highway official recommends using electrically conductive concrete (ECC) for\nresurfacing concrete bridges. This would allow the transmission of an electric\ncurrent to prevent ice buildup in winter. The highway official supports the\nproposal by stating that the cost of the electricity used would be substantially\nlower than the cost of the deicing salt used at present. A taxpayer objects that\nECC is much more expensive than standard concrete.\n\nReasoning\n\nWhich piece of additional information would most logically address the objection\nof the taxpayer? Consider whether there could be other, indirect or long-term,\ncosts associated with either of the two deicing methods (salt, electricity). For\nexample, would use of ECC involve installation of additional infrastructure to\nprovide electric power to the bridges\u2014and, if so, how would the total costs\ncompare with total existing costs? What are the cost implications of the current\nuse of deicing salt? Any additional information that addresses these questions\nwill be relevant. Note that the taxpayer\u2019s objection primarily concerns the\ncapital cost of ECC bridge surfacing.\n\nA. Correct. The use of deicing salt causes corrosion that c"},{"n":654,"s":"Verb","t":"Critical Reasoning","d":"E","topic":"Critical Reasoning \u2014 Critical Reasoning","q":"In virtually any industry, technological improvements increase labor productivity, which is the\noutput of goods and services per person-hour worked. In Parland\u2019s industries, labor\nproductivity is significantly higher than it is in Vergia\u2019s industries. Clearly, therefore, Parland\u2019s\nindustries must, on the whole, be further advanced technologically than Vergia\u2019s are.\nThe argument is most vulnerable to which of the following criticisms?","opts":{"A":"It offers a conclusion that is no more than a paraphrase of one of the pieces of","B":"It presents as evidence in support of a claim information that is inconsistent with other","C":"It takes one possible cause of a condition to be the actual cause of that condition without","D":"It takes a condition to be the effect of something that happened only after the condition","E":"It makes a distinction that presupposes the truth of the conclusion that is to be"},"ans":"C","exp":"Argument Evaluation\nSituation\n\nTechnological improvements in nearly every industry increase labor\nproductivity, which is the output of goods and services per person-hour\nworked. Because labor productivity is significantly higher in Parland than\nVergia, Parland\u2019s industries are, in general, more technologically advanced\nthan Vergia\u2019s.\n\nReasoning\n\nTo which criticism is the argument most vulnerable? Though one factor, such as\ntechnological advancements, may lead to greater labor productivity, it may not\nbe the only such factor, or even a necessary factor, leading to greater labor\nproductivity. Therefore, the mere fact that one region\u2019s labor is more\nproductive than another\u2019s is not sufficient to establish that the former region is\nmore technologically advanced than the latter region is.\n\nA. The conclusion is not merely a paraphrase of the pieces of information provided in its\nsupport. Indeed, the problem with the argument is that the conclusion goes too far\nbeyond what the premises merit.\nB. The premises of the argument are not inconsistent with one another.\nC. Correct. This accurately describes the flaw in the argument because the reasons given in\nthe argument for its conclusion woul"},{"n":655,"s":"Verb","t":"Critical Reasoning","d":"E","topic":"Critical Reasoning \u2014 Boldface","q":"Chaco Canyon, a settlement of the ancient Anasazi culture in North America, had massive\nbuildings. It must have been a major Anasazi center. Analysis of wood samples shows that\nsome of the timber for the buildings came from the Chuska and San Mateo mountains, 50\nmiles from Chaco Canyon. Only a major cultural center would have the organizational\npower to import timber from 50 miles away.\nIn the argument given, the two portions in boldface play which of the following roles?","opts":{"A":"The first is a premise used to support the argument\u2019s main conclusion; the second is the","B":"The first is the argument\u2019s main conclusion; the second is a premise used to support that","C":"The first is one of two premises used to support the argument\u2019s main conclusion; the","D":"The first is a premise used to support the argument\u2019s main conclusion; the second is a","E":"The first is inferred from another statement in the argument; the second is inferred from"},"ans":"B","exp":"Argument Construction\nSituation\n\nThe ancient Anasazi settlement at Chaco Canyon had massive buildings, for\nwhich some of the timber came from mountains 50 miles away.\n\nReasoning\n\nWhat roles do the statement that Chaco Canyon must have been a major Anasazi\ncenter and the statement that only a major center would have the organizational\npower to import timber from 50 miles away play in the argument? The first and\nthird sentences in the passage are both factual observations. Since no further\nsupport is provided for either of them, neither can be a conclusion in the\nargument. The final sentence (i.e., the second boldfaced portion of the\nargument) is a speculative generalization about major cultural centers. None of\nthe other statements gives us any reason to think this generalization is true, so\nit cannot be a conclusion in the argument either. However, the third and fourth\nsentences together imply that Chaco Canyon was a major cultural center, and\nthe first sentence indicates that it was Anasazi. So, together, the first, third, and\nfourth sentences all support the claim that Chaco Canyon was a major Anasazi\ncultural center and thus more generally a major Anasazi center, as the second\ns"},{"n":656,"s":"Verb","t":"Critical Reasoning","d":"E","topic":"Critical Reasoning \u2014 Critical Reasoning","q":"The Maxilux car company\u2019s design for its new luxury model, the Max 100, included a special\ndesign for the tires that was intended to complement the model\u2019s image. The winning bid for\nsupplying these tires was submitted by Rubco. Analysts concluded that the bid would only just","opts":{},"ans":"D","exp":"Argument Construction\nSituation\n\nRubco won a bid for supplying tires for the Max 100, a new luxury model by\nMaxilux. The bid would barely cover the cost of the tires, but Rubco executives\nclaim that winning the bid will be profitable.\n\nReasoning\n\nWhat would support the executives\u2019 claim? Rubco is not expected to make a\nprofit from supplying the tires for the new cars, so we must look for some\nother way that Rubco could derive a profit as a result of winning the bid. If by\nwinning the bid Rubco created an inevitable market for itself in replacement\ntires\u2014on which Rubco could earn a profit\u2014then the executives\u2019 claim may be\njustified.\n\nA. We have already been told that the bid is expected to barely cover the costs of supplying\nthe tires on the new cars, so the analysts mentioned in the passage have presumably\nalready taken into account that there is a spare tire supplied for the Max 100.\nB. If winning the bid led Rubco to win more exclusive contracts with Maxilux, that might help\nsupport the executives\u2019 claim. But this statement indicates only that Rubco already has\n\n\f\nseveral exclusive contracts to supply Maxilux with tires, not that winning the bid has led\nto, or will lead to, more "},{"n":657,"s":"Verb","t":"Critical Reasoning","d":"E","topic":"Critical Reasoning \u2014 Complete","q":"Which of the following most logically completes the passage?\nMost bicycle helmets provide good protection for the top and back of the head but little or no\nprotection for the temple regions on the sides of the head. A study of head injuries resulting\nfrom bicycle accidents showed that a large proportion were caused by blows to the temple\narea. Therefore, if bicycle helmets protected this area, the risk of serious head injury in bicycle\naccidents would be greatly reduced, especially since _______","opts":{"A":"among the bicyclists included in the study\u2019s sample of head injuries, only a very small","B":"even those bicyclists who regularly wear helmets have a poor understanding of the","C":"a helmet that included protection for the temples would have to be somewhat larger and","D":"the bone in the temple area is relatively thin and impacts in that area are thus very likely","E":"bicyclists generally land on their arm or shoulder when they fall to the side, which"},"ans":"D","exp":"Argument Construction\nSituation\n\nBicycle helmets protect the top and back of the head but not the sides or\ntemples. A study found that a large proportion of head injuries caused by\nbiking accidents were caused by blows to the temple area.\n\nReasoning\n\nWhy would the risk of serious head injury in bicycle accidents be greatly reduced if\nbicycle helmets protected the temple regions? If for some reason a serious head\ninjury is particularly likely when there is impact to the temple area, then bicycle\nhelmets that protect that area would be apt to reduce the number of serious\nhead injuries from bicycle accidents. One such reason is that the bone in the\ntemple area is relatively thin.\n\nA. This point is irrelevant because it gives us no information about the seriousness or the\nlikelihood of injuries due to impact to the temple area.\nB. Whether bicyclists who regularly wear helmets have a good understanding of what\nprotection their helmets afford is not relevant as to whether serious head injuries are\nparticularly likely to occur from impact to the temple area.\n\n\f\nC. This point is relevant only to what a helmet that protected the temple area would be like,\nnot to the seriousness of injuries "},{"n":658,"s":"Verb","t":"Critical Reasoning","d":"E","topic":"Critical Reasoning \u2014 Complete","q":"Which of the following most logically completes the argument?\nIn a typical year, Innovair\u2019s airplanes are involved in 35 collisions while parked or being\ntowed in airports, with a resulting yearly cost of $1,000,000 for repairs.\nTo reduce the frequency of ground collisions, Innovair will begin giving its ground crews\nadditional training, at an annual cost of $500,000. Although this will cut the number of ground\ncollisions by about half at best, the drop in repair costs can be expected to be much","opts":{"A":"most ground collisions happen when ground crews are rushing to minimize the time a","B":"a ground collision typically occurs when there are no passengers on the airplane","C":"the additional training will focus on helping ground crews avoid those kinds of ground"},"ans":"C","exp":"Situation\n\nAn airline will give its ground crews additional training to reduce the\nfrequency of the collisions its airplanes are involved in while parked or being\ntowed in airports.\n\nReasoning\n\nWhat premise would most logically support the conclusion that the additional\ntraining will reduce repair costs from ground collisions much more than it reduces\nthe number of such collisions? The key word since before the blank shows that\nthe argument should be completed with a premise that supports the preceding\nclaim that the drop in repair costs can be expected to be much greater. What\nstatement would support that claim? Note that the annual cost of training,\n$500,000, is half as much as the yearly cost of the repairs needed as a result of\nground collisions, $1,000,000. We are told that the training will cut the number\nof ground collisions by at most about half, so if the drop in repair costs will be\nmuch greater than half, which would need to be the case to make the training\nworthwhile, what would have to be true of the ground collisions that the\ntraining will help the ground crews avoid? Presumably, they would have to be\n\n\f\namong the higher repair cost collisions, as opposed to the less "},{"n":659,"s":"Verb","t":"Critical Reasoning","d":"E","topic":"Critical Reasoning \u2014 Inference","q":"Many agriculturally intensive areas of the world are beginning to encounter water scarcity\nproblems. As a result, many farmers in these areas are likely to reduce their output as the\nwater supply they need in order to maintain production shrinks. However, one group of\nfarmers in such a region plans to increase their production by implementing techniques for\nwater conservation.\nWhich of the following, if true, would most strongly support the prediction that the group\u2019s\nplan will succeed?","opts":{"A":"Farmers that can gain a larger share of the food market in their regions will be better","B":"Most agricultural practices in areas with water shortages are water-intensive.","C":"Other regions of the world not facing water shortages are likely to make up for the","D":"Demand for agricultural products in the group\u2019s region is not expected to decline.","E":"More than half the water used for agriculture in the farmers\u2019 region is lost to evaporation"},"ans":"E","exp":"Situation\n\nFarmers in many agriculturally intensive regions will probably reduce their\noutput because the regions\u2019 water supplies are dwindling, but one group of\nfarmers in such a region plans to use water conservation techniques to\nincrease their output.\n\nReasoning\n\nWhat would provide evidence that water conservation techniques will help the\nfarmers increase production despite their region\u2019s dwindling water supplies? In\n\n\f\norder for the water conservation techniques to be effective, they must result in\nsignificantly more water becoming available for the farmers to use. Because\noverall supplies are shrinking, rather than growing, that can only happen if the\nfarmers are currently losing or wasting a great deal of water in ways that could\nbe prevented with water conservation techniques.\nA. This suggests an advantage the farmers will gain if their water conservation plan enables\nthem to increase production, but it provides no evidence that the plan actually will enable\nthem to increase production.\nB. This suggests that the plan would have to yield quite a lot of conserved water in order for\nthe farmers to increase production, but it offers no evidence that the plan will do so.\nThus, i"},{"n":660,"s":"Verb","t":"Critical Reasoning","d":"E","topic":"Critical Reasoning \u2014 Critical Reasoning","q":"Hollywood restaurant is replacing some of its standard tables with tall tables and stools. The\nrestaurant already fills every available seat during its operating hours, and the change in\nseating arrangements will not result in an increase in the restaurant\u2019s seating capacity.\nNonetheless, the restaurant\u2019s management expects revenue to increase as a result of the\nseating change without any concurrent change in menu, prices, or operating hours.\nWhich of the following, if true, provides the best re","opts":{"A":"One of the taller tables takes up less floor space than one of the standard tables.","B":"Diners seated on stools typically do not linger over dinner as long as diners seated at","C":"Since the restaurant will replace only some of its standard tables, it can continue to","D":"Few diners are likely to avoid the restaurant because of the new seating arrangement.","E":"The standard tables being replaced by tall tables would otherwise have to be replaced"},"ans":"B","exp":"Argument Construction\nSituation\n\nHollywood restaurant is replacing some of its tables with taller tables and\nstools, and the management expects this will increase revenue, despite the fact\nthat the restaurant already fills all of its available seats and that this change will\n\n\f\nnot increase seating capacity. Furthermore, there will not be any change in\nmenu, prices, or operating hours.\nReasoning\n\nWhat would strongly support the management\u2019s expectation? Since the new\nseating will not increase the restaurant\u2019s seating capacity, the management\u2019s\nexpectations must be based on a belief that the change to taller tables and\nstools will somehow change diners\u2019 behavior, perhaps by leading them to\norder more food, or to stay at their tables for a shorter time, thereby allowing\nthe restaurant to serve more diners during its operating hours without\nincreasing seating capacity. If diners seated at tall tables and on tall stools\nspend less time lingering over their dinners, then they will leave sooner,\nopening up the tables for more diners. Because the restaurant, before the\nchange, already fills every available seat during its operating hours, it is\nreasonable to think that it will be able to "},{"n":661,"s":"Verb","t":"Critical Reasoning","d":"E","topic":"Critical Reasoning \u2014 Inference","q":"A major network news organization experienced a drop in viewership in the week following\nthe airing of a controversial report on the economy. The network also received a very large\nnumber of complaints regarding the report. The network, however, maintains that negative\nreactions to the report had nothing to do with its loss of viewers.\nWhich of the following, if true, most strongly supports the network\u2019s position?","opts":{"A":"The other major network news organizations reported similar reductions in viewership","B":"The viewers who registered complaints with the network were regular viewers of the","C":"Major network news organizations publicly attribute drops in viewership to their own"},"ans":"A","exp":"Argument Construction\n\n\f\nSituation\n\nA major network news organization aired a controversial report on the\neconomy, and the following week the network\u2019s viewership declined. The\nnetwork claims that the loss of viewers was not connected with negative\nreactions to the report.\n\nReasoning\n\nWhich statement most strongly supports the network\u2019s position? If other major\nnews networks had similar drops in viewership, it is implausible to think that\nthe controversial report accounted for the other networks\u2019 drops in\nviewership. On the other hand, it is plausible to suppose that whatever did\ncause the drop in the viewership experienced by other network news\norganizations\u2014e.g., holidays, weather, popular non-news programming\u2014also\nhad that effect on the organization that ran the controversial report. This\nwould give some reason to believe that the airing of the report does not\naccount for the organization\u2019s drop in viewership.\n\nA. Correct. The network\u2019s position is that the drop in viewership was not caused by its\nairing of the controversial report and thus that the drop was caused by something else.\nThis answer choice provides some evidence that there might have been a different cause.\nIf none "},{"n":662,"s":"Verb","t":"Critical Reasoning","d":"E","topic":"Critical Reasoning \u2014 Critical Reasoning","q":"Only a reduction of 10 percent in the number of scheduled flights using Greentown\u2019s airport\nwill allow the delays that are so common there to be avoided. Hevelia airstrip, 40 miles away,\nwould, if upgraded and expanded, be an attractive alternative for fully 20 percent of the\npassengers using Greentown airport. Nevertheless, experts reject the claim that turning\nHevelia into a full-service airport would end the chronic delays at Greentown.\nWhich of the following, if true, most helps to justify t","opts":{"A":"Turning Hevelia into a full-service airport would require not only substantial construction","B":"A second largely undeveloped airstrip close to Greentown airport would be a more","C":"Hevelia airstrip lies in a relatively undeveloped area but would, if it became a full-service","D":"If an airplane has to wait to land, the extra jet fuel required adds significantly to the","E":"Several airlines use Greentown as a regional hub, so that most flights landing at"},"ans":"E","exp":"Situation\n\nTo avoid the delays now common at Greentown\u2019s airport, the number of\nscheduled flights there would need to be reduced by 10 percent. If the nearby\nHevelia airstrip were expanded and upgraded, it would be an attractive\nalternative for 20 percent of Greentown airport\u2019s passengers. Still, experts do\nnot believe that the delays at Greentown would end even if Hevelia were\nturned into a full-service airport.\n\nReasoning\n\nWhich statement most supports the experts\u2019 position? If the number of flights at\nGreentown\u2019s airport did not drop by at least 10 percent, despite the fact that\n20 percent of the passengers who currently use Greentown\u2019s airport would\nfind nearby Hevelia airstrip an attractive alternative, then the delays would not\nbe avoided. Airlines generally use certain airports as regional hubs\u2014an\nairport through which an airline routes most of its traffic\u2014so, even if many\npassengers would be willing to use Hevelia airstrip, the number of flights at\nGreentown may not decline significantly, or at all.\n\nA. The experts\u2019 position concerns what would happen to the flight delays at Greentown\nairport if the Hevelia airstrip were converted into a full-service airport. So, the fact t"},{"n":663,"s":"Verb","t":"Critical Reasoning","d":"E","topic":"Critical Reasoning \u2014 Assumption","q":"Farmer: Worldwide, just three grain crops\u2014rice, wheat, and corn\u2014account for most human\ncaloric intake. To maintain this level of caloric intake and also keep pace with global\npopulation growth, yields per acre from each of these crops will have to increase at least 1.5\npercent every year, given that the supply of cultivated land is diminishing. Therefore, the\ngovernment should increase funding for research into new ways to improve yields.\nWhich of the following is an assumption on which the farm","opts":{"A":"It is solely the government\u2019s responsibility to ensure that the amount of rice, wheat, and","B":"Increasing government funding for research into new ways to improve the yields per","C":"Increasing the yields per acre of rice, wheat, and corn is more important than increasing","D":"Current levels of funding for research into ways of improving grain crop yields per acre","E":"In coming decades, rice, wheat, and corn will become a minor part of human caloric"},"ans":"B","exp":"Argument Construction\nSituation\n\nThe farmer states that although the worldwide human population is increasing,\nthe supply of cultivated land is decreasing. We thus need to increase yields for\nthe food crops that account for most of human caloric intake\u2014rice, wheat, and\ncorn\u2014if we are to maintain our existing caloric intake. The increase in yields,\naccording to the farmer, would need to be at least 1.5 percent every year.\n\nReasoning\n\nWhat must be true if we are to accept the farmer\u2019s conclusion, that the\ngovernment should increase funding for research into new ways to improve crop\nyields, on the basis of the above statements? The farmer uses the above\nstatements as premises of an argument for an increase in government funding\nfor research on crop yields. Supposing that the farmer\u2019s statements are true,\nwe need to find in the available options the statement that, if added to the\nargument, may allow us to accept the farmer\u2019s conclusion, based on the\nargument.\n\nA. Whether or not nongovernmental entities such as NGOs (nongovernmental\norganizations) are responsible for helping to ensure that humans have an adequate\namount of food, governments may or may not also have this responsibility."},{"n":664,"s":"Verb","t":"Critical Reasoning","d":"E","topic":"Critical Reasoning \u2014 Critical Reasoning","q":"The air quality board recently informed Coffee Roast, a small coffee roasting firm, of a\ncomplaint regarding the smoke from its roaster. Recently enacted air quality regulations\nrequire machines roasting more than 10 pounds of coffee to be equipped with expensive\nsmoke-dissipating afterburners. The firm, however, roasts only 8 pounds of coffee at a time.\nNevertheless, the company has decided to purchase and install an afterburner.","opts":{},"ans":"E","exp":"Situation\n\nAfter being informed of a complaint about smoke from its coffee roaster, a firm\ndecided to purchase and install an afterburner to reduce or eliminate\nemissions of smoke, even though the roaster roasts too little coffee at a time\nfor an afterburner to be legally required.\n\nReasoning\n\nWhat would have been a good reason for the firm to buy and install the\nafterburner? The only factors mentioned that might give the firm reason to buy\nan afterburner are the complaint about smoke and the regulations requiring\nan afterburner. Since the regulations do not apply in this case, the complaint is\nmore likely to have motivated the firm\u2019s decision. Any serious potential\nconsequences the firm might have faced from failure to address the complaint\ncould have provided a good reason to buy and install the afterburner.\n\nA. If this debate had still been ongoing when the firm made its decision, uncertainty about\nthe pending regulations might have justified the decision. But the debate had already\nbeen settled before the firm decided to purchase the afterburner, and the regulations\nclearly did not require one.\nB. An unspecified alteration in flavor is not clearly a good reason to use an afterb"},{"n":665,"s":"Verb","t":"Critical Reasoning","d":"E","topic":"Critical Reasoning \u2014 Weaken","q":"People who do regular volunteer work tend to live longer, on average, than people who do\nnot. It has been found that \u201cdoing good,\u201d a category that certainly includes volunteer work,\nreleases endorphins, the brain\u2019s natural opiates, which induce in people a feeling of wellbeing. Clearly, there is a connection: regular releases of endorphins must in some way help to\nextend people\u2019s lives.\nWhich of the following, if true, most seriously undermines the force of the evidence given as\nsupport for the ","opts":{"A":"People who do regular volunteer work are only somewhat more likely than others to","B":"Although extremely high levels of endorphins could be harmful to health, such levels are","C":"There are many people who have done some volunteer work but who do not do such","D":"People tend not to become involved in regular volunteer work unless they are healthy","E":"Releases of endorphins are responsible for the sense of well-being experienced by many"},"ans":"D","exp":"Argument Evaluation\nSituation\n\nPeople who volunteer regularly live longer on average than people who do\nnot. Doing good work, including volunteer work, releases endorphins, which\ninduce a feeling of well-being.\n\nReasoning\n\nWhat additional findings would suggest that the cited evidence does not indicate\nthat endorphins increase longevity? The argument implicitly assumes that the\nreason regular volunteers tend to live longer is that volunteering lengthens\ntheir lives. It further assumes that no factor that is correlated with\nvolunteering, other than the endorphin release, would plausibly explain how\nvolunteering could have this effect. Findings that cast doubt on either of these\nassumptions would undermine the connection between the cited evidence and\nthe conclusion that endorphins promote longevity.\n\nA. Volunteering might greatly boost volunteers\u2019 endorphin levels even if the work the\nvolunteers do for a living is no different from other people\u2019s work.\nB. Even if unnaturally high endorphin levels could harm health, the levels attainable through\nvolunteer work may promote health.\nC. The argument is about an observed correlation in a certain group of people (those who\nregularly do vol"},{"n":666,"s":"Verb","t":"Critical Reasoning","d":"E","topic":"Critical Reasoning \u2014 Explain","q":"A study compared a sample of Swedish people older than 75 who needed in-home assistance\nwith a similar sample of Israeli people. The people in the two samples received both informal\nassistance, provided by family and friends, and formal assistance, professionally provided.\nAlthough Sweden and Israel have equally well-funded and comprehensive systems for\nproviding formal assistance, the study found that the people in the Swedish sample received\nmore formal assistance, on average, than those in th","opts":{"A":"A companion study found that among children needing special in-home care, the amount","B":"More Swedish than Israeli people older than 75 live in rural areas where formal","C":"Although in both Sweden and Israel much of the funding for formal assistance ultimately","D":"In recent decades, the increase in life expectancy of someone who is 75 years old has"},"ans":"E","exp":"Argument Construction\nSituation\n\nA study of elder care in Israel and Sweden found that in Sweden, of the total\namount of care that people older than 75 and needing in-home assistance\nreceived, the proportion of care that was formal, i.e., provided by professional\ncare personnel, was greater than in Israel. Both Sweden and Israel had equally\ngood systems for providing formal care, and in both countries, the elderly also\nreceived informal care, i.e., care provided by friends and family.\n\nReasoning\n\nAmong the factors given, which would most contribute to explaining the difference\nthe study found between Sweden and Israel with respect to elder care? A good\nguess would be that there is a difference in some societal factor that affects the\ndifference the study found. For example, perhaps elders in one of the\ncountries regard maintaining independence as a higher priority than elders in\nthe other and consequently try to rely less on friends and family? Perhaps\npatterns of decline in ability to remain independent are different in the two\ncountries? Or perhaps a greater proportion of elders live alone in one of the\ncountries than in the other?\n\nA. The difference to be explained concerns only"},{"n":667,"s":"Verb","t":"Critical Reasoning","d":"E","topic":"Critical Reasoning \u2014 Inference","q":"Film director: It is true that certain characters and plot twists in my newly released film The\nBig Heist are similar to characters and plot twists in Thieves, a movie that came out last year.\nPointing to these similarities, the film studio that produced Thieves is now accusing me of\ntaking ideas from that film. The accusation is clearly without merit. All production work on\nThe Big Heist was actually completed months before Thieves was released.\nWhich of the following, if true, provides the str","opts":{"A":"Before Thieves began production, its script had been circulating for several years among","B":"The characters and plot twists that are most similar in the two films have close parallels","C":"The film studio that produced Thieves seldom produces films in this genre.","D":"The director of Thieves worked with the director of The Big Heist on several earlier","E":"Production work on Thieves began before production work on The Big Heist was started."},"ans":"B","exp":"Argument Evaluation\nSituation\n\nThe director of the film The Big Heist has been accused, by the studio that\nproduced the film Thieves, of taking ideas from the film. The director responds\nthat the accusation lacks merit, since all production work on The Big Heist was\ncompleted before Thieves appeared last year in theaters.\n\nReasoning\n\nWhich of the five statements most strongly supports the director\u2019s position? Crime\nthrillers, as a film genre, are likely to have stock characters and plot lines that\nreflect a long tradition. So, it would be no surprise if some of the characters or\nplot twists in one such film would resemble, to a greater or lesser extent, the\ncharacters and plot twists in another. The studio might be correct in identifying\nsuch resemblances between The Big Heist and Thieves. But it would not\n\n\f\nnecessarily be correct that characters or plot lines in The Big Heist were\nderived from Thieves.\nA. This undercuts the director\u2019s position, since it provides information that indicates an\nopportunity for the director to copy ideas from the script for Thieves.\nB. Correct. This information strengthens the support for the director\u2019s claim that the\nstudio\u2019s accusation lacks merit."},{"n":668,"s":"Verb","t":"Critical Reasoning","d":"E","topic":"Critical Reasoning \u2014 Critical Reasoning","q":"In Mernia, commercial fossil hunters often sell important fossils they have found, not to\nuniversities or museums but to individual collectors, who pay much better but generally do\nnot allow researchers access to their collections. To increase the number of fossils available\nfor research, some legislators propose requiring all fossils that are found in Mernia to be sold\nonly to universities or museums.\nWhich of the following, if true, most strongly indicates that the legislators\u2019 proposal will f","opts":{"A":"Some fossil hunters in Mernia are not commercial fossil hunters, but rather are amateurs","B":"Most fossils found in Mernia are common types that have little scientific interest.","C":"Commercial fossil hunters in Mernia currently sell some of the fossils they find to","D":"Many universities in Mernia do not engage in fossil research.","E":"Most fossils are found by commercial fossil hunters, and they would give up looking for"},"ans":"E","exp":"Situation\n\nFossil hunters in Mernia often sell important fossils to collectors who do not\nmake them accessible to researchers. To increase the number of fossils\navailable for research, some legislators propose requiring all fossils found in\nMernia to be sold only to universities or museums.\n\nReasoning\n\nWhat would most strongly suggest that requiring all fossils found in Mernia to be\nsold only to universities or museums would not increase the number of fossils\navailable for research? To increase the number of fossils available for research,\nthe proposed requirement will have to be implemented and effectively\nenforced. It will presumably have to increase the total number of fossils sold to\n\n\f\nuniversities and museums. And those institutions will have to make more of the\nfossils in their collections available to researchers than the private collectors\ndo. Evidence that any of those conditions will not be fulfilled would suggest\nthat the legislators\u2019 proposal will fail to achieve its goal.\nA. Even if the legislation does not affect fossils kept by amateurs, it might still result in many\nmore fossils being sold to universities or museums rather than to private collectors, and\nthus might"},{"n":669,"s":"Verb","t":"Critical Reasoning","d":"E","topic":"Critical Reasoning \u2014 Inference","q":"Economist: Tropicorp, which constantly seeks profitable investment opportunities, has been\nbuying and clearing sections of tropical forest for cattle ranching, although pastures newly\ncreated there become useless for grazing after just a few years. The company has not gone\ninto rubber tapping, even though greater profits can be made from rubber tapping, which\nleaves the forest intact. Thus, some environmentalists argue that Tropicorp\u2019s actions do not\nserve even its own economic interest. However","opts":{"A":"The first supports the conclusion of the economist\u2019s argument; the second calls that"},"ans":"D","exp":"Argument Construction\nSituation\n\nAccording to an economist, the firm Tropicorp has been investing in tropical\nforest that it has cleared for cattle ranching. But its new pastures are useless\nfor grazing after a few years. In contrast, rubber tapping\u2014which would avoid\ncutting trees\u2014could be more profitable. According to the economist,\nenvironmentalists consequently argue that Tropicorp\u2019s investment does not\n\n\f\nserve the firm\u2019s economic interest. However, the economist argues, investing in\nrubber tapping involves some potential costs and risks greater than those that\ninvesting in cattle ranching involves. Consequently, the economist argues, the\nenvironmentalists\u2019 conclusion is probably wrong.\nReasoning\n\nWhat function is served by the statement that Tropicorp\u2019s actions do not serve\neven its own economic interest? What function is served by the statement that the\nenvironmentalists\u2019 conclusion is probably wrong? The first statement is a\nconclusion that the economist attributes to environmentalists. The second\nstatement is the conclusion of an argument presented by the economist.\n\nA. The first states the conclusion of the argument that is attributed to environmentalists; it\ndoes not supp"},{"n":670,"s":"Verb","t":"Critical Reasoning","d":"E","topic":"Critical Reasoning \u2014 Inference","q":"Brown tides are growths of algae on the sea\u2019s surface that prevent sunlight from reaching\nmarine plants below, thereby destroying not only the plants but also the shellfish that live off\nthese plants. Biologists recently isolated a virus that, when added to seawater, kills the algae\nthat cause brown tides. Adding large quantities of this virus to waters affected by brown tides\nwill therefore make it possible to save the populations of shellfish that inhabit those waters.\nWhich of the following, ","opts":{"A":"When applied in large quantities, the virus not only kills the algae that cause brown tides","B":"Marine animals that prey on shellfish avoid areas of the sea in which brown tides are","C":"The number of different kinds of viruses present in seawater is far greater than many","D":"The presence of large quantities of the virus in seawater does not adversely affect the","E":"The amount of the virus naturally present in seawater in which brown tides occur is"},"ans":"D","exp":"Argument Evaluation\nSituation\n\nBrown tides\u2014growths of algae on the sea\u2019s surface\u2014kill the marine plants on\nwhich certain shellfish depend, by depriving them of sunlight. Biologists have\ndiscovered a virus that, if added to seawater in large quantities, can kill the\nalgae. An author argues that this can be a means of saving the shellfish\npopulations.\n\n\f\nReasoning\n\nWhich of the answer choices most strongly supports the conclusion of the\nargument? The argument concludes that adding large quantities of the virus to\nseawater infected by brown tides will help the shellfish survive. Any new\ninformation suggesting that the virus would, directly or indirectly, help the\nshellfish survive supports the conclusion. But the conclusion would be\nquestionable if the virus could directly or indirectly harm the shellfish in a way\nthat would outweigh any benefits the virus provides. New information\nindicating that this would not occur could provide support for the argument.\n\nA. This information suggests that deployment of the virus could have undesirable side\neffects, but it neither supports nor casts doubt on the conclusion. We have no\ninformation suggesting that killing algae other than those that p"},{"n":671,"s":"Verb","t":"Critical Reasoning","d":"E","topic":"Critical Reasoning \u2014 Explain","q":"In persons with astigmatism, the clear outer layer of the eye is deformed in a way that impairs\nand sometimes distorts vision. The elongated figures in the paintings of El Greco (1541\u20131614)\nwere so unusual that some critics sought to explain them by hypothesizing that, without\nknowing it, El Greco had an astigmatism that caused everything to appear to him in the\ndistorted way that was characteristic of his painted figures.\nThe proposed explanation is most vulnerable to the criticism that it fail","opts":{"A":"establish that during the period in which El Greco lived, there was any correction","B":"provide evidence that astigmatism was common in the 1500s and 1600s","C":"consider that the critics who proposed the explanation might have suffered from","D":"consider the effect of the hypothesized astigmatism on El Greco\u2019s perception of his own","E":"allow for the possibility that artists see the world differently than do nonartists"},"ans":"D","exp":"Argument Evaluation\nSituation\n\nFigures in the paintings of El Greco are strikingly elongated. Some art critics\nhave hypothesized that this was an unintentional result of his having a type of\n\n\f\nastigmatism that made things look elongated to him.\nReasoning\n\nWhat is a significant weakness in the critics\u2019 explanation? Reasons to doubt the\nexplanation could include any evidence that another explanation is more likely\nto be true or that the situation envisioned in the explanation may be\nimpossible or inconsistent with the phenomena to be explained. For example,\nif only human figures in El Greco\u2019s paintings were elongated while other\nsimilarly shaped objects were not, that observation would be inconsistent with\nthe claim that the elongations were due to a general distortion in his vision.\nAnswer choice D presents a similar reason to think that the proposed\nexplanation is inconsistent with the facts. If El Greco perceived human models\nas more elongated than they appear to non-astigmatic perceivers, he would\nalso have perceived his depictions of such models as more elongated than\nthose depictions appear to non-astigmatic perceivers. So if he had intended to\ndepict the figures accurately, h"},{"n":672,"s":"Verb","t":"Critical Reasoning","d":"E","topic":"Critical Reasoning \u2014 Critical Reasoning","q":"Marketing executive for Magu Corporation: Whenever Magu opens a manufacturing facility in\na new city, the company should sponsor, or make donations to, a number of nonprofit\norganizations in that city. Doing so would improve Magu\u2019s image in the community, and thus\nthe money spent on such charitable ventures would lead to increased sales.","opts":{},"ans":"B","exp":"Situation\n\nA marketing executive for Magu Corporation argues that Magu can increase its\nsales if it sponsors or donates to nonprofit organizations in any city in which it\nopens a new manufacturing facility, because doing so would improve its image\nin that city and increase sales.\n\nReasoning\n\nWhat would most strongly suggest that Magu would not increase sales even if it\nfollowed the plan proposed by the marketing executive? Sponsoring or donating\nto nonprofit organizations would require the use of financial assets that\ntherefore cannot be spent elsewhere. If as a result Magu had to cut other\nexpenditures that drive sales more effectively than funding nonprofit\norganizations drives sales, the plan may not succeed.\n\nA. Because Magu sells its products internationally and no one city represents more than a\nsmall portion of revenue, any increase in sales in any given city will have only a slight\neffect on total sales; nonetheless, sales could still rise.\nB. Correct. If sponsoring or donating to a nonprofit would require Magu to reduce\nadvertising, and advertising is the most effective means of reaching its target customers,\nthen any positive influence on sales resulting from the charitab"},{"n":673,"s":"Verb","t":"Critical Reasoning","d":"E","topic":"Critical Reasoning \u2014 Weaken","q":"In the last few years, plant scientists have been able to genetically engineer seeds to produce\ncrops highly resistant to insect damage. Farmers growing crops with these seeds will be able\nto spend significantly less on pesticides. This cost reduction would more than make up for the\nhigher cost of the genetically engineered seeds. Clearly, therefore, farmers who grow crops\nfrom genetically engineered seeds will be able to reduce their costs by using them.\nWhich of the following, if true, most we","opts":{"A":"Plant scientists have not yet developed insect-resistant strains of every crop that is","B":"The cost of several commonly used pesticides is expected to rise in the next few years.","C":"Crops grown from the genetically engineered seeds require significantly more fertilizer","D":"In the future, the cost of genetically engineered seeds is likely to fall to the level of","E":"The crops that now require the greatest expenditure on pesticides are not the ones for"},"ans":"C","exp":"Argument Evaluation\nSituation\n\nFarmers who grow crops with seeds that have been genetically engineered to\nproduce crops resistant to insect damage will be able to spend less on\npesticides. Though these seeds are more expensive than regular seeds, this\ngreater cost will be more than compensated for by lower expenditures on\npesticides.\n\nReasoning\n\nWhat claim most weakens the argument\u2019s support for the claim that farmers who\ngrow crops from these genetically engineered seeds will be able to reduce their\ncosts by using them? The argument gives us good reason to think that even\nthough these seeds are more expensive, the added expense is less than the\namount that farmers will save by reducing their pesticide usage. But the\nargument does not tell us how the use of these seeds affects other costs the\nfarmer might have. If, for instance, crops grown from these seeds require\ngreater use of fertilizer or water, costs may stay stable or even increase.\n\nA. The argument\u2019s conclusion is only that farmers who grow crops using these seeds will be\nable to reduce their costs. The argument does not claim that every farmer will be able to\nreduce costs for every crop the farmer produces.\nB. If the cost "},{"n":674,"s":"Verb","t":"Critical Reasoning","d":"E","topic":"Critical Reasoning \u2014 Inference","q":"Educational theorist: Recent editorials have called for limits on the amount of homework\nassigned to schoolchildren younger than 12. They point out that free-time activities play an\nimportant role in childhood development and that homework in large quantities can severely\nrestrict children\u2019s free time, hindering their development. But the actual average homework\ntime for children under 12\u2014little more than 30 minutes per night\u2014leaves plenty of free time.\nIn reality, therefore, the editorials\u2019 rat","opts":{"A":"Some teachers give as homework assignments work of a kind that research suggests is","B":"For children younger than 12, regularly doing homework in the first years of school has","C":"Some homework assignments are related to free-time activities that children engage in,","D":"A substantial proportion of schoolchildren under 12, particularly those in their first few"},"ans":"D","exp":"Argument Evaluation\nSituation\n\nAn educational theorist points out that recent editorials have called for limits\non the amount of homework assigned to children under the age of 12, since\nlarge amounts of homework can restrict the sort of free-time activities that are\ncrucial to their development. The theorist argues that such restrictions are not\njustified, because children under 12 spend on average only 30 minutes on\nhomework. That leaves plenty of time for other activities.\n\nReasoning\n\nWhat would most seriously call the theorist\u2019s conclusion into question? The\ntheorist gives only the average amount of time children under the age of 12\nspend on homework. However, the editorials advocated a limit on the\nmaximum amount of homework assigned, not on the average amount across\nall schoolchildren. There could be a wide variation among the amounts of time\ndifferent children spend on homework. While a large number of children may\nspend only a short amount of time on homework, some children may spend\nmuch longer. For those who have the greater amounts of homework, this might\nleave little time for important free-time activities.\n\nA. This claim, if true, may suggest that certain types of homew"},{"n":675,"s":"Verb","t":"Critical Reasoning","d":"E","topic":"Critical Reasoning \u2014 Critical Reasoning","q":"Thyrian lawmaker: Thyria\u2019s Cheese Importation Board inspects all cheese shipments to Thyria\nand rejects shipments not meeting specified standards. Yet only 1 percent is ever rejected.\nTherefore, since the health consequences and associated economic costs of not rejecting that\n1 percent are negligible, whereas the board\u2019s operating costs are considerable, for economic\nreasons alone the board should be disbanded.\nConsultant: I disagree. The threat of having their shipments rejected deters many che","opts":{"A":"rejecting the lawmaker\u2019s argument while proposing that the standards according to","B":"providing evidence that the lawmaker\u2019s argument has significantly overestimated the cost","C":"objecting to the lawmaker\u2019s introducing into the discussion factors that are not strictly","D":"pointing out a benefit of maintaining the board which the lawmaker\u2019s argument has failed","E":"shifting the discussion from the argument at hand to an attack on the integrity of the"},"ans":"D","exp":"Argument Construction\n\n\f\nSituation\n\nThe Thyrian lawmaker argues that the Cheese Importation Board should be\ndisbanded, because its operating costs are high and it rejects only a small\npercentage of the cheese it inspects. The consultant disagrees, pointing out\nthat the board\u2019s inspections deter those who export cheese to Thyria from\nshipping substandard cheese.\n\nReasoning\n\nWhat strategy does the consultant use in the counterargument? The consultant\nindicates to the lawmaker that there is a reason to retain the board that the\nlawmaker has not considered. The benefit the board provides is not that it\nidentifies a great deal of substandard cheese and rejects it (thus keeping the\npublic healthy), but that the possibility that their cheese could be found\nsubstandard is what keeps exporters from attempting to export low-quality\ncheese to Thyria.\n\nA. The consultant does reject the lawmaker\u2019s argument, but the consultant does not\npropose higher standards. Indeed, in suggesting that the board should be retained, the\nconsultant implies that the board\u2019s standards are appropriate.\nB. The consultant does not provide any evidence related to the board\u2019s cost.\nC. The only point the lawmaker raises"},{"n":676,"s":"Verb","t":"Critical Reasoning","d":"E","topic":"Critical Reasoning \u2014 Critical Reasoning","q":"The tulu, a popular ornamental plant, does not reproduce naturally and is only bred and sold\nby specialized horticultural companies. Unfortunately, the tulu is easily devastated by a\ncontagious fungal rot. The government ministry plans to reassure worried gardeners by\nrequiring all tulu plants to be tested for fungal rot before being sold. However, infected plants\nless than 30 weeks old have generally not built up enough fungal rot in their systems to be\ndetected reliably. And many tulu plants a","opts":{"A":"Releasing a general announcement that tulu plants less than 30 weeks old cannot be","B":"Requiring all tulu plants less than 30 weeks old to be labeled as such","C":"Researching possible ways to test tulu plants less than 24 weeks old for fungal rot","D":"Ensuring that tulu plants are not sold before they are 30 weeks old","E":"Quarantining all tulu plants from horticultural companies at which any case of fungal rot"},"ans":"D","exp":"Situation\n\nThere is a contagious fungal rot that devastates the tulu, a popular ornamental\nplant. To reassure worried gardeners, the government ministry plans to\nrequire that tulu plants be tested for the rot before being sold. However, many\ntulu plants are sold before they are 24 weeks old, yet fungal rot in plants less\nthan 30 weeks old generally cannot be detected reliably.\n\nReasoning\n\nWhat could the government ministry do to overcome the problem? The problem\narises from the fact that tulu plants are frequently sold before they are 24\nweeks old, which is too soon for any fungal rot that is present to have built up\nenough in their root systems to be detected. Since the goal of the testing is to\nensure that infected tulu plants are not sold, an obvious solution would be to\nmake sure that no plants are sold before they are old enough for fungal rot to\nhave built up to a detectable level. Thus, tulu plants should not be sold before\nthey are 30 weeks old.\n\nA. Releasing such an announcement would help overcome the problem if it guaranteed that\nno one would buy or sell tulu plants before the plants were 30 weeks old, but it is far\nfrom certain that it would guarantee this.\nB. Similar t"},{"n":677,"s":"Verb","t":"Critical Reasoning","d":"E","topic":"Critical Reasoning \u2014 Explain","q":"While many people think of genetic manipulation of food crops as being aimed at developing\nlarger and larger plant varieties, some plant breeders have in fact concentrated on\ndiscovering or producing dwarf varieties, which are roughly half as tall as normal varieties.\nWhich of the following would, if true, most help to explain the strategy of the plant breeders\nreferred to above?","opts":{"A":"Plant varieties used as food by some are used as ornamentals by others.","B":"The wholesale prices of a given crop decrease as the supply of it increases."},"ans":"D","exp":"Situation\n\nSome plant breeders have concentrated on discovering or producing certain\nspecies of food crop plants to be roughly half as tall as normal varieties.\n\n\f\nReasoning\n\nWhy would some plant breeders concentrate on discovering or producing smaller\nvarieties of certain food crops? Presumably, these breeders would not seek\nsmaller varieties of plant crops unless the smaller size conveyed some benefit.\nIf short plants were less vulnerable to strong wind and heavy rains, they would\nbe apt to be more productive, other things being equal. Plant breeders would\nhave reason to try to discover or produce such more productive varieties.\n\nA. This statement doesn\u2019t indicate whether those who use the plants as ornamentals desire\nshorter varieties.\nB. At most this suggests that higher productivity is not as much of an advantage as it\notherwise would be. But there is nothing in the passage that indicates that smaller\nvarieties would be more productive than normal-sized plants.\nC. No reason is given for thinking that smaller varieties of plants are more conducive to use\nfor animal feed than are larger varieties.\nD. Correct. This answer choice is correct because\u2014unlike the other choices\u2014it help"},{"n":678,"s":"Verb","t":"Critical Reasoning","d":"E","topic":"Critical Reasoning \u2014 Weaken","q":"Secret passwords are often used to control access to computers.\nWhen employees select their own passwords, they frequently choose such easily guessed\npasswords as their initials or birth dates. To improve security, employers should assign\nrandomly generated passwords to employees rather than allowing employees to make up\ntheir own.\nWhich of the following, if true, most seriously undermines the conclusion drawn above?","opts":{"A":"If passwords are generated randomly, it is theoretically possible that employees will be","B":"Randomly generated passwords are so difficult for employees to recall that they often","C":"Computer systems protected by passwords are designed to ignore commands that are","D":"In general, the higher the level of security maintained at the computer system, the more","E":"Control of physical access to computers by the use of locked doors and guards should be"},"ans":"B","exp":"Argument Evaluation\nSituation\n\nPasswords are intended to control access to computers, limiting access only to\nintended users. Employees often choose easily guessed passwords. To improve\nsecurity, therefore, employers should assign randomly generated passwords.\n\nReasoning\n\nWhat would significantly undermine the argument\u2019s conclusion? Any evidence\nthat suggests that assigning randomly generated passwords would be no more\n\n\f\nlikely to be secure than employee-generated passwords would undermine the\nconclusion.\nA. Even if in theory a randomly generated password could assign an employee a password\nthe employee might have selected, that in actuality is extremely improbable.\nB. Correct. If employees frequently record their randomly generated passwords where\npeople who are not intended to have access to their computers can easily see them, as\nthis option indicates, then such randomly generated passwords might in such cases\nreduce rather than increase security.\nC. This detail is irrelevant because the issue is whether an unauthorized user can easily\nenter a valid password, not an invalid one.\nD. This does not undermine the conclusion because the issue is whether the proposed plan\ndoes in fac"},{"n":679,"s":"Verb","t":"Critical Reasoning","d":"E","topic":"Critical Reasoning \u2014 Critical Reasoning","q":"The economy around Lake Paqua depends on fishing of the lake\u2019s landlocked salmon\npopulation. In recent years, scarcity of food for salmon there has caused a decline in both the\nnumber and the size of the adult salmon in the lake. As a result, the region\u2019s revenues from\nsalmon fishing have declined significantly. To remedy this situation, officials plan to introduce\nshrimp, which can serve as a food source for adult salmon, into Lake Paqua.\nWhich of the following, if true, most seriously calls in","opts":{"A":"Salmon is not a popular food among residents of the Lake Paqua region.","B":"Tourists coming to fish for sport generate more income for residents of the Lake Paqua","C":"The shrimp to be introduced into Lake Paqua are of a variety that is too small to be","D":"The primary food for both shrimp and juvenile salmon is plankton, which is not abundant","E":"Fishing regulations prohibit people from keeping any salmon they have caught in Lake"},"ans":"D","exp":"Situation\n\nIn recent years, scarcity of food for landlocked salmon in Lake Paqua has led\nto a decline in number and size of the salmon there, leading to a decline in\nrevenues from salmon fishing, on which the area\u2019s economy depends. Officials\nplan to remedy this situation by introducing shrimp, a common food source for\nadult salmon, into Lake Paqua.\n\nReasoning\n\nWhat would seriously undermine the plan\u2019s chances for success? Note that shrimp\nare described as a food source for adult salmon. If there were good reason to\nthink that shrimp cannot serve as a significant source of food for juvenile\nsalmon\u2014or that shrimp would not be able to live sustainably in the lake\u2014\nthere would be reason to be skeptical of the plan\u2019s eventual success.\n\n\f\nA. Whether salmon is a popular food among residents around Lake Paqua is not\nparticularly relevant to the question of whether introducing shrimp will help the salmon\npopulation there rebound.\nB. Nothing in the plan depends on whether salmon fishing\u2019s primary contribution to the\neconomy of the Lake Paqua region comes from tourists fishing or from commercial\nfishing.\nC. The plan does not depend on the shrimp being usable as a human food source, only on\nt"},{"n":680,"s":"Verb","t":"Critical Reasoning","d":"M","topic":"Critical Reasoning \u2014 Critical Reasoning","q":"Airline representative: The percentage of flight delays caused by airline error decreased\nsignificantly this year. This indicates that airlines listened to complaints about preventable\nerrors and addressed the problems. Although delays caused by weather and other\nuncontrollable factors will always be part of travel, preventable delays are clearly decreasing.\nWhich of the following most clearly points to a logical flaw in the representative\u2019s reasoning?","opts":{},"ans":"D","exp":"Argument Evaluation\nSituation\n\nAccording to an airline representative, the percentage of flight delays caused\nby airline error decreased significantly this year. The representative concludes\nthat airlines have addressed preventable errors reported by travelers.\n\nReasoning\n\nWhich of the answer choices most clearly suggests a logical flaw in the reasoning\nof the airline representative? Flight delays can be caused in many ways: for\nexample, by unpredictable bad weather, mechanical or computer failures, bad\nmanagement, or some combination of these. Some but not all errors of these\nkinds\u2014and the flight delays they might cause\u2014are preventable. Note that the\nargument is focused on the percentage of all flight delays that are airline-error\n(AE) delays. This percentage can decrease by (1) a reduction in the number of\nAE delays or (2) an increase in the number of non-AE delays, i.e., those delays\n\n\f\nthat the airline could not have prevented. Even if a significant increase\noccurred in the number of AE delays, such delays could have decreased as a\npercentage of all flight delays if there had been a large enough increase in nonAE flight delays.\nA. The hypothesis stated in this answer choice off"},{"n":681,"s":"Verb","t":"Critical Reasoning","d":"M","topic":"Critical Reasoning \u2014 Critical Reasoning","q":"Although the school would receive financial benefits if it had soft drink vending machines in\nthe cafeteria, we should not allow them. Allowing soft drink machines there would not be in\nour students\u2019 interest. If our students start drinking more soft drinks, they will be less healthy.\nThe argument depends on which of the following?","opts":{"A":"If the soft drink vending machines were placed in the cafeteria, students would consume","B":"The amount of soft drinks that most students at the school currently drink is not","C":"Students are apt to be healthier if they do not drink soft drinks at all than if they just","D":"Students will not simply bring soft drinks from home if the soft drink vending machines","E":"The school\u2019s primary concern should be to promote good health among its students."},"ans":"A","exp":"Argument Construction\nSituation\n\nAllowing soft drink vending machines in a school cafeteria would financially\nbenefit the school, but students who drink more soft drinks would become less\nhealthy.\n\nReasoning\n\nWhat must be true in order for the claim that students drinking more soft drinks\nwould cause them to become less healthy to justify the conclusion that soft drink\nvending machines should not be allowed in the cafeteria? The argument is that\nbecause drinking more soft drinks would be unhealthy for the students,\nallowing the vending machines would not be in the students\u2019 interest, so the\nvending machines should not be allowed. This reasoning depends on the\nimplicit factual assumption that allowing the vending machines would result in\nthe students drinking more soft drinks. It also depends on the implicit value\njudgment that receiving financial benefits should be less important to the\nschool than preventing a situation that would make the students less healthy.\n\nA. Correct. If the cafeteria vending machines would not result in students consuming more\nsoft drinks, then allowing the machines would not harm the students\u2019 health in the way\nthe argument assumes.\nB. Even if the amount "},{"n":682,"s":"Verb","t":"Critical Reasoning","d":"M","topic":"Critical Reasoning \u2014 Inference","q":"Many athletes inhale pure oxygen after exercise in an attempt to increase muscular\nreabsorption of oxygen. Measured continuously after exercise, however, the blood lactate\nlevels of athletes who inhale pure oxygen are practically identical, on average, to those of\nathletes who breathe normal air. The lower the blood lactate level is, the higher the muscular\nreabsorption of oxygen is.\nIf the statements above are all true, they most strongly support which of the following\nconclusions?","opts":{"A":"Athletes\u2019 muscular reabsorption of oxygen is not increased when they inhale pure","B":"High blood lactate levels cannot be reduced.","C":"Blood lactate levels are a poor measure of oxygen reabsorption by muscles.","D":"The amount of oxygen reabsorbed by an athlete\u2019s muscles always remains constant.","E":"The inhaling of pure oxygen has no legitimate role in athletics."},"ans":"A","exp":"Argument Construction\nSituation\n\nBlood lactate levels after exercise are practically identical in athletes who\nbreathe normal air and in those who inhale pure oxygen after exercise. The\nlower the blood lactate level, the higher the muscular reabsorption of oxygen.\n\nReasoning\n\nWhat conclusion do the stated facts most strongly support? We are told that\nlower blood lactate levels correspond consistently to higher muscular\nreabsorption of oxygen. Since athletes who breathe pure oxygen after exercise\nhave blood lactate levels practically identical to those in athletes who breathe\nnormal air, probably muscular reabsorption of oxygen does not differ\nsignificantly between athletes who breathe pure oxygen and those who\nbreathe pure air.\n\nA. Correct. As explained above, the stated facts suggest that muscular reabsorption of\noxygen does not differ significantly between athletes who breathe pure oxygen and those\nwho breathe pure air. So, breathing pure oxygen instead of normal air after exercise\nprobably does not increase athletes\u2019 muscular reabsorption of oxygen.\nB. None of the statements indicates that blood lactate levels cannot be reduced by means\nother than inhaling pure oxygen.\nC. We are"},{"n":683,"s":"Verb","t":"Critical Reasoning","d":"M","topic":"Critical Reasoning \u2014 Strengthen","q":"Historian: Fifteenth-century advances in mapmaking contributed to the rise of modern nationstates. In medieval Europe (from the fifth to the fifteenth century), sovereignty centered in\ncities and towns and radiated outward, with boundaries often ambiguously defined. The\nconceptual shift toward the modern state began in the late fifteenth century, when mapmakers\nlearned to reflect geography accurately by basing maps on latitude-longitude grids. By the\nmid-seventeenth century, nearly all maps show","opts":{},"ans":"E","exp":"Argument Evaluation\nSituation\n\nA historian claims that fifteenth-century advances in mapmaking contributed to\nthe rise of modern nation-states. In earlier centuries, boundaries of\nsovereignty in Europe were poorly defined, but in the fifteenth century, maps\nwere made based on grids showing latitude and longitude.\n\nReasoning\n\nWhat additional piece of information, if true and added to the argument, would\nmost improve the support offered for the conclusion that improved mapping\ncontributed to the rise of nation-states? The historian claims that there was a\ncause-effect relationship between progress in mapmaking and the rise of the\nnation-state. This claim is supported by information that territories of\nsovereignty were vague and ill-defined before the fifteenth century, when\nlatitude-longitude grids began to allow progressively greater accuracy in the\ndelineation of territories on maps. The argument assumes that the rise of\nnation-states would have required a high degree of clarity about each state\u2019s\nnonoverlapping area of sovereignty.\n\nA. This indicates the role of treaties in the evolution of nation-states but provides no\nadditional support for the historian\u2019s causal claim.\nB. This "},{"n":684,"s":"Verb","t":"Critical Reasoning","d":"M","topic":"Critical Reasoning \u2014 Complete","q":"Sascha: The attempt to ban parliament\u2019s right to pass directed-spending bills\u2014bills that\ncontain provisions specifically funding the favorite projects of some powerful politicians\u2014is\nantidemocratic. Our nation\u2019s constitution requires that money be drawn from our treasury\nonly when so stipulated by laws passed by parliament, the branch of government most\ndirectly representative of the citizens. This requirement is based on the belief that exercising\nthe power to spend public resources involves th","opts":{"A":"designating funding specifically for the favorite projects of some powerful politicians","B":"the right to exercise such a power should belong exclusively to the branch of government","C":"exercising the power to spend public resources is in most cases\u2014but not all\u2014protected","D":"modifications to any spending bills should be considered expenditures authorized by law","E":"only officials who are motivated by concerns for reelection should retain that power"},"ans":"B","exp":"Argument Construction\nSituation\n\nAccording to Sascha, restricting parliament\u2019s ability to direct public money to\nthe projects favored by powerful politicians would be undemocratic. Sascha\nargues that such a restriction on directed spending would be inconsistent with\nconstitutional requirements.\n\nReasoning\n\nWhat piece of information would most logically complete Sascha\u2019s argument?\nWhat piece of information would most strongly associate parliament\u2019s\nspending authority with the concept of democracy? A good guess would be:\nsome information that connects parliament\u2019s public representation role with\nits spending authority.\n\nA. Sascha believes that democratic constitutional principles require that parliament remain\nfree to do what is described in this sentence.\nB. Correct. This statement makes explicit the connection, implicitly relied on by Sascha\u2019s\nargument, between parliament\u2019s spending authority and its role in representing the\npublic.\nC. This statement may be true but fails to associate parliament\u2019s spending authority under\nthe constitution with the notion of democracy.\nD. Bills are merely works-in-progress, texts of proposed laws. Modifications of bills do not in\nthemselves provide "},{"n":685,"s":"Verb","t":"Critical Reasoning","d":"M","topic":"Critical Reasoning \u2014 Boldface","q":"Boreal owls range over a much larger area than do other owls of similar size. Scientists have\nhypothesized that it is scarcity of prey that leads the owls to range so widely. This\nhypothesis would be hard to confirm directly, since it is not possible to produce a sufficiently\naccurate count of the populations of small mammals inhabiting the forests where boreal owls\nlive. Careful study of owl behavior has, however, shown that boreal owls do range over\nlarger areas when they live in regions where","opts":{"A":"The first presents an explanatory hypothesis; the second states the main conclusion of","B":"The first presents an explanatory hypothesis; the second presents evidence tending to","C":"The first presents an explanatory hypothesis; the second presents evidence to support an","D":"The first describes a position that the argument opposes; the second presents evidence","E":"The first describes a position that the argument opposes; the second states the main"},"ans":"B","exp":"Argument Construction\nSituation\n\nBoreal owls range over a much larger area than other owls of similar size.\nScientists hypothesize that they do so because of prey scarcity. Counting the\nowls\u2019 prey\u2014small mammals\u2014in the boreal owls\u2019 habitat is inherently difficult.\nThis makes the scientists\u2019 hypothesis hard to confirm directly. However, it has\nbeen found that boreal owls range widely when they inhabit regions that have\nrelatively little food for the small mammals they prey on.\n\nReasoning\n\nWhat function is served by the statement that it is scarcity of prey that leads the\nowls to range so widely? What function is served by the statement that boreal owls\nrange widely if food for their small-mammal prey is relatively sparse in the region\nthey inhabit? The first boldfaced statement expresses an explanatory\nhypothesis. The passage explicitly says that this is a hypothesis and indicates\nthat scientists have proposed this hypothesis as a tentative explanation for the\ncomparatively wide range of boreal owls. The second boldfaced statement\nprovides some indirect evidence for the scientists\u2019 hypothesis. The final\nsentence of the passage says that the immediately preceding idea (expressed in\nth"},{"n":686,"s":"Verb","t":"Critical Reasoning","d":"M","topic":"Critical Reasoning \u2014 Assumption","q":"Cognitive scientist: Using the pioneering work of comparative psychologist Gordon Gallup as a\nmodel, several studies have investigated animals\u2019 capacity for mirror self-recognition (MSR).\nMost animals exposed to a mirror respond only with social behavior, such as aggression.\nHowever, in the case of the great apes, repeated exposure to mirrors leads to self-directed\nbehaviors, such as exploring the inside of the mouth, suggesting that these animals recognize\nthe reflection as an image of self. Th","opts":{"A":"Gallup\u2019s work has established that the great apes have a capacity for MSR unique among","B":"If an animal does not have the capacity for MSR, it does not have the capacity for selfawareness.","C":"If a researcher exposes an animal to a mirror and that animal exhibits social behavior,","D":"When exposed to a mirror, all animals display either social behavior or self-directed","E":"Animals that do not exhibit MSR may demonstrate a capacity for self-awareness in other"},"ans":"B","exp":"Argument Construction\nSituation\n\nA cognitive scientist claims that several studies, modeled on Gordon Gallup\u2019s\nwork, have investigated animals\u2019 capacity for mirror self-recognition (MSR)\nand found that, whereas most animals exposed to a mirror exhibit only social\nbehavior in response, great apes can come to respond with self-directed\nbehavior. The cognitive scientist infers from this that the great apes, unique\namong nonhumans, have a capacity for self-awareness.\n\nReasoning\n\nWhat must be true for the studies to support the cognitive scientist\u2019s conclusion?\nThe implicit reasoning is that an animal has self-awareness only if the animal\nhas the capacity for MSR; if the latter is lacking, so is the capacity for selfawareness.\n\nA. The studies the cognitive scientist\u2019s inference is based on were not nece
