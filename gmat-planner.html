ssarily conducted\nby Gallup himself. We are told only that they are modeled on his work.\nB. Correct. If it were possible for an animal to have the capacity for self-awareness even if\nthe animal lacks the capacity for MSR, then the studies would not imply that the great\napes have a capacity for self-awareness that other nonhuman animal species lack.\nC. The cognitive scientist\u2019s reasoning d"},{"n":687,"s":"Verb","t":"Critical Reasoning","d":"M","topic":"Critical Reasoning \u2014 Boldface","q":"Last year a record number of new manufacturing jobs were created. Will this year bring\nanother record? Well, any new manufacturing job is created either within an existing company\nor by the start-up of a new company. Within existing firms, new jobs have been created\nthis year at well below last year\u2019s record pace. At the same time, there is considerable\nevidence that the number of new companies starting up will be no higher this year than it was\nlast year, and there is no reason to think that th","opts":{"A":"The first is a claim that the argument challenges; the second is an explicit assumption on","B":"The first is a claim that the argument challenges; the second is a judgment advanced in","C":"The first provides evidence in support of the main conclusion of the argument; the","D":"The first provides evidence in support of the main conclusion of the argument; the","E":"The first and the second are each claims that have been advanced in support of a position"},"ans":"D","exp":"Argument Construction\nSituation\n\nManufacturing jobs are created either within existing companies or in startups. Manufacturing jobs are being created at a much slower rate this year than\nlast year. It seems likely that the number of new start-ups will not exceed last\nyear\u2019s number and that the average number of manufacturing jobs per startup will not exceed last year\u2019s number. So, fewer manufacturing jobs are likely\nto be created this year than last year.\n\nReasoning\n\nWhat function is served by the statement that within existing firms, new jobs have\nbeen created this year at well below last year\u2019s record pace? What function is\nserved by the statement that there is no reason to think that the new companies\nstarting up this year will create more jobs per company than did last year\u2019s startups? The first statement is one of the statements used as support for the\nargument\u2019s main conclusion (the prediction about this year\u2019s job creation). The\nsecond statement gives another premise used as support for that prediction.\n\nA. The argument does not challenge the claim made by the first statement; it uses the first\nand the second statement as support for the argument\u2019s main conclusion, the predi"},{"n":688,"s":"Verb","t":"Critical Reasoning","d":"M","topic":"Critical Reasoning \u2014 Critical Reasoning","q":"A study of ticket sales at a summer theater festival found that people who bought tickets to\nindividual plays had a no-show rate of less than 1 percent, while those who paid in advance\nfor all ten plays being performed that summer had a no-show rate of nearly 30 percent. This\nmay be at least in part because the greater the awareness customers retain about the cost of\nan item, the more likely they are to use it.\nWhich of the following would, if true, best serve as an alternative explanation of th","opts":{},"ans":"D","exp":"Argument Construction\nSituation\n\nPeople who bought tickets to individual plays at a theater festival had a much\nlower no-show rate than did people who paid in advance for all ten plays.\n\nReasoning\n\nWhat factor other than greater awareness of the ticket costs could explain why\npeople who bought tickets individually were more likely to attend the plays? The\npassage suggests that people who bought tickets individually were more likely\nto attend the plays because they were more vividly aware of what they had\npaid for each ticket. But there are other possible explanations\u2014perhaps the\npeople who bought the tickets individually were more eager to attend each\nplay for its own sake, or they had other characteristics or incentives that made\nthem more likely to attend the plays.\n\nA. A slight price difference would not plausibly explain why the no-show rate was thirty\ntimes greater among those who bought all the tickets in advance than among those who\nbought them individually.\nB. This could be true of many people who bought their tickets individually as well as many\nwho bought them in advance.\nC. This would provide an added incentive for those who bought tickets in advance to attend\nall the pl"},{"n":689,"s":"Verb","t":"Critical Reasoning","d":"M","topic":"Critical Reasoning \u2014 Assumption","q":"Although there is no record of poet Edmund Spenser\u2019s parentage, we do know that as a\nyouth, Spenser attended the Merchant Tailors\u2019 School in London for a period between 1560\nand 1570. Records from this time indicate that the Merchant Tailors\u2019 Guild then had only three\nmembers named Spenser: Robert Spenser, listed as a gentleman; Nicholas Spenser, elected the\nGuild\u2019s Warden in 1568; and John Spenser, listed as a \u201cjourneyman cloth-maker.\u201d Of these, the\nlast was likely the least affluent of the thr","opts":{"A":"Anybody in sixteenth-century London who made clothing professionally would have had","B":"The fact that Edmund Spenser attended the Merchant Tailors\u2019 School did not necessarily","C":"No member of the Guild could become Guild warden in sixteenth-century London unless","D":"Most of those whose fathers were members of the Merchant Tailors\u2019 Guild were students","E":"The Merchant Tailors\u2019 School did not reduce its fees for the children of the more affluent"},"ans":"E","exp":"Argument Construction\nSituation\n\nRecords indicate that the poet Edmund Spenser attended the Merchant Tailors\u2019\nSchool for a reduced fee as a youth. There is no record of his parentage, but at\nthe time, the Merchant Tailors\u2019 Guild had only three members named Spenser,\nof whom the least affluent was probably John Spenser.\n\nReasoning\n\nWhat must be true in order for the cited facts to support the conclusion that John\nSpenser was probably Edmund Spenser\u2019s father? The implicit reasoning is that\nsince Edmund Spenser attended the Merchant Tailors\u2019 School at a reduced fee,\nhis father must have been poor. And since John Spenser was probably the\npoorest of the three men named Spenser in the Merchant Tailors\u2019 Guild, he\nwas probably Edmund Spenser\u2019s father. This reasoning assumes that only the\nchildren of poor parents had reduced fees at the Merchant Tailors\u2019 School, that\nthe children at the school generally had fathers in the Merchant Tailors\u2019 Guild,\nthat children in that time and place generally shared their fathers\u2019 surnames,\nand that the two other Spensers in the Merchant Tailors\u2019 Guild were not poor\nenough for their children to qualify for reduced fees.\n\nA. John Spenser, as a tailor and mem"},{"n":690,"s":"Verb","t":"Critical Reasoning","d":"M","topic":"Critical Reasoning \u2014 Inference","q":"Hea Sook: One should not readily believe urban legends. Most legends are propagated\nbecause the moral lesson underlying them supports a political agenda. People will repeat a\ntale if it fits their purpose. They may not deliberately spread untruths, but neither are they\nparticularly motivated to investigate deeply to determine if the tale they are telling is true.\nKayla: But people would not repeat stories that they did not believe were true. Therefore, one\ncan safely assume that if a story has b","opts":{"A":"does not specify how many people need to repeat a story before someone is justified in","B":"overstates the significance of political agendas in the retelling of stories","C":"fails to address the claim that people will not verify the truth of a story that fits their","D":"implicitly supports the claim that the people repeating legends are not deliberately","E":"cannot distinguish people\u2019s motivations for repeating urban legends from their"},"ans":"C","exp":"Argument Evaluation\nSituation\n\nHea Sook and Kayla have a difference of opinion on how likely urban legends\nare to be true.\n\nReasoning\n\nWhat criticism is Kayla\u2019s reply most vulnerable to? Hea Sook argues that because\nurban legends generally are propagated for political purposes, people are not\nparticularly motivated to carefully investigate whether the story they are telling\nis true. These people may not be deliberately telling an untruth, but they have\nnot taken care to establish whether the story is true. Kayla responds that\npeople would not repeat a story that they did not believe to be true, but Hea\nSook not only does not attempt to deny that, but she suggests that it may be\ntrue. Kayla ignores the fact that sometimes people believe that something is\ntrue without carefully determining whether it actually is true, and that they are\nless likely to verify whether it is true when the story fits their purposes.\n\nA. Kayla does not specify how many people need to repeat a story before one is justified in\nbelieving it, but she does not need to. Her claim\u2014that there is some number sufficient for\nsuch belief to be justified\u2014could be true even if she does not specify what that number\nis.\nB"},{"n":691,"s":"Verb","t":"Critical Reasoning","d":"M","topic":"Critical Reasoning \u2014 Critical Reasoning","q":"Rainwater contains hydrogen of a heavy form called deuterium. The deuterium content of\nwood reflects the deuterium content of rainwater available to trees during their growth.\nWood from trees that grew between 16,000 and 24,000 years ago in North America contains\nsignificantly more deuterium than wood from trees growing today. But water trapped in\nseveral North American caves that formed during that same early period contains significantly\nless deuterium than rainwater in North America contains ","opts":{"A":"There is little deuterium in the North American caves other than the deuterium in the","B":"Exposure to water after a tree has died does not change the deuterium content of the","C":"Industrialization in North America over the past 100 years has altered the deuterium","D":"Trees draw on shallow groundwater from rain that falls during their growth, whereas","E":"Wood with a high deuterium content is no more likely to remain preserved for long"},"ans":"D","exp":"Argument Construction\nSituation\n\nIn North America, wood from trees that grew 16,000 to 24,000 years ago\ncontains more deuterium than wood from trees growing today. But water in\ncaves that formed during that same period contains less deuterium than\nrainwater contains today.\n\nReasoning\n\nWhat could explain the puzzling discrepancy between the observed deuterium\nlevels in wood and in caves? Since the deuterium content of wood from trees\nreflects the deuterium content of rainwater available to the trees while they\ngrew, the deuterium levels observed in wood suggests that North American\nrainwater contained more deuterium 16,000 to 24,000 years ago than it\ncontains today. But this conclusion seems at odds with the low deuterium\nlevels in water in caves that formed 16,000 to 24,000 years ago. Several factors\nmight explain the discrepancy: the water in those caves might not be rainwater\nfrom the period when the caves formed; or some natural process might have\naltered the deuterium levels in the cave water or the wood; or the wood or\ncaves in which deuterium levels were measured might be statistically abnormal\nsomehow.\n\n\f\nA. If the caves had absorbed deuterium out of the rainwater trapped in"},{"n":692,"s":"Verb","t":"Critical Reasoning","d":"M","topic":"Critical Reasoning \u2014 Critical Reasoning","q":"Enforcement of local speed limits through police monitoring has proven unsuccessful in the\ntown of Ardane. In many nearby towns, speed humps (raised areas of pavement placed across\nresidential streets, about 300 feet apart) have reduced traffic speeds on residential streets by\n20 to 25 percent. In order to reduce traffic speed and thereby enhance safety in residential\nneighborhoods, Ardane\u2019s transportation commission plans to install multiple speed humps in\nthose neighborhoods.\nWhich of the foll","opts":{"A":"On residential streets without speed humps, many vehicles travel at speeds more than 25","B":"Because of their high weight, emergency vehicles such as fire trucks and ambulances","C":"The residential speed limit in Ardane is higher than that of the nearby towns where","D":"Motorists who are not familiar with the streets in Ardane\u2019s residential districts would be","E":"Bicyclists generally prefer that speed humps be constructed so as to leave a space on the"},"ans":"B","exp":"Situation\n\nArdane\u2019s difficulty in getting compliance with speed limits has led it to propose\nthe installation of speed humps to slow traffic. In nearby towns, speed humps\nhave reduced speeds in residential areas by up to 25 percent.\n\nReasoning\n\nWhich one of the statements presented identifies a major disadvantage of the\nproposed installation of speed humps? Is it possible that they might slow traffic\ntoo much? Clearly, there is a general need for traffic to flow smoothly. Would\n\n\f\nspeed humps affect all types of traffic equally? Perhaps not. For example,\ncertain emergency vehicles must sometimes need to travel quickly through\nresidential neighborhoods. A problem with speed humps is that some heavier\nvehicles must go very slowly over speed humps.\nA. This indicates a drawback of not installing speed humps.\nB. Correct. This information indicates a significant drawback\u2014possibly leading to loss of life\nand property\u2014of the plan to install the speed humps.\nC. This suggests that installing speed humps might lower speeds significantly below the\ncurrent speed limits. If speeds became very low, the result could be traffic gridlock that\nwould have unforeseen consequences. However, we have insu"},{"n":693,"s":"Verb","t":"Critical Reasoning","d":"M","topic":"Critical Reasoning \u2014 Complete","q":"Which of the choices most logically completes the following argument?\nNowNews, although still the most popular magazine covering cultural events in Kalopolis, has\nrecently suffered a significant drop in advertising revenue because of falling circulation. Many\nreaders have begun buying a competing magazine that, at 50 cents per copy, costs less than\nNowNews at $1.50 per copy. In order to boost circulation and thus increase advertising\nrevenue, NowNews\u2019s publisher has proposed making it available ","opts":{},"ans":"C","exp":"Argument Construction\nSituation\n\nNowNews is suffering declines in circulation and advertising revenue due to\ncompetition from a lower-priced magazine. The publisher proposes offering\nNowNews for free to reverse these declines.\n\n\f\nReasoning\n\nWhat would suggest that the publisher\u2019s proposal will fail to increase circulation\nand advertising revenue? The proposal\u2019s intended effect is simply to increase\nadvertising revenue by increasing circulation. Any evidence that offering the\nmagazine for free will not result in more copies being circulated or will not\nattract advertisers would therefore be evidence of a drawback in the proposal.\nSo, a statement offering such evidence would logically complete the argument.\n\nA. The fact that certain highly motivated Kalopolis residents still read NowNews even at a\ncost of $1.50 per issue leaves open the possibility that providing the magazine free might\nstill boost readership.\nB. This suggests that improving its cultural reporting might help NowNews increase its\ncirculation, not that the publisher\u2019s proposal will fail to do so.\nC. Correct. If the proposal leads newsstands and stores to stop carrying NowNews,\ncirculation and advertising revenue would "},{"n":694,"s":"Verb","t":"Critical Reasoning","d":"M","topic":"Critical Reasoning \u2014 Weaken","q":"Archaeologist: Researchers excavating a burial site in Cyprus found a feline skeleton lying\nnear a human skeleton. Both skeletons were in the same sediment at the same depth and\nequally well-preserved, suggesting that the feline and human were buried together about\n9,500 years ago. This shows that felines were domesticated around the time farming began,\nwhen they would have been useful in protecting stores of grain from mice.\nWhich of the following, if true, would most seriously weaken the archa","opts":{"A":"Archaeologists have not found any remains of stores of grain in the immediate vicinity of","B":"The burial site in Cyprus is substantially older than any other known burial site in which","C":"Paintings found near the burial site seem to show people keeping felines as domestic","D":"In Cyprus, there are many burial sites dating from around 9,500 years ago in which the","E":"Before felines were domesticated, early farmers had no effective way to protect stores of"},"ans":"D","exp":"Argument Evaluation\nSituation\n\nA human skeleton and a feline skeleton were apparently buried together in\nCyprus about 9,500 years ago.\n\nReasoning\n\nWhat would most strongly suggest that the skeletons do not show that felines\nwere domesticated around the time farming began? The argument implicitly\nassumes that farming in Cyprus began around 9,500 years ago, so evidence\n\n\f\nagainst that assumption would weaken the argument. The argument could also\nbe weakened by evidence that felines were domesticated much earlier, that the\nfeline skeleton was not from a domesticated cat, or that the two skeletons were\nnot actually buried together around 9,500 years ago.\nA. Even if archaeologists searched for evidence of a grain store, the fact that no such\nevidence was found near the burial site is at best only weak evidence that no grain store\nexisted there or slightly farther away.\nB. The lack of corroborating evidence from other burial sites would weaken the argument\nslightly but would still be compatible with the hypothesis that this site revealed one of the\nvery first burials of a domesticated cat.\nC. This would cast doubt on the hypothesis that cats were domesticated mainly to protect\nstores of "},{"n":695,"s":"Verb","t":"Critical Reasoning","d":"M","topic":"Critical Reasoning \u2014 Weaken","q":"Farmer: Several people in the past few years have claimed to have seen a mountain lion in the\nsuburban outskirts\u2014the latest just last month\u2014and, while mountain lions were thought to\nhave been driven from this entire region about twenty years ago, there is no reason for the\npeople who reported seeing a mountain lion to have deliberately concocted a false report.\nTherefore, local wildlife managers should begin to urgently address the mountain lion\u2019s\npresence.\nWhich of the following would, if true,","opts":{"A":"Farmers in the suburban outskirts mostly raise cattle and hogs, which when fully grown","B":"Mountain lions are dissimilar in size and color to other wild animals found near the","C":"No person who claimed to have seen a mountain lion had anyone else with them at the","D":"There have been no regional reports in the past year of mountain lions migrating to the","E":"Recent surveys show that more than half of the people in the region report that they"},"ans":"C","exp":"Argument Evaluation\nSituation\n\nA farmer argues that, because several people in recent years, including\nsomeone just last month, have claimed to have seen a mountain lion in the\nsuburban outskirts, local wildlife managers need to address the mountain\nlion\u2019s presence. The farmer claims that people would not intentionally create a\nfalse story about seeing a mountain lion.\n\n\f\nReasoning\n\nWhat would most seriously call into question the farmer\u2019s argument that because\nthere have been reports of mountain lion sightings, wildlife managers should\naddress the issue? Even if it is true that people would not intentionally create a\nfalse report of having seen a mountain lion, it is possible that people have\nmistakenly believed they have seen a mountain lion when in fact what they saw\nwas something else. If some fact called into question the accuracy of the\nreports of mountain lion sightings, then the farmer\u2019s conclusion would have\nweaker support.\n\nA. Even if most fully grown animals raised by farmers would not be attacked by mountain\nlions, there could still be good reason to be concerned about the presence of mountain\nlions in the suburban outskirts. The mountain lion might attack animals befor"},{"n":696,"s":"Verb","t":"Critical Reasoning","d":"M","topic":"Critical Reasoning \u2014 Critical Reasoning","q":"The heavy traffic in Masana is a growing drain on the city\u2019s economy\u2014the clogging of the\nstreets of the central business district alone cost the economy more than $1.2 billion over the\npast year. In order to address this problem, officials plan to introduce congestion pricing, by\nwhich drivers would pay to enter the city\u2019s most heavily trafficked areas during the busiest\ntimes of the day.\nWhich of the following, if true, would most strongly indicate that the plan will be a success?","opts":{"A":"Approximately one-fifth of the vehicles in the central business district are in transit from","B":"Planners expect that, without congestion pricing, traffic in Masana is likely to grow by 6","C":"In other urban areas, congestion pricing has strongly encouraged carpooling (sharing of","D":"Several studies have shown that a reduction in traffic of 15 percent in Masana could","E":"Over 30 percent of the vehicles in the city\u2019s center are occupied by more than one"},"ans":"C","exp":"Situation\n\nTraffic congestion in Masana has been harming the city\u2019s economy. To address\nthe problem, officials plan to make drivers pay to enter the city\u2019s most heavily\ntrafficked areas during the busiest times of day.\n\nReasoning\n\nWhat would most strongly suggest that the plan will reduce the harm to Masana\u2019s\neconomy from traffic congestion? In order to succeed, the plan will have to be\nimplemented and effectively enforced. Furthermore, the prices drivers pay will\nhave to be high enough to significantly change their behavior in ways that\nreduce the amount of traffic congestion in the city. Finally, the economic\nbenefits from the reduced traffic congestion will have to substantially outweigh\nany economically damaging side effects of the congestion pricing. Any evidence\nthat any of these conditions will hold would provide at least some support for\nthe prediction that the plan will succeed.\n\nA. This provides no evidence that the congestion pricing would affect the behavior of either\nthe one-fifth of drivers whose vehicles traverse the city or of the other four-fifths of\ndrivers, nor does it give any evidence that the plan would produce overriding economic\nbenefits.\nB. This indicates t"},{"n":697,"s":"Verb","t":"Critical Reasoning","d":"M","topic":"Critical Reasoning \u2014 Assumption","q":"Economist: The most economically efficient way to reduce emissions of air pollutants is to tax\nthem in proportion to the damage they are likely to cause. But in Country Y, many serious\npollutants are untaxed and unregulated, and policy makers strongly oppose new taxes.\nTherefore, the best way to achieve a reduction in air pollutant emissions in Country Y would\nbe to institute fixed upper limits on them.\nWhich of the following is an assumption of the economist\u2019s argument?","opts":{"A":"Policy makers in Country Y oppose all new taxes equally strongly, regardless of any","B":"Country Y\u2019s air pollutant emissions would not fall significantly if they were taxed in","C":"Policy makers in Country Y strongly favor reductions in air pollutant emissions.","D":"Country Y\u2019s policy makers believe that air pollutant emissions should be reduced with","E":"Policy makers in Country Y do not oppose setting fixed upper limits on air pollutant"},"ans":"E","exp":"Argument Construction\nSituation\n\nAlthough taxing air pollution emissions in proportion to the damage they\ncause is the most economically efficient way to reduce those emissions, many\nserious pollutants in Nation Y are untaxed and unregulated, and the nation\u2019s\npolicy makers strongly oppose new taxes. Therefore, fixed upper limits on\nsuch emissions would more effectively reach this goal.\n\nReasoning\n\nWhat must be true in order for the factors the economist cites to support the claim\nthat fixing upper limits on air pollutant emissions in Nation Y would be the best\nway to reduce those emissions? Political opposition to taxation in Nation Y is the\nonly factor the economist cites to support the argument\u2019s conclusion that it\nwould be best to institute fixed upper limits on air pollutants. In order for the\npremise to support the conclusion, there must be less political opposition in\nNation Y to instituting such limits than there would be to the proportional\ntaxation approach the economist prefers.\n\nA. Even if the policy makers oppose some new taxes less than others, they could still oppose\nthe proportional taxation approach strongly enough for it to be utterly infeasible.\nB. Even if the pro"},{"n":698,"s":"Verb","t":"Critical Reasoning","d":"M","topic":"Critical Reasoning \u2014 Inference","q":"Humans get Lyme disease from infected ticks. Ticks get infected by feeding on animals with\nLyme disease, but the ease of transmission from host animal to tick varies. With most species\nof host animal, transmission of Lyme disease to ticks is extremely rare, but white-footed mice\nare an exception, readily passing Lyme disease to ticks. And white-footed mouse populations\ngreatly expand, becoming the main food source for ticks, in areas where biodiversity is in\ndecline.\nThe information in the passa","opts":{"A":"In areas where many humans are infected with Lyme disease, the proportion of ticks","B":"Very few animals that live in areas where there are no white-footed mice are infected","C":"Humans are less at risk of contracting Lyme disease in areas where biodiversity is high."},"ans":"C","exp":"Argument Construction\nSituation\n\nWhite-footed mice readily pass Lyme disease to ticks, which pass it to humans.\nWhite-footed mouse populations expand where biodiversity is declining.\n\nReasoning\n\nWhat conclusion do the stated facts support? Since declining biodiversity causes\nwhite-footed mouse populations to increase, and white-footed mice are\nespecially likely to pass Lyme disease to ticks, and ticks pass it to humans,\ndeclining biodiversity could reasonably be expected to increase the incidence\nof Lyme disease in both ticks and humans.\n\nA. In areas where many humans are infected with Lyme disease, the total number of ticks\nmay be unusually high, so even if the number of infected ticks is unusually high, the\nproportion of infected ticks may not be unusually high.\nB. Most animals with Lyme disease may get it from sources other than ticks that have fed on\ninfected mice.\nC. Correct. If biodiversity is high, then any biodiversity decline that has already begun has\nlikely not yet reached a point where white-footed mouse populations have greatly\nexpanded, so the risk of people contracting Lyme disease is still relatively less than in\nareas where biodiversity is low and where significant"},{"n":699,"s":"Verb","t":"Critical Reasoning","d":"M","topic":"Critical Reasoning \u2014 Strengthen","q":"Many industrialized nations are trying to reduce atmospheric concentrations of carbon\ndioxide, a gas released by the burning of fossil fuels. One proposal is to replace conventional\ncement, which is made with calcium carbonate, by a new \u201ceco-cement.\u201d This new cement, made\nwith magnesium carbonate, absorbs large amounts of carbon dioxide when exposed to the\natmosphere. Therefore, using eco-cement for new concrete building projects will significantly\nhelp reduce atmospheric concentrations of carbo","opts":{"A":"The cost of magnesium carbonate, currently greater than the cost of calcium carbonate,","B":"Eco-cement is strengthened when absorbed carbon dioxide reacts with the cement.","C":"Before the development of eco-cement, magnesium-based cement was considered too","D":"The manufacture of eco-cement uses considerably less fossil fuel per unit of cement than","E":"Most building-industry groups are unaware of the development or availability of ecocement."},"ans":"D","exp":"Argument Evaluation\nSituation\n\nMany nations are trying to reduce atmospheric concentrations of carbon\ndioxide. One proposed method is to use a new type of \u201ceco-cement\u201d that\nabsorbs carbon dioxide from air.\n\nReasoning\n\nWhat evidence, combined with the cited facts, would most support the prediction\nthat using eco-cement will significantly help reduce atmospheric concentrations\nof carbon dioxide? The prediction assumes that the use of eco-cement would be\nan effective way to reduce carbon dioxide levels. Any evidence supporting this\nassumption will support the prediction.\n\nA. Since eco-cement uses magnesium carbonate, the prediction that magnesium carbonate\nprices will fall suggests that a potential financial barrier to widespread eco-cement use\nwill diminish. However, those prices may not fall enough to make eco-cement costcompetitive with regular cement.\nB. Even if absorbed carbon dioxide strengthens eco-cement, the strengthened eco-cement\nmight still be much weaker than regular cement and thus might never become widely\nused, in which case it will not significantly help reduce atmospheric concentrations of\ncarbon dioxide.\nC. Even if eco-cement is less susceptible to water erosion tha"},{"n":700,"s":"Verb","t":"Critical Reasoning","d":"M","topic":"Critical Reasoning \u2014 Weaken","q":"Professor: A marine biologist argues that transmission of sea lice from farm salmon to wild\nsalmon is unlikely in the Broughton Archipelago, British Columbia, citing numerous studies\nsuggesting that salinities less than 30 parts per thousand are unfavorable to sea-lice survival.\nThe biologist concludes that the archipelago\u2019s 25\u201330 parts per thousand salinity range\nbetween March and June, the critical period for wild salmon migration, tends to suppress sealice proliferation. But a review of the l","opts":{"A":"pointing out that a condition claimed to be necessary for sea-lice survival is not sufficient","B":"citing studies that suggest that salinity levels were not measured reliably","C":"claiming that there is evidence showing that one of its premises is false","D":"questioning the reliability of the biologist\u2019s scientific sources","E":"showing that its conclusion is inconsistent with its premises"},"ans":"C","exp":"Argument Evaluation\nSituation\n\nA professor gives us information about one biologist\u2019s opinion, based on\nnumerous studies, about the low probability of sea-lice transmission from\nfarm salmon to wild salmon in the Broughton Archipelago. The biologist thinks\nsalinities less than 30 parts per thousand (ppt) would make such transmission\nunlikely; in the archipelago, the salinity is 25\u201330 ppt between March and June,\nthe period when wild salmon migration occurs. However, the professor\nchallenges the biologist\u2019s view, maintaining, based on a literature review, that\ncool spring temperatures in the archipelago, combined with the lower salinity,\ndo favor the flourishing of sea lice.\n\nReasoning\n\nIn what way does the professor attempt to undermine the biologist\u2019s argument?\nThe professor points out that a premise used by the biologist\u2014that the low\nspring salinities in the archipelago when the wild salmon migrate suppress\nsea-lice proliferation\u2014is not correct. The professor claims the academic\nliterature reveals that two conditions\u2014the 25\u201330 ppt salinities combined with\nthe cool spring temperatures\u2014would be jointly sufficient for the flourishing of\nsea lice.\n\nA. This does not accurately describe "},{"n":701,"s":"Verb","t":"Critical Reasoning","d":"M","topic":"Critical Reasoning \u2014 Strengthen","q":"Advertisement: When your car\u2019s engine is running at its normal operating temperature, any\nmajor brand of motor oil will protect it about as well as Tuff does. When the engine is cold, it\nis a different story: Tuff motor oil flows better at lower temperatures than its major\ncompetitors do. So, if you want your car\u2019s engine to have maximum protection, you should use\nTuff.\nWhich of the following, if true, most strengthens the argument in the advertisement?","opts":{"A":"Tuff motor oil provides above-average protection for engines that happen to overheat.","B":"Tuff motor oil is periodically supplied free of charge to automobile manufacturers to use"},"ans":"A","exp":"Argument Evaluation\nSituation\n\nAn advertisement argues that since Tuff motor oil flows better than its major\ncompetitors at low temperatures and works about as well as they do at normal\ntemperatures, it provides maximum protection for car engines.\n\nReasoning\n\nWhat additional evidence would suggest that Tuff motor oil provides the best\navailable protection for car engines? The argument requires the assumptions\nthat no type of motor oil other than the \u201cmajor brands\u201d provides superior\nprotection, that flowing better at lower temperatures ensures superior\nprotection at those temperatures, and that Tuff protects car engines at least as\nwell as its competitors do at above-normal temperatures. Any evidence\nsupporting any of these assumptions would strengthen the argument.\n\nA. Correct. If Tuff provides above-average protection when engines overheat, in addition to\nthe solid protection it provides at normal and low temperatures, it may well provide the\nbest available protection overall.\nB. The company that makes Tuff might give automobile manufacturers free motor oil as a\npromotional gimmick even if Tuff is an inferior product.\nC. Tuff\u2019s sales might have declined over the past three years b"},{"n":702,"s":"Verb","t":"Critical Reasoning","d":"M","topic":"Critical Reasoning \u2014 Critical Reasoning","q":"Linguist: In English, the past is described as \u201cbehind\u201d and the future \u201cahead,\u201d whereas in\nAymara, the past is \u201cahead\u201d and the future \u201cbehind.\u201d Research indicates that English speakers\nsway backward when discussing the past and forward when discussing the future. Conversely,\nAymara speakers gesture forward with their hands when discussing the past and backward\nwhen discussing the future. These bodily movements, therefore, suggest that the language one\nspeaks affects how one mentally visualizes t","opts":{"A":"At least some Aymara speakers sway forward when discussing the past and backward","B":"Most people mentally visualize time as running either forward or backward.","C":"Not all English and Aymara speakers tend to sway or gesture forward or backward when","D":"How people move when discussing the future correlates to some extent with how they","E":"The researchers also examined the movements of at least some speakers of languages"},"ans":"D","exp":"Argument Construction\nSituation\n\nA linguist argues that the language one speaks affects how one mentally\nvisualizes time. The linguist\u2019s argument is based on the fact that English\nspeakers, who refer to the past as \u201cbehind\u201d and the future as \u201cahead,\u201d display\nbackward and forward bodily movements when speaking of the past and the\nfuture, while speakers of Aymara, who refer to the past as \u201cahead\u201d and the\nfuture as \u201cbehind,\u201d display correspondingly different body movements.\n\nReasoning\n\nWhat must be true if we are to accept the linguist\u2019s conclusion from the given\ninformation that the language one speaks affects how one mentally visualizes\ntime? The linguist\u2019s evidence will support the conclusion only if there is some\ncorrelation between people\u2019s bodily movements and how they mentally\nvisualize time. So, the linguist\u2019s reasoning requires an assumption to that effect.\n\nA. The linguist\u2019s reasoning is based on the differences in bodily movements discussed in the\nargument\u2014that is, that Aymara speakers gesture in certain ways and that English\nspeakers sway in certain ways; thus, the linguist\u2019s reasoning does not require that\nAymara speakers sway in any way whatsoever when they discuss the p"},{"n":703,"s":"Verb","t":"Critical Reasoning","d":"M","topic":"Critical Reasoning \u2014 Inference","q":"The Testament of William Thorpe was published around 1530 as an appendix to Thorpe\u2019s\nlonger Examination. Many scholars, however, doubt the attribution of the Testament to Thorpe\nbecause, whereas the Examination is dated 1406, the Testament is dated 1460. One scholar\nhas recently argued that the 1460 date be amended to 1409, based on the observation that\nwhen these numbers are expressed as Roman numerals, MCCCCLX and MCCCCIX, it becomes\neasy to see how the dates might have become confused through","opts":{"A":"The sole evidence that historians have had that William Thorpe died no earlier than 1460","B":"In the preface to the 1530 publication, the editor attributes both works to William","C":"Few writers in fifteenth-century England marked dates in their works using only Roman","D":"The Testament alludes to a date, \u201cFriday, September 20,\u201d as apparently contemporaneous","E":"The Testament contains few references to historical events that occurred later than 1406."},"ans":"D","exp":"Argument Construction\nSituation\n\nThe Testament of William Thorpe, dated 1460, was published around 1530 as\nan appendix to Thorpe\u2019s Examination, dated 1406. But when expressed in\nRoman numerals, 1460 could easily be confused with 1409.\n\nReasoning\n\nGiven the facts cited, what would provide additional evidence that Thorpe\u2019s\nTestament dates from 1409 rather than 1460? The scholar\u2019s hypothesis that the\nwork dates from 1409 is based on the observation that in Roman numerals,\n1409 might easily have been improperly transcribed as 1460. What evidence\nwould support this hypothesis? Any independent evidence that 1409 is a more\nlikely date for the Testament than 1460 would certainly help. For instance, if\nsome event or date that occurred in 1409 but not in 1460 is referred to in the\nTestament as being recent or contemporaneous, this would lend significant\nsupport to the hypothesis. For instance, if the Testament indicated that some\nday of the month had just fallen on a given day of the week, and that date fell\non that day in 1409 but not in 1460, this would support the hypothesis\nsignificantly.\n\nA. Suppose there is no reason to think that Thorpe was still alive in 1460 other than the\npresumpti"},{"n":704,"s":"Verb","t":"Critical Reasoning","d":"H","topic":"Critical Reasoning \u2014 Critical Reasoning","q":"A prominent investor who holds a large stake in the Burton Tool Company has recently\nclaimed that the company is mismanaged, citing as evidence the company\u2019s failure to slow\ndown production in response to a recent rise in its inventory of finished products. It is\ndoubtful whether an investor\u2019s sniping at management can ever be anything other than\ncounterproductive, but in this case, it is clearly not justified. It is true that an increased","opts":{},"ans":"A","exp":"Argument Construction\nSituation\n\nAn investor has criticized a company, based on the company\u2019s recent increase\nin inventory and on its not decreasing production as a result of this increase.\n\nReasoning\n\nWhat roles do the two boldfaced statements play in the argument? The\nargument suggests that the investor\u2019s criticism is based on a principle that\nincreased inventory of finished products often indicates that production is\nfaster than it should be, given the existing demand for a company\u2019s products.\nHowever, the argument then states that the increase in inventory at the\ncompany in question is entirely attributable to existing orders of products. The\nargument thus suggests that the investor\u2019s criticism is misplaced, based on a\nsuggestion as to (1) a principle that the investor could be using to support her\nargument and (2) an explanation as to why the principle does not apply to the\ncompany. The two boldfaced portions state these respective elements.\n\nA. Correct. The first boldfaced portion states the principle that may provide the basis of the\ninvestor\u2019s criticism, which the argument as a whole opposes. The second boldfaced\nportion is a statement that, if true, shows the generalizatio"},{"n":705,"s":"Verb","t":"Critical Reasoning","d":"H","topic":"Critical Reasoning \u2014 Explain","q":"To reduce productivity losses from employees calling in sick, Corporation X implemented a\nnew policy requiring employees to come into work unless they were so sick that they had to\ngo to a doctor. But a year after the policy was implemented, a study found that Corporation\nX\u2019s overall productivity losses due to reported employee illnesses had increased.\nWhich of the following, if true, would best explain why the policy produced the reverse of its\nintended effect?","opts":{"A":"After the policy was implemented, employees more frequently went to the doctor when","B":"Before the policy was implemented, employees who were not sick at all often called in","C":"Employees coming into work when sick often infect many of their coworkers.","D":"Unusually few employees became genuinely sick during the year after the policy was","E":"There are many other factors besides employee illness that can adversely affect"},"ans":"C","exp":"Situation\n\nAfter a company started requiring employees to come to work unless they\nwere sick enough to have to go to a doctor, the company\u2019s productivity losses\nfrom reported employee illness increased.\n\nReasoning\n\nWhat would explain why the policy increased productivity losses from reported\nemployee illness? Any factors that could have plausibly caused the policy to\nincrease employee absenteeism from reported illness or to reduce the\nemployees\u2019 productivity at work as a result of reported illness could explain\nwhy the policy increased productivity losses from reported illness.\n\nA. Even though the policy required sick employees to consult a doctor, there is no reason to\nthink that employees\u2019 doing so would have made them less productive than they would\notherwise have been when absent from work.\nB. This suggests that the policy made it more difficult for employees to falsely claim illness\nas an excuse for a work absence. Reduction in absences should result in productivity\ngains rather than losses.\nC. Correct. This could have been a result of the policy and would have led to productivity\nlosses possibly greater than those seen before the policy was introduced.\n\n\f\nD. This would help t"},{"n":706,"s":"Verb","t":"Critical Reasoning","d":"H","topic":"Critical Reasoning \u2014 Inference","q":"Advertising by mail has become much less effective, with fewer consumers responding.\nBecause consumers are increasingly overwhelmed by the sheer amount of junk mail they\nreceive, most discard almost all offers without considering them. Thus, an effective way for\ncorporations to improve response rates would be to more carefully target the individuals to\nwhom they mail advertising, thereby cutting down on the amount of junk mail each consumer\nreceives.\nWhich of the following, if true, would most s","opts":{"A":"There are cost-effective means by which corporations that currently advertise by mail","B":"Many successful corporations are already carefully targeting the individuals to whom"},"ans":"E","exp":"Situation\n\nAdvertising by mail has become less effective because consumers\noverwhelmed with the amount of junk mail they receive discard almost all of it\nwithout considering it.\n\nReasoning\n\nWhat would most help to support the claim that making mail advertising more\ncarefully targeted would improve response rates? The passage recommends\ntargeted advertising, reasoning that since targeted advertising would reduce\nthe total amount of junk mail consumers receive, it would generate higher\nresponse rates. Any additional evidence for the claim that carefully targeted\nadvertising would improve response rates would support this\nrecommendation.\n\nA. Even if targeted advertising and every other means of improving response rates were too\nexpensive to be cost-effective, targeted advertising could still be effective for any\ncorporation willing to pay the expense.\nB. If many corporations already mail targeted advertising, and mail advertising is\nnonetheless yielding declining response rates, that suggests that targeted mail is an\nineffective way to increase response rates.\nC. This could be equally true for targeted and untargeted mail advertising, so it does not\nsuggest that the former is more eff"},{"n":707,"s":"Verb","t":"Critical Reasoning","d":"H","topic":"Critical Reasoning \u2014 Inference","q":"Petrochemical industry officials have said that the extreme pressure exerted on plant\nmanagers during the last five years to improve profits by cutting costs has done nothing to\nimpair the industry\u2019s ability to operate safely. However, environmentalists contend that the\nrecent rash of serious oil spills and accidents at petrochemical plants is traceable to costcutting measures.\nWhich of the following, if true, would provide the strongest support for the position held by\nindustry officials?","opts":{"A":"The petrochemical industry benefits if accidents do not occur, since accidents involve risk","B":"Petrochemical industry unions recently demanded that additional money be spent on","C":"Despite major cutbacks in most other areas of operation, the petrochemical industry has","D":"There is evidence that the most damaging of the recent oil spills would have been","E":"Both the large fines and the adverse publicity generated by the most recent oil spill have"},"ans":"C","exp":"Argument Evaluation\nSituation\n\nPetrochemical industry officials claim that pressure on plant managers to cut\ncosts over the past five years has not made the industry\u2019s operations any less\nsafe. Environmentalists claim that recent oil spills and accidents show\notherwise.\n\nReasoning\n\nWhat evidence would most strongly suggest that the cost-cutting pressure was not\nresponsible for the recent rash of oil spills and accidents? Evidence that the plant\nmanagers did not cut costs in any specific ways likely to have increased the\nlikelihood of oil spills and accidents would support the industry officials\u2019\nposition that the cost-cutting pressure has not made petrochemical operations\nany less safe.\n\nA. Even if the petrochemical industry has good reasons to try to prevent accidents, the\nrecent rash of serious accidents suggests that it is failing to do so and that the costcutting pressure might be responsible.\nB. This suggests that the unions, whose members could directly observe the cost-cutting\npressure\u2019s effects, share the environmentalists\u2019 belief that this pressure contributed to\nthe oil spills and accidents. Because the unions abandoned their demands, their concerns\nprobably have not been"},{"n":708,"s":"Verb","t":"Critical Reasoning","d":"H","topic":"Critical Reasoning \u2014 Strengthen","q":"A company has developed a new sensing device that, according to the company\u2019s claims,\ndetects weak, ultralow-frequency electromagnetic signals associated with a beating heart.\nThese signals, which pass through almost any physical obstruction, are purportedly detected\nby the device even at significant distances. Therefore, if the company\u2019s claims are true, their\ndevice will radically improve emergency teams\u2019 ability to locate quickly people who are\ntrapped within the wreckage of collapsed buildin","opts":{"A":"People trapped within the wreckage of collapsed buildings usually have serious injuries","B":"The device gives a distinctive reading when the signals it detects come from human","C":"Most people who have survived after being trapped in collapsed buildings were rescued","D":"Ultralow-frequency signals are not the only electromagnetic signals that can pass through","E":"Extensive training is required in order to operate the device effectively."},"ans":"B","exp":"Argument Evaluation\nSituation\n\nA new sensing device can detect\u2014at significant distances and even behind\nobstructions such as walls\u2014weak, ultralow-frequency electromagnetic signals\nthat are characteristic of heartbeats. It is predicted, based on this information,\nthat the new device will shorten the time it currently takes to locate people\nburied under collapsed buildings but still alive.\n\nReasoning\n\nWhat new information, if accurate, would provide further evidence that would\nsupport the prediction? The existing evidence fails to tell us whether the new\ndevice can distinguish between human heartbeats and heartbeats from other\nspecies. If the device does not allow the user to distinguish between the\nheartbeats of humans and those of animals of other species, then the\nprediction might not be correct, because if there are any nonhuman animals in\nthe building, emergency teams may believe they have located a trapped human\nand begin a rescue effort, when in fact they have merely located an animal of\nsome other species. Any new information that implies the device can help the\nuser to discern between signals associated with a human heartbeat and signals\nassociated with the heartbeats of ani"},{"n":709,"s":"Verb","t":"Critical Reasoning","d":"H","topic":"Critical Reasoning \u2014 Critical Reasoning","q":"Economist: The price of tap water in our region should be raised drastically. Supplies in local\nfreshwater reservoirs have been declining for years because water is being used faster than","opts":{},"ans":"C","exp":"Argument Construction\nSituation\n\nLocal water supplies have been declining for years because of excessive water\nuse and low prices. Few users have adopted even easy conservation measures.\n\nReasoning\n\nWhat roles do the two boldfaced statements play in the argument? Both are\nfactual observations. Since no further evidence or support is provided for\neither, neither can be a conclusion in the argument. However, interconnected\ncausal explanations, signaled by because and since, are provided for both. The\nobservation in the first boldfaced statement is causally explained by the\nfurther observation that water is being used faster than it can be replenished,\nwhich in turn is causally explained by the entire final sentence. The\nobservation in the second boldfaced statement is causally explained by the\nobservation that the price of tap water has been low. The only remaining\nportion of the argument is the initial sentence, a recommendation supported\n\n\f\nby these four observations together, and by the causal claims in which they are\nembedded. Thus, the four observations (including the two boldfaced\nstatements) and the causal claims containing them are all premises, and the\ninitial statement is t"},{"n":710,"s":"Verb","t":"Critical Reasoning","d":"H","topic":"Critical Reasoning \u2014 Critical Reasoning","q":"Politician: Hybrid cars use significantly less fuel per kilometer than nonhybrids. And fuel\nproduces air pollution, which contributes to a number of environmental problems. Motorists\ncan save money by driving cars that are more fuel efficient, and they will be encouraged to\ndrive hybrid cars if we make them aware of that fact. Therefore, we can help reduce the total\namount of pollution emitted by cars in this country by highlighting this advantage of hybrid\ncars.\nWhich of the following, if true,","opts":{"A":"People with more fuel-efficient cars typically drive more than do those with less fuelefficient cars.","B":"Not all air pollution originates from automobiles.","C":"Hybrid cars have already begun to gain popularity.","D":"Fuel-efficient alternatives to hybrid cars will likely become available in the future.","E":"The future cost of gasoline and other fuel cannot be predicted with absolute precision or"},"ans":"A","exp":"Argument Evaluation\nSituation\n\nAccording to a politician, hybrid cars use less fuel per kilometer than\nnonhybrids, and fuel produces air pollution. Motorists can save money by\ndriving fuel-efficient cars, and they will be encouraged to do so if made aware\n\n\f\nof the fact. The politician concludes that highlighting this fact will result in a\nreduction in air pollution.\nReasoning\n\nWhat would suggest that telling motorists they can save money by driving fuelefficient cars would not reduce automotive air pollution, despite the facts cited by\nthe politician? The politician\u2019s implicit reasoning is that since hybrid cars use\nless fuel per kilometer, and fuel produces air pollution, motorists who drive\nhybrid cars must produce less air pollution than those who drive nonhybrids.\nThe politician concludes that encouraging motorists to drive hybrid cars by\ntelling them they would save money on fuel will therefore reduce automotive\nair pollution. Evidence that motorists who drive hybrid cars produce just as\nmuch automotive air pollution as those who drive nonhybrids would\nundermine this argument.\n\nA. Correct. If drivers of hybrid cars tend to drive more kilometers than drivers of\nnonhybrids, the"},{"n":711,"s":"Verb","t":"Critical Reasoning","d":"H","topic":"Critical Reasoning \u2014 Critical Reasoning","q":"Mayor: False alarms from home security systems waste so much valuable police time that in\nmany communities, police have stopped responding to alarms from homes whose systems\nfrequently produce false alarms. This policy reduces wastage of police time but results in a\nloss of protection for some residents. To achieve a comparable reduction in wastage without\nreducing protection for residents, the council has enacted a measure to fine residents for\nrepeated false alarms.\nWhich of the following, if ","opts":{"A":"A fine in the amount planned by the council will not cover the expenses police typically","B":"Homes equipped with security systems are far less likely to be broken into than are","C":"The threat of fines is likely to cause many residents to deactivate their security systems.","D":"The number of home security systems is likely to increase dramatically over the next five","E":"Many home security systems have never produced false alarms."},"ans":"C","exp":"Situation\n\nIn many communities, police have been responding to false home-security\nalarms but have ceased to respond to alarms from homes that often have such\nfalse alarms. To reduce wastage of police time without compromising\nresidents\u2019 home protection, one town council has enacted a new measure that\nwill fine home residents for repeated false alarms.\n\nReasoning\n\nWhat fact or occurrence would most reduce the likelihood that the town council\u2019s\nnewly enacted measure would achieve its goal, which is to reduce wastage of\npolice time without compromising home protection? Note that the goal is not to\neliminate all wastage of police time or to pay all the costs of it; some random\nwastage is to be expected. But if many residents deactivated their security\nalarms (even well-functioning systems) because they wish to avoid being fined,\nthis could reduce the level of home protection for those residents.\n\nA. The goal is to reduce wastage of police time resulting from false security-system alarms,\nnot necessarily to cover all the costs in police time for such alarms.\nB. This seems obviously true, but it is also irrelevant to the frequency of false home-security\nalarms. It is therefore irrelevan"},{"n":712,"s":"Verb","t":"Critical Reasoning","d":"H","topic":"Critical Reasoning \u2014 Critical Reasoning","q":"Excavation of the house of a third-century Camarnian official revealed that he had served four\nmagistrates\u2014public officials who administer the law\u2014over his thirty-year public career, in\nfour provincial capital cities. However, given the Camarnian administrative system of that era,\nit is unclear whether he served them simultaneously, as a traveling administrator living for\npart of the year in each provincial capital, or else did so sequentially, leaving one magistrate\nafter several years to join ","opts":{"A":"Maps and documents describing each of the four provincial capitals","B":"A cache of the official\u2019s documents related to work from early in his career","C":"A set of cups of a type made only in the city of the first magistrate whom the official is","D":"Several pieces of furniture in the styles of two of the provincial capital cities","E":"Heavy clothing appropriate only for the coldest of the four cities"},"ans":"B","exp":"Argument Construction\n\n\f\nSituation\n\nEvidence from an excavation makes clear that a particular third-century\nCamarnian official served four magistrates in four provincial capitals over his\nthirty-year career, but it is unclear whether he served the magistrates\nsimultaneously or sequentially.\n\nReasoning\n\nWhat evidence, if it were also found in the excavation, would be most helpful in\ndetermining whether the official served the magistrates simultaneously or\nsequentially? It would be helpful to find documents from throughout the\nmagistrate\u2019s career indicating at what times he worked for each magistrate, or\neven documents from just one period, as long as there were a large number,\nbecause this would likely show whether he was working for just one\nmagistrate or for all four.\n\nA. We already know that the official worked in each of the four capitals. The fact that maps\nand documents describing the capitals were at his house tells us nothing about whether\nhe worked for magistrates in these capitals simultaneously or not.\nB. Correct. Presumably, the work-related documents would show whom he was working for\nat the time, and for how long\u2014and would provide evidence as to whether he was\nworking "},{"n":713,"s":"Verb","t":"Critical Reasoning","d":"H","topic":"Critical Reasoning \u2014 Assumption","q":"In 1563, in Florence\u2019s Palazzo Vecchio, Giorgio Vasari built in front of an existing wall a new\nwall on which he painted a mural. Investigators recently discovered a gap between Vasari\u2019s\nwall and the original, large enough to have preserved anything painted on the original.\nHistorians believe that Leonardo da Vinci had painted, but left unfinished, a mural on the\noriginal wall; some historians had also believed that by 1563, the mural had been destroyed.\nHowever, it is known that in the late 156","opts":{"A":"Leonardo rarely if ever destroyed artworks that he left unfinished.","B":"Vasari was likely unaware that the mural in the Palazzo Vecchio had willingly been","C":"Vasari probably would not have built the Palazzo Vecchio wall with a gap behind it except","D":"Leonardo would probably have completed the Palazzo Vecchio mural if he had had the","E":"When Vasari preserved the frescoes of Santa Maria Novella he did so secretly."},"ans":"C","exp":"Argument Construction\nSituation\n\nGeorgio Vasari built a new wall in front of an existing wall in the Palazzo\nVecchio that historians believe had had an unfinished mural by Leonardo da\nVinci painted on it. Some historians, however, believe the mural had been\ndestroyed by the time Vasari built the new wall. There is a gap between the old\nand new wall, large enough to have preserved anything painted on it, as there\nis in Santa Maria Novella, where Vasari also constructed a new wall in front of\nan old wall; on that wall, the building\u2019s frescoes were preserved.\n\nReasoning\n\nWhat claim needs to be true for the cited facts to support the conclusion that\nLeonardo\u2019s Palazzo Vecchio mural likely still exists behind Vasari\u2019s wall? If there\nare other equally likely reasons that Vasari would have left a gap between the\nold wall and a new wall, besides preserving any painting on the old wall, the\nstated facts would not support the conclusion. After all, it may be only\nfortuitous that the frescoes in the Santa Maria Novella were preserved when\nVasari built the new wall with a gap between it and the old wall. Therefore, the\nargument depends on assuming that it is unlikely that Vasari would have\ncre"},{"n":714,"s":"Verb","t":"Critical Reasoning","d":"H","topic":"Critical Reasoning \u2014 Inference","q":"Coffee shop owner: A large number of customers will pay at least the fair market value for a\ncup of coffee, even if there is no formal charge. Some will pay more than this out of\nappreciation of the trust that is placed in them. And our total number of customers is likely to\nincrease. We could therefore improve our net cash flow by implementing an honor system in\nwhich customers pay what they wish for coffee by depositing money in a can.\nManager: We\u2019re likely to lose money on this plan. Many cus","opts":{"A":"The new system, if implemented, would increase the number of customers.","B":"By roasting its own coffee, the shop has managed to reduce the difficulties (and cost) of"},"ans":"D","exp":"Situation\n\nThe owner and the manager of a coffee shop disagree about whether allowing\ncustomers to pay for coffee on an honor system would increase or decrease\nprofits.\n\nReasoning\n\nWhat would be the best evidence that the honor-system plan would increase\nprofits even if many customers cheated the system? The owner argues that\nprofits would increase because many customers will choose to pay as much or\nmore than before and the total number of customers will likely increase. But\nthe manager points out that many customers would also choose to pay little or\nnothing. Assuming that the manager is correct about that, what further\nsupport could the owner present for the claim that the plan would still be\nprofitable?\n\nA. Since the owner has already basically asserted this, asserting it again would not provide\nany significant additional support for the plan.\nB. This suggests that the shop is already profitable, not that the honor-system plan would\nmake it more profitable.\nC. Customers who stay in the cafe for long stretches would not necessarily pay any more\nper cup on the honor-system plan than other customers would.\nD. Correct. If the customer base increases (as both the owner and the manag"},{"n":715,"s":"Verb","t":"Critical Reasoning","d":"H","topic":"Critical Reasoning \u2014 Assumption","q":"Birds have been said to be descended from certain birdlike dinosaur species with which they\nshare distinctive structural features. The fossil record, however, shows that this cannot be so,\nsince there are bird fossils that are much older than the earliest birdlike dinosaur fossils that\nhave been found.\nWhich of the following is an assumption on which the argument relies?","opts":{"A":"The birdlike dinosaurs have no living descendants.","B":"There are no flightless dinosaur species that have the distinctive structural features","C":"There are no birdlike dinosaur fossils that are older than the bird fossils but have not yet","D":"It could not have been the case that some birds were descended from one of the birdlike","E":"Birds cannot have been descended from dinosaur species with which the birds do not"},"ans":"C","exp":"Argument Construction\nSituation\n\nAlthough birds have been said to be descended from birdlike dinosaurs, some\nbird fossils predate the earliest known birdlike dinosaur fossils.\n\nReasoning\n\nWhat must be true in order for the premise that some bird fossils predate the\nearliest known birdlike dinosaur fossils to support the conclusion that birds are\nnot descended from birdlike dinosaurs? The argument implicitly reasons that\nsince the cited bird fossils predate the earliest known birdlike dinosaur fossils,\nthey must be from birds that lived before the earliest birdlike dinosaurs, and\nwhich therefore could not have been descended from birdlike dinosaurs. This\nreasoning assumes that any birdlike dinosaurs that lived before the first birds\nwould have left fossils that still exist. It also assumes that no undiscovered\nbirdlike dinosaur fossils predate the cited bird fossils.\n\nA. The argument is only about whether birds are descended from birdlike dinosaurs.\nWhether birdlike dinosaurs have any living descendants other than birds is irrelevant.\nB. The argument is only about birds and birdlike dinosaurs. It is not about other types of\ndinosaurs that were not birdlike.\nC. Correct. If any undisc"},{"n":716,"s":"Verb","t":"Critical Reasoning","d":"H","topic":"Critical Reasoning \u2014 Critical Reasoning","q":"City council member: Demand for electricity has been increasing by 1.5 percent a year, and\nthere simply is no more space to build additional power plants to meet future demand\nincreases. We must therefore begin to curtail usage, which is why I propose passing\nordinances requiring energy-conservation measures in all city departments.\nThe city council member\u2019s proposal assumes which of the following?","opts":{"A":"Existing power plants do not have the capacity to handle all of the projected increase in","B":"No city departments have implemented energy-conservation measures voluntarily.","C":"Passing ordinances designed to curtail electricity usage will not have negative economic","D":"Residential consumers are not responsible for the recent increases in demand for","E":"City departments that successfully conserve energy will set a good example for"},"ans":"A","exp":"Argument Construction\nSituation\n\nA city council member proposes energy-conservation measures for all city\ngovernment departments because there is no room to build new power plants\nto meet future increases in the demand for electricity.\n\nReasoning\n\nWhat must be true in order for the factors the city council member cites to help\njustify the proposal? The city council member says electricity usage must be\ncurtailed on account of an increasing demand for electricity and a lack of space\nfor new power plants that could meet future demand increases. In order for\nthis reasoning to help justify the proposal, the cited factors must actually\nestablish a need to curtail electricity usage.\n\nA. Correct. If current power plants could satisfy the projected increased demand for\nelectricity, then the increasing demand and the lack of room to build new plants would\nnot establish a need to curtail electricity usage.\nB. The proposed ordinances could still be necessary even if one city department had\nvoluntarily implemented energy-conservation measures.\nC. Passing the ordinances could still be necessary even if they would have some negative\neconomic effects.\nD. No matter who is responsible for the recen"},{"n":717,"s":"Verb","t":"Critical Reasoning","d":"H","topic":"Critical Reasoning \u2014 Strengthen","q":"Certain groups of Asian snails include both \u201cleft-handed\u201d and \u201cright-handed\u201d species, with\nshells coiling to the left and right, respectively. Some left-handed species have evolved from\nright-handed ones. Also, researchers found that snail-eating snakes in the same habitat have\nasymmetrical jaws, allowing them to grasp right-handed snail shells more easily. If these\nsnakes ate more right-handed snails over time, this would have given left-handed snails an\nevolutionary advantage over right-handed","opts":{},"ans":"E","exp":"Argument Evaluation\nSituation\n\nThere are both Asian snails with shells that coil to the right and Asian snails\nwith shells that coil to the left, and the latter have evolved from the former;\nfurthermore, there are snakes that have asymmetrical jaws that allow the\nsnakes to grasp the snails with right-coiled shells more easily.\n\nReasoning\n\nWhat fact would help support the claim that the snakes\u2019 asymmetrical jaws helped\ndrive the emergence of species of snails with left-coiled shells? We are told that if\nover time the snakes with asymmetrical jaws ate more snails with right-coiled\nshells than snails with left-coiled shells, then this would give snails with leftcoiled shells an evolutionary survival advantage. So, if some evidence showed\nthat the snakes with such jaws in fact were more likely to have successfully\neaten the snails with the right-coiled shells, then we would have good reason\nto think the snakes\u2019 asymmetrical jaws helped drive the emergence of snails\nwith left-coiled shells.\n\nA. The fact that snakes with asymmetrical jaws eat snails and other snakes do not does not\ngive any indication as to whether snails with left-coiled shells have any evolutionary\nadvantages over snai"},{"n":718,"s":"Verb","t":"Critical Reasoning","d":"H","topic":"Critical Reasoning \u2014 Inference","q":"A moderately large city is redesigning its central downtown area and is considering a plan\nthat would reduce the number of lanes for automobiles and trucks and increase those for\nbicycles and pedestrians. The intent is to attract more workers and shoppers to downtown\nbusinesses by making downtown easier to reach and more pleasant to move around in.\nWhich of the following would, if true, most strongly support the prediction that the plan\nwould achieve its goal?","opts":{"A":"People who make a habit of walking or bicycling whenever feasible derive significant","B":"Most people who prefer to shop at suburban malls instead of downtown urban areas do","C":"In other moderately sized cities where measures were taken to make downtowns more","D":"If the proposed lane restrictions on drivers are rigorously enforced, more people will","E":"Most people who own and frequently ride bicycles for recreational purposes live at a"},"ans":"C","exp":"Situation\n\nA moderately large city desires to attract more workers and shoppers to\ndowntown businesses by making the downtown area more pleasant and easier\nto travel to. In light of this goal, the city is considering a plan that would reduce\nthe number of lanes for automobiles and trucks and increase those for\nbicycles and pedestrians.\n\nReasoning\n\nWhat would most strongly support the prediction that reducing the number of\nlanes for automobiles and trucks and increasing those for bicycles and pedestrians\nwould achieve the goal of attracting more people to downtown businesses? If\nother moderately sized cities that have improved the accessibility of their\ndowntown areas to pedestrians and cyclists have seen increased downtown\nbusiness, then it is reasonable to think that the city in question will have\nimproved downtown business as well.\n\nA. If people who make a habit of walking or bicycling derive significant health benefits from\ndoing so, that would provide further motivation for trying to encourage people to walk or\nride a bicycle, but it does not provide much support for the claim that adding lanes for\npedestrians and cyclists will successfully bring people to shop or work more in "},{"n":719,"s":"Verb","t":"Critical Reasoning","d":"H","topic":"Critical Reasoning \u2014 Inference","q":"Previously, Autoco designed all of its cars itself and then contracted with specialized parts\nsuppliers to build parts according to its specifications. Now it plans to include its suppliers in\ndesigning the parts they are to build. Since many parts suppliers have more designers with\nspecialized experience than Autoco has, Autoco expects this shift to reduce the overall time\nand cost of the design of its next new car.\nWhich of the following, if true, most strongly supports Autoco\u2019s expectation?","opts":{"A":"When suppliers provide their own designs, Autoco often needs to modify its overall","B":"In order to provide designs for Autoco, several of the parts suppliers will have to add to","C":"Parts and services provided by outside suppliers account for more than 50 percent of","D":"When suppliers built parts according to specifications provided by Autoco, the suppliers","E":"Most of Autoco\u2019s suppliers have on hand a wide range of previously prepared parts"},"ans":"E","exp":"Situation\n\nA car manufacturer plans to have its parts suppliers start helping to design the\nparts they build for the manufacturer. Many parts suppliers have more\ndesigners with specialized experience than the manufacturer has.\n\nReasoning\n\nWhat would make it more likely that having the parts suppliers help design the\nparts will reduce the time and cost of designing the manufacturer\u2019s next new car?\nIn order for the change to reduce the time and cost, the parts suppliers\ninvolved in designing the next car will probably have to do their portion of the\ndesign process faster and cheaper than the manufacturer would have, and the\ndesign collaboration process will have to avoid producing substantial new\ninefficiencies.\n\nA. The additional need to modify the overall design would probably make the design\nprocess slower and more expensive, not faster and cheaper.\nB. The additional need to hire more designers would probably increase design costs, not\nreduce them.\n\n\f\nC. Although this suggests that the change is likely to substantially affect the design\u2019s\nexpense, it does not indicate whether the expense will increase or decrease.\nD. If anything, this competition probably made Autoco\u2019s previous de"},{"n":720,"s":"Verb","t":"Critical Reasoning","d":"H","topic":"Critical Reasoning \u2014 Inference","q":"In response to viral infection, the immune systems of mice typically produce antibodies that\ndestroy the virus by binding to proteins on its surface. Mice infected with the herpesvirus\ngenerally develop keratitis, a degenerative disease affecting part of the eye. Since proteins on\nthe surface of cells in this part of the eye closely resemble those on the herpesvirus surface,\nscientists hypothesize that these cases of keratitis are caused by antibodies to the herpesvirus.\nWhich of the following, ","opts":{"A":"Other types of viruses have surface proteins that closely resemble proteins found in","B":"Mice that are infected with the herpesvirus but do not develop keratitis produce as many","C":"Mice infected with a new strain of the herpesvirus that has different surface proteins did","D":"Mice that have never been infected with the herpesvirus can sometimes develop keratitis.","E":"There are mice that are unable to form antibodies in response to herpes infections, and"},"ans":"C","exp":"Argument Evaluation\nSituation\n\nMice infected with the herpesvirus tend to develop keratitis, an eye disease.\nThe surface of the eye cells has proteins that resemble those on the\nherpesvirus surface. Based on this finding, scientists have hypothesized that\nkeratitis develops in mice because antibodies that attack herpesvirus surface\nproteins can also attack eyes.\n\nReasoning\n\nWhat other information, if correct, would provide the strongest support for the\nscientists\u2019 hypothesis? The clue that led the scientists to form their hypothesis\nwas the close resemblance of the proteins on the mouse eye surface to those\non the herpesvirus surface. The resemblance could cause antibodies to bind to\nboth types of proteins, in one case eliminating the herpesvirus and in the other\ncase causing keratitis.\n\nA. Even if this is correct, we lack information as to whether the antibodies to those other\ntypes of virus can damage the organs that display the closely resembling proteins. If such\na damage process were confirmed, it could count as evidence\u2014even if not sufficient\u2014to\nconfirm the scientists\u2019 hypothesis.\nB. If anything, this would, absent further information, raise doubts about the correctness of\nth"},{"n":721,"s":"Verb","t":"Critical Reasoning","d":"H","topic":"Critical Reasoning \u2014 Critical Reasoning","q":"One might expect that within a particular species, any individuals that managed to slow down\nthe aging process would leave more offspring. Natural selection should therefore favor\nextreme longevity\u2014but this does not seem to be the case. A possible explanation is that aging\nis a product of the inevitable wear and tear of living, similar to how household appliances\ngenerally accumulate faults that lead to their eventual demise. However, most researchers do\nnot find this analogy satisfactory as an ","opts":{"A":"Some organisms are capable of living much longer than other organisms.","B":"Some organisms reproduce very quickly despite having short lifespans.","C":"There are several ways of defining \u201cextreme longevity,\u201d and according to some definitions","D":"Organisms are capable of maintenance and self-repair and can remedy much of the","E":"Some organisms generate much more wear and tear on their bodies than others."},"ans":"D","exp":"Argument Construction\nSituation\n\nOne possible explanation for the fact that natural selection does not favor\nextreme longevity, despite the fact that a slowed-down aging process would\nleave more offspring, is that aging is the product of wear and tear, much like\nhow household appliances eventually no longer function because of wear and\ntear; most researchers, however, reject this analogy as an explanation.\n\nReasoning\n\nWhat would explain the researchers\u2019 rejection of the explanation? The\nexplanation is based on analogy between organisms and household\nappliances. If there were a crucial difference between appliances and\norganisms, such as the fact that organisms are capable of self-repair in a way\nthat household appliances are not, then it would be reasonable for the\nresearchers to reject the explanation.\n\nA. The fact that some organisms can live much longer than other organisms is not a good\nreason to reject the analogy; after all, some household appliances may last much longer\nthan others, perhaps because they receive a different amount of wear and tear.\nB. Even if some organisms reproduce very quickly despite having short lifespans, that does\nnot mean that they would not have even"},{"n":722,"s":"Verb","t":"Critical Reasoning","d":"H","topic":"Critical Reasoning \u2014 Boldface","q":"Last year a record number of new manufacturing jobs were created. Will this year bring\nanother record? Well, any new manufacturing job is created either within an existing\ncompany or by the start-up of a new company. Within existing firms, new jobs have been\ncreated this year at well below last year\u2019s record pace. At the same time, there is considerable\nevidence that the number of new companies starting up this year will be no higher than it was\nlast year, and there is no reason to think that th","opts":{"A":"The first provides evidence in support of the main conclusion of the argument; the","B":"The first is a generalization that the argument seeks to establish; the second is a"},"ans":"E","exp":"Argument Construction\nSituation\n\nManufacturing jobs are created either within existing companies or in startups. Manufacturing jobs are being created at a much slower rate this year than\nlast year. It seems likely that the number of new start-ups will not exceed last\nyear\u2019s number and that the average number of manufacturing jobs per startup will not exceed last year\u2019s number. So, fewer manufacturing jobs are likely\nto be created this year than last year.\n\nReasoning\n\nWhat function is served by the statement that any new manufacturing job is\ncreated either within an existing company or by the start-up of a new company?\nWhat function is served by the statement that there is no reason to think that the\nnew companies starting up this year will create more jobs per company than did\nlast year\u2019s start-ups? The first statement makes explicit a general background\nassumption that there are just two wa
