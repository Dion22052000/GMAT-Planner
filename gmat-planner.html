ys in which manufacturing jobs are\n\n\f\ncreated. This assumption is used, along with other information, to support the\nargument\u2019s main conclusion, i.e., the prediction about job creation this year.\nThe second statement gives a premise meant to help support the prediction\nabout this year\u2019s manufact"},{"n":723,"s":"Verb","t":"Critical Reasoning","d":"H","topic":"Critical Reasoning \u2014 Boldface","q":"Last year a record number of new manufacturing jobs were created. Will this year bring\nanother record? Well, any new manufacturing job is created either within an existing\ncompany or by the start-up of a new company. Within existing firms, new jobs have been\ncreated this year at well below last year\u2019s record pace. At the same time, there is considerable\nevidence that the number of new companies starting up will be no higher this year than it was\nlast year, and there is no reason to think that th","opts":{"A":"The first is presented as an obvious truth on which the argument is based; the second is","B":"The first is presented as an obvious truth on which the argument is based; the second is","C":"The first and the second each provide evidence in support of the main conclusion of the","D":"The first is a generalization that the argument seeks to establish; the second is the main","E":"The first is a generalization that the argument seeks to establish; the second is a"},"ans":"A","exp":"Argument Construction\n\n\f\nSituation\n\nManufacturing jobs are created either within existing companies or in startups. Manufacturing jobs at existing firms are being created at a much slower\nrate this year than last year. It seems likely that the number of new start-ups\nwill not exceed last year\u2019s number and that the average number of new\nmanufacturing jobs per start-up will not exceed last year\u2019s number. So, fewer\nmanufacturing jobs are likely to be created this year than last year.\n\nReasoning\n\nWhat function is served by the statement that any new manufacturing job is\ncreated either within an existing company or by the start-up of a new company?\nWhat function is served by the statement that the number of new jobs created this\nyear will fall short of last year\u2019s record number? The first statement makes\nexplicit a general background assumption that manufacturing jobs are created\nin just two ways. This assumption is used, along with other information, to\nsupport the argument\u2019s main conclusion. The second statement gives the\nargument\u2019s main conclusion, a prediction about how this year\u2019s\nmanufacturing-job creation will compare with last year\u2019s.\n\nA. Correct. The first statement expresses a"},{"n":724,"s":"Verb","t":"Critical Reasoning","d":"H","topic":"Critical Reasoning \u2014 Inference","q":"In Stenland, many workers have been complaining that they cannot survive on minimum\nwage, the lowest wage an employer is permitted to pay. The government is proposing to raise\nthe minimum wage. Many employers who pay their workers the current minimum wage argue\nthat if it is raised, unemployment will increase because they will no longer be able to afford to\nemploy as many workers.\nWhich of the following, if true in Stenland, most strongly supports the claim that raising the\nminimum wage there wi","opts":{"A":"For any position with wages below a living wage, the difficulty of finding and retaining","B":"Raising the minimum wage does not also increase the amount employers have to","C":"When inflation is taken into account, the proposed new minimum wage is not as high as","D":"Many employees currently being paid wages at the level of the proposed new minimum","E":"Many employers who pay some workers only the minimum wage also pay other workers"},"ans":"A","exp":"Argument Evaluation\nSituation\n\nStenland\u2019s government proposes to raise the minimum wage because many\nworkers have complained they cannot survive on it. But many employers claim\nthat raising the minimum wage will increase unemployment.\n\nReasoning\n\nWhat evidence would most strongly suggest that raising the minimum wage will\nnot increase unemployment? The employers with minimum-wage workers\nimplicitly reason that because raising the minimum wage will increase the\nwages they have to pay each worker, it will reduce the number of workers they\ncan afford to employ, and thus will increase unemployment. Evidence that the\nincreased wage would not actually increase the employers\u2019 expenses per\nemployee would cast doubt on their prediction, as would evidence that\nreducing the number of minimum-wage workers would not increase the\nnation\u2019s overall unemployment rate.\n\nA. Correct. This suggests that raising the minimum wage would make it easier for\nemployers to find and retain minimum-wage employees, and that the savings would fully\noffset the cost of paying the higher wages. If there were such offsetting savings, the\nemployers should still be able to afford to employ as many workers as they curren"},{"n":725,"s":"Verb","t":"Critical Reasoning","d":"H","topic":"Critical Reasoning \u2014 Critical Reasoning","q":"Biologists with a predilection for theory have tried\u2014and largely failed\u2014to define what it is\nthat makes something a living thing. Organisms take in energy-providing materials and excrete","opts":{},"ans":"E","exp":"Argument Construction\nSituation\n\nSome biologists have tried, unsuccessfully, to find a theoretically defensible\naccount of what it means for something to be a living thing. Some of the\nsuggested definitions are too broad because they include things that we would\nnot regard as living. To find life on other planets, we must not narrow our\nconception of life by basing it simply on the kinds of life encountered on Earth.\n\nReasoning\n\nWhich of the answer choices would be the logically most appropriate completion\nof the argument? The argument points out that life-forms elsewhere in the\nuniverse may be very different from any of the life-forms on Earth. Both lifeforms on Earth and life-forms discovered elsewhere would all qualify as\nmembers of a very large class, the class of all life-forms. Taking life-forms on\nEarth, a mere subset of the class of all life-forms, as representative of all lifeforms would be a logical mistake and might not lead to success in defining\nwhat it means for something to be a living thing. The correct answer choice,\ntherefore, would involve a case of specifying what some general class of things\nis by examining the members of only a small, and not necessarily\nrepre"},{"n":726,"s":"Verb","t":"Critical Reasoning","d":"H","topic":"Critical Reasoning \u2014 Critical Reasoning","q":"For the period from the eighth century through the eleventh century, the shifting boundaries\nbetween Kingdom F and Kingdom G have not been well charted. Although a certain village in a\nborder region between the two kingdoms usually belonged to Kingdom G, ninth-century\nartifacts found in the village were in the typical Kingdom F style of that time. It is unclear\nwhether the village was actually a part of Kingdom F in the ninth century or whether it was a\npart of Kingdom G but had merely adopted K","opts":{"A":"A trading contract written in the Kingdom G dialect","B":"A drawing of a dwelling complex known to have existed on the border of Kingdom F and","C":"Knives and other utensils made from metal typical of ninth-century mining sites in","D":"Some fragments of pottery made in the Kingdom G style from the seventh century out of","E":"Numerous teeth from the ninth century with a chemical signature typical only of teeth"},"ans":"E","exp":"Argument Construction\nSituation\n\nFrom the eighth century to the eleventh century, the boundaries between two\nkingdoms, F and G, shifted, but these shifts are not well documented. A certain\nvillage in a border region was usually part of Kingdom G, but ninth-century\nartifacts in the village are typical of the style of ninth-century artifacts from\nKingdom F.\n\nReasoning\n\nWhat evidence, if it were found in the ninth-century sites in the village, would be\nmost helpful in determining which of the two kingdoms the village was a part of\nduring that century? Information strongly indicating that during the ninth\ncentury the village was primarily settled by people clearly from Kingdom F\nwould lend support to the claim that the village was part of Kingdom F in the\nninth century.\n\nA. A trading contract found at a ninth-century site in the village written in Kingdom G dialect\nwould not settle whether the village was part of Kingdom G, because it could be the case\nthat such a document would be written in that dialect even if the village were part of\nKingdom F but regularly traded with Kingdom G.\nB. Finding at a ninth-century site in the village a drawing of a dwelling complex known to\nhave been on"},{"n":727,"s":"Verb","t":"Critical Reasoning","d":"H","topic":"Critical Reasoning \u2014 Explain","q":"Sammy: For my arthritis, I am going to try my aunt\u2019s diet: large amounts of wheat germ and\ngarlic. She was able to move more easily right after she started that diet.\nPat: When my brother began that diet, his arthritis got worse. But he has been doing much\nbetter since he stopped eating vegetables in the nightshade family, such as tomatoes and\npeppers.\nWhich of the following, if true, would provide a basis for explaining the fact that Sammy\u2019s aunt\nand Pat\u2019s brother had contrasting experiences wi","opts":{"A":"A change in diet, regardless of the nature of the change, frequently brings temporary","B":"The compounds in garlic that can lessen the symptoms of arthritis are also present in","C":"Arthritis is a chronic condition whose symptoms improve and worsen from time to time"},"ans":"C","exp":"Argument Construction\nSituation\n\nSammy\u2019s aunt\u2019s arthritis apparently improved after she consumed large\namounts of wheat germ and garlic. Pat\u2019s brother\u2019s arthritis deteriorated after\nhe followed the same diet. Since he stopped eating vegetables in the\nnightshade family, such as tomatoes and peppers, his arthritis has improved.\n\nReasoning\n\nWhat could account for the fact that Sammy\u2019s aunt\u2019s arthritis improved and Pat\u2019s\nbrother\u2019s arthritis got worse after they both followed the wheat germ and garlic\ndiet? The fact that a person has a health improvement following a diet is, by\nitself, very weak evidence for the claim that the diet caused the improvement.\nMore generally, the fact that one event follows another is seldom, by itself,\nevidence that the earlier event caused the later. This applies to both the\nexperience of Sammy\u2019s aunt and that of Pat\u2019s brother with the wheat germ and\ngarlic diet.\n\n\f\nA. In theory, this could be somewhat relevant to Sammy\u2019s aunt\u2019s experience but not to Pat\u2019s\nbrother\u2019s experience. It is, however, insufficient to explain either.\nB. Even if this is true, it might be the case that a large quantity of the compounds in question\nmust be consumed in concentrated for"},{"n":728,"s":"Verb","t":"Critical Reasoning","d":"H","topic":"Critical Reasoning \u2014 Weaken","q":"In the 1960s, surveys of Florida\u2019s alligator population indicated that the population was\ndwindling rapidly. Hunting alligators was banned. By the early 1990s, the alligator population\nhad recovered, and restricted hunting was allowed. Over the course of the 1990s, reports of\nalligators appearing on golf courses and lawns increased dramatically. Therefore, in spite of\nwhatever alligator hunting went on, the alligator population must have increased significantly\nover the decade of the 1990s.\nWhic","opts":{"A":"The human population of Florida increased significantly during the 1990s.","B":"The hunting restrictions applied to commercial as well as private hunters.","C":"The number of sightings of alligators in lakes and swamps increased greatly in Florida","D":"Throughout the 1990s, selling alligator products was more strictly regulated than hunting","E":"Most of the sightings of alligators on golf courses and lawns in the 1990s occurred at"},"ans":"A","exp":"Argument Evaluation\nSituation\n\nIn the 1960s, hunting alligators was banned in Florida to allow the alligator\npopulation to recover\u2014as it did by the early 1990s. Then restricted hunting\nwas allowed. But over the decade, reports of alligators appearing on golf\ncourses and lawns increased greatly. The author of the argument concludes\nfrom this information that the alligator population must have increased\nsignificantly during the 1990s.\n\nReasoning\n\nWhat new piece of information would seriously weaken the argument? Increased\nsightings of alligators could occur either because there are more alligators or\nbecause more people are seeing the ones that are there. Any information\nindicating an increase in the ratio of people to alligators in locations where the\n\n\f\ntwo species coexist could offer an alternative to the hypothesis that the\nalligator population increased.\nA. Correct. The argument suggests that Florida is an area in which golf courses and lawns\nare common. A large rapid increase in the human population of such an area would\nprobably lead to a significant increase in the number of golf courses and lawns, some of\nwhich would encroach on the alligators\u2019 habitats. Even without any inc"},{"n":408,"s":"Data","t":"Two-Part Analysis","d":"E","topic":"Two-Part Analysis","q":"Trains M and N are traveling west on parallel tracks. At exactly noon, the front of Train M,\nwhich is traveling at a constant speed of 80 kilometers per hour (km/h), is at the rail crossing\nat Location X, and the front of Train N, which is traveling at a constant speed of 65 km/h, is 30\nkm west of the rail crossing at Location X. The trains continue traveling at their respective\nspeeds until the front of Train M and the front of Train N are simultaneously at the rail\ncrossing at Location Y.\nIn t","opts":{"note":"Select one answer per column. See book/online for full table."},"ans":"?","exp":"Infer\nFront of Train M:\nThe elapsed time between noon and 12:45 p.m. is 45 minutes, which is\n80 kilometers per hour for\n\nhour, the front of Train M traveled\n\nhour. In traveling at\n\n(80) = 60 kilometers.\n\nThe correct answer is 60.\nFront of Train N:\nThe elapsed time between noon and 1:00 p.m. is 1 hour. In traveling at 65 kilometers per hour\nfor 1 hour, the front of Train N traveled 1(65) = 65 kilometers.\nThe correct answer is 65."},{"n":409,"s":"Data","t":"Two-Part Analysis","d":"E","topic":"Two-Part Analysis","q":"An international basketball tournament will be held in either Nation QN or Nation RN. Exactly\nsix nations, including the host, plan to participate, depending on the following conditions:\nSN will participate only if TN does. UN will not participate if either VN or WN does. WN will\nnot participate unless the tournament is held in RN.\nBased on the information provided, and assuming WN participates, in the first column select\nthe nation that must also participate, and in the second column select the","opts":{"note":"Select one answer per column. See book/online for full table."},"ans":"?","exp":"Apply\nMust participate:\nWe are told to assume that WN participates. If so, we know that the tournament will be held in\nRN, because WN will not participate unless that is where the tournament is held. And if the\ntournament is held in RN, then it must be that RN will participate, because the host nation will\nparticipate in the tournament. Therefore, assuming WN participates, it must be the case that\nRN will participate as well.\nThe correct answer is RN.\nWill not participate:\nWe are told to assume that WN participates. We are also told that UN will not participate if\neither VN or WN does. So, assuming that WN participates, it cannot be that UN participates.\nThe correct answer is UN."},{"n":410,"s":"Data","t":"Two-Part Analysis","d":"E","topic":"Two-Part Analysis","q":"A portion of an automobile test track is divided into Segment A, Segment B, and Segment C, in\nthat order. In a performance test on a car, the car traveled Segment A at a constant speed of\n140 kilometers per hour (km/h). Immediately after this, the car rapidly slowed on Segment B\nand then traveled on Segment C at a constant speed of 70 km/h. The length of Segment C is 3\ntimes the length of Segment A, and it took a total of 42 minutes for the car to travel both\nSegments A and C. In the table, sele","opts":{"note":"Select one answer per column. See book/online for full table."},"ans":"?","exp":"Strategize\nLength of Segment A (kilometers)\nWe are asked to determine the lengths of two segments of an automobile test track. The\npassage states that a car traveled Segment A at a constant rate of 140 km/h and traveled\nSegment C at a constant rate of 70 km/h, which indicates that it took the car twice as much\ntime to cover a given unit of distance in Segment C as it took to cover the same distance in\nSegment A. The passage further states that the length of Segment C is 3 times the length of\nSegment A. Because the car took twice the time to cover a given distance in Segment C as in\nSegment A, and because Segment C is 3 times as long as Segment A, it can be further\ndetermined that the car spent 6 times as much time traveling Segment C as it did traveling\nSegment A. The passage indicates that it took a total of 42 minutes for the car to travel both\nSegments A and C, and 42 minutes is equal to 0.7 h (42/60). Therefore, given that the car\nspent 6 times as much of the total combined time on Segment C as it did on Segment A, it can\nbe calculated that the car spent 0.1 h on Segment A and 0.6 h on Segment C. Because we know\nthat the car was traveling at 140 km/h for 0.1 h on Segment A, we "},{"n":411,"s":"Data","t":"Two-Part Analysis","d":"E","topic":"Two-Part Analysis","q":"Let X, Y, and Z denote the number of international students, in thousands, that Company U\npredicted would be studying in the United States (US) during the school years 2014\u20132015,\n2019\u20132020, and 2024\u20132025, respectively. The average (arithmetic mean) of X, Y, and Z is\n1,128, and Y = 1,124. Company U predicted that there would be more international students\nstudying in the US during the 2024\u20132025 school year than during the 2014\u20132015 school year.\nIn the table, identify a value of X and a value of Z","opts":{"note":"Select one answer per column. See book/online for full table."},"ans":"?","exp":"Apply\nInfer\nThe task is to determine values for X and Z, where X < Z, such that the arithmetic mean of X, Y,\nand Z is 1,128 and Y = 1,124. Given that the arithmetic mean of X, Y, and Z is 1,128, it follows\nthat\n\nand X + Y + Z = 3(1,128) = 3,384. If Y = 1,124, then X + Z = 3,384 \u2212 1,124 =\n\n2,260. Since X < Z and\n\n, it follows that X < 1,130 and Z > 1,130.\n\nX:\nSince X < 1,130, the only table values possible are X = 910 or X = 995. If X = 910, then, since X\n+ Z = 2,260, Z = 2,260 \u2212 910 = 1,350, which is a table entry.\nThe correct answer is 910.\nZ:\nSince X = 910 and X + Z = 2,260, it follows that Z = 2,260 \u2212 910 = 1,350.\nThe correct answer is 1,350."},{"n":412,"s":"Data","t":"Two-Part Analysis","d":"E","topic":"Two-Part Analysis","q":"Advice from a computer security expert on passwords used for accessing online accounts\nfollows:\nComputer users should use a different password for each online account. They should also\nuse strong passwords, which are hard for hackers to decipher. However, strong passwords are\ndifficult to remember, and this is especially the case for users who have multiple online\naccounts.\nFortunately, software is available at no cost that can store and encrypt a user\u2019s passwords: the\nuser need only remember on","opts":{"note":"Select one answer per column. See book/online for full table."},"ans":"?","exp":"Infer\nSacrifice:\nTo be able to follow the computer security expert\u2019s advice effectively, the expert acknowledges\nthat computer users with multiple accounts will have to make a sacrifice of time to install the\nsoftware and input the relevant data.\nThe correct answer is Time.\nGain:\nThe computer security expert claims that making the sacrifice of time involved in installing the\nsoftware and inputting the relevant data will result in an increase in security (namely, by\nmaking online accounts secure from hacking).\nThe correct answer is Security."},{"n":413,"s":"Data","t":"Two-Part Analysis","d":"E","topic":"Two-Part Analysis","q":"Some studies of how it was that Prussia resisted the wave of European democratization in the\nnineteenth century point to Prussia\u2019s unequal distribution of land ownership as the principal\nexplanation. And political figures from areas in Prussia with high inequality in land ownership\ntended to be the staunchest opponents of democratic reforms.\nHowever, arguments that focus only on those figures\u2019 conflicts with landless people\nignore the fact that political figures are not only representatives of s","opts":{"note":"Select one answer per column. See book/online for full table."},"ans":"?","exp":"Evaluate\nThe passage asserts that some studies appeal to the fact that Prussia had significant inequality\nin land ownership during the nineteenth century to explain why Prussia did not participate in\nthe wave of democratization in that century. Political figures in areas of Prussia with high\ninequality of land ownership were often most strongly opposed to democratization. The\npassage, however, asserts (in the boldfaced text) that such arguments ignore that these\npolitical figures not only represent socioeconomic interests but also are political actors\nembedded in contexts that affect whether they support democratization. The passage claims\nthat historians must take such contexts into account to arrive at an accurate understanding of\nPrussia during this period.\nPassage:\nThe passage argues that historians should not focus too narrowly on socioeconomic interests.\nInstead, the passage asserts that they should think more broadly and consider other contexts.\nThe correct answer is To encourage historians not to approach a particular historical\nevent from too narrow a perspective.\nPortion in Boldface:\nThe portion in boldface is critical of arguments that focus only on political figures\u2019 co"},{"n":414,"s":"Data","t":"Two-Part Analysis","d":"E","topic":"Two-Part Analysis","q":"In September 2010, Armando purchased 5 identically priced shirts and 3 identically priced\npairs of trousers from a certain department store. Armando paid a total of \u20ac28.85 for the\nshirts and \u20ac38.97 for the trousers. In October 2010, the department store held a sale, taking\n25% off the September price of everything in the store. Armando returned to the store during\nthe October 2010 sale and bought 11 of the shirts and 7 pairs of the trousers for some\nfriends.\nIn the table, select how much Armando","opts":{"note":"Select one answer per column. See book/online for full table."},"ans":"?","exp":"Infer\nShirts:\nIn September 2010, Armando purchased 5 identically priced shirts for a total of \u20ac28.85. It\nfollows that he paid \u20ac\n\n= \u20ac5.77 each. At the sale in October 2010, he purchased 11 of\n\nthese shirts at a reduced price of 25% off the September 2010 price and paid a total of\n(\u20ac5.77)(0.75)(11) \u2248 \u20ac47.60.\nThe correct answer is \u20ac47.60.\nTrousers:\nIn September 2010, Armando purchased 3 identically priced pairs of trousers for a total of\n\u20ac38.97. It follows that he paid \u20ac\n\n= \u20ac12.99 each. At the sale in October 2010, he\n\npurchased 7 of these pairs of trousers at a reduced price of 25% off the September 2010\nprice and paid a total of (\u20ac12.99)(0.75)(7) \u2248 \u20ac68.20.\nThe correct answer is \u20ac68.20."},{"n":415,"s":"Data","t":"Two-Part Analysis","d":"E","topic":"Two-Part Analysis","q":"A city is hosting a table tennis tournament for its residents. Each team has exactly two players,\nand each player is on exactly one team. In each round, each team plays exactly one other team\nand either wins or loses. The winning team advances to the next round and the losing team is\neliminated. No team or player drops out except by losing a game. The tournament is in\nprogress, and exactly 512 players participated in the first round.\nFrom the available options, select a number of tournament roun","opts":{"note":"Select one answer per column. See book/online for full table."},"ans":"?","exp":"Apply\nBefore any rounds are completed, there are 512 players, each on exactly one team of two\nplayers. Therefore, there are 256 teams in the competition. After each round, half of the teams\nare eliminated. The following table summarizes the results after each round of the\ntournament.\nRounds completed 1\nTeams remaining\n\n2\n\n3\n\n4\n\n5 6 7 8\n\n128 64 32 16 8 4 2 1\n\nThe only available combination of rounds completed and number of teams remaining is 4\nrounds completed and 16 teams remaining.\nRounds completed:\nThe correct answer is 4.\nTeams remaining:\nThe correct answer is 16."},{"n":416,"s":"Data","t":"Two-Part Analysis","d":"E","topic":"Two-Part Analysis","q":"Adiliah, Bao, Davi, Laszlo, Saleema, and Yarah work in a firm\u2019s legal department. Adiliah\nsupervises Bao and Davi, Davi supervises Laszlo, and Laszlo supervises Saleema and Yarah.\nThese are the only supervisory relationships involving these six employees. Each document\nthat the department processes must be initially reviewed by exactly one department member.\nEach document reviewed by a department member must then be reviewed by that person\u2019s\nsupervisor. No other rules require anyone else to revi","opts":{"note":"Select one answer per column. See book/online for full table."},"ans":"?","exp":"Apply\nLaszlo among reviewers:\nIf Laszlo reviews a document, so must his supervisor, Davi, and Davi\u2019s supervisor, Adiliah. If\nLaszlo is the initial reviewer, then exactly 3 department members would review the document.\nHowever, if Laszlo reviews a document but is not the initial reviewer, the initial reviewer must\nbe either Saleema or Yarah for a maximum total of 4 reviewers of the document.\nThe correct answer is 4.\nAdiliah among reviewers:\nIf Adiliah reviews a document, no department members will review the document after her. If\nAdiliah is the initial reviewer, then exactly 1 department member will review the document. If\nBao or Davi is the initial reviewer, then the document will be reviewed by exactly 2\ndepartment members. If Laszlo is the initial reviewer, then the document will be reviewed by\nexactly 3 department members. Finally, if Saleema or Yarah is the initial reviewer, then exactly\n4 department members will review the document. Since no one else can be the initial\nreviewer, 4 must be the maximum number of reviewers of a single document for which\nAdiliah is among the reviewers.\nThe correct answer is 4."},{"n":417,"s":"Data","t":"Two-Part Analysis","d":"E","topic":"Two-Part Analysis","q":"Naturalist: The decline of coral reefs has various causes. One contributing factor is predation\non coral by organisms such as the crown-of-thorns sea star, whose preferred food source is\ncoral polyps. Human fishing practices have decreased the sea star\u2019s predators, such as the\nharlequin shrimp. It is also possible that runoff containing nutrients for phytoplankton has\nresulted in larger phytoplankton blooms: the crown-of-thorns sea star gladly eats\nphytoplankton.\nIndicate which cause-and-effect ","opts":{"note":"Select one answer per column. See book/online for full table."},"ans":"?","exp":"Infer\nWe are asked to provide a sequence of cause and effect that would (according to the\nnaturalist) result in coral reef decline. The question suggests that the answers will be\ndependent on one another, in that the correct answer for Cause will depend on the correct\nanswer for Effect, and vice versa.\n\n\f\nThe passage states that one factor contributing to coral reef decline is predation on coral by\norganisms such as the crown-of-thorns sea star. The preferred food source for this organism\nis coral polyps, and so a causal sequence that has as its effect an increase in crown-of-thorns\nsea stars may be likely to produce a decline in coral reefs. This suggests that the third option\nmay be the correct response for Effect. However, this depends on whether one of the other\nstatements in the table describes a cause suggested by the naturalist to produce this effect.\nThe last sentence of the naturalist\u2019s statement indeed suggests, in the context of the passage,\nthat an increase in phytoplankton blooms would result in greater numbers of crown-ofthorns sea stars. This suggests that the first option may be the correct response for Cause.\nAnd indeed, according to the naturalist, the crown-of-th"},{"n":418,"s":"Data","t":"Two-Part Analysis","d":"E","topic":"Two-Part Analysis","q":"Archaeologist: There were several porcelain-production centers in eighteenth-century Britain,\namong them Bristol, Plymouth, and New Hall. Each center developed a unique recipe for its\nporcelain that might include flint glass, soapstone, bone ash, clay, quartz, and so on. We will\ntherefore be able to determine, on the basis of compositional analysis, where the next cup we\nrecover from this archaeological site was made.\nIndicate two different statements as follows: one statement identifies an assu","opts":{"note":"Select one answer per column. See book/online for full table."},"ans":"?","exp":"Infer\nThis item asks for a possible fact and an assumption of the argument such that the possible\nfact supports the assumption. This suggests that the correctness of the answer for one\nresponse opportunity could depend on the correctness of the answer for the other.\nAssumption Required:\nOnly one of the statements in the table is an assumption required by the archaeologist\u2019s\nargument. If the next cup recovered from the archaeological site is not made of porcelain,\nthen the evidence provided by the archaeologist has no relevance regarding where the next\ncup recovered from the site was made. This indicates that the third statement may be the\ncorrect response.\nIn contrast, the first statement, although a strengthener of the argument, is not a required\nassumption: we could, for example, have other reasons for believing that the next cup will be\nmade of porcelain. The sixth statement would also be an important strengthener, but it is not\nrequired for the reasoning of the argument to be sound.\nThe correct answer is The next cup to be recovered from the site will likely be made of\nporcelain.\nPossible Fact:\nGiven that the third statement is the required assumption within the list in the tab"},{"n":419,"s":"Data","t":"Two-Part Analysis","d":"E","topic":"Two-Part Analysis","q":"Health advocate: The government\u2019s current farm-subsidy system primarily rewards large\nfarms for planting monocultures of corn, soybeans, wheat, and rice. Most of the crops\nproduced in this way go to feed livestock in factory farms, which results in a glut of fatty meats\nin the marketplace. A large proportion of such crops that are not used to feed livestock are\n\n\n\n\f23/06/2024, 22:24\n\nused to make sugary processed foods. These subsidies promote unhealthy diets by making\nsugary foods and fatty mea","opts":{"note":"Select one answer per column. See book/online for full table."},"ans":"?","exp":"Infer\nRecommends:\nThe health advocate\u2019s comments have little or no relevance to overall quality of livestock feed,\noverall financial cost of people\u2019s diets, or prevention of the manufacture of sugary\nprocessed food. Of the two remaining options, the health advocate\u2019s comments are more\nappropriate for an argument to change the farm-subsidy system than to improve the overall\nquality of people\u2019s diets, the latter of which the health advocate\u2019s last two sentences suggest\nwould be a consequence of changing the farm-subsidy system.\nThe correct answer is Change the farm-subsidy system.\nIntended result:\nThe explanation above shows that, among the options, improving the overall quality of\npeople\u2019s diets is the intended result of changing the farm-subsidy system.\nThe correct answer is Improve the overall quality of people\u2019s diets."},{"n":420,"s":"Data","t":"Two-Part Analysis","d":"E","topic":"Two-Part Analysis","q":"An archaeologist studying Artifacts A\u2013D is interested in whether Artifact C is older than\nArtifact A.\nSelect an assertion involving Artifact A and an assertion involving Artifact C that together\nimply the assertion \u201cArtifact C is older than Artifact A.\u201d Make only two selections, one in each\ncolumn.\nAssertion involving Artifact Assertion involving Artifact\nA\nC\nArtifact A is older than Artifact\nB.\nArtifact A is older than Artifact\nD.\nArtifact B is older than Artifact\nA.\nArtifact B is older than Ar","opts":{"note":"Select one answer per column. See book/online for full table."},"ans":"?","exp":"Infer\nWe are asked to select an assertion pertaining to Artifact A and an assertion pertaining to\nArtifact C that together imply the assertion Artifact C is older than Artifact A.\nAn assertion that Artifact A is older than one of the three other artifacts will not, together with\nany of the assertions involving Artifact C, imply the assertion Artifact C is older than Artifact A.\nTherefore, the assertion involving Artifact A must be an assertion that one of the other\nartifacts is older than Artifact A. Only the third option, Artifact B is older than Artifact A, is such\nan assertion.\nGiven the assertion that Artifact B is older than Artifact A, the assertion involving Artifact C that\nArtifact C is older than Artifact B implies that Artifact C is older than Artifact A. None of the\nother pairs of options would together imply that Artifact C is older than Artifact A.\nAssertion involving Artifact A:\nThe correct answer is Artifact B is older than Artifact A.\nAssertion involving Artifact C:\nThe correct answer is Artifact C is older than Artifact B."},{"n":421,"s":"Data","t":"Two-Part Analysis","d":"E","topic":"Two-Part Analysis","q":"For a randomly selected day, the probability that a visitor to a certain pond will see at least\none swan is 0.35. The probability that a visitor to that pond on a randomly selected day will\nsee at least one heron is 0.2. Furthermore, seeing a swan and seeing a heron are independent\nof each other.\nBased on the information provided, select Both swan and heron for the probability that a\nvisitor to the pond will see both at least one swan and at least one heron on any given day,\nand select Neither s","opts":{"note":"Select one answer per column. See book/online for full table."},"ans":"?","exp":"Apply\nBoth swan and heron:\nWe\u2019re told that seeing a swan and seeing a heron are independent of each other. The\nprobability that two independent events both occur equals the probability of the first\nmultiplied by the probability of the second. So, the probability that a visitor to the pond will\nsee both at least one swan and at least one heron on any given day is 0.35 0.2 = 0.07.\nThe correct answer is 0.07.\nNeither swan nor heron:\nIf the probability of an event is P, the probability that the event won\u2019t occur is 1 \u2212 P. So, the\nprobability of a visitor to the pond not seeing a swan on any given day is 1 \u2212 0.35 = 0.65, and\nthe probability of the visitor not seeing a heron on any given day is 1 \u2212 0.2 = 0.8. Since seeing\na swan is independent of seeing a heron, not seeing a swan is likewise independent of not\nseeing a heron. Thus, the probability that a visitor to the pond will see neither a swan nor a\nheron on any given day is 0.65 0.8 = 0.52.\nThe correct answer is 0.52."},{"n":422,"s":"Data","t":"Two-Part Analysis","d":"E","topic":"Two-Part Analysis","q":"Two primary school teachers are debating the merits of classrooms with highly decorated\nwalls.\nTeacher 1: A recent study has shown that highly decorated walls can interfere with learning in\nthe classroom. We should therefore decrease the number of wall decorations in our\nclassrooms.\nTeacher 2: The results of that study are correct, but pertain only to the retention of\ninformation from single lessons in which the students were in the classroom for only a short\nperiod of time. Our students are in ","opts":{"note":"Select one answer per column. See book/online for full table."},"ans":"?","exp":"Infer\nX:\nTeacher 1 cites a study as having shown that highly decorated walls interfere with classroom\nlearning. Teacher 2 remarks that these study results are correct with regard to retention of\ninformation from single, brief lessons. Thus, the two teachers agree that wall decorations\ninterfere with retention of information from lessons given in rooms occupied for only a short\ntime.\nThe correct answer is retention of information from lessons given in rooms occupied for\nonly a short time.\nY:\nBy citing the study without qualification as a reason to remove classroom wall decorations,\nTeacher 1 implicitly accepts that the study results hold in general. Thus, Teacher 1 seems to\nbelieve that highly decorated walls generally interfere with classroom learning. But Teacher 2\nargues that when students are in the same room for many lessons over long periods,\ndecorated walls reduce their boredom and distraction, helping them learn better in the long\nrun. So, the two teachers evidently disagree about whether highly decorated walls interfere\nwith students\u2019 retention of information from multiple lessons given in the same room over\ntime.\nThe correct answer is retention of information from multiple"},{"n":423,"s":"Data","t":"Two-Part Analysis","d":"M","topic":"Two-Part Analysis","q":"Supervisor\u2019s memo: At the present rate of manufacture we will not have the 1,200 circuit\nboards assembled in time to ship them to the customer. We currently have 10 workers, all\nworking 8 hours a day at the same hourly rate, assembling the boards, and to date they\u2019ve\nassembled 400. In order to finish the customer\u2019s order in time, I\u2019ll need to have each of the\nworkers work an additional 2 hours for each of the 10 workdays between now and the\ndeadline.\nOne can determine the hourly rate at which ea","opts":{"note":"Select one answer per column. See book/online for full table."},"ans":"?","exp":"Strategize\nCircuit boards:\nThe number of circuit boards assembled is the product of the number of workers, the hourly\nrate per worker, the number of hours worked per day, and the number of days worked. Using\nthe given information, it follows that\n(400 boards) = (10 workers)(hourly rate) (8 hours/day)(number of days)\nNow solve for the hourly rate:\nhourly rate =\n=\nThe correct answer is 400.\nWorker-hours:\nThe analysis in Response 1 shows that the number of worker-hours per day is 80.\nThe correct answer is 80."},{"n":424,"s":"Data","t":"Two-Part Analysis","d":"M","topic":"Two-Part Analysis","q":"In an experiment, one thousand nine-year-old children were allowed to choose whether to\nparticipate in a program in which the researchers taught them dance during the daily break\nfrom their lessons. Four hundred of the children chose to participate for at least one year. At\nthe end of the year, researchers found that the children who had participated had significantly\nbetter balance, on average, than those who had not. The researchers hypothesized that\ndancing resulted in a sustained improvement","opts":{"note":"Select one answer per column. See book/online for full table."},"ans":"?","exp":"Evaluate\nResearchers and Prior to:\nNote that because of the relationship between the two answers that complete the sentence,\nthe responses have to be considered together, not separately.\nThe question asks what would be most helpful to know when evaluating the researchers\u2019\nhypothesis. To answer this, it is useful to consider some alternative explanations for the better\nbalance of the children who had participated in the program. One alternative would be that\nthe children who had decided to participate in the program already had better balance before\nparticipating. Therefore, it would be useful to know whether they actually did have any\nimprovement in their balance. To resolve that issue, it would be helpful if we knew that the\nresearchers had this information, which they could have acquired by testing the children\u2019s\nsense of balance prior to teaching them dance through the dance program.\nThe correct answer to Response 1 is tested the children\u2019s sense of balance.\nThe correct answer to Response 2 is taught dance to the children through the dance\nprogram."},{"n":425,"s":"Data","t":"Two-Part Analysis","d":"M","topic":"Two-Part Analysis","q":"Klaus: Closing our neighborhood\u2019s school will mean a major hassle for neighborhood families.\nStudents will have to travel farther to and from school, which means they\u2019ll have less time for\nhomework. That will likely affect them academically. Additionally, a vacant school building in\nour neighborhood is sure to attract crime and drag down home values.\nRena: Our neighborhood\u2019s school never had a great reputation anyway. Closing it means\nstudents will get to go to a larger school\u2014with a better repu","opts":{"note":"Select one answer per column. See book/online for full table."},"ans":"?","exp":"Recognition\nKlaus:\nKlaus and Rena both specifically mention the vacant school building, the distance students\nmust travel to school, and real estate values. Klaus, unlike Rena, also specifically mentions\nstudents\u2019 academic performance. (It is possible that when Rena talks about the schools\u2019\nreputations, the schools\u2019 students\u2019 academic performance is one of the factors that affects the\nschools\u2019 reputations, but we do not know for certain.)\nThe correct answer is Students\u2019 academic performance.\nRena:\nKlaus and Rena both specifically mention the vacant school building, the distance students\nmust travel to school, and real estate values. Rena, unlike Klaus, also specifically mentions\nextracurricular activities.\nThe correct answer is Extracurricular activities."},{"n":426,"s":"Data","t":"Two-Part Analysis","d":"M","topic":"Two-Part Analysis","q":"Alfredo: The United States could make significant progress toward becoming independent of\npetroleum-derived gasoline as a source of energy by diverting a large proportion of corn\ngrown in the US to the production of ethanol for fuel. Brazil is virtually independent of\npetroleum as a source of fuel because that country has been very successful in ethanol\nproduction.\n\n\n\n\f23/06/2024, 22:24\n\nMavis: Ethanol derived from corn will never be a viable substitute for petroleum-derived\ngasoline in the US. ","opts":{"note":"Select one answer per column. See book/online for full table."},"ans":"?","exp":"Infer\nAgree with each other about:\nAlfredo and Mavis both accept the claim that Brazil has been very successful at replacing\npetroleum with ethanol.\nThe correct answer is Brazil has been very successful at replacing petroleum with\nethanol.\nDisagree with each other about:\nWhereas Alfredo believes that Brazil\u2019s success at replacing demand for petroleum with\nethanol supports the claim that producing corn ethanol is a viable strategy for a nation intent\non reducing demand on petroleum, Mavis does not. Mavis points out that producing ethanol\nfrom sugarcane, as Brazil does, has very significant advantages over producing ethanol from\ncorn.\nThe correct answer is Producing corn ethanol is a viable strategy for a nation intent on\nreducing dependence on petroleum."},{"n":427,"s":"Data","t":"Two-Part Analysis","d":"M","topic":"Two-Part Analysis","q":"Radhika is refinancing a business loan and is considering 2 different loan offers. Under Offer\n1, the loan\u2019s initial principal would be $190,000, and she would pay down $1,250 in principal\nwith each monthly payment during the first year of the loan. Under Offer 2, $4,000 in\nrefinancing fees would be added to bring the principal to $194,000, but she would pay down\n$1,775 in principal with each monthly payment during the first year of the loan.\nIn the first column of the table, select the amount o","opts":{"note":"Select one answer per column. See book/online for full table."},"ans":"?","exp":"Apply\nPrincipal remaining after 12 months under Offer 1:\nUnder Offer 1, the principal would be $190,000, and the monthly payment would be $1,250.\nThe total of 12 monthly payments would be 12($1,250) = $15,000. Therefore, the principal\nremaining after 12 months under Offer 1 would be $190,000 $15,000 = $175,000.\nThe correct answer is $175,000.\nPrincipal remaining after 12 months under Offer 2:\nUnder Offer 2, with the $4,000 refinancing fee added, the principal would be $194,000 and the\nmonthly payment would be $1,775. The total of 12 monthly payments would be 12($1,775) =\n$21,300. Therefore, the principal remaining after 12 months under Offer 2 would be $194,000\n$21,300 = $172,700.\nThe correct answer is $172,700."},{"n":428,"s":"Data","t":"Two-Part Analysis","d":"M","topic":"Two-Part Analysis","q":"Professor A: The field of Artificial Intelligence (AI) was originally aimed exclusively at the\nconstruction of thinking machines, that is, computer systems with human-like general\nintelligence. But the difficulty of this goal of general AI has led researchers to shift their focus\nto producing narrow AI systems: software displaying intelligence regarding specific tasks in\nrelatively narrow domains such as chess. The problem is, narrow AI and general AI are\nfundamentally and entirely different pur","opts":{"note":"Select one answer per column. See book/online for full table."},"ans":"?","exp":"Infer\nProfessor A disagrees:\nProfessor A states that the field of AI (Artificial Intelligence) originally was intended to create\nthinking machines, that is, computers that could display human-like general intelligence.\nProfessor A then states that over time the field of AI shifted its focus to narrow AI systems,\nones that address relatively narrow realms of intelligence, such as chess playing. Professor A\nstates that narrow AI will not aid in being able to produce systems that model general\nintelligence, because narrow AI and general AI are entirely different pursuits. Therefore, a\nclaim that Professor A would disagree with is that the creation of systems that display\nintelligence regarding specific tasks is an especially important step toward the creation of\nsystems with general intelligence.\nThe correct answer is The creation of systems that display intelligence regarding specific\ntasks is an especially important step toward the creation of systems with general\nintelligence.\nProfessor B disagrees:\nUnlike Professor A, Professor B believes that the achievements of narrow AI\u2014of which\nProfessor B says there are many\u2014will eventually lead to the creation of systems with general\nintelli"},{"n":429,"s":"Data","t":"Two-Part Analysis","d":"M","topic":"Two-Part Analysis","q":"Swamp sparrows live in a variety of wetland habitats. Unlike most swamp sparrows, which live\nin freshwater habitats, the coastal-plain subspecies lives in tidal wetlands, where freshwater\nand seawater mix and the mud is gray rather than brown. Coastal-plain swamp sparrows\ndiffer from all other populations of swamp sparrows in having plumage that is gray-brown\nrather than rusty brown. DNA analysis indicates several important genetic differences\nbetween swamp sparrows that inhabit tidal marshes an","opts":{"note":"Select one answer per column. See book/online for full table."},"ans":"?","exp":"Evaluate\nThe passage discusses differences among various types of swamp sparrows and their\nhabitats. Most swamp sparrows, which have rusty brown plumage, live in freshwater habitats,\nwhere the mud tends to be brown, but coastal-plain swamp sparrows, which have gray-brown\nplumage, live in tidal wetlands, where the mud tends to be gray. Research on the DNA of these\ntypes of birds has discovered important genetic differences between the coastal-plain swamp\nsparrows and other, freshwater-dwelling swamp sparrows. The passage draws the conclusion\nfrom these facts that there was some genetic pressure on coastal-plain swamp sparrows to\nbecome darker and grayer.\nStrengthen:\nThe argument concludes that the difference in plumage between tidal-marsh swamp sparrows\nand other swamp sparrows is genetic rather than, for instance, the direct environment in\nwhich an individual sparrow grows up or the sorts of food an individual sparrow consumes.\nTherefore, the argument in the passage would be strengthened if there were evidence that\nbaby birds of the coastal-plain subspecies and baby birds of the freshwater species had\n\n\f\nplumage similar in color to their respective parents, even if the baby birds w"},{"n":430,"s":"Data","t":"Two-Part Analysis","d":"M","topic":"Two-Part Analysis","q":"Boppo is a game played by 2 teams for a fixed duration (number of minutes). It is played with\n8 members of each team on the floor\u2014actually playing the game\u2014at all times. At any time\nduring the game, exactly one player from each team must be off the floor\u2014not actually\nplaying. Thus, by taking a break, by entering the game after it starts, or by leaving before it\nfinishes, every player on each team must spend exactly 5 minutes resting or otherwise not\nplaying.\nIn the table, identify a number of pl","opts":{"note":"Select one answer per column. See book/online for full table."},"ans":"?","exp":"Apply\nNumber of players:\nHaving 8 + 1 = 9 players per team is consistent with the requirement that, at any time during\nthe game, 8 players must be on the floor actually playing the game and 1 player must be off\nthe floor\u2014not actually playing the game.\nThe correct answer is 9.\nNumber of minutes:\nA fixed duration of 9 \u00d7 5 = 45 minutes per game is consistent with each of the 9 members on a\nteam being required to spend exactly 5 minutes during each game resting or otherwise not\nplaying the game.\nThe correct answer is 45."},{"n":431,"s":"Data","t":"Two-Part Analysis","d":"M","topic":"Two-Part Analysis","q":"Loan X has a principal of $x and a yearly simple interest rate of 4%. Loan Y has a principal of\n$y and a yearly simple interest rate of 8%. Loans X and Y will be consolidated to form Loan Z\nwith a principal of $(x + y) and a yearly simple interest rate of r%, where r =\n\n. Select a\n\nvalue for x and a value for y corresponding to a yearly simple interest rate of 5% for the\nconsolidated loan. Make only two selections, one in each column.\n\n\n\n\n\f23/06/2024, 22:24\n\nx y Value\n21,000\n32,000\n51,000\n64,000","opts":{"note":"Select one answer per column. See book/online for full table."},"ans":"?","exp":"Apply\nThe task is to determine values of x and y such that\n\n.\n\nAs shown, algebraic manipulation results in a simple relationship between x and y.\n=5\n\ngiven\n\n4x + 8y = 5(x + y)\n\nmultiply both sides by x + y\n\n4x + 8y = 5x + 5y\n\napply the distributive property\n\n4x + 3y = 5x\n\nsubtract 5y from both sides\n\n3y = x\n\nsubtract 4x from both sides\n\nx:\nChoose a value for x that is 3 times another value in the Value column. Since the value for x\nwill be greater than the other value, it is wise to start with the greatest value, which is 96,000.\nSince 96,000 is 3(32,000), 96,000 is a value for x that is consistent with the given information.\nThe correct answer is 96,000.\ny:\nFrom the explanation above, the value of y is 32,000.\nThe correct answer is 32,000."},{"n":432,"s":"Data","t":"Two-Part Analysis","d":"M","topic":"Two-Part Analysis","q":"Perry, Maria, and Lorna are painting rooms in a college dormitory. Working alone, Perry can\npaint a standard room in 3 hours, Maria can paint a standard room in 2 hours, and Lorna can\npaint a standard room in 2 hours 30 minutes. Perry, Maria, and Lorna have decided that, to\nspeed up the work, 2 of them will paint a standard room together.\nSelect the value closest to the shortest time in which a 2-person team could paint a standard\nroom, and select the value closest to the longest time in which a","opts":{"note":"Select one answer per column. See book/online for full table."},"ans":"?","exp":"Apply\nShortest time:\nWorking together, Lorna and Maria can paint a standard room in the shortest amount of time\nbecause individually they can paint a standard room in less time than Perry. Lorna can paint a\nstandard room in 2\n\n=\n\nhours, so she can paint\n\nstandard room in 2 hours, so she can paint\n\nroom in 1 hour. Maria can paint a\n\nroom in 1 hour. Working together, they can\n\npaint\n\nroom in 1 hour. It follows that they can paint 1 room in\n\nequivalent to 1\n\nhours or about 1 hour 7 minutes.\n\nhours, which is\n\nThe correct answer is 1 hour 7 minutes.\nLongest time:\nWorking together, Lorna and Perry take the longest amount of time to paint a standard room\nbecause individually they take more time than Maria to paint a standard room. Lorna can\npaint a standard room in 2\n\n=\n\nhours, so she can paint\n\nstandard room in 3 hours, so he can paint\n\nroom in 1 hour. Perry can paint a\n\nroom in 1 hour. Working together, they can paint\n\nroom in 1 hour. It follows that they can paint 1 room in\nequivalent to 1\n\nhours, which is\n\nhours or about 1 hour 22 minutes.\n\n\f\nThe correct answer is 1 hour 22 minutes."},{"n":433,"s":"Data","t":"Two-Part Analysis","d":"M","topic":"Two-Part Analysis","q":"A dance show will include exactly five pieces, and each piece will be presented only once:\nRequiem, Smooth Step, Trampoline, Unleashed, and Waltzy. Requiem will be presented\nimmediately before Smooth Step. Unleashed will be presented earlier than Trampoline, with at\nleast one piece in between. Waltzy will not be the final piece presented.\nIn the table, select a piece that cannot be the second piece presented and a piece that cannot\nbe the third piece presented. Make only two selections, one in e","opts":{"note":"Select one answer per column. See book/online for full table."},"ans":"?","exp":"Infer\nCannot be presented second:\nOne of the conditions states that Unleashed will be presented earlier than Trampoline, with at\nleast one piece in between. It follows from this that the earliest Trampoline can be presented\nis third, because both Unleashed and at least one of the other pieces must be presented\nearlier than Trampoline. Therefore, Trampoline cannot be presented first or second.\nThe correct answer is Trampoline.\nCannot be presented third:\nWaltzy cannot be presented third. To see this, remember that Requiem must be presented\nimmediately before Smooth Step. If Waltzy were third, then Requiem and Smooth Step would\nhave to be first and second, in that order, or fourth and fifth, in that order. In either of those\ncases, Unleashed and Trampoline would have to be presented one right after the other\u2014\neither first and second or fourth and fifth\u2014but that is not allowed; there must be some piece\npresented between them. Therefore, Waltzy cannot be presented third.\nThe correct answer is Waltzy."},{"n":434,"s":"Data","t":"Two-Part Analysis","d":"M","topic":"Two-Part Analysis","q":"An American museum of East Asian art reviewed its acquisitions strategy in 2009. As part of\nthat review, a marketing executive recommended purchasing more ceramics, jades, and\npaintings of people or landscapes because visitor surveys indicated that those types are of\ngreatest interest to museumgoers in the region. The museum\u2019s curator recommended\npurchasing more twenty-first-century East Asian art\u2014particularly abstract\n(nonrepresentational) paintings and sculptures\u2014because the museum\u2019s collectio","opts":{"note":"Select one answer per column. See book/online for full table."},"ans":"?","exp":"Apply\nPainting:\n\u201cPainting of girl\u2019s face \u2026\u201d satisfies the people or landscapes recommendation of the marketing\nexecutive and satisfies the twenty-first-century (from 2006) recommendation of the museum\u2019s\ncurator.\nThe correct answer is Painting of girl\u2019s face, in shades of blue and red, acrylic and oil on\ncanvas, 2006.\nSculpture:\n\u201cAbstract sequence \u2026\u201d satisfies the ceramic recommendation of the marketing executive and\nsatisfies the twenty-first-century (from 2008) recommendation of the museum\u2019s curator.\nThe correct answer is Abstract sequence of interconnected curves, ceramic, 2008."},{"n":435,"s":"Data","t":"Two-Part Analysis","d":"M","topic":"Two-Part Analysis","q":"Professor A: The aid industry should begin to focus its efforts to spending on primary schools\nin the poorest areas, to providing medicines and other basic supplies for health such as\nmosquito nets, and to a few key agricultural initiatives.\nProfessor B: Much education work has been ineffective. A village or town with poor schooling\nmay be better off getting a road than a teacher. Once local farmers can transport produce to\nmarket, they will be willing to pay for schools\u2014and to make sure the sch","opts":{"note":"Select one answer per column. See book/online for full table."},"ans":"?","exp":"Infer\nThe wording of the question suggests that the correctness of an answer for one of the\nresponse opportunities will depend on the correctness of the answer to the other. We are to\nfind a statement in the table such that the information indicates Professor A would likely\ndisagree with the first statement and Professor B would take the second statement to present\nevidence against the first.\n1:\nThe only statement in the table that the dialogue strongly suggests Professor A would\ndisagree with is The aid industry should focus its spending less on primary education than it now\ndoes. For example, if the relative distribution of spending by the aid industry between primary\nschools in the poorest areas, medicines, and other basic supplies for health such as mosquito nets,\nand the few key agricultural initiatives is maintained, while spending in other areas is\ndrastically reduced, then the aid industry will thereby focus its spending more on primary\neducation than it now does.\nThe correct answer is The aid industry should focus its spending less on primary\neducation than it now does.\n2:\nGiven the answer for 1, the question requires identification of the statement within the table\nthat P"},{"n":436,"s":"Data","t":"Two-Part Analysis","d":"M","topic":"Two-Part Analysis","q":"A car is traveling on a straight stretch of roadway, and the speed of the car is increasing at a\nconstant rate with respect to time. At time 0 seconds, the speed of the car is v0 meters per\nsecond; 10 seconds later, the front bumper of the car has traveled 125 meters, and the speed\nof the car is v10 meters per second.\nSelect values of v0 and v10 that are together consistent with the information provided. Make\nonly two selections, one in each column.\nv0 v10\n5\n18\n20\n36\n72","opts":{"note":"Select one answer per column. See book/online for full table."},"ans":"?","exp":"Infer\nSince the speed of the car increases at a constant rate, the car\u2019s average speed, in meters per\nsecond, over the 10-second period is equal to (v0 + v10). Thus, the distance the car traveled,\nin meters, over that period is equal to\n\n(v0 + v10) (10), or 5(v0 + v10). But this value is given\n\nto be 125, so it must be true that v0 + v10 =\n\n, or 25. Because speed must be positive, both\n\nv0 and v10 must be less than 25, ruling out 36 and 72 as possible values.\nv0:\nAmong the available alternatives\u20145, 18, and 20\u2014the only pair that sum to 25 are 5 and 20.\nSince the speed is increasing, it must also be true that v0 \u2264 v10. Therefore, v0 = 5.\nThe correct answer is 5.\nv10:\nFollowing the analysis for Response 1, the value of v10 must correspond to v0 = 5. So, 5 + v10\n= 25, and therefore, v10 = 20.\nThe correct answer is 20."},{"n":437,"s":"Data","t":"Two-Part Analysis","d":"M","topic":"Two-Part Analysis","q":"For each positive integer n, the quantity sn is defined such that sn + 2 = (sn)2 \u2212 sn + 1. In\naddition, s2 = 1.\nSelect values for s1 and s4 that are jointly compatible with these conditions. Select only two\nvalues, one in each column.\n\n\n\n\n\f23/06/2024, 22:24\n\ns1\n\ns4\n\u221212\n\u22127\n\u22123\n\u22121\n0","opts":{"note":"Select one answer per column. See book/online for full table."},"ans":"?","exp":"Infer\nFor n = 1, the equation sn + 2 = (sn)2 \u2212 sn + 1 is equivalent to s3 = (s1)2 \u2212 s2. For n = 2, the\nequation sn + 2 = (sn)2 \u2212 sn + 1 is equivalent to s4 = (s2)2 \u2212 s3, and substituting (s1)2 \u2212 s2 for s3\nyields s4 = (s2)2 \u2212 (s1)2 + s2. (Continuing in this fashion, it is possible to produce, for each\npositive integer n, an expression for sn in terms of s1 and s2.) Substituting 1 for s2 in the\nequation for s4, it follows that the values of s1 and s4 are related by the equation s4 = 2 \u2212\n\n(s1)2. One strategy is to substitute each value in the table for s1 to see if the corresponding\nvalue of s4 is present.\ns1:\nBecause the value of (s1)2 is nonnegative and increases rapidly as the absolute value of s1\nincreases, it makes sense to begin testing possible values for s1 at the bottom of the table.\n\nWhen s1 is equal to 0 or \u22121, the quantity 2 \u2212 (s1)2 is positive, so the corresponding value of s4\ndoes not appear. When s1 = \u22123, the corresponding value of s4 is 2 \u2212 (\u22123)2 = \u22127, which is\n\npresent in the table. Note that when s1 \u2264 \u22127, it follows that 2 \u2212 (s1)2 \u2264 2 \u2212 49, so the\ncorresponding value of s4 is less than or equal to \u221247 and hence cannot appear in the table.\nSo the value of s1 must be \u2212"},{"n":438,"s":"Data","t":"Two-Part Analysis","d":"M","topic":"Two-Part Analysis","q":"The finesse of a gold bar is the weight of the gold present in the bar divided by the total weight\nof the bar. A jeweler has three gold bars. The three bars have identical weights, and the first\ntwo bars have identical finesse. If all three bars were melted and combined into one bar, the\nfinesse of the resulting bar would be 0.96.\nSelect a finesse of the First two bars and a finesse of the Third bar that are jointly consistent\nwith the given information. Make only two selections, one in each col","opts":{"note":"Select one answer per column. See book/online for full table."},"ans":"?","exp":"Infer\nFirst two bars:\nAccording to the text, the finesse of a gold bar is equal to the weight of gold in the bar divided\nby the total weight of the bar. The text also indicates that the three gold bars have the same\nweight, that the first two bars have the same finesse, and that melting and combining the three\nbars would result in a gold bar with a finesse of 0.96. Since the first two bars have identical\nfinesse and identical weight, the weight of the gold present in those bars must also be\nidentical. Let x equal the weight of the gold in each of the first two bars, let y equal the weight\nof the gold in the third bar, and let w be the total weight of each bar. Then, since the finesse of\nthe combined bar is 0.96, it must be the case that\n2.88. But then if F1 =\n\n= 0.96, or 2\n\n+\n\nis the finesse of each of the first two bars, and F3 =\n\n= (0.96)(3) =\nis the\n\nfinesse of the third bar, then 2F1 + F3 = 2.88. Among the available options, substituting 0.98\nfor F1 and 0.92 for F3 gives us 2(0.98) + 0.92 = 1.96 + 0.92 = 2.88. No other pair of options\nyields the correct result.\nThe correct answer is 0.98.\nThird bar:\nBased on the explanation for Response 1, the correct answer for Response 2 is 0"},{"n":439,"s":"Data","t":"Two-Part Analysis","d":"M","topic":"Two-Part Analysis","q":"A fair coin has 2 distinct flat sides\u2014one of which bears the image of a face and the other of\nwhich does not\u2014and when the coin is tossed, the probability that the coin will land face up is\n. For certain values of M, N, p, and q, when M fair coins are tossed simultaneously, the\nprobability is p that all M coins land face up, and when N fair coins are tossed simultaneously,\nthe probability is q that all N coins land face up. Furthermore, M < N and + = 72.\nIn the table, select a value for M and a v","opts":{"note":"Select one answer per column. See book/online for full table."},"ans":"?","exp":"Infer\nIf M is a positive integer, then the probability, p, that M fair coins all land face up is\n\nSimilarly, if N is a positive integer, then the probability, q, that N fair coins all land face up is\n\nSince\n\n+\n\n= 72\n\nThen\nThe task, then, is to find two powers of 2 (an Mth power and an Nth power) that add up to 72.\nThe correct answer for M will be the lesser of the two exponents. Note that for the given\noptions, the only possible powers of 2 are 4, 8, 16, 32, 64, and 128. The only way for two of\nthese to add up to 72 is for one to be 8 = 23 and the other to be 64 = 26. Since M is to be the\nlesser of the two exponents and N is to be the greater of the two exponents, it must be that M\n= 3 and N = 6.\nM:\nAs noted in the discussion above, M = 3.\nThe correct answer is 3.\nN:\nAs noted in the discussion above, N = 6.\nThe correct answer is 6."},{"n":440,"s":"Data","t":"Two-Part Analysis","d":"M","topic":"Two-Part Analysis","q":"Educational policy analyst: To improve the long-term economic benefits that our country\u2019s\nuniversities provide to their students, the government should provide subsidies enabling the\nuniversities to hire more academic staff. Hiring more academic staff would allow smaller class\nsizes. Statistically, university students in smaller classes tend to receive higher grades than\nthose in larger classes. And on average, a student who earns higher grades in university\nclasses tends to have a higher salary","opts":{"note":"Select one answer per column. See book/online for full table."},"ans":"?","exp":"Evaluate\nWe are asked to complete the statement so that it is an accurate reflection of the information\nprovided in the educational policy analyst\u2019s argument.\nThe educational policy analyst asserts that hiring more academic staff would allow smaller class\nsizes, and that on average, a student who earns higher grades in university classes tends to have a\nhigher salary after graduation than a student who earns lower grades. This leads the analyst to\nconclude that hiring more academic staff would improve the economic well-being of graduates\nnationwide. Given this conclusion in conjunction with the analyst\u2019s other assertions, according\nto the analyst\u2019s argument, students\u2019 economic well-being after graduation from university is\nbolstered by their tendency to earn higher grades in university classes.\nThe analyst makes no claims about the quality of education overall or the number of academic\nstaff students learn from. Furthermore, the only implication with respect to larger university\nclass sizes is that they would likely not bolster either grades or salaries. Therefore, no other\npair of options completes the statement so that it is an accurate reflection of the information\nprovided.\n1:\n"},{"n":441,"s":"Data","t":"Two-Part Analysis","d":"H","topic":"Two-Part Analysis","q":"The payload rating (PR) of a truck is the truck\u2019s recommended load weight, which is specified\nas a number of tonnes (t), where 1 tonne = 1,000 kilograms. A certain truck\u2019s PR is a whole\nnumber of tonnes. The truck has hauled exactly 7 loads, exactly 3 of which had a greater\nweight than the truck\u2019s PR. The weights of these 7 loads, in tonnes, are as follows:\n50, 51, 52, 52, 54, 54, 56.\nSelect the Least and the Greatest possible values for the truck\u2019s PR, in tonnes. Make only two\nselections, one i","opts":{"note":"Select one answer per column. See book/online for full table."},"ans":"?","exp":"Apply\nLeast:\nAccording to the information provided, the PR is a whole number of tonnes, and among the\nseven loads (weighing 50, 51, 52, 52, 54, 54, and 56 tonnes), exactly three exceeded the\ntruck\u2019s PR. Given this, the PR must be a whole number of tonnes less than 54 and no less than\n52, so the truck\u2019s PR can be either 52 or 53 tonnes. Therefore, the least possible value for the\ntruck\u2019s PR is 52 tonnes.\nThe correct answer is 52.\nGreatest:\nBased on the explanation for Response 1, the greatest possible value for the truck\u2019s PR is 53\ntonnes.\nThe correct answer is 53."},{"n":442,"s":"Data","t":"Two-Part Analysis","d":"H","topic":"Two-Part Analysis","q":"Each of the species of a certain type of insect has at least one of five significant traits: A, B, C,\nD, and E. Furthermore, one study has determined that any species with Trait A has at least one\nof the Traits B and C. Another study has determined that any species with Trait C has at least\none of the Traits D and E. And a third study has determined that any of the species with Trait\nB has Trait C. The results of each study are correct.\nSelect different options for X and for Y such that the foll","opts":{"note":"Select one answer per column. See book/online for full table."},"ans":"?","exp":"Infer\nWe are asked to identify, in addition to the relationship between Traits B and C, a relationship\nbetween two of the five significant traits of a certain type of insect that is implied by the\ninformation in the passage.\nThe passage states that any species of insect with Trait A has at least one of the Traits B and C\n\u2014any insects with Trait A will have Trait B, Trait C, or both. The passage also states that any of\nthe species with Trait B has Trait C. Taken together, these claims imply that any of the insects\nthat has Trait A also has Trait C\u2014an insect with Trait A will either have Trait C and not Trait B,\nor it will have both Trait B and Trait C. The passage does not imply any other relationships\nbetween the five significant traits such that any insect that has any one of the significant traits\nmust also have another of the significant traits. Therefore, the statement that the passage\nimplies that any of the insects that has Trait A also has Trait C most accurately describes the\npassage.\nX:\nThe correct answer is A.\nY:\nThe correct answer is C."},{"n":443,"s":"Data","t":"Two-Part Analysis","d":"H","topic":"Two-Part Analysis","q":"Events A, B, and C have the following probabilities of future occurrence:\nA: 20%\nB: 50%\nC: 80%\nOn the basis of these probabilities, select for Both A and B a description that must be true of\nthe probability that both A and B will occur. And select for B or C or Both a description that\nmust be true of the probability that B or C or both will occur. Make only two selections, one in\neach column.\n\n\n\n\f23/06/2024, 22:24\n\nBoth A and B B or C or Both\nMust be equal to 40%\nMust be equal to 50%\nMust be equ","opts":{"note":"Select one answer per column. See book/online for full table."},"ans":"?","exp":"Apply\nBoth A and B:\nThe probability of two events both occurring never exceeds either individual event\u2019s\nprobability of occurring. The probability of A occurring is only 20%, so the probability of both\nA and B occurring cannot exceed 20%.\nThe correct answer is Must be less than or equal to 20%.\nB or C or Both:\nThe probability that at least one of two events will occur is never less than either individual\nevent\u2019s probability of occurring. The probability of C occurring is 80%, so the probability that\neither B or C or both will occur must be at least 80%.\nThe correct answer is Must be greater than or equal to 80%.\nQuestions 444 to 455 \u2014 Difficulty: Hard"},{"n":444,"s":"Data","t":"Two-Part Analysis","d":"H","topic":"Two-Part Analysis","q":"In June 1990, a small academic press published an initial run of 2,500 copies of linguist Chloe\nVermeulen\u2019s first book, Speech and Speaking. Because the first run was selling well, a second,\nlarger run was produced in June 1995. Total sales for the period from June 1995\u2013June 2000\nrepresented an increase of 52 percent over total sales for the preceding five years; by June\n2000, Vermeulen\u2019s book had sold a total of 3,843 copies. In 2000, Speech and Speaking was\ncited in an influential paper; subse","opts":{"note":"Select one answer per column. See book/online for full table."},"ans":"?","exp":"Apply\nJune 1990\u2212June 1995:\nLet N be the total sales for June 1990\u2212June 1995. Then 1.52N is the total sales for June\n1995\u2212June 2000 and N + 1.52N = 2.52N is the sales by June 2000. Since the sales by June\n2000 is 3,843, it follows that 2.52N = 3,843, or N = 1,525. Among the table values, 1,530 most\nclosely approximates the value of N (total sales for June 1990\u2212June 1995).\nThe correct answer is 1,530.\nJune 2000\u2212June 2005:\nFrom the analysis above, 1.52N = 1.52(1,525) = 2,318 is the total sales for June 1995\u2212June\n2000. The total sales for June 2000\u2212June 2005 is double the total sales for June 1995\u2212June\n2000, or 2(2,318) = 4,636. Among the table values, 4,640 most closely approximates the total\nsales for June 2000\u2212June 2005.\nThe correct answer is 4,640."},{"n":445,"s":"Data","t":"Two-Part Analysis","d":"H","topic":"Two-Part Analysis","q":"Miguel\u2019s online banking password is nine characters long and includes at least one character\nof each of five types: digits, punctuation marks, uppercase (capital) letters, lowercase\n(noncapital) letters, and certain other characters. The password begins or ends with one of\nthese other characters, of which it contains exactly one. No consecutive characters in the\npassword are of the same one of these types. (For example, no capital letter is preceded or\nfollowed by another capital letter.) The pa","opts":{"note":"Select one answer per column. See book/online for full table."},"ans":"?","exp":"Apply\nThe passage indicates that Miguel\u2019s password is nine characters long, contains at least one\ncharacter of each of five different types\u2014digits, punctuation marks, uppercase letters,\nlowercase letters, and \u201cother characters\u201d\u2014and either begins or ends with one of the \u201cother\ncharacters.\u201d We are also given the first three characters of the password: M, ?, and G. So,\nbecause the password begins with an uppercase letter, it must end with one of the \u201cother\ncharacters.\u201d We know the password contains more lowercase letters than characters of any of\nthe other types, so it must contain at least three lowercase letters. We also know that there is\nat least one punctuation mark and fewer punctuation marks than digits, lowercase letters, or\nuppercase letters, so there must be at least two digits.\nGiven that the password is nine characters long, we can now determine the distribution of all\nthe characters in the password across all five of the types: one other character, one\npunctuation mark, two digits, two uppercase letters, and three lowercase letters. We know that\nthe two uppercase letters and the one punctuation mark are among the first three characters\nand that the \u201cother character\u201d is th"},{"n":446,"s":"Data","t":"Two-Part Analysis","d":"H","topic":"Two-Part Analysis","q":"Public health professional: The Happydale Department of Environmental Services (DES) has\ninspected area beaches for pathogenic bacteria for over 20 years. Currently, DES monitors 50\nfreshwater beaches and 10 coastal beaches on a weekly basis. Program participation by\nowners of beaches that are open to the public is voluntary. Beach owners who choose not to\nparticipate in the program are allowing the public to recreate on entirely unmonitored\nbeaches. The DES now proposes adoption of the Adopt-a-","opts":{"note":"Select one answer per column. See book/online for full table."},"ans":"?","exp":"Infer\nAdopted:\nCurrently not all beaches are monitored. Because the proposal calls for the DES to collect data\non\u2014that is, monitor\u2014all area beaches, it is reasonable to conclude that there will be fewer,\nif any, entirely unmonitored beaches in the area.\nThe correct answer is There will be fewer, if any, entirely unmonitored beaches.\nNot adopted:\nIf the proposal requiring that all area beaches be monitored is not adopted, then, barring\nsome other change to the current situation, it is likely that some beaches will remain entirely\nunmonitored.\nThe correct answer is Some beaches will remain entirely unmonitored."},{"n":447,"s":"Data","t":"Two-Part Analysis","d":"H","topic":"Two-Part Analysis","q":"Marco: Giant kangaroos\u2014one of several extinct species of large mammals (megafauna)\u2014went\nextinct in Australia around 46,000 years ago. The deposits and wear patterns on the teeth of\nthese animals from around the time of their extinction indicate that they fed mostly on\n\n\n\n\f23/06/2024, 22:24\n\nsaltbrush shrubs. Saltbrush thrives in arid climates, so it is not likely that the kangaroos\u2019 food\nsupply was adversely affected by the increasing aridity of the climate at the time. Thus,\nsomething else woul","opts":{"note":"Select one answer per column. See book/online for full table."},"ans":"?","exp":"Evaluate\nMarco:\nMarco argues that increasing aridity is not likely the cause of the giant kangaroos\u2019 extinction\nin Australia. If it is a fact that giant kangaroos endured during even more arid conditions than\nthe conditions at the time of their extinction, this fact would make it less likely that the\nincreasing aridity would be either a direct or indirect cause of their extinction. This would,\ntherefore, help justify Marco\u2019s conclusion that something other than increasing aridity led to\ntheir extinction.\nThe correct answer is Giant kangaroos became extinct during a period that was less arid\nthan previous periods they endured.\nFatima:\nMarco proposes that the most likely cause of the giant kangaroos\u2019 extinction is human\npredation. But giant kangaroos went extinct in Australia about 46,000 years ago. Therefore, if\nmany researchers believe that humans didn\u2019t first arrive in Australia until 40,000 years ago,\nthen Fatima has justification for being skeptical about Marco\u2019s suggestion that human\npredation is the best candidate for the cause of giant kangaroos\u2019 extinction in Australia. If\nthese researchers are correct, humans did not arrive in Australia until giant kangaroos had\nbeen extinc"},{"n":448,"s":"Data","t":"Two-Part Analysis","d":"H","topic":"Two-Part Analysis","q":"A mattress company has two stores, one in City X and the other in City Z. The company has\nadvertised equally in newspapers in both cities but has advertised twice as much on the radio\nin City Z as in City X. The two cities have similar populations and economies, and the sales at\neach store have been roughly equal. A consultant claims this shows that the radio advertising\nhas not improved mattress sales. In the table below, select changes that the company could\nmake in City X and City Z, respecti","opts":{"note":"Select one answer per column. See book/online for full table."},"ans":"?","exp":"Strategize\nWhile changes to the newspaper or television advertising strategy may affect mattress sales,\nthose changes would not necessarily clarify the effect radio advertising has had on mattress\nsales.\nEven if changing the content of the radio advertising in either city were to bring about an\nincrease in mattress sales, it may not be possible to determine if the consultant\u2019s claim was\ncorrect. If the previous content had a negligible or a positive effect on sales, then an increase\nin sales coinciding
