ents in the\nclass was 20, what was the standard deviation of the adjusted test scores of the students in\nthe class?","opts":{"A":"12","B":"16","C":"28","D":"36","E":"40"},"ans":"B","exp":"The solution to this problem relies on the statistical properties summarized in the following\ntable:\nData Set\nMean Standard Deviation\nValues\nx\n\n\u03bc\n\nax + b a\u03bc + b\n\n\u03c3\na\u03c3\n\nThe standard deviation of the original test scores was 20. Therefore, when the teacher\nmultiplied each student\u2019s score by 0.8 and then added 20, the standard deviation of the set of\nadjusted scores is 0.8(20) = 16.\nThe correct answer is B."},{"n":188,"s":"Quan","t":"Problem Solving","d":"H","topic":"Arithmetic Applied Problems","q":"Last year 26 members of a certain club traveled to England, 26 members traveled to France,\nand 32 members traveled to Italy. Last year no members of the club traveled to both England\nand France, 6 members traveled to both England and Italy, and 11 members traveled to both\nFrance and Italy. How many members of the club traveled to at least one of these three\ncountries last year?","opts":{"A":"52","B":"67","C":"71","D":"73","E":"79"},"ans":"B","exp":"The numbers in the Venn diagram below represent the numbers of members of the club who\ntraveled to the indicated countries, and these numbers can be determined as follows. Since no\nmembers traveled to both England and France, both regions that form the overlap of England\nand France are labeled with 0. It follows that none of the 6 members who traveled to both\nEngland and Italy traveled to France, and so the region corresponding to England and Italy\nonly is labeled with 6. It also follows that none of the 11 members who traveled to both\nFrance and Italy traveled to England, and so the region corresponding to France and Italy only\nis labeled with 11. At this point it can be determined that 26 \u2013 6 = 20 members traveled to\nEngland only, 26 \u2013 11 = 15 members traveled to France only, and 32 \u2013 (6 + 11) = 15 members\ntraveled to Italy only.\n\n\f\nFrom the diagram it follows that 20 + 15 + 6 + 11 + 15 = 67 members traveled to at least one\nof these three countries.\nThe correct answer is B."},{"n":189,"s":"Quan","t":"Problem Solving","d":"H","topic":"Arithmetic Percents","q":"A store reported total sales of $385 million for February of this year. If the total sales for the\nsame month last year was $320 million, approximately what was the percent increase in sales?","opts":{"A":"2%","B":"17%","C":"20%","D":"65%","E":"83%"},"ans":"C","exp":"The percent increase in sales from last year to this year is 100 times the quotient of the\ndifference in sales for the two years divided by the sales last year. Thus, the percent increase\nis\n\nThe correct answer is C."},{"n":190,"s":"Quan","t":"Problem Solving","d":"H","topic":"Arithmetic Properties of Numbers","q":"When positive integer x is divided by positive integer y, the remainder is 9. If\n\nwhat\n\nis the value of y?","opts":{"A":"96"},"ans":"B","exp":"The remainder is 9 when x is divided by y, so x = yq + 9 for some positive integer q. Dividing\nboth sides by y gives = q + . But = 96.12 = 96 + 0.12. Equating the two expressions for\ngives q +\n\n= 96 + 0.12. Thus, q = 96 and\n\n= 0.12.\n\nThe correct answer is B."},{"n":191,"s":"Quan","t":"Problem Solving","d":"H","topic":"Algebra Second-Degree Equations; Simultaneous Equations","q":"If x(2x + 1) = 0 and\n\n(2x \u2013 3) = 0, then x =\n\nA.\nB.\nC. 0\nD.\nE.","opts":{"C":"0"},"ans":"B","exp":"Setting each factor equal to 0, it can be seen that the solution set to the first equation is\nand the solution set to the second equation is\n\n. Therefore,\n\nis the\n\nsolution to both equations.\nThe correct answer is B."},{"n":192,"s":"Quan","t":"Problem Solving","d":"H","topic":"Algebra Simultaneous Equations; Inequalities","q":"A certain experimental mathematics program was tried out in 2 classes in each of 32\nelementary schools and involved 37 teachers. Each of the classes had 1 teacher and each of\nthe teachers taught at least 1, but not more than 3, of the classes. If the number of teachers\nwho taught 3 classes is n, then the least and greatest possible values of n, respectively, are","opts":{"A":"0 and 13","B":"0 and 14","C":"1 and 10","D":"1 and 9","E":"2 and 8"},"ans":"A","exp":"It is given that 2(32) = 64 classes are taught by 37 teachers. Let k, m, and n be the number of\nteachers who taught, respectively, 1, 2, and 3 of the classes. Then k + m + n = 37 and\nk + 2m + 3n = 64. Subtracting these two equations gives m + 2n = 64 \u2013 37 = 27, or 2n = 27 \u2013 m,\nand therefore 2n \u2264 27. Because n is an integer, it follows that n \u2264 13 and answer choice B\ncannot be the answer. Since n = 0 is possible, which can be seen by using m = 27 and k = 10\n(obtained by solving 2n = 27 \u2013 m with n = 0, then by solving k + m + n = 37 with n = 0 and\nm = 27), the answer must be answer choice A.\nIt is not necessary to ensure that n = 13 is possible to answer the question. However, it is not\ndifficult to see that k = 23, m = 1, and n = 13 satisfy the given conditions.\nThe correct answer is A."},{"n":193,"s":"Quan","t":"Problem Solving","d":"H","topic":"Algebra Statistics","q":"For the positive numbers, n, n + 1, n + 2, n + 4, and n + 8, the mean is how much greater than\nthe median?","opts":{"A":"0","B":"1","C":"n + 1","D":"n + 2","E":"n + 3"},"ans":"B","exp":"Since the five positive numbers n, n + 1, n + 2, n + 4, and n + 8 are in ascending order, the\nmedian is the third number, which is n + 2. The mean of the five numbers is\n\nSince\n\n, the mean is 1 greater than the median.\n\nThe correct answer is B."},{"n":194,"s":"Quan","t":"Problem Solving","d":"H","topic":"Algebra Applied Problems","q":"The present ratio of students to teachers at a certain school is 30 to 1. If the student\nenrollment were to increase by 50 students and the number of teachers were to increase by\n5, the ratio of students to teachers would then be 25 to 1. What is the present number of\nteachers?","opts":{"A":"5","B":"8","C":"10","D":"12","E":"15"},"ans":"E","exp":"After noting that\n\nimplies that the number of students is 30 times the\n\nnumber of teachers, this problem can be solved with arithmetic, as shown in the table below,\nby guessing the present number of teachers, increasing the numbers of students and teachers\nas specified, then checking to see if the resulting ratio is equal to\n\n.\n\nPresent Teachers Students\nPresent Number\nNumber of Increased Increased Resulting Ratio Equal to\nof Teachers\nStudents\nby 5\nby 50\n5\n\n150\n\n10\n\n200\n\n8\n\n240\n\n13\n\n290\n\n10\n\n300\n\n15\n\n350\n\n12\n\n360\n\n17\n\n410\n\n15\n\n450\n\n20\n\n500\n\n?\n\nno\nno\n\n=\n\nno\n\nno\n\n=\n\nyes\n\nTherefore, the present number of teachers is 15.\nAlternatively, the problem can be solved using algebra.\nThe following table summarizes the given information, where s represents the present\nnumber of students and t represents the present number of teachers:\nNumber of Number of\nStudents Teachers\nPresent\nAfter Increases\n\ns\n\nt\n\ns + 50\n\nt+5\n\nEquation After Cross\nMultiplying\ns = 30t\n\n=\n\ns + 50 = 25(t + 5)\n\nDetermine the value of t using s = 30t (Equation 1) and s + 50 = 25(t + 5) = 25t + 125\n(Equation 2).\n\n\f\ns + 50 = 25t + 125\n\nEquation 2\n\n30t + 50 = 25t + 125\n\nsubstitution from Equation 1\n\n5t + 50 = 125\n\nsubtract 25t fro"},{"n":195,"s":"Quan","t":"Problem Solving","d":"H","topic":"Arithmetic Operations with Rational Numbers","q":"What is the smallest integer n for which 25n > 512?","opts":{"A":"6","B":"7","C":"8","D":"9","E":"10"},"ans":"B","exp":"Because\n, a common base is 5. Rewrite the left side with 5 as a base:\nIt follows that the desired integer is the least integer n for which\n. This will be the\nleast integer n for which\n, or the least integer n for which n > 6, which is 7.\n\n.\n\nThe correct answer is B."},{"n":196,"s":"Quan","t":"Problem Solving","d":"H","topic":"Arithmetic Probability","q":"Sixty percent of the members of a study group are women, and 45 percent of those women\nare lawyers. If one member of the study group is to be selected at random, what is the\nprobability that the member selected is a woman lawyer?","opts":{"A":"0.10","B":"0.15","C":"0.27","D":"0.33","E":"0.45"},"ans":"C","exp":"For simplicity, suppose there are 100 members in the study group. Since 60 percent of the\nmembers are women, there are 60 women in the group. Also, 45 percent of the women are\nlawyers so there are 0.45(60) = 27 women lawyers in the study group. Therefore, the\nprobability of selecting a woman lawyer is\n\n= 0.27.\n\nThe correct answer is C."},{"n":197,"s":"Quan","t":"Problem Solving","d":"H","topic":"Arithmetic Operations on Rational Numbers","q":"Each year for 4 years, a farmer increased the number of trees in a certain orchard by\n\nof the\n\nnumber of trees in the orchard the preceding year. If all of the trees thrived and there were\n6,250 trees in the orchard at the end of the 4-year period, how many trees were in the\norchard at the beginning of the 4-year period?","opts":{"A":"1,250","B":"1,563","C":"2,250","D":"2,560","E":"2,752"},"ans":"D","exp":"Let N be the number of trees in the orchard at the beginning of the 4-year period. Since the\nnumber of trees increases by a factor of\n\neach year, the number of trees after the first year is\n\n. Note that this shows algebraically that an increase by a factor of\ncorresponds to multiplication by . Therefore, the number of trees after the second year is\ntimes\n\n, which equals\n\n. Similarly, the number of trees after the third year is\n\nand the number of trees after the fourth year is\nfourth year is 6,250, it follows that\n\n. Since the number of trees after the\n. Next, solve for N:\n\n= 6, 250\n\ngiven\n\n= 6, 250\n\nproperty of exponents\n\nN\n\n=\n\ndivide both sides by\n\nN\n\n=\n\ninvert and multiply\n\nN\n\n=\n\nfactor 6,250\n\nN\n\n= 2 \u00d7 5 \u00d7 44 cancel common factors\n\nN\n\n= 2,560\n\nmultiply\n\nThe correct answer is D."},{"n":198,"s":"Quan","t":"Problem Solving","d":"H","topic":"Arithmetic Interpretation of Graphs and Tables; Statistics","q":"According to the chart shown, which of the following is closest to the median annual number\nof shipments of manufactured homes in the United States for the years from 1990 to 2000,\ninclusive?","opts":{"A":"250,000","B":"280,000"},"ans":"C","exp":"From the chart, the approximate numbers of shipments are as follows:\n\n\f\nYear Number of Shipments\n1990\n\n190,000\n\n1991\n\n180,000\n\n1992\n\n210,000\n\n1993\n\n270,000\n\n1994\n\n310,000\n\n1995\n\n350,000\n\n1996\n\n380,000\n\n1997\n\n370,000\n\n1998\n\n390,000\n\n1999\n\n360,000\n\n2000\n\n270,000\n\nSince there are 11 entries in the table and 11 is an odd number, the median of the numbers of\nshipments is the 6th entry when the numbers of shipments are arranged in order from least\nto greatest. In order, from least to greatest, the first 6 entries are:\nNumber of Shipments\n180,000\n190,000\n210,000\n270,000\n270,000\n310,000\nThe 6th entry is 310,000.\nThe correct answer is C."},{"n":199,"s":"Quan","t":"Problem Solving","d":"H","topic":"Arithmetic Property of Numbers","q":"For the positive integers a, b, and k,\ndivisor of b. If k is a positive integer and\n\nmeans that\n\nis a divisor of b, but\n\nis not a\n\nthen k is equal to","opts":{"A":"2","B":"3","C":"4","D":"8","E":"18"},"ans":"B","exp":"Since 72 = (23)(32), it follows that 23 is a divisor of 72 and 24 is not a divisor of 72. Therefore,\n, and hence k = 3.\nThe correct answer is B."},{"n":200,"s":"Quan","t":"Problem Solving","d":"H","topic":"Arithmetic Statistics","q":"A certain characteristic in a large population has a distribution that is symmetric about the\nmean m. If 68 percent of the distribution lies within one standard deviation d of the mean,\nwhat percent of the distribution is less than m + d?","opts":{"A":"16%","B":"32%","C":"48%","D":"84%","E":"92%"},"ans":"D","exp":"Since 68% lies between m \u2212 d and m + d, a total of (100 \u2212 68)% = 32% lies to the left of m \u2212 d\nand to the right of m + d. Because the distribution is symmetric about m, half of the 32% lies\nto the right of m + d. Therefore, 16% lies to the right of m + d, and hence (100 \u2212 16)% = 84%\nlies to the left of m + d.\nThe correct answer is D."},{"n":201,"s":"Quan","t":"Problem Solving","d":"H","topic":"Arithmetic","q":"Four extra-large sandwiches of exactly the same size were ordered for m students, where m >","opts":{},"ans":"E","exp":"Since each of 3 of the sandwiches was evenly divided among m students, each piece was\n\nof\n\na sandwich. Since the fourth sandwich was evenly divided among m \u2212 4 students, each piece\nwas\nof the fourth sandwich. Carol ate 1 piece from each of the four sandwiches, so she\nate a total of\nThe correct answer is E."},{"n":4,"s":"Quan","t":"Problem Solving","d":"E","topic":"Algebra Applied Problems","q":"Three of the sandwiches were evenly divided among the students. Since 4 students did not\nwant any of the fourth sandwich, it was evenly divided among the remaining students. If Carol\nate one piece from each of the four sandwiches, the amount of sandwich that she ate would\nbe what fraction of a whole extra-large sandwich?\nA.\nB.\nC.\nD.\nE.","opts":{},"ans":"C","exp":"The commission on the total sales can be calculated as follows:\n\n\f\ncommission on first $500 + commission on amount over $500\n=\n\n(0.15)($500) + (0.20)($1,300 \u2013 $500)\n$75\n\n=\n\n+ $160\n\nTherefore, the commission on the total sales is $75 + $160 = $235.\nThe correct answer is C."},{"n":202,"s":"Quan","t":"Problem Solving","d":"H","topic":"Algebra Second-Degree Equations","q":"Which of the following equations has 1 +\n\nas one of its roots?","opts":{"A":"x2 + 2x \u2013 1 = 0","B":"x2 \u2013 2x + 1 = 0","C":"x2 + 2x + 1 = 0","D":"x2 \u2013 2x \u2013 1 = 0","E":"x2 \u2013 x \u2013 1 = 0"},"ans":"D","exp":"This problem can be solved by working backward to construct a quadratic equation with 1 +\nas a root that does not involve radicals.\nx=\n\n1+\n\nx\u20131 =\n\nset x to the desired value\nsubtract 1 from both sides\n\n(x \u2013 1)2 = 2\n\nsquare both sides\n\nx2 \u2013 2x + 1 = 2\n\nexpand the left side\n\nx2 \u2013 2x \u2013 1 = 0\n\nsubtract 2 from both sides\n\nThe correct answer is D."},{"n":203,"s":"Quan","t":"Problem Solving","d":"H","topic":"Arithmetic Percents","q":"In Country C, the unemployment rate among construction workers dropped from 16 percent\non September 1, 1992, to 9 percent on September 1, 1996. If the number of construction\nworkers was 20 percent greater on September 1, 1996, than on September 1, 1992, what was\nthe approximate percent change in the number of unemployed construction workers over this\nperiod?","opts":{"A":"50% decrease","B":"30% decrease","C":"15% decrease","D":"30% increase","E":"55% increase"},"ans":"B","exp":"Letting N represent the number of construction workers on September 1, 1992, the\ninformation given in the problem is as follows:\n1. On September 1, 1992, the unemployment rate among construction workers was 16\npercent, so the number of unemployed construction workers on September 1, 1992, was\n0.16N.\n2. On September 1, 1996, the number of construction workers was 20 percent greater than\non September 1, 1992, so the number of construction workers on September 1, 1996,\nwas 1.2N.\n3. On September 1, 1996, the unemployment rate among construction workers was 9\npercent, so the number of unemployed construction workers on September 1, 1996, was\n0.09(1.2N).\nAs a fraction, the percent change in the number of unemployed construction workers from\nSeptember 1, 1992, to September 1, 1996, is given by:\n\nThen, as a percent, \u2013\n\n=\n\nsubstitution of expressions from (1) and (3)\n\n=\n\ndivide numerator and denominator by N\n\n=\n\nmultiply numerator and denominator by\n1,000 for ease of calculation\n\n=\n\nmultiply\n\n=\n\n\u2013\n\nsubtract\n\n=\n\n\u2013\n\ndivide numerator and denominator by 4\n\n\u2013\n\n39 \u2248 40\n\n\u2013\n\ndivide numerator and denominator by 13\n\nrepresents a decrease of about 30%.\n\nThe correct answer is B."},{"n":204,"s":"Quan","t":"Problem Solving","d":"H","topic":"Arithmetic Probability","q":"In a box of 12 pens, a total of 3 are defective. If a customer buys 2 pens selected at random\nfrom the box, what is the probability that neither pen will be defective?\nA.\nB.\nC.\nD.\nE.","opts":{},"ans":"C","exp":"The probability that the first pen selected is not defective is\n\n(9 pens are not defective\n\nout of a total of 12 pens). Assuming the first pen selected is not defective, the probability that\nthe second pen is not defective is\n\n(this time 8 pens are not defective out of a total of\n\n11 pens). Therefore, using the multiplication rule for dependent events, the probability that\nboth pens are not defective is\n\n.\n\nAlternatively, by a direct count using the number of combinations of n objects taken k at a time\n(see Section 3.4.3, \u201cCounting Methods,\u201d in the Math Review chapter), there are\n= 36 ways to select 2 non-defective pens from the 9 non-defective pens, and there are\n= 66 ways to select 2 pens from the 12 pens. Therefore, the probability that\nthe 2 pens selected are not defective is\n.\nThe correct answer is C."},{"n":205,"s":"Quan","t":"Problem Solving","d":"H","topic":"Algebra Statistics","q":"At a certain fruit stand, the price of each apple is 40 cents and the price of each orange is 60\ncents. Mary selects a total of 10 apples and oranges from the fruit stand, and the average\n(arithmetic mean) price of the 10 pieces of fruit is 56 cents. How many oranges must Mary\nput back so that the average price of the pieces of fruit that she keeps is 52 cents?","opts":{"A":"1","B":"2","C":"3","D":"4","E":"5"},"ans":"E","exp":"This problem can be solved using arithmetic or algebra.\nWith algebra\nLet x be the number of oranges Mary selected originally. It follows that the number of apples\nMary selected is 10 \u2013 x since the number of pieces of fruit she selected originally was 10. The\naverage price of the 10 pieces of fruit is 56 cents so,\n\n\f\n= 56\n\ngiven\n\n40(10 \u2013 x) + 60x = 560\n\nmultiply both sides by 10\n\n400 \u2013 40x + 60x = 560\n\ndistributive property\n\n400 + 20x = 560\n20x = 160\nx=8\n\ncombine like terms\nsubtract 400 from each term\ndivide both sides by 20\n\nThus, Mary originally selected 8 oranges and 2 apples.\nIf y represents the number of oranges that Mary must put back, then 8 \u2013 y is the number of\noranges she keeps. So, with the 2 apples, the total number of pieces of fruit she keeps is\n2 + (8 \u2013 y). The average price of these 2 + (8 \u2013 y) pieces of fruit is 52 cents so,\n= 52\n\ngiven\n\n40(2) + 60(8 \u2013 y) = 52[2 + (8 \u2013 y)]\n\nmultiply both sides by 2 + (8 \u2013 y)\n\n40(2) + 60(8 \u2013 y) = 52(10 \u2013 y)\n\ncombine like terms\n\n80 + 480 \u2013 60y\n\n= 520 \u2013 52y\n\ndistributive property\n\n560 \u2013 60y = 520 \u2013 52y\n\ncombine like terms\n\n560 = 520 + 8y\n\nadd 60y to both sides\n\n40 = 8y\n\nsubtract 520 from both sides\n\n5=y\n\ndivide both sides by 8\n\nTherefor"},{"n":206,"s":"Quan","t":"Problem Solving","d":"H","topic":"Arithmetic Percents","q":"A pharmaceutical company received $3 million in royalties on the first $20 million in sales of\nthe generic equivalent of one of its products and then $9 million in royalties on the next $108\nmillion in sales. By approximately what percent did the ratio of royalties to sales decrease\nfrom the first $20 million in sales to the next $108 million in sales?","opts":{"A":"8%","B":"15%","C":"45%","D":"52%","E":"56%"},"ans":"C","exp":"The ratio of royalties to sales for the first $20 million in sales is\nto sales for the next $108 million in sales is\nfrom\n\nto\n\n, and the ratio of royalties\n\n. Now calculate the percent decrease\n\n.\n\n\u2248 \u22120.44 \u00d7 100\n\u2248 45% decrease\nAn alternative way to calculate the percent decrease from\n\nto\n\nis to scale the values up\n\nuntil they are integers, which allows for a simpler calculation. Multiplying each of these values\nby 60 gives\n\nand\n\n, respectively, so the problem reduces to calculating the\n\npercent decrease from 9 to 5. Therefore,\n\n\u2248 \u2212 0.44 \u00d7 100 \u2248 45%\n\ndecrease.\nThe correct answer is C."},{"n":207,"s":"Quan","t":"Problem Solving","d":"H","topic":"Arithmetic Operations with Integers","q":"The light in a restroom operates with a 15-minute timer that is reset every time the door\nopens as a person goes in or out of the room. Thus, after someone enters or exits the room,\nthe light remains on for only 15 minutes unless the door opens again and resets the timer for\nanother 15 minutes. If the times listed above are the times at which the door opened from\n8:00 to 10:00, approximately how many minutes during this two-hour period was the light\noff?","opts":{"A":"10","B":"25","C":"35","D":"40","E":"70"},"ans":"B","exp":"In the table given above, read down the columns looking for pairs of consecutive times that\nare more than 15 minutes apart. The following table shows all such pairs:\nConsecutive times more than Minutes between Minutes that Minutes that\n15 minutes apart\ntimes door opens light is on\nlight is off\n8:31 and 8:54\n\n54 \u2013 31 = 23\n\n15\n\n23 \u2013 15 = 8\n\n9:11 and 9:29\n\n29 \u2013 11 = 18\n\n15\n\n18 \u2013 15 = 3\n\n9:31 and 10:00\n\n60 \u2013 31 = 29\n\n15\n\n29 \u2013 15 = 14\n\nTotal time light is off\n\n25\n\nThe correct answer is B."},{"n":208,"s":"Quan","t":"Problem Solving","d":"H","topic":"Arithmetic Properties of Numbers","q":"If p is the product of the integers from 1 to 30, inclusive, what is the greatest integer k for\nwhich is a factor of p?","opts":{"A":"10","B":"12","C":"14","D":"16","E":"18"},"ans":"C","exp":"The table below shows the numbers from 1 to 30, inclusive, that have at least one factor of 3\nand how many factors of 3 each has.\nMultiples of 3\nBetween 1 and 30 Number of Factors of 3\n3\n\n1\n1\n2\n1\n1\n2\n1\n1\n3\n1\n\nThe sum of the numbers in the right column is 14. Therefore, 314 is the greatest power of 3\nthat is a factor of the product of the first 30 positive integers.\nThe correct answer is C."},{"n":209,"s":"Quan","t":"Problem Solving","d":"H","topic":"Arithmetic Properties of Numbers","q":"If n = 38 \u2013 28, which of the following is NOT a factor of n?","opts":{"A":"97","B":"65","C":"35","D":"13","E":"5"},"ans":"C","exp":"Since 38 \u2212 28 is the difference of the perfect squares (34)2 and (24)2, then 38 \u2013 28 = (34 + 24)\n(34 \u2013 24). But 34 \u2013 24 is also the difference of the perfect squares (32)2 and (22)2 so 34 \u2013 24 =\n(32 + 22)(32 \u2013 22) and therefore 38 \u2013 28 = (34 + 24)(32 + 22)(32 \u2013 22). It follows that 38 \u2013 28\ncan be factored as (81 + 16)(9 + 4)(9 \u2013 4) = (97)(13)(5). Therefore, 7 is not a factor of 38 \u2013\n28, and hence 35 = 5 \u00d7 7 is not a factor of 38 \u2013 28. It is easy to see that each of 97, 13, and 5 is\n\n\f\na factor of 38 \u2013 28, and so is 65, since 65 = 5 \u00d7 13, although this additional analysis is not\nneeded to arrive at the correct answer.\nThe correct answer is C."},{"n":210,"s":"Quan","t":"Problem Solving","d":"H","topic":"Arithmetic Properties of Numbers","q":"Club X has more than 10 but fewer than 40 members. Sometimes the members sit at tables\nwith 3 members at one table and 4 members at each of the other tables, and sometimes they\nsit at tables with 3 members at one table and 5 members at each of the other tables. If they sit\nat tables with 6 members at each table except one and fewer than 6 members at that one\ntable, how many members will be at the table that has fewer than 6 members?","opts":{"A":"1"},"ans":"E","exp":"Let n be the number of members that Club X has. Since the members can be equally divided\ninto groups of 4 each with 3 left over, and the members can be equally divided into groups of\n5 each with 3 left over, it follows that n \u2013 3 is divisible by both 4 and 5. Therefore, n \u2013 3 must\nbe a multiple of (4)(5) = 20. Also, because the only multiple of 20 that is greater than 10 and\nless than 40 is 20, it follows that n \u2013 3 = 20, or n = 23. Finally, when these 23 members are\ndivided into the greatest number of groups of 6 each, there will be 5 members left over, since\n23 = (3)(6) + 5.\nThe correct answer is E."},{"n":211,"s":"Quan","t":"Problem Solving","d":"H","topic":"Algebra Applied Problems","q":"In order to complete a reading assignment on time, Terry planned to read 90 pages per day.\nHowever, she read only 75 pages per day at first, leaving 690 pages to be read during the last\n6 days before the assignment was to be completed. How many days in all did Terry have to\ncomplete the assignment on time?","opts":{"A":"15","B":"16","C":"25","D":"40","E":"46"},"ans":"B","exp":"Let n be the number of days that Terry read at the slower rate of 75 pages per day. Then 75n\nis the number of pages Terry read at this slower rate, and 75n + 690 is the total number of\npages Terry needs to read. Also, n + 6 is the total number of days that Terry will spend on the\nreading assignment. The requirement that Terry average 90 pages per day is equivalent to\n= 90. Then\n\n\f\nTherefore, the total number of days that Terry has to complete the assignment on time is n + 6\n= 10 + 6 = 16.\nThe correct answer is B."},{"n":212,"s":"Quan","t":"Problem Solving","d":"H","topic":"Algebra Equations","q":"If s > 0 and\n\n= s, what is r in terms of s?\n\nA.\nB.\nC.\nD.\nE.","opts":{},"ans":"D","exp":"Solve the equation for r as follows:\n\nThe correct answer is D."},{"n":213,"s":"Quan","t":"Problem Solving","d":"H","topic":"Arithmetic Properties of Numbers","q":"If 3 < x < 100, for how many values of x is\n\nthe square of a prime number?","opts":{"A":"Two","B":"Three","C":"Four","D":"Five","E":"Nine"},"ans":"B","exp":"If\n\nis the square of a prime number, then possible values of\n\nare 22, 32, 52, 72, \u2026. Therefore,\n\npossible values of x are 3 \u00d7 22 = 12, 3 \u00d7 32 = 27, 3 \u00d7 52 = 75, 3 \u00d7 72 = 147, \u2026. Since only three\nof these values, namely 12, 27, and 75, are between 3 and 100, there are three values of x\nsuch that\n\nis the square of a prime number.\n\n\f\nThe correct answer is B."},{"n":214,"s":"Quan","t":"Problem Solving","d":"H","topic":"Arithmetic Elementary Combinatorics","q":"A researcher plans to identify each participant in a certain medical experiment with a code\nconsisting of either a single letter or a pair of distinct letters written in alphabetical order.\nWhat is the least number of letters that can be used if there are 12 participants, and each\nparticipant is to receive a different code?","opts":{"A":"4","B":"5","C":"6","D":"7","E":"8"},"ans":"B","exp":"None of the essential aspects of the problem is affected if the letters are restricted to be the\nfirst n letters of the alphabet, for various positive integers n. With the 3 letters a, b, and c,\nthere are 6 codes: a, b, c, ab, ac, and bc. With the 4 letters a, b, c, and d, there are 10 codes: a, b,\nc, d, ab, ac, ad, bc, bd, and cd. Clearly, more than 12 codes are possible with 5 or more letters,\nso the least number of letters that can be used is 5.\nThe correct answer is B."},{"n":215,"s":"Quan","t":"Problem Solving","d":"H","topic":"Algebra Applied Problems","q":"An object thrown directly upward is at a height of h feet after t seconds, where h = \u201316(t \u2013 3)2\n+ 150. At what height, in feet, is the object 2 seconds after it reaches its maximum height?\nA.\n\n6\n\nB. 86\nC. 134\nD. 150\nE. 166","opts":{"B":"86","C":"134","D":"150","E":"166"},"ans":"B","exp":"Since (t \u2013 3)2 is positive when t \u2260 3 and zero when t = 3, it follows that the minimum value of\n(t \u2013 3)2 occurs when t = 3. Therefore, the maximum value of \u201316(t \u2013 3)2, and also the\nmaximum value of \u201316(t \u2013 3)2 + 150, occurs when t = 3. Hence, the height 2 seconds after the\nmaximum height is the value of h when t = 5, or \u201316(5 \u2013 3)2 + 150 = 86.\nThe correct answer is B."},{"n":216,"s":"Quan","t":"Problem Solving","d":"H","topic":"Algebra Inequalities","q":"Which of the following is equivalent to the pair of inequalities x + 6 > 10 and x \u2013 3 \u2264 5?","opts":{"A":"2 \u2264 x < 16","B":"2 \u2264 x < 4","C":"2 < x \u2264 8","D":"4 < x \u2264 8","E":"4 \u2264 x < 16"},"ans":"D","exp":"Solve the inequalities separately and combine the results.\n\n\f\nSince\n\n, then\n\n. Combining\n\nand\n\ngives\n\n.\n\nThe correct answer is D."},{"n":217,"s":"Quan","t":"Problem Solving","d":"H","topic":"Algebra Applied Problems; Simultaneous Equations","q":"David has d books, which is 3 times as many as Jeff and\n\nas many as Paula. How many books\n\ndo the three of them have altogether, in terms of d?\nA.\nB.\nC.\nD.\nE.","opts":{},"ans":"C","exp":"Let J be the number of books that Jeff has, and let P be the number of books Paula has. Then\nthe given information about David\u2019s books can be expressed as d = 3J and d =\nthese two equations for J and P gives\n\n= J and 2d = P. Thus, d + J + P = d +\n\nP. Solving\n+ 2d = 3\n\nd=\n\nd.\nThe correct answer is C."},{"n":218,"s":"Quan","t":"Problem Solving","d":"H","topic":"Arithmetic Operations on Rational Numbers","q":"There are 8 teams in a certain league and each team plays each of the other teams exactly\nonce. If each game is played by 2 teams, what is the total number of games played?","opts":{"A":"15","B":"16","C":"28","D":"56","E":"64"},"ans":"C","exp":"Since no team needs to play itself, each team needs to play 7 other teams. In addition, each\ngame needs to be counted only once, rather than once for each team that plays that game.\n\n\f\nSince two teams play each game,\n\n= 28 games are needed.\n\nThe correct answer is C."},{"n":219,"s":"Quan","t":"Problem Solvi hat will be the approximate total amount\nof the investment 18 years later, when Pat is ready for college?","opts":{"A":"$20,000","B":"$15,000","C":"$12,000","D":"$10,000","E":"$9,000"},"ans":"A","exp":"Since the investment will double in\n\nyears, the value of the investment\n\nover 18 years can be approximated by doubling its initial value twice. Therefore, the\napproximate value will be\n$20,000.\nThe correct answer is A."},{"n":223,"s":"Quan","t":"Problem Solving","d":"H","topic":"Arithmetic Estimation","q":"On a recent trip, Cindy drove her car 290 miles, rounded to the nearest 10 miles, and used 12\ngallons of gasoline, rounded to the nearest gallon. The actual number of miles per gallon that\nCindy\u2019s car got on this trip must have been between\nA.","opts":{},"ans":"D","exp":"The lowest number of miles per gallon can be calculated using the lowest possible miles and\nthe highest amount of gasoline. Also, the highest number of miles per gallon can be calculated\nusing the highest possible miles and the lowest amount of gasoline.\nSince the miles are rounded to the nearest 10 miles, the number of miles is between 285 and\n295. Since the gallons are rounded to the nearest gallon, the number of gallons is between\n11.5 and 12.5. Therefore, the lowest number of miles per gallon is\n\nand\n\nthe highest number of miles per gallon is\nThe correct answer is D."},{"n":224,"s":"Quan","t":"Problem Solving","d":"H","topic":"Algebra Inequalities","q":"Which of the following inequalities is an algebraic expression for the shaded part of the\nnumber line above?","opts":{"A":"|x| \u2264 3","B":"|x| \u2264 5","C":"|x \u2013 2| \u2264 3","D":"|x \u2013 1| \u2264 4","E":"|x + 1| \u2264 4"},"ans":"E","exp":"The number line above shows\n. To turn this into absolute value notation, as all the\nchoices are written, the numbers need to be opposite signs of the same value.\nSince the distance between \u22125 and 3 is 8 (3 \u2013 (\u20135) = 8), that distance needs to be split in 2. It cannot be \u22121 because \u22121 is\ngreater than \u22121.6. The greatest integer that is less than or equal to 3.4 is 3. It cannot be 4\nbecause 4 is greater than 3.4. The greatest integer that is less than or equal to 2.7 is 2. It\ncannot be 3 because 3 is greater than 2.7. Therefore,\n= \u22122 + 3 + 2 = 3.\nThe correct answer is A."},{"n":228,"s":"Quan","t":"Problem Solving","d":"H","topic":"Arithmetic Operations on Rational Numbers","q":"In the first week of the year, Nancy saved $1. In each of the next 51 weeks, she saved $1 more\nthan she had saved in the previous week. What was the total amount that Nancy saved during\nthe 52 weeks?","opts":{"A":"$1,326","B":"$1,352","C":"$1,378","D":"$2,652","E":"$2,756"},"ans":"C","exp":"In dollars, the total amount saved is the sum of 1, (1 + 1), (1 + 1 + 1), and so on, up to and\nincluding the amount saved in the 52nd week, which was $52. Therefore, the total amount\nsaved in dollars was 1 + 2 + 3 + \u2026 + 50 + 51 + 52. This sum can be easily evaluated by\ngrouping the terms as (1 + 52) + (2 + 51) + (3 + 50) + \u2026 + (26 + 27), which results in the\nnumber 53 added to itself 26 times. Therefore, the sum is (26)(53) = 1,378.\n\n\f\nAlternatively, the formula for the sum of the first n positive integers is\nthe sum of the first 52 positive integers is\n\n. Therefore,\n\n.\n\nThe correct answer is C."},{"n":229,"s":"Quan","t":"Problem Solving","d":"H","topic":"Algebra Simplifying Algebraic Expressions","q":"In a certain sequence, the term xn is given by the formula\n\nfor all n \u2265 2. If\n\nx0 = 3 and x1 = 2, what is the value of x3?","opts":{"A":"2.5","B":"3.125","C":"4","D":"5","E":"6.75"},"ans":"C","exp":"Given the formula\n\nwith x0 = 3 and x1 = 2, then\n\n=\n=\n\n=\n\n=\n=\n\n= 5\u20131\n=4\nThe correct answer is C."},{"n":230,"s":"Quan","t":"Problem Solving","d":"H","topic":"Algebra Applied Problems","q":"During a trip, Francine traveled x percent of the total distance at an average speed of 40 miles\nper hour and the rest of the distance at an average speed of 60 miles per hour. In terms of x,\nwhat was Francine\u2019s average speed for the entire trip?\nA.\nB.\nC.\nD.\nE.","opts":{},"ans":"E","exp":"Assume for simplicity that the total distance of Francine\u2019s trip is 100 miles. Then the following\ntable gives all of the pertinent information.\nDistance Rate\n\nx\n\n40\n\n100 \u2013 x\n\n60\n\nThe total time for Francine\u2019s trip is\n=\n\n=\n\n=\n\n=\n\nFrancine\u2019s average speed over the entire trip is\n\n.\n\nThe correct answer is E."},{"n":231,"s":"Quan","t":"Problem Solving","d":"H","topic":"Arithmetic Properties of Numbers","q":"If n = (33)43 + (43)33, what is the units digit of n?","opts":{"A":"0","B":"2","C":"4","D":"6","E":"8"},"ans":"A","exp":"When a polynomial is raised to a power, the last term in the expression is the last term of the\npolynomial raised to that power. For example, (a + b)2 = a2 + 2ab + b2. We can think of 33 as\nthe binomial 10 \u00b7 3 + 3 whose last term is the units digit 3. Thus, the units digit of 332 is\n32 = 9. Similarly, for 333 we have 33 = 27, so the units digit of 333 is 7. The patterns for\npowers of 33 and 43 are shown in the following table.\n\n\f\npower of 33 units digit\n\npower of units\n43\ndigit\n\n331\n\n3\n\n431\n\n3\n\n332\n\n9\n\n432\n\n9\n\n333\n\n7\n\n433\n\n7\n\n334\n\n1\n\n434\n\n1\n\n335\n\n3\n\n435\n\n3\n\n336\n\n9\n\n436\n\n9\n\n337\n\n7\n\n437\n\n7\n\n338\n\n1\n\n438\n\n1\n\n3332\n\n1\n\n4332\n\n1\n\n3333\n\n3\n\n4333\n\n3\n\n3340\n\n1\n\n3341\n\n3\n\n3342\n\n9\n\n3343\n\n7\n\nFrom the table above, the units digit of 343 is 7 and the units digit of 4333 is 3. Since\n7 + 3 = 10, the units digit of 3343 + 4333 is 0.\nThe correct answer is A."},{"n":232,"s":"Quan","t":"Problem Solving","d":"H","topic":"Arithmetic Elementary Combinatorics","q":"Team A and Team B are competing against each other in a game of tug-of-war. Team A,\nconsisting of 3 males and 3 females, decides to line up male, female, male, female, male,\nfemale. The lineup that Team A chooses will be one of how many different possible lineups?\nA.\n\n9","opts":{},"ans":"D","exp":"Any of the 3 males can be first in the line, and any of the 3 females can be second. Either of\nthe 2 remaining males can be next, followed by either of the 2 remaining females. The last\n2 places in the line are filled with the only male left followed by the only female left. By the\nmultiplication principle, there are 3 \u00d7 3 \u00d7 2 \u00d7 2 \u00d7 1 \u00d7 1 = 36 different lineups possible.\nThe correct answer is D."},{"n":233,"s":"Quan","t":"Problem Solving","d":"H","topic":"Arithmetic Operations on Rational Numbers","q":"If\n\nis expressed as a terminating decimal, how many nonzero digits will d have?","opts":{"A":"One","B":"Two","C":"Three","D":"Seven","E":"Ten"},"ans":"B","exp":"It will be helpful to use the fact that a factor that is an integer power of 10 has no effect on the\nnumber of nonzero digits a terminating decimal has.\n\nThe correct answer is B."},{"n":234,"s":"Quan","t":"Problem Solving","d":"H","topic":"Algebra Simplifying Expressions; Arithmetic Computation with Integers","q":"For any positive integer n, the sum of the first n positive integers equals\n\n. What is the\n\nsum of all the even integers between 99 and 301?","opts":{"A":"10,100","B":"20,200","C":"22,650","D":"40,200","E":"45,150"},"ans":"B","exp":"Note: The following approach does not rely on the given formula.\nTo determine how many integers are to be summed, consider the following:\n5 even integers have 10 as their first two digits, namely 100, 102, 104, 106, 108; 5 even\nintegers have 11 as their first two digits, namely 110, 112, 114, 116, 118;\n5 even integers have 28 as their first two digits, namely 280, 282, 284, 286, 288;\n5 even integers have 29 as their first two digits, namely 290, 292, 294, 296, 298.\nThe first two digits range from 10 through 29, so there are 29 \u2013 10 + 1 = 20 such pairs of two\ndigits. Thus, there are 20(5) = 100 even integers between 100 and 298. Including 300, there\nare 101 even integers between 99 and 301.\nThese even integers are listed below.\n1st 2nd 3rd 4th \u2026 50th 51st 52nd \u2026 98th 99th 100th 101st\n100 102 104 106 \u2026 198 200 202 \u2026 294 296 298\n\n300\n\nTo sum, pair the integers\n\nAlternatively, let S represent the sum. Then,\nS = 100 + 102 + 104 + \u2026 + 296 + 298 + 300 next, rewrite the sum\nS = 300 + 298 + 296 + \u2026 + 104 + 102 + 100 then add the two equations\n2S = 400 + 400 + 400 + \u2026 + 400 + 400 + 400 now divide by 2\nS = 200 + 200 + 200 + \u2026 + 200 + 200 + 200 there are 101 terms in S, so\nS = 101(200) = 20,20"},{"n":235,"s":"Quan","t":"Problem Solving","d":"H","topic":"Arithmetic Operations with Integers","q":"November 16, 2001, was a Friday. If each of the years 2004, 2008, and 2012 had 366 days,\nand the remaining years from 2001 through 2014 had 365 days, what day of the week was\nNovember 16, 2014?","opts":{"A":"Sunday","B":"Monday","C":"Tuesday","D":"Wednesday","E":"Thursday"},"ans":"A","exp":"The number of days between November 16, 2001, and November 16, 2014, is 10(365) +\n3(366) = 4,748 and, because 4,748 = 7(678) + 2, it follows that 4,748 days is 678 weeks plus\n2 days. Then, 678 weeks from Friday, November 16, 2001, is Friday, November 14, 2014, and\n2 days from Friday, November 14, 2014, is Sunday, November 16, 2014.\nThe correct answer is A."},{"n":236,"s":"Quan","t":"Problem Solving","d":"H","topic":"Arithmetic Rate","q":"How many prime numbers between 1 and 100 are factors of 7,150?","opts":{"A":"One","B":"Two","C":"Three","D":"Four","E":"Five"},"ans":"D","exp":"To find the number of prime numbers between 1 and 100 that are factors of 7,150, find the\nprime factorization of 7,150 using a method similar to the following:\n\nThus, 7,150 has four prime factors: 2, 5, 11, and 13.\nThe correct answer is D."},{"n":237,"s":"Quan","t":"Problem Solving","d":"H","topic":"Algebra Sequences","q":"A sequence of numbers a1, a2, a3, \u2026 is defined as follows: a1 = 3, a2 = 5, and every term in the\nsequence after a2 is the product of all terms in the sequence preceding it, e.g., a3 = (a1)(a2)\nand a4 = (a1)(a2)(a3). If an = t and n > 2, what is the value of an + 2 in terms of t?","opts":{"A":"4t","B":"t2"},"ans":"D","exp":"It is given that an = (a1)(a2) \u2026 (an \u2013 1) and an = t. Therefore, an + 1 = (a1)(a2) \u2026 (an \u2013 1)\n(an) = (an)(an) = t2 and an + 2 = (a1)(a2) \u2026 (an)(an + 1) = (an + 1)(an + 1) = (t2)(t2) = t4.\nThe correct answer is D."},{"n":238,"s":"Quan","t":"Problem Solving","d":"H","topic":"Algebra Percents","q":"Last year the price per share of Stock X increased by k percent and the earnings per share of\nStock X increased by m percent, where k is greater than m. By what percent did the ratio of\nprice per share to earnings per share increase, in terms of k and m?\nA.\nB. (k \u2013 m)%\nC.\nD.\nE.","opts":{"B":"(k \u2013 m)%"},"ans":"D","exp":"Although this problem can be solved algebraically, the answer can also be identified by\nchoosing numerical values for the variables, calculating the percent increase in the ratio, and\ncomparing the result with the corresponding numerical values of the answer choices. To this\nend, let the original price per share be $1,000 and earnings per share be $200, where k = 10\nand m = 5. Note that k > m for these values.\nBefore increase After increase\nprice\n\n$1,000\n\nearnings $200\n\n1.1($1,000) = $1,100\n1.05($200) = $210\n\n=5\nTherefore, the percent increase in the ratio of price per share to earnings per share is\n\nNow substitute k = 10 and m = 5 into the answer choices to determine which answer choice\ngives\n\n.\n\nA.\n\nNO\n\nB. (10 \u2013 5)% NO\nC.\n\nNO\n\nD.\n\nYES\n\nE.\n\nNO\n\nThe correct answer is D."},{"n":239,"s":"Quan","t":"Problem Solving","d":"H","topic":"Arithmetic Applied Problems","q":"Of the 300 subjects who participated in an experiment using virtual-reality therapy to reduce\ntheir fear of heights, 40 percent experienced sweaty palms, 30 percent experienced vomiting,\nand 75 percent experienced dizziness. If all of the subjects experienced at least one of these\neffects and 35 percent of the subjects experienced exactly two of these effects, how many of\nthe subjects experienced only one of these effects?","opts":{"A":"105","B":"125","C":"130","D":"180","E":"195"},"ans":"D","exp":"Let a be the number who experienced only one of the effects, b be the number who\nexperienced exactly two of the effects, and c be the number who experienced all three of the\neffects. Then a + b + c = 300, since each of the 300 participants experienced at least one of the\neffects. From the given information, b = 105 (35% of 300), which gives a + 105 + c = 300, or a\n+ c = 195 (Equation 1). Also, if the number who experienced sweaty palms (40% of 300, or\n120) is added to the number who experienced vomiting (30% of 300, or 90), and this sum is\nadded to the number who experienced dizziness (75% of 300, or 225), then each participant\nwho experienced only one of the effects is counted exactly once, each participant who\nexperienced exactly two of the effects is counted exactly twice, and each participant who\nexperienced all three of the effects is counted exactly 3 times. Therefore, a + 2b + 3c = 120 +\n90 + 225 = 435. Using b = 105, it follows that a + 2(105) + 3c = 435, or a + 3c = 225\n(Equation 2). Then, solving the system defined by Equation 1 and Equation 2,\n\n\u22122a = \u2212360, or a = 180\nThe correct answer is D."},{"n":240,"s":"Quan","t":"Problem Solving","d":"H","topic":"Arithmetic Negative Exponents","q":"If\n\n, then\n\nis equal to\n\nA.\nB.\nC.\nD.\nE.","opts":{},"ans":"D","exp":"Using rules of exponents,\n\n, and since\n\n.\n\nThe correct answer is D."},{"n":241,"s":"Quan","t":"Problem Solving","d":"H","topic":"Arithmetic Percents","q":"A photography dealer ordered 60 Model X cameras to be sold for $250 each, which\nrepresents a 20 percent marku ercent have a swimming pool. If 5 of the houses have all three of\nthese amenities and 5 have none of them, how many of the houses have exactly two of these\namenities?","opts":{"A":"10","B":"45","C":"50","D":"55","E":"65"},"ans":"D","exp":"Since 60% of the 150 houses have air-conditioning, b + c + d + 5 = 0.6(150) = 90, so\nb + c + d = 85 (i). Similarly, since 50% have a sunporch, a + b + f + 5 = 0.5(150) = 75, so\na + b + f = 70 (ii). Likewise, since 30% have a swimming pool, d + e + f + 5 = 0.3(150) = 45, so\nd + e + f = 40 (iii). Adding equations (i), (ii), and (iii) gives\n(b + c + d) + (a + b + f) + (d + e + f) = 195, or a + 2b + c + 2d + e + 2f = 195 (iv). But\na + b + c + d + e + f + 5 + 5 = 150, or a + b + c + d + e + f = 140 (v). Subtracting equation (v)\nfrom equation (iv) gives b + d + f = 55, so 55 houses have exactly two of the amenities.\nThe correct answer is D."},{"n":259,"s":"Quan","t":"Problem Solving","d":"H","topic":"Arithmetic Negative Exponents","q":"The value of\n\nis how many times the value of\n\n?\n\nA.\nB.\nC. 3\nD. 4\nE. 5","opts":{"C":"3","D":"4","E":"5"},"ans":"C","exp":"If the value of\n\nis x times the value of\n\n, then\n\nThe correct answer is C."},{"n":260,"s":"Quan","t":"Problem Solving","d":"H","topic":"Arithmetic Fractions; Decimals","q":"Which of the following fractions has a decimal equivalent that is a terminating decimal?\nA.\nB.\nC.\nD.\nE.","opts":{},"ans":"E","exp":"Since the denominator of\n\n, which is 128, has only factors of 2, and\n\nshows that\n\n, the following\n\nhas a terminating decimal.\n\nMoreover, the fact that each of the other answer choices, when expanded in this way, involves\nat least one factor of\nand/or\n, neither of which has a\nterminating decimal expansion, suggests that none of the other answer choices has a\nterminating decimal.\ndenominator\n\nprime factors\n\n189\n\n3 and 7\n\n196\n\n2 and 7\n\n225\n\n3 and 5\n\n144\n\n2 and 3\n\n128\n\nonly 2\n\nIn fact, it can be proved that a fraction (nume , and III"},"ans":"D","exp":"The table shows, for each of the possible number of defects in the sixth car (shown in bold),\nthe list of the number of defects in the first six cars in ascending order, the mean of this list,\nand the median of this list. For example, if the sixth car has 7 defects, then the list of the\nnumber of defects in ascending order is 4, 6, 7, 7, 9, 10; the mean of this list is the sum of\nthese numbers divided by 6, or\n, which is approximately 7.2; and the median of this list\nwhen in ascending order is the average of the 3rd and 4th numbers in this list, which is 7. For\nthis example, the mean is NOT equal to the median.\nlist of the number of defects mean\n\nmedian\n\n3, 4, 6, 7, 9, 10\n\n6.5\n\n4, 6, 7, 7, 9, 10\n\n7\n\n4, 6, 7, 9, 10, 12\n\n8\n\nFrom the table it follows that the mean equals the median ONLY when the number of defects\nin the sixth car is 3 or 12.\nThe correct answer is D."},{"n":266,"s":"Quan","t":"Problem Solving","d":"H","topic":"Algebra Applied Problems; First-Degree Equations","q":"A furniture dealer purchased a desk for $150 and then set the selling price equal to the\npurchase price plus a markup that was 40 percent of the selling price. If the dealer sold the\ndesk at the selling price, what was the amount of the dealer\u2019s gross profit from the purchase\nand the sale of the desk?","opts":{"A":"$40"},"ans":"E","exp":"Let S be the selling price in dollars. From the first sentence of the problem, we have S = 150 +\n0.4S. Thus, 0.6S = 150 and S =\n\n= 250. Therefore, the selling price was $250, and hence the\n\ngross profit was $250 \u2212 $150 = $100.\nThe correct answer is E."},{"n":267,"s":"Quan","t":"Problem Solving","d":"H","topic":"Arithmetic Properties of Integers","q":"How many odd numbers between 10 and 1,000 are the squares of integers?","opts":{"A":"12","B":"13","C":"14","D":"15","E":"16"},"ans":"C","exp":"A quick way to determine which squares of integers are less than 1,000 is to observe that 302\n= 900 (easily done mentally) is relatively close to 1,000 and then, since odd numbers that are\nthe squares of integers correspond exactly to the squares of odd numbers, consider the\nsquares of odd numbers beginning with 3. This leads to the following list:\n32 = 9, 52 = 25, \u2026, 312 = 961, 332 = 1,089\nIt follows that the odd numbers between 10 and 1,000 that are the squares of integers are 52,\n72, 92, \u2026, 312. By a direct count one finds that there are 14 squares of integers in this list. A\ndirect count can be avoided by using the computation\n\n+ 1.\n\nThe correct answer is C."},{"n":268,"s":"Quan","t":"Problem Solving","d":"H","topic":"Algebra Applied Problems","q":"Three grades of milk are 1 percent, 2 percent, and 3 percent fat by volume. If x gallons of the\n1 percent grade, y gallons of the 2 percent grade, and z gallons of the 3 percent grade are\nmixed to give x + y + z gallons of a 1.5 percent grade, what is x in terms of y and z?","opts":{"A":"y + 3z","C":"2y + 3z","D":"3y + z","E":"3y + 4.5z"},"ans":"A","exp":"Since the milk, when mixed, is 1.5 percent fat, the number of gallons of fat in the mixed milk is\n0.015(x + y + z). This is also equal to the sum of the numbers of gallons of fat in the three\ngrades of milk before they are mixed, which is 0.01x + 0.02y + 0.03z, so\n0.015(x + y + z) = 0.01x + 0.02y + 0.03z.\nMultiplying both sides by 1,000 (to remove the decimal fractions) and expanding the left side\ngives\n15x + 15y + 15z = 10x + 20y + 30z.\nTo solve for x, isolate the terms involving x on one side, combine like terms, and divide by the\ncoefficient of x.\n\n\f\n15x \u2212 10x = 20y \u2212 15y + 30z \u2212 15z\n5x = 5y + 15z\nx = y + 3z\nThe correct answer is A."},{"n":269,"s":"Quan","t":"Problem Solving","d":"H","topic":"Arithmetic Elementary Combinatorics","q":"There are 8 books on a shelf, of which 2 are paperbacks and 6 are hardbacks. How many\npossible selections of 4 books from this shelf include at least one paperback?","opts":{"A":"40","B":"45","C":"50","D":"55","E":"60"},"ans":"D","exp":"The number of possible selections of 4 books that have at least 1 paperback is the number of\npossible selections of 4 books having 1 paperback and 3 hardbacks added to the number of\npossible selections of 4 books having 2 paperbacks and 2 hardbacks. In the case of 1\npaperback and 3 hardbacks, this will be the number of combinations of 2 objects taken 1 at a\ntime (i.e., the number of ways to choose the paperback) multiplied by the number of\ncombinations of 6 objects taken 3 at a time (i.e., the number of ways to choose the hardbacks),\nwhich is equal to\n\n.\n\nSimilarly, the analogous calculation for the number of possible selections of having 2\npaperbacks and 2 hardbacks is\n\n.\n\nThus, the number of possible selections of 4 books that have at least 1 paperback is 40 + 15 =\n55.\nAlternatively, determine the number of possible selections of 4 books that do NOT include at\nleast 1 paperback and then subtract this number from the number of possible selections of 4\nbooks without regard to how many are paperback. The number of possible selections of 4\nbooks that do NOT include at least 1 paperback (i.e., the number of ways to choose 4\nhardback books from the 6 hardback books) is the number of co"},{"n":270,"s":"Quan","t":"Problem Solving","d":"H","topic":"Arithmetic Estimation; Operations on Radical Expressions","q":"If\n\n, then the value of M is","opts":{"A":"less than 3","B":"equal to 3","C":"between 3 and 4","D":"equal to 4","E":"greater than 4"},"ans":"E","exp":"Note that\ntrue. Similarly,\n\n. Also,\nbecause if\n. Therefore,\n\nthen\n, or 4 \u2264 1, which is not\n> 2 + 1 + 1 = 4.\n\nThe correct answer is E."},{"n":271,"s":"Quan","t":"Problem Solving","d":"H","topic":"Algebra Series and Sequences; First-Degree Equations","q":"When a certain tree was first planted, it was 4 feet tall, and the height of the tree increased by\na constant amount each year for the next 6 years. At the end of the 6th year, the tree was\ntaller than it was at the end of the 4th year. By how many feet did the height of the tree\nincrease each year?\nA.","opts":{},"ans":"D","exp":"Let H be the constant amount, in feet, that the height of the tree increased each of the 6 years\nafter the tree was planted. Since the height of the tree when planted was 4 feet, its height at\nthe end of the 4th year was (4 + 4H) feet and its height at the end of the 6th year was (4 + 6H)\nfeet. We are given that its height at the end of the 6th year was\n\ngreater than its height at the\n\nend of the 4th year.\n4 + 6H = (4 + 4H)+\n4 + 6H =\n6H =\n\n(4 + 4H)\n+\n\n+\nH=\n\nH\nH\n\ngiven\ndistributive property, collect like terms\n\nsubtract\n\nfrom both sides\n\nsubtract\n\nfrom both sides\n\ndivide both sides by\nAlternatively, fractions can be mostly avoided by recognizing that\n\ngreater is equivalent to\n\n20% greater.\n\n\f\n4 + 6H = 1.2(4 + 4H)\n\ngiven\n\n4 + 6H = 4.8 + 4.8H\n\ndistributive property\n\n6H = 0.8 + 4.8H\n1.2H = 0.8\n\nsubtract 4 from both sides\nsubtract 4.8H from both sides\ndivide both sides by 1.2\n\nTherefore, the height of the tree increased by\n\nfeet each year.\n\nThe correct answer is D."},{"n":272,"s":"Data","t":"Data Sufficiency","d":"E","topic":"Arithmetic","q":"What is the number of pages of a certain journal article?\n1. The size of each page is\n\ninches by 8 inches.\n\n2. The average (arithmetic mean) number of words per page is 250.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"E","exp":"1. Given that each page is 5 inches by 8 inches, any positive integer can be the number of\npages of the journal article. For example, it is possible that the journal article consists of\n10 pages, each 5 inches by 8 inches. However, it is also possible that the journal article\nconsists of 20 pages, each 5 inches by 8 inches. Therefore, the number of pages cannot\nbe determined; NOT sufficient.\n2. Given that the average number of words per page is 250, any positive integer can be the\nnumber of pages of the journal article. For example, it is possible that the journal article\nconsists of 10 pages and contains a total of 10(250) = 2,500 words, and in this case the\naverage number of words per page is\n\n= 250. However, it is also possible that the\n\njournal article consists of 20 pages and contains a total of 20(250) = 5,000 words, and in\nthis case the average number of words per page is also\n\n= 250. Therefore, the\n\nnumber of pages cannot be determined; NOT sufficient.\nTaking (1) and (2) together, it is still not possible to determine the number of pages because\neach of the examples used above satisfies both (1) and (2).\nThe correct answer is E; both statements together are still not suffic"},{"n":273,"s":"Data","t":"Data Sufficiency","d":"E","topic":"Arithmetic Ratio and Proportion","q":"If a certain vase contains only roses and tulips, how many tulips are there in the vase?\n1. The number of roses in the vase is 4 times the number of tulips in the vase.\n2. There is a total of 20 flowers in the vase.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"C","exp":"The task is to determine the number of tulips in the vase.\n1. This says that for every tulip in the vase, there are 4 roses, so the ratio of roses to tulips\nis 4:1. Because there could be 4 roses and 1 tulip or there could be 20 roses and 5 tulips,\nthe number of tulips cannot be uniquely determined; NOT sufficient.\n2. This says the total number of roses and tulips in the vase is 20. Because there could be\n10 roses and 10 tulips or there could be 15 roses and 5 tulips, the number of tulips\ncannot be uniquely determined; NOT sufficient.\nFrom (1), the ratio of roses to tulips is 4:1 so\n\nof the flowers in the vase are tulips. From (2),\n\nthere are 20 flowers in the vase. So, taking (1) and (2) together, the number of tulips in the\nvase is\n\n= 4.\n\nThe correct answer is C; both statements together are sufficient."},{"n":274,"s":"Data","t":"Data Sufficiency","d":"E","topic":"Arithmetic Applied Problems","q":"The cost of 10 pounds of apples and 2 pounds of grapes was $12. What was the cost per\npound of apples?\n1. The cost per pound of grapes was $2.\n2. The cost of 2 pounds of apples was less than the cost of 1 pound of grapes.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"A","exp":"Determine the cost per pound of apples.\n1. The cost per pound of grapes was $2. The cost of 2 pounds of grapes was 2($2) = $4. The\ncost of the 10 pounds of apples was $12 \u2013 $4 = $8. The cost per pound of the apples was\n= $0.80; SUFFICIENT.\n2. Intuitively, since (2) involves an inequality, it seems as if it wouldn\u2019t give enough\ninformation to determine the unique cost per pound of apples. A good strategy might be\nto guess multiple values for the costs per pound of apples and grapes that satisfy the\ncondition given in the problem (the cost of 10 pounds of apples and 2 pounds of grapes\nis $12) and look for values that also meet the condition in (2), namely that the cost of\n2 pounds of apples is less than the cost of 1 pound of grapes. For example:\n\n\f\nCost Cost\nIs the cost of 2\nTotal cost of 10\nper\nper\nIs total pounds of apples\npounds of apples\npound pound\ncost less than the cost\nand 2 pounds of\nof\nof\n$12?\nof 1 pound of\ngrapes, in dollars\napples grapes\ngrapes?\n$1\n\n$1\n\n10(1) + 2(1)\n\nyes\n\nNo, 2(1)\n\n1\n\n$0.50 $3.50\n\n10(0.5) + 2(3.5)\n\nyes\n\nYes, 2(0.50) < 3.50\n\n$0.60 $3.00\n\n10(0.6) + 2(3)\n\nyes\n\nYes, 2(0.60) < 3.00\n\nAs shown in the table, the cost per pound of apples could be $0.50 or $0.60, "},{"n":275,"s":"Data","t":"Data Sufficiency","d":"E","topic":"Arithmetic Statistics","q":"What was the median annual salary for the employees at Company X last year?","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"E","exp":"1. Given that there were 29 employees, the median salary is the 15th salary in a list of\n29 positive numbers, but we cannot determine the value of any of the numbers; NOT\nsufficient.\n2. Given that 12 employees had an annual salary of $24,000, the median salary is the\nmedian of a list of 12 or more positive numbers, of which 12 are equal to $24,000. If\nthere were only 12 employees, then the median salary would be $24,000. However, if\nthere were more than 2(12) = 24 employees and all but 12 of the employees had an\nannual salary of $30,000, then the median salary would be $30,000; NOT sufficient.\nTaking (1) and (2) together, if 12 employees had an annual salary of $24,000 and the\nremaining 17 employees had an annual salary of $20,000, then the median salary would be\n$20,000. However, if 12 employees had an annual salary of $24,000 and the remaining\n17 employees had an annual salary of $30,000, then the median salary would be $30,000.\nTip: If more than half the numbers in a list of numbers have the same value, then the median\nof the list will be that value, regardless of the values of the remaining numbers.\nThe correct answer is E; both statements together are still not sufficient."},{"n":276,"s":"Data","t":"Data Sufficiency","d":"E","topic":"Arithmetic Ratio and Proportion","q":"How many basic units of Currency X are equivalent to 250 basic units of Currency Y?\n1. 100 basic units of Currency X are equivalent to 625 basic units of Currency Y.\n2. 2,000 basic units of Currency X are equivalent to 12,500 basic units of Currency Y.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"D","exp":"1. The equivalency of 100 basic units of Currency X and 625 basic units of Currency Y\nmeans that 1 basic unit of Currency Y is equivalent to\n\nbasic units of Currency X.\n\n\f\nTherefore, 250 basic units of Currency Y are equivalent to (250)\n\nbasic units of\n\nCurrency X; SUFFICIENT.\n2. The equivalency of 2,000 basic units of Currency X and 12,500 basic units of Currency Y\nmeans that 1 basic unit of Currency Y is equivalent to\n\nbasic units of Currency X.\n\nTherefore, 250 basic units of Currency Y are equivalent to (250)\n\nbasic units of\n\nCurrency X; SUFFICIENT.\nTip: For Data Insights questions in which the task is to determine a specific value, there is no\nneed to perform calculations to get the value in its simplest form. The goal is to determine\nwhether the value can be uniquely determined, not to find the actual value in its simplest\nform.\nThe correct answer is D; each statement alone is sufficient."},{"n":277,"s":"Data","t":"Data Sufficiency","d":"E","topic":"Algebra Simultaneous Equations","q":"A company bought 3 printers and 1 scanner. What was the price of the scanner?\n1. The total price of the printers and the scanner was $1,300.\n2. The price of each printer was 4 times the price of the scanner.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"C","exp":"Let P1, P2, and P3 be the prices, in dollars, of the 3 printers and let S be the price, in dollars, of\nthe scanner. What is the value of S?\n1. Given that P1 + P2 + P3 + S = 1,300, it is clear that the value of S cannot be determined;\nNOT sufficient.\n2. Given that P1 = P2 = P3 = 4S, it is possible that P1 = P2 = P3 = 400 and S = 100. On the\nother hand, it is also possible that P1 = P2 = P3 = 800 and S = 200; NOT sufficient.\nTaking (1) and (2) together, substituting P1 = 4S, P2 = 4S, and P3 = 4S into P1 + P2 + P3 + S =\n1,300 gives 4S + 4S + 4S + S = 1,300, or 13S = 1,300, and therefore S = 100.\nThe correct answer is C; both statements together are sufficient."},{"n":278,"s":"Data","t":"Data Sufficiency","d":"E","topic":"Arithmetic Ratio and Proportion","q":"Each of the 256 solid-colored marbles in a box is either blue, green, or purple. What is the\nratio of the number of blue marbles to the number of purple marbles in the box?\n1. The number of green marbles in the box is 4 times the number of blue marbles in the\nbox.\n2. There are 192 green marbles in the box.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"C","exp":"Let B, G, and P be the numbers of marbles, respectively, that are blue, green, and purple. From\nthe given information, it follows that B + G + P = 256. What is the value of\n1. Given that G = 4B, it is possible that\npossible that\n\n?\n\n(choose B = 1, G = 4, and P = 251), and it is\n\n(choose B = 2, G = 8, and P = 246); NOT sufficient.\n\n\f\n2. Given that G = 192, it is possible that\nis possible that\n\n(choose B = 1, G = 192, and P = 63), and it\n\n(choose B = 2, G = 192, and P = 62); NOT sufficient.\n\nTaking (1) and (2) together, it follows from G = 4B and G = 192 that 192 = 4B, or B = 48. Thus,\nB + G + P = 256 becomes 48 + 192 + P = 256, and so P = 256 \u2013 48 \u2013 192 = 16. Therefore,\n.\nThe correct answer is C; both statements together are sufficient."},{"n":279,"s":"Data","t":"Data Sufficiency","d":"E","topic":"Arithmetic Ratios","q":"A certain mixture of paint requires blue, yellow, and red paints in ratios of 2:3:1, respectively,\nand no other ingredients. If there are ample quantities of the blue and red paints available, is\nthere enough of the yellow paint available to make the desired amount of the mixture?\n1. Exactly 20 quarts of the mixture are needed.\n2. Exactly 10 quarts of the yellow paint are available.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"C","exp":"Given that the mixture requires blue paint, yellow paint, and red paint in the ratios 2:3:1, it\nfollows that\n\nof the mixture will be yellow paint. Determining whether there\n\nis enough yellow paint available depends on how much of the mixture is needed and how\nmuch yellow paint is available.\n1. This indicates that exactly 20 quarts of the paint mixture are needed, so\n\n=\n\n10 quarts of yellow paint are needed. However, there is no information about how much\nyellow paint is available; NOT sufficient.\n2. This indicates that exactly 10 quarts of yellow paint are available, but there is no\ninformation about how much of the mixture or how much yellow paint is needed; NOT\nsufficient.\nTaking (1) and (2) together, 10 quarts of yellow paint are needed, and 10 quarts are available.\nThe correct answer is C; both statements together are sufficient."},{"n":280,"s":"Data","t":"Data Sufficiency","d":"E","topic":"Arithmetic Statistics","q":"There are 2 groups of students who took a history test. Was the average (arithmetic mean)\nscore of the students in Group A higher than the average score of the students in Group B\nwho took the test?\n1. Of the students who took the test, 10 were in Group A and 12 were in Group B.\n2. On the test, the highest score achieved was achieved by a Group B student, and the lowest\nscore achieved was achieved by a Group A student.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"E","exp":"1. Given that 10 of the scores were by students in Group A and 12 of the scores were by\nstudents in Group B, the following table shows two possibilities.\n\n\f\nA\nscores\n\nB scores\n\nA\nB\nA average >\naverage average B average?\n\n10 scores of 8 12 scores of 1\n\n8\n\n1\n\nyes\n\n10 scores of 1 12 scores of 8\n\n1\n\n8\n\nno\n\nTherefore, it is not possible to determine whether the average score of the students in\nGroup A is higher than the average score of the students in Group B; NOT sufficient.\n2. Given that the highest score was achieved by a Group B student and the lowest score was\nachieved by a Group A student, the following table shows two possibilities.\nA\nB\nA\nB\nA average >\nscores scores average average B average?\n1, 7, 7 2, 2, 8\n\n5\n\n4\n\nyes\n\n1, 1, 1 8, 8, 8\n\n1\n\n8\n\nno\n\nTherefore, it is not possible to determine whether the average score of the students in\nGroup A is higher than the average score of the students in Group B; NOT sufficient.\nTaking (1) and (2) together, the table below shows that it is not possible to determine whether\nthe average score of the students in Group A is higher than the average score of the students\nin Group B.\nA scores\n\nB scores\n\nA\nB\nA average >\naverage average B average?\n\ns"},{"n":281,"s":"Data","t":"Data Sufficiency","d":"E","topic":"Algebra Order; Ratio","q":"The research funds of a certain company were divided among three departments, X, Y, and Z.\nWhich one of the three departments received the greatest proportion of the research funds?\n1. The research funds received by Departments X and Y were in the ratio 3 to 5,\nrespectively.\n2. The research funds received by Departments X and Z were in the ratio 2 to 1,\nrespectively.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"C","exp":"Let x, y, and z be the research funds, respectively, of Departments X, Y, and Z. Which of\n,\n\n, or\n\nis the greatest, or respectively, which of x, y, or z is the\n\ngreatest?\n1. Given that\n\nwhere x and y are positive, it follows that x < y. However, nothing is\n\nknown about z other than z is positive, so it cannot be determined which of x, y, or z is\nthe greatest; NOT sufficient.\n2. Given that\n\nwhere x and z are positive, it follows that z < x. However, nothing is\n\nknown about y other than y is positive, so it cannot be determined which of x, y, or z is\nthe greatest; NOT sufficient.\nTaking (1) and (2) together, it follows from (1) that x < y and it follows from (2) that z < x.\nTherefore, z < x < y, and y is the greatest.\nThe correct answer is C; both statements together are sufficient."},{"n":282,"s":"Data","t":"Data Sufficiency","d":"E","topic":"Arithmetic Statistics","q":"In a certain class, some students donated cans of food to a local food bank. What was the\naverage (arithmetic mean) number of cans donated per student in the class?\n1. The students donated a total of 56 cans of food.\n2. The total number of cans donated was 40 greater than the total number of students in\nthe class.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"C","exp":"Let s be the number of students and let c be the number of cans. What is the value of ?\n1. Given that c = 56, it is not possible to determine the value of because nothing is known\nabout the value of s other than s is a positive integer; NOT sufficient.\n2. Given that c = 40 + s, it is not possible to determine the value of . For example, if c = 40\nand s = 40, then\n1. However, if c = 80 and s = 40, then\n2; NOT sufficient.\nTaking (1) and (2) together, it follows that 40 + s = c = 56, or s = 56 \u2013 40 = 16. Therefore, c =\n56, s = 16, and\n\n.\n\nThe correct answer is C; both statements together are sufficient."},{"n":283,"s":"Data","t":"Data Sufficiency","d":"E","topic":"Arithmetic Statistics","q":"Each of the n employees at a certain company has a different annual salary. What is the\nmedian of the annual salaries of the n employees?\n1. When the annual salaries of the n employees are listed in increasing order, the median is\nthe 15th salary.\n2. The sum of the annual salaries of the n employees is $913,500.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"E","exp":"1. Given that the median is the 15th salary and all n salaries are different, it follows that\nthere are 14 salaries less than the 15th salary and 14 salaries greater than the 15th\nsalary, for a total of 29 employee salaries. However, there is no information about what\nany of the salaries actually are, so the median of the salaries cannot be determined; NOT\nsufficient.\n2. Given that the sum of the annual salaries is $913,500, the median salary cannot be\nuniquely determined. To determine more than one possible value for the median salary,\nuse common divisibility rules to find factors of $913,500.\nFor example, 913,500 is divisible by 5 because it ends in 0. Then, because\n913,500 = 5(182,700), there could be 5 salaries, each $182,700. But the salaries must be\nall different, so we need 5 different salaries that total $913,500. They could be the\nsalaries shown in the table below. Note that the pattern starts with the 3rd (middle)\nsalary of $182,700, and then the 2nd and 4th salaries are \u201cpaired\u201d in that one is\ndecreased and the other is increased by the same amount from $182,700. Likewise, for\nthe 1st and 5th salaries. The median is $182,700.\nSalary #\n\nSalary\n\n1\n\n$182,698\n\n2\n\n$182,699\n\n3"},{"n":284,"s":"Data","t":"Data Sufficiency","d":"E","topic":"Arithmetic Ratio and Proportion","q":"In a recent town election, what was the ratio of the number of votes in favor of a certain\nproposal to the number of votes against the proposal?\n1. There were 60 more votes in favor of the proposal than against the proposal.\n2. There were 240 votes in favor of the proposal.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"C","exp":"Let F be the number of votes in favor and let A be the number of votes against. What is the\nvalue of\n\n?\n\n1. Given that F = 60 + A, it is possible that\npossible that\n\n(choose F = 120 and A = 60) and it is\n\n(choose F = 90 and A = 30); NOT sufficient.\n\n2. Given that F = 240, it is possible that\npossible that\n\n(choose F = 240 and A = 240) and it is\n\n(choose F = 240 and A = 120); NOT sufficient.\n\nTaking (1) and (2) together, substitute F = 240 into F = 60 + A to get 240 = 60 + A, or A = 180.\nTherefore,\n\n.\n\nThe correct answer is C; both statements together are sufficient."},{"n":285,"s":"Data","t":"Data Sufficiency","d":"E","topic":"Arithmetic Applied Problems","q":"How many men are in a certain company\u2019s vanpool program?\n1. The ratio of men to women in the program is 3 to 2.\n2. The men and women in the program fill 6 vans.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"E","exp":"Let m be the number of men in the program and let w be the number of women in the\nprogram. What is the value of m?\n1. Given that\nw = 2, then\n\n, it is not possible to determine the value of m. For example, if m = 3 and\nis true; and if m = 6 and w = 4, then\n\nis true; NOT sufficient.\n\n2. Given that the men and women fill 6 vans, it is clearly not possible to determine the value\nof m; NOT sufficient.\nTaking (1) and (2) together, it is still not possible to determine the value of m. Even if it is\nassumed that each van has the same maximum capacity, it is possible that m = 18 and w = 12\n(a total of 30 people, which would fill 6 vans each having a capacity of 5 people), and it is\npossible that m = 36 and w = 24 (a total of 60 people, which would fill 6 vans each having a\ncapacity of 10 people).\nThe correct answer is E; both statements together are still not sufficient."},{"n":286,"s":"Data","t":"Data Sufficiency","d":"E","topic":"Arithmetic Probability","q":"Each of the marbles in a jar is either red or white or blue. If one marble is to be selected at\nrandom from the jar, what is the probability that the marble will be blue?\n1. There are a total of 24 marbles in the jar, 8 of which are red.\n2. The probability that the marble selected will be white is\n\n.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"C","exp":"This problem can be solved by determining the number of marbles in the jar and the number\nthat are blue.\n\n\f\n1. This indicates that there are 24 marbles in the jar and 8 of them are red. The number of\nmarbles that are blue is not known; NOT sufficient.\n2. This indicates neither the number of marbles in the jar nor the number that are blue;\nNOT sufficient.\nTaking (1) and (2) together, there are 24 marbles in the jar, 8 of which are red and\n\n(24) =\n\n12 of which are white. Then the number of blue marbles is 24 \u2212 8 \u2212 12 = 4, and the\nprobability that one marble selected at random will be blue is\n\n.\n\nThe correct answer is C; both statements together are sufficient."},{"n":287,"s":"Data","t":"Data Sufficiency","d":"E","topic":"Algebra Simultaneous Equations","q":"Last semester, Professor K taught two classes, A and B. Each student in Class A handed in 7\nassignments, and each student in Class B handed in 5 assignments. How many students were\nin Class A?\n1. The students in both classes combined handed in a total of 85 assignments.\n2. There were 10 students in Class B.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"C","exp":"Let a be the number of students in Class A and let b be the number of students in Class B.\nThen the students in Class A handed in a total of 7a assignments, and the students in Class B\nhanded in a total of 5b assignments. What is the value of a?\n1. Given that 7a + 5b = 85, it is not possible to determine the value of a. For example, it is\npossible that a = 5 and b = 10, since 7(5) + 5(10) = 85. On the other hand, it is also\npossible that a = 10 and b = 3, since 7(10) + 5(3) = 85; NOT sufficient.\n2. Given that b = 10, it is not possible to determine the value of a. For example, it is possible\nthat a = b = 10; and it is also possible that a = 5 and b = 10; NOT sufficient.\nTaking (1) and (2) together, substituting b = 10 into 7a + 5b = 85 gives 7a + 5(10) = 85, or 7a\n= 35, or a = 5.\nThe correct answer is C; both statements together are sufficient."},{"n":288,"s":"Data","t":"Data Sufficiency","d":"E","topic":"Arithmetic Applied Problems","q":"Was the amount of John\u2019s heating bill for February greater than it was for January?\n1. The ratio of the amount of John\u2019s heating bill for February to that for January was\n\n.\n\n2. The sum of the amounts of John\u2019s heating bills for January and February was $183.60.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"A","exp":"Let J and F be the amounts, respectively and in dollars, of the heating bills for January and\nFebruary. Is F > J?\n1. Given that\n\n, it follows that\n\n. Multiplying both sides of the inequality\n\nby the positive quantity J gives F > J; SUFFICIENT.\n2. Given that J + F = 183.60, it is not possible to determine whether F > J. For example, if J =\n83.60 and F = 100.00, then J + F = 183.60 and F > J. On the other hand, if J = 100.00 and F\n= 83.60, then J + F = 183.60 and F < J; NOT sufficient.\nThe correct answer is A; statement 1 alone is sufficient."},{"n":289,"s":"Data","t":"Data Sufficiency","d":"E","topic":"Algebra Applied Problems","q":"Machine R and Machine S work at their respective constant rates. How much time does it take\nMachine R, working alone, to complete a certain job?\n1. The amount of time that it takes Machine S, working alone, to complete the job is\n\nthe\n\namount of time that it takes Machine R, working alone, to complete the job.\n2. Machine R and Machine S, working together, take 12 minutes to complete the job.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"C","exp":"1. Given that Machine S takes\n\nas long as Machine R to complete the job, if the rate of each\n\nmachine were doubled, then Machine S would still take\n\nas long as Machine R to\n\ncomplete the job and Machine R, working alone, would then take half as long to complete\nthe job as compared to before the rates were doubled; NOT sufficient.\n2. Given that Machine R and Machine S, working together, take 12 minutes to complete the\njob, if Machine S is extremely slow and thus contributes very little when the machines are\nworking together, then it would take Machine R, working alone, only a little more than\n12 minutes to complete the job. However, if Machine S, working alone, takes only a few\nseconds less than 12 minutes to complete the job, and thus Machine R contributes very\nlittle when the machines are working together, then it would take Machine R, working\nalone, a long time to complete the job; NOT sufficient.\nTaking (1) and (2) together, let t be the time it takes for Machine R, working alone, to complete\nthe job. Then the time it takes Machine S, working alone, to complete the job is t. Thus, the\nindividual constant rates of Machines R and S are, respectively,\ncombined rate is\n\nand\n\n, and t"},{"n":290,"s":"Data","t":"Data Sufficiency","d":"E","topic":"Arithmetic Statistics","q":"What was the range of the selling prices of the 30 wallets sold by a certain store yesterday?\n1.\n\nof the wallets had a selling price of $24 each.\n\n2. The lowest selling price of the wallets was\n\nthe highest selling price of the wallets.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"E","exp":"Since the range of a d
