with the change of content would be evidence that the consultant\u2019s claim is\nincorrect. On the other hand, if the previous content had a negative effect on sales, then the\nnew content may simply have had less of a negative effect.\nThe best way to determine if radio advertising does not improve mattress sales is to eliminate\nradio advertising in both cities. Any change in sales may be attributed to the radio advertising,\nindicating whether the consultant\u2019s claim was correct. If there was no change, the consultant\u2019s\nclaim would be strongly supported.\nCity X:\nThe correct answer is Eliminate radio advertising.\nCity Z:\nThe correct answer is Eliminate radio advertising."},{"n":449,"s":"Data","t":"Two-Part Analysis","d":"H","topic":"Two-Part Analysis","q":"Metro Ballet Company presents high-quality productions of traditional, classical ballet. For the\npast several years, however, the company\u2019s overall profits have been declining, and ticket sales\nhave been flat. Annual audience surveys indicate that a majority of those who attend Metro\nBallet productions consistently enjoy the performances and prefer classical ballet to other\nforms of dance; almost all of them have been attending Metro Ballet for several years. General\nsurveys of area residents in","opts":{"note":"Select one answer per column. See book/online for full table."},"ans":"?","exp":"Strategize\nDecrease expenses:\nThis requires consideration of all the strategy options presented in the table to determine\nwhich one would lead most directly to decreasing expenses for Metro Ballet\u2019s classical ballet\nproductions. Obtaining public funding to double the spending on stage productions without\nincreasing ticket prices (the first option) would lead to an increase in expenses for ballet\nproductions, although those expenses should be offset by public funding. If expanding\nproductions to include modern, folk, and tap dance traditions (the third option) had the effect\nof decreasing period\nbeginning 13 May, and no more than 2 absences within any other 365-day period.\nIn the third option, the 4.5-hour absence on 19 March 2010 counts as a full day\u2019s absence and\nis not offset by the extra hour because it was not worked on the same day. Therefore, the\nemployee in the third option had exactly 3 unexcused absences in the 365-day period\nbeginning on 19 March 2010\u2013\u2013enough for a verbal warning, though not a written reprimand.\nIn the fourth option, the employee was absent between 10 minutes and 2 hours on"},{"n":451,"s":"Data","t":"Two-Part Analysis","d":"H","topic":"Two-Part Analysis","q":"Marketing strategist: Agency A designed an advertising campaign that our company is about\nto test with a focus group. We are wondering whether a new ad campaign will increase our\nname recognition among consumers. As a contingency, we have decided that we might ask\nAgency B to design an alternate campaign. However, if we find that Agency A\u2019s campaign elicits\npositive responses from the focus group, we will not ask Agency B for a campaign.\nA statement that must be true if the marketing strategist\u2019","opts":{"note":"Select one answer per column. See book/online for full table."},"ans":"?","exp":""},{"n":452,"s":"Data","t":"Two-Part Analysis","d":"H","topic":"Two-Part Analysis","q":"Francois and Pierre each owe Claudine money. Today, Francois will make a payment equal to\n50% of the amount he owes Claudine, and Pierre will make a payment equal to 10% of the\n\n\n\n\f23/06/2024, 22:24\n\namount he owes Claudine. Together, the two payments will be equal to 40% of the combined\namount that Francois and Pierre owe Claudine.\nSelect for Francois and Pierre amounts that Francois and Pierre could owe Claudine that are\njointly consistent with the given information. Make only two selections, ","opts":{"note":"Select one answer per column. See book/online for full table."},"ans":"?","exp":""},{"n":453,"s":"Data","t":"Two-Part Analysis","d":"H","topic":"Two-Part Analysis","q":"Witness testimony: Around 8:00 on the morning of Tuesday, July 6, I saw a man exit from the\nback entrance of the building. I knew it was McGregor by the man\u2019s height and his long,\nslightly awkward steps, and from the fact that he was wearing a hat\u2014possibly a baseball cap.\nMcGregor always seemed to be wearing some kind of hat. On Tuesdays there are always\nseveral groundskeepers scheduled to work on the grounds, and he would very likely have\nbeen scheduled that day.\nSelect Assumes to be true for t","opts":{"note":"Select one answer per column. See book/online for full table."},"ans":"?","exp":""},{"n":454,"s":"Data","t":"Two-Part Analysis","d":"H","topic":"Two-Part Analysis","q":"Ribonucleic acid (RNA) is a molecule built from sequences of smaller molecules called\nnucleobases. RNA nucleobases are of 4 different types: adenine (A), cytosine (C), guanine (G),\nand uracil (U). Consider the collection of all possible RNA sequences consisting of 12\nnucleobases, 3 of each type. An RNA sequence will be selected at random from this collection,\nand the first 3 nucleobases of the sequence will be detached from the sequence.\n\n\n\n\f23/06/2024, 22:24\n\nIn the table, select the probabilit","opts":{"note":"Select one answer per column. See book/online for full table."},"ans":"?","exp":""},{"n":455,"s":"Data","t":"Two-Part Analysis","d":"H","topic":"Two-Part Analysis","q":"Let S be the set of all 7-digit numbers N such that the sum of the digits of N is divisible by 7.\nA and B are two 7-digit numbers:\nA = 4,893,P12\nB = 5,857,0Q5\nSelect a value for P so that A is an element of S. Select a value for Q so that B is an element of\nS. Make two selections, one in each column.\nP Q\n4\n5\n6\n7\n8\n\n\n\n\n\f23/06/2024, 22:24","opts":{"note":"Select one answer per column. See book/online for full table."},"ans":"?","exp":""}];
const FLASHCARDS = {"Arithmetic & Numbers":[{"title":"Even/Odd Rules","content":"Even \u00d7 Even = Even\nEven \u00d7 Odd = Even\nOdd \u00d7 Odd = Odd\nEven + Even = Even\nEven + Odd = Odd\nOdd + Odd = Even"},{"title":"Quotient & Remainder","content":"For integers x, y: y = xq + r where 0 \u2264 r < x\nRemainder r = 0 iff y is divisible by x\n(x is a factor of y)"},{"title":"Absolute Value","content":"|x| = x if x \u2265 0\n|x| = \u2212x if x < 0\n|xy| = |x||y|\n|x/y| = |x|/|y| (y \u2260 0)"},{"title":"Decimal Multiplication","content":"Multiply ignoring decimal points.\nCount total digits to right of decimal in both numbers.\nPlace decimal so product has that many digits to the right."},{"title":"Scientific Notation","content":"A \u00d7 10\u207f: move decimal n places right (n > 0) or left (n < 0).\nTo convert 0.00042: move right 4 places \u2192 4.2 \u00d7 10\u207b\u2074"}],"Exponents & Roots":[{"title":"Exponent Rules","content":"x\u00b9 = x\nx\u2070 = 1 (x \u2260 0)\n(x\u02b8)\u1dbb = x^(yz)\nx^(y+z) = x\u02b8 \u00b7 x\u1dbb\n(xy)\u1dbb = x\u1dbb \u00b7 y\u1dbb\nx^(\u2212n) = 1/x\u207f"},{"title":"Square Roots Table","content":"\u221a1=1, \u221a2\u22481.41, \u221a3\u22481.73, \u221a4=2\n\u221a5\u22482.24, \u221a6\u22482.45, \u221a7\u22482.65\n\u221a8\u22482.83, \u221a9=3, \u221a10\u22483.16"},{"title":"If x > 1 and y > 1","content":"x\u02b8 > x (grows larger)\nIf 0 < x < 1 and y > 1: x\u02b8 < x (grows smaller)\nExample: 0.5\u00b2 = 0.25 < 0.5"}],"Algebra":[{"title":"Factoring Formulas","content":"a\u00b2 \u2212 b\u00b2 = (a\u2212b)(a+b)\na\u00b2 + 2ab + b\u00b2 = (a+b)\u00b2\na\u00b2 \u2212 2ab + b\u00b2 = (a\u2212b)\u00b2"},{"title":"Quadratic Formula","content":"For ax\u00b2 + bx + c = 0:\nx = (\u2212b \u00b1 \u221a(b\u00b2\u22124ac)) / 2a\nb\u00b2\u22124ac > 0: two real roots\nb\u00b2\u22124ac = 0: one root\nb\u00b2\u22124ac < 0: no real roots"},{"title":"Solving Inequalities","content":"Add/subtract same number from both sides \u2713\nMultiply/divide by POSITIVE number \u2713\nMultiply/divide by NEGATIVE number \u2192 FLIP the inequality sign \u2717\u2192flip\nExample: \u22122x > 4 \u2192 x < \u22122"},{"title":"Coordinate Geometry","content":"y = mx + b (slope-intercept)\nm = (y\u2082\u2212y\u2081)/(x\u2082\u2212x\u2081) = rise/run\nParallel lines: same slope\nPerpendicular lines: slopes are negative reciprocals (m\u2081 \u00d7 m\u2082 = \u22121)"},{"title":"Translating Words to Math","content":"\"more than\" \u2192 +\n\"less than\" \u2192 \u2212\n\"of\" \u2192 \u00d7 (multiply)\n\"ratio of x to y\" \u2192 x/y\n\"is/was/equals\" \u2192 =\n\"per\" \u2192 \u00f7"}],"Rates, Ratios & Percents":[{"title":"Rate Formula","content":"Distance = Rate \u00d7 Time\nd = rt\nAvg speed = Total Distance / Total Time\n\u26a0 Don't average the rates directly!"},{"title":"Work Formula","content":"If A does job in r hours, B in s hours:\nCombined time = rs/(r+s)\nRate of A = 1/r per hour\nRate of B = 1/s per hour\nCombined rate = 1/r + 1/s"},{"title":"Percent Change","content":"% Increase = (New\u2212Old)/Old \u00d7 100\n% Decrease = (Old\u2212New)/Old \u00d7 100\nSuccessive discounts of n% then m%:\nFinal = Original \u00d7 (1\u2212n/100)(1\u2212m/100)"},{"title":"Interest","content":"Simple: P \u00d7 r \u00d7 t\nCompound (n periods): P(1+r)\u207f \u2212 P\nWhere r = interest rate per period"},{"title":"Mixture Formula","content":"Amount_A \u00d7 Conc_A + Amount_B \u00d7 Conc_B\n= Total Amount \u00d7 Final Concentration\nKey: set up a table with amounts and concentrations"},{"title":"Profit & Discount","content":"Profit = Revenue \u2212 Cost\n= Selling Price \u2212 Cost\nPrice after n% discount = (100\u2212n)% of original\nPrice after n% then m% discount = (1\u2212n/100)(1\u2212m/100) \u00d7 original"}],"Statistics & Probability":[{"title":"Mean, Median, Mode","content":"Mean = Sum / Count\nMedian = middle value (odd n) or avg of two middle (even n)\nMode = most frequent value\nRange = Max \u2212 Min"},{"title":"Standard Deviation","content":"1. Find mean\n2. Find (x\u1d62 \u2212 mean) for each value\n3. Square each difference\n4. Average the squares\n5. Take \u221a of that average\nHigher SD = more spread out data"},{"title":"Counting Methods","content":"Permutations (order matters): P(n,k) = n!/(n\u2212k)!\nn distinct objects in a row: n!\nCombinations (order doesn't matter): C(n,k) = n!/(k!(n\u2212k)!)\nUseful: 5! = 120, 4! = 24, 3! = 6"},{"title":"Probability Rules","content":"P(E) = favorable outcomes / total outcomes\nP(not E) = 1 \u2212 P(E)\nP(A or B) = P(A) + P(B) \u2212 P(A and B)\nP(A and B) = P(A) \u00d7 P(B) [if independent]\nP(A|B) = P(A and B) / P(B) [conditional]"},{"title":"Sets (Venn Diagram)","content":"|A \u222a B| = |A| + |B| \u2212 |A \u2229 B|\nFor 3 sets: |A\u222aB\u222aC| = |A|+|B|+|C| \u2212 |A\u2229B| \u2212 |B\u2229C| \u2212 |A\u2229C| + |A\u2229B\u2229C|"}],"Data Sufficiency Strategy":[{"title":"DS Answer Choices","content":"A: Statement (1) ALONE sufficient\nB: Statement (2) ALONE sufficient\nC: BOTH together sufficient\nD: EACH alone sufficient\nE: Together NOT sufficient\nMemory trick: 12-TEN (1, 2, Together, Either, Neither)"},{"title":"DS Key Rules","content":"For value questions: sufficient = ONE unique value\nFor yes/no questions: sufficient = always yes OR always no\nNever assume info not given (e.g., don't assume integers)\nStatements are always true \u2014 never contradict each other"},{"title":"DS Approach","content":"Step 1: Understand what's asked\nStep 2: Test Statement (1) alone\nStep 3: Test Statement (2) alone\nStep 4: If both insufficient alone, test together\n\nIf (1) sufficient \u2192 answer is A or D\nIf (1) not sufficient \u2192 answer is B, C, or E"}],"Critical Reasoning":[{"title":"Question Types & Keywords","content":"Strengthen: 'most strengthens', 'most supports'\nWeaken: 'most weakens', 'undermines'\nAssumption: 'relies on assuming', 'assumes'\nInference: 'most strongly supports', 'most logically inferred'\nBoldface: identifies role of bolded statements\nExplain: 'most helps explain', 'resolves the paradox'"},{"title":"Argument Structure","content":"Premise: fact/evidence supporting conclusion\nConclusion: what the argument is trying to prove\nAssumption: unstated premise connecting evidence to conclusion\n\nSignal words for conclusions:\n'Thus', 'Therefore', 'Hence', 'So', 'Consequently'"},{"title":"Strengthen Strategy","content":"Correct answer must: support the conclusion given the premises\nLook for: fills a logical gap, supports an assumption\nBeware: new info that's irrelevant or too extreme\n'Out of scope' is a common wrong answer trap"},{"title":"Weaken Strategy","content":"Correct answer: attacks the conclusion or an assumption\nLook for: alternative explanations, countering evidence\nThe question is about the argument's logic, not real-world truth\nWatch out for answers that strengthen instead"},{"title":"Assumption Strategy","content":"Assumption = required bridge between premise and conclusion\nNegation test: Negate the answer. If argument falls apart \u2192 it's an assumption\nLook for: what MUST be true for the conclusion to hold\nAssumptions are unstated but necessary"}]};

function getYTQuery(topic) {
  const t = (topic || "").toLowerCase();
  if (t.includes("statistic")||t.includes("mean")||t.includes("median")) return "GMAT mean median mode statistics";
  if (t.includes("percent")) return "GMAT percentage problems tricks";
  if (t.includes("ratio")||t.includes("proportion")) return "GMAT ratio proportion problems";
  if (t.includes("probability")) return "GMAT probability combinations permutations";
  if (t.includes("exponent")||t.includes("radical")) return "GMAT exponents roots rules";
  if (t.includes("inequalit")) return "GMAT inequalities strategy";
  if (t.includes("simultaneous")||t.includes("system")) return "GMAT simultaneous equations";
  if (t.includes("sequence")||t.includes("series")) return "GMAT sequences series";
  if (t.includes("geometry")||t.includes("triangle")||t.includes("circle")||t.includes("coordinate")) return "GMAT geometry coordinate triangles circles";
  if (t.includes("work problem")||t.includes("rate problem")) return "GMAT work rate time problems";
  if (t.includes("profit")||t.includes("loss")) return "GMAT profit loss problems";
  if (t.includes("mixture")) return "GMAT mixture problems";
  if (t.includes("set")||t.includes("venn")) return "GMAT sets venn diagram";
  if (t.includes("counting")||t.includes("combinat")||t.includes("permut")) return "GMAT combinations permutations counting";
  if (t.includes("data sufficiency")) return "GMAT data sufficiency AD BCE method strategy";
  if (t.includes("two-part")) return "GMAT two part analysis tutorial";
  if (t.includes("strengthen")) return "GMAT critical reasoning strengthen argument";
  if (t.includes("weaken")) return "GMAT critical reasoning weaken argument";
  if (t.includes("assumption")) return "GMAT critical reasoning assumption negation test";
  if (t.includes("inference")||t.includes("conclusion")) return "GMAT critical reasoning inference";
  if (t.includes("boldface")) return "GMAT critical reasoning boldface";
  if (t.includes("explain")||t.includes("paradox")) return "GMAT critical reasoning explain paradox";
  if (t.includes("critical reasoning")) return "GMAT critical reasoning strategy";
  if (t.includes("algebra")) return "GMAT algebra word problems strategy";
  if (t.includes("arithmetic")) return "GMAT arithmetic number properties";
  return "GMAT " + (topic || "") + " tutorial";
}

function topicGroup(topic) {
  const t = (topic || "").toLowerCase();
  if (t.includes("statistic")||t.includes("mean")||t.includes("median")||t.includes("mode")||t.includes("range")) return "Statistics";
  if (t.includes("percent")) return "Percents";
  if (t.includes("ratio")||t.includes("proportion")) return "Ratios & Proportions";
  if (t.includes("probability")) return "Probability";
  if (t.includes("exponent")||t.includes("radical")||t.includes("root")) return "Exponents & Roots";
  if (t.includes("inequalit")) return "Inequalities";
  if (t.includes("simultaneous")||t.includes("system")) return "Simultaneous Equations";
  if (t.includes("sequence")||t.includes("series")) return "Sequences & Series";
  if (t.includes("geometry")||t.includes("triangle")||t.includes("circle")||t.includes("coordinate")||t.includes("line")) return "Geometry";
  if (t.includes("set")||t.includes("venn")) return "Sets";
  if (t.includes("counting")||t.includes("combinat")||t.includes("permut")) return "Counting Methods";
  if (t.includes("work problem")||t.includes("rate problem")) return "Work & Rate";
  if (t.includes("profit")||t.includes("loss")) return "Profit & Loss";
  if (t.includes("mixture")) return "Mixtures";
  if (t.includes("interpretation")||t.includes("table")) return "Graphs & Tables";
  if (t.includes("applied")||t.includes("word problem")) return "Word Problems";
  if (t.includes("algebra")) return "Algebra";
  if (t.includes("arithmetic")) return "Arithmetic";
  if (t.includes("data sufficiency")) return "Data Sufficiency";
  if (t.includes("two-part")) return "Two-Part Analysis";
  if (t.includes("critical reasoning")) return topic.replace("Critical Reasoning — ", "CR: ");
  return topic || "Other";
}

const SECTION_MAP = { "Quan": "Quantitative Reasoning", "Data": "Data Insights", "Verb": "Verbal Reasoning" };
const DIFF_MAP    = { "E": "Easy", "M": "Medium", "H": "Hard" };
const DIFF_COLOR  = { "E": "#22c55e", "M": "#f59e0b", "H": "#ef4444" };
const SECTION_COLOR = { "Quan": "#e85d3a", "Data": "#3b82f6", "Verb": "#22c55e" };

const PAGE_SIZE = 20;

function GMATPlanner() {
  const [section, setSection]           = useState("Quan");
  const [topicFilter, setTopicFilter]   = useState("All");
  const [diffFilter, setDiffFilter]     = useState("All");
  const [typeFilter, setTypeFilter]     = useState("All");
  const [view, setView]                 = useState("questions");
  const [selectedQ, setSelectedQ]       = useState(null);
  const [showAnswer, setShowAnswer]     = useState(false);
  const [showExp, setShowExp]           = useState(false);
  const [answered, setAnswered]         = useState({});
  const [fcSection, setFcSection]       = useState(null);
  const [flipped, setFlipped]           = useState({});
  const [search, setSearch]             = useState("");
  const [page, setPage]                 = useState(0);

  const color = SECTION_COLOR[section];

  const sectionQs = useMemo(() => RAW_QUESTIONS.filter(q => q.s === section), [section]);

  const topicGroups = useMemo(() => {
    const g = {};
    sectionQs.forEach(q => { const k = topicGroup(q.topic); g[k] = (g[k]||0)+1; });
    return Object.entries(g).sort((a,b) => a[0].localeCompare(b[0]));
  }, [sectionQs]);

  const types = useMemo(() => ["All", ...new Set(sectionQs.map(q => q.t))], [sectionQs]);

  const filtered = useMemo(() => sectionQs.filter(q => {
    if (diffFilter !== "All" && q.d !== diffFilter[0]) return false;
    if (topicFilter !== "All" && topicGroup(q.topic) !== topicFilter) return false;
    if (typeFilter !== "All" && q.t !== typeFilter) return false;
    if (search && !q.q.toLowerCase().includes(search.toLowerCase())) return false;
    return true;
  }), [sectionQs, diffFilter, topicFilter, typeFilter, search]);

  const paginated  = filtered.slice(page*PAGE_SIZE, (page+1)*PAGE_SIZE);
  const totalPages = Math.ceil(filtered.length / PAGE_SIZE);

  const stats = useMemo(() => {
    const total   = Object.keys(answered).length;
    const correct = Object.values(answered).filter(a => a.correct).length;
    return { total, correct, pct: total>0 ? Math.round(correct/total*100) : null };
  }, [answered]);

  function selectQ(q) { setSelectedQ(q); setShowAnswer(false); setShowExp(false); }
  function handleAnswer(q, opt) {
    if (answered[q.n]) return;
    setAnswered(p => ({...p, [q.n]: { chosen:opt, correct: opt===q.ans }}));
    setShowAnswer(true);
  }
  function resetFilters() { setTopicFilter("All"); setDiffFilter("All"); setTypeFilter("All"); setSearch(""); setPage(0); }
  function changeSection(s) { setSection(s); resetFilters(); setSelectedQ(null); }

  return (
    <div style={{fontFamily:"'Sora','Segoe UI',sans-serif",background:"#09090b",minHeight:"100vh",color:"#e4e4e7",display:"flex",flexDirection:"column",overflow:"hidden"}}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
        *{box-sizing:border-box;margin:0;padding:0;}
        ::-webkit-scrollbar{width:4px;height:4px;}
        ::-webkit-scrollbar-track{background:#18181b;}
        ::-webkit-scrollbar-thumb{background:#3f3f46;border-radius:2px;}
        .qrow{transition:background 0.1s;cursor:pointer;}
        .qrow:hover{background:#18181b!important;}
        .chip{transition:all 0.1s;cursor:pointer;}
        .chip:hover{opacity:1!important;border-color:#71717a!important;}
        .yt-link{transition:color 0.1s;}
        .yt-link:hover{color:#e4e4e7!important;}
        .ans-opt{transition:all 0.15s;cursor:pointer;}
        .ans-opt:hover{border-color:#52525b!important;}
        @keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
        .fade-up{animation:fadeUp 0.2s ease;}
        .card-wrap{perspective:1000px;}
        .card-inner{transition:transform 0.4s;transform-style:preserve-3d;position:relative;height:100%;}
        .card-inner.flipped{transform:rotateY(180deg);}
        .card-face,.card-back{backface-visibility:hidden;-webkit-backface-visibility:hidden;position:absolute;inset:0;border-radius:10px;padding:16px;}
        .card-back{transform:rotateY(180deg);overflow-y:auto;}
        a{color:inherit;text-decoration:none;}
        input:focus,select:focus{outline:none;}
        select option{background:#18181b;}
      `}</style>

                )}
                <select value={topicFilter} onChange={e=>{setTopicFilter(e.target.value);setPage(0);}}
                  style={{padding:"5px 7px",background:"#18181b",border:"1px solid #27272a",borderRadius:5,color:"#a1a1aa",fontFamily:"'JetBrains Mono',monospace",fontSize:10,cursor:"pointer",maxWidth:160}}>
                  <option value="All">All Topics</option>
                  {topicGroups.map(([g])=><option key={g} value={g}>{g}</option>)}
                </select>
                <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10,color:"#52525b",whiteSpace:"nowrap"}}>{filtered.length}q</div>
              </div>

              {/* Question rows */}
              <div style={{flex:1,overflowY:"auto"}}>
                {paginated.map(q=>{
                  const ans=answered[q.n];
                  const isSel=selectedQ?.n===q.n;
                  return(
                    <div key={q.n} className="qrow" onClick={()=>selectQ(q)}
                      style={{padding:"10px 14px",borderBottom:"1px solid #131316",background:isSel?"#18181b":"transparent",borderLeft:`3px solid ${isSel?color:ans?(ans.correct?"#22c55e":"#ef4444"):"transparent"}`}}>
                      <div style={{display:"flex",gap:8,alignItems:"flex-start"}}>
                        <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10,color:"#52525b",minWidth:26,paddingTop:2}}>{q.n}.</span>
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{fontSize:12,color:isSel?"#e4e4e7":"#a1a1aa",lineHeight:1.5,display:"-webkit-box",WebkitLineClamp:2,WebkitBoxOrient:"vertical",overflow:"hidden"}}>
                            {q.q.split("\n")[0]}
                          </div>
                          <div style={{display:"flex",gap:4,marginTop:4,flexWrap:"wrap"}}>
                            <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:8,padding:"1px 5px",borderRadius:3,background:DIFF_COLOR[q.d]+"18",color:DIFF_COLOR[q.d]}}>{DIFF_MAP[q.d]}</span>
                            <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:8,padding:"1px 5px",borderRadius:3,background:"#18181b",color:"#71717a"}}>{q.t}</span>
                            <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:8,padding:"1px 5px",borderRadius:3,background:"#18181b",color:"#52525b"}}>{topicGroup(q.topic)}</span>
                            {ans&&<span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:8,padding:"1px 5px",borderRadius:3,background:ans.correct?"#22c55e18":"#ef444418",color:ans.correct?"#22c55e":"#ef4444"}}>{ans.correct?"✓":"✗"} {ans.chosen}</span>}
                          </div>
                        </div>
                      </div>
                    </div>
                  );
                })}
                {paginated.length===0&&(
                  <div style={{padding:40,textAlign:"center",color:"#3f3f46",fontFamily:"'JetBrains Mono',monospace",fontSize:12}}>No questions match filters</div>
                )}
                {/* Pagination */}
                {totalPages>1&&(
                  <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:8,padding:"10px 14px",borderTop:"1px solid #18181b"}}>
                    <button onClick={()=>setPage(p=>Math.max(0,p-1))} disabled={page===0}
                      style={{padding:"3px 10px",background:"#18181b",border:"1px solid #27272a",borderRadius:4,color:page===0?"#3f3f46":"#a1a1aa",cursor:page===0?"default":"pointer",fontFamily:"'JetBrains Mono',monospace",fontSize:11}}>‹</button>
                    <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:9,color:"#52525b"}}>{page+1}/{totalPages}</span>
                    <button onClick={()=>setPage(p=>Math.min(totalPages-1,p+1))} disabled={page===totalPages-1}
                      style={{padding:"3px 10px",background:"#18181b",border:"1px solid #27272a",borderRadius:4,color:page===totalPages-1?"#3f3f46":"#a1a1aa",cursor:page===totalPages-1?"default":"pointer",fontFamily:"'JetBrains Mono',monospace",fontSize:11}}>›</button>
                  </div>
                )}
              </div>
            </>
          )}

          {view==="revision"&&(
            <RevisionView section={section} color={color} fcSection={fcSection} setFcSection={setFcSection}
              flipped={flipped} setFlipped={setFlipped} topicGroups={topicGroups} sectionQs={sectionQs}/>
          )}
        </div>

        {/* ── Right: Question detail ── */}
        {selectedQ&&(
          <div className="fade-up" style={{flex:1,overflowY:"auto",padding:"18px 20px",background:"#0c0c0e"}}>
            <QuestionDetail q={selectedQ} answered={answered} onAnswer={handleAnswer}
              showAnswer={showAnswer} setShowAnswer={setShowAnswer}
              showExp={showExp} setShowExp={setShowExp}
              color={color} onClose={()=>setSelectedQ(null)}/>
          </div>
        )}
      </div>
    </div>
  );
}

// ── Question Detail ───────────────────────────────────────────────────────────
function QuestionDetail({q, answered, onAnswer, showAnswer, setShowAnswer, showExp, setShowExp, color, onClose}) {
  const ans = answered[q.n];
  const ytQuery = encodeURIComponent(getYTQuery(q.topic));

  return(
    <div>
      {/* Top row */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:14}}>
        <div>
          <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:6}}>
            <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:9,padding:"2px 7px",borderRadius:3,background:color+"22",color}}>Q{q.n}</span>
            <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:9,padding:"2px 7px",borderRadius:3,background:DIFF_COLOR[q.d]+"18",color:DIFF_COLOR[q.d]}}>{DIFF_MAP[q.d]}</span>
            <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:9,padding:"2px 7px",borderRadius:3,background:"#18181b",color:"#71717a"}}>{q.t}</span>
          </div>
          <div style={{fontSize:10,color:"#52525b",fontFamily:"'JetBrains Mono',monospace"}}>{q.topic}</div>
        </div>
        <button onClick={onClose} style={{background:"none",border:"none",color:"#52525b",cursor:"pointer",fontSize:18,padding:"0 2px",lineHeight:1}}>✕</button>
      </div>

      {/* YouTube button */}
      <a href={`https://www.youtube.com/results?search_query=${ytQuery}`} target="_blank" rel="noopener noreferrer"
        style={{display:"inline-flex",alignItems:"center",gap:8,padding:"6px 14px",background:"#27272a",borderRadius:6,color:"#a1a1aa",fontSize:12,marginBottom:14,border:"1px solid #3f3f46",transition:"border-color 0.1s"}}
        onMouseEnter={e=>e.currentTarget.style.borderColor="#ef4444"}
        onMouseLeave={e=>e.currentTarget.style.borderColor="#3f3f46"}>
        <span style={{color:"#ef4444",fontSize:14}}>▶</span>
        Watch: {topicGroup(q.topic)} on YouTube ↗
      </a>

      {/* Question text */}
      <div style={{background:"#18181b",border:"1px solid #27272a",borderRadius:8,padding:16,marginBottom:14}}>
        {q.q.split("\n").map((line,i)=>(
          <p key={i} style={{fontSize:13.5,lineHeight:1.85,color:"#d4d4d8",marginBottom:line===""?5:0}}>{line||"\u00A0"}</p>
        ))}
      </div>

      {/* DS reminder */}
      {q.t==="Data Sufficiency"&&(
        <div style={{background:"#18181b",border:"1px solid #27272a",borderRadius:5,padding:"8px 12px",marginBottom:14,fontSize:10,color:"#71717a",fontFamily:"'JetBrains Mono',monospace",lineHeight:1.6}}>
          A: (1) alone sufficient · B: (2) alone sufficient · C: Both together · D: Each alone · E: Neither
        </div>
      )}

      {/* Answer options */}
      <div style={{display:"flex",flexDirection:"column",gap:5,marginBottom:14}}>
        {Object.entries(q.opts||{}).map(([opt,text])=>{
          const isChosen=ans?.chosen===opt;
          const isCorrect=opt===q.ans;
          let bg="#18181b",border="#27272a",tc="#a1a1aa";
          if(ans){
            if(isCorrect){bg="#22c55e18";border="#22c55e";tc="#22c55e";}
            else if(isChosen){bg="#ef444418";border="#ef4444";tc="#ef4444";}
          }
          return(
            <div key={opt} className={ans?"":"ans-opt"} onClick={()=>!ans&&onAnswer(q,opt)}
              style={{padding:"9px 13px",borderRadius:6,border:`1px solid ${border}`,background:bg,color:tc,fontSize:12.5,lineHeight:1.5,cursor:ans?"default":"pointer",display:"flex",gap:9}}>
              <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10,minWidth:14,paddingTop:1}}>{opt}.</span>
              <span>{text}</span>
            </div>
          );
        })}
      </div>

      {/* Reveal answer */}
      {!ans&&(
        <button onClick={()=>setShowAnswer(true)}
          style={{padding:"7px 16px",background:color+"22",border:`1px solid ${color}`,borderRadius:6,color,fontFamily:"'JetBrains Mono',monospace",fontSize:10,cursor:"pointer",letterSpacing:1}}>
          SHOW ANSWER
        </button>
      )}
      {(ans||showAnswer)&&(
        <div style={{padding:"10px 13px",background:"#18181b",border:`1px solid ${q.ans===ans?.chosen?"#22c55e":"#3f3f46"}`,borderRadius:6,marginBottom:10}}>
          <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:"#22c55e"}}>✓ Correct Answer: {q.ans}</div>
          {ans&&<div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10,color:ans.correct?"#22c55e":"#ef4444",marginTop:3}}>
            {ans.correct?"You answered correctly!":"You chose: "+ans.chosen}
          </div>}
        </div>
      )}

      {/* Explanation */}
      {q.exp&&(
        <div style={{marginTop:8}}>
          <button onClick={()=>setShowExp(p=>!p)}
            style={{padding:"5px 13px",background:"#18181b",border:"1px solid #27272a",borderRadius:5,color:"#71717a",fontFamily:"'JetBrains Mono',monospace",fontSize:9,cursor:"pointer",letterSpacing:1}}>
            {showExp?"HIDE":"SHOW"} OG EXPLANATION
          </button>
          {showExp&&(
            <div className="fade-up" style={{marginTop:8,background:"#18181b",border:"1px solid #27272a",borderRadius:6,padding:14}}>
              {q.exp.split("\n").map((line,i)=>(
                <p key={i} style={{fontSize:12.5,lineHeight:1.75,color:"#a1a1aa",marginBottom:3}}>{line}</p>
              ))}
              <div style={{marginTop:10,padding:"7px 11px",background:"#0c0c0e",borderLeft:`3px solid ${color}`,borderRadius:"0 4px 4px 0"}}>
                <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:9,color,letterSpacing:1}}>OG TOPIC · </span>
                <span style={{fontSize:11,color:"#71717a"}}>{q.topic}</span>
              </div>
            </div>
          )}
        </div>
      )}

      {/* YouTube deep links */}
      <div style={{marginTop:18,padding:14,background:"#18181b",borderRadius:8,border:"1px solid #27272a"}}>
        <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:9,color:"#52525b",letterSpacing:2,marginBottom:10}}>YOUTUBE PREP FOR THIS TOPIC</div>
        {[
          `GMAT ${topicGroup(q.topic)} full tutorial`,
          `GMAT ${topicGroup(q.topic)} practice problems`,
          `GMAT ${q.t} ${DIFF_MAP[q.d]} level strategy`,
        ].concat(CHANNELS.slice(0,3).map(ch=>`${ch} GMAT ${topicGroup(q.topic)}`))
        .map((query,i)=>(
          <a key={i} className="yt-link" href={`https://www.youtube.com/results?search_query=${encodeURIComponent(query)}`} target="_blank" rel="noopener noreferrer"
            style={{display:"flex",alignItems:"center",gap:8,padding:"6px 0",borderBottom:i<5?"1px solid #27272a":"none",color:"#71717a",fontSize:11.5}}>
            <span style={{color:"#ef4444",fontSize:9}}>▶</span>{query}
          </a>
        ))}
      </div>
    </div>
  );
}

// ── Revision View ─────────────────────────────────────────────────────────────
function RevisionView({section, color, fcSection, setFcSection, flipped, setFlipped, topicGroups, sectionQs}) {
  const relevantFCKeys = {
    "Quan": ["Arithmetic & Numbers","Exponents & Roots","Algebra","Rates, Ratios & Percents","Statistics & Probability"],
    "Data": ["Data Sufficiency Strategy","Statistics & Probability","Algebra","Rates, Ratios & Percents"],
    "Verb": ["Critical Reasoning"]
  }[section] || Object.keys(FLASHCARDS);

  const cards = fcSection ? (FLASHCARDS[fcSection]||[]) : [];

  return(
    <div style={{flex:1,overflowY:"auto",padding:16}}>
      {/* Flashcard category picker */}
      <div style={{marginBottom:16}}>
        <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:9,color:"#52525b",letterSpacing:2,textTransform:"uppercase",marginBottom:8}}>
          ⚡ Quick Reference Flashcards — tap a category
        </div>
        <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
          {relevantFCKeys.map(k=>(
            <button key={k} className="chip" onClick={()=>setFcSection(fcSection===k?null:k)}
              style={{padding:"6px 12px",borderRadius:20,border:`1px solid ${fcSection===k?color:"#27272a"}`,background:fcSection===k?color+"22":"#18181b",color:fcSection===k?color:"#71717a",fontFamily:"'Sora',sans-serif",fontSize:11,opacity:0.9}}>
              {k}
            </button>
          ))}
        </div>
      </div>

      {/* Flashcards grid */}
      {fcSection&&cards.length>0&&(
        <div className="fade-up">
          <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:9,color:"#52525b",letterSpacing:2,marginBottom:10}}>{cards.length} CARDS · CLICK TO FLIP</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(220px,1fr))",gap:10,marginBottom:20}}>
            {cards.map((card,i)=>{
              const key=`${fcSection}_${i}`;
              const isFlipped=flipped[key];
              return(
                <div key={key} className="card-wrap" style={{height:170,cursor:"pointer"}}
                  onClick={()=>setFlipped(p=>({...p,[key]:!p[key]}))}>
                  <div className={`card-inner${isFlipped?" flipped":""}`}>
                    {/* Front */}
                    <div className="card-face" style={{background:"#18181b",border:`1px solid ${color}44`,display:"flex",flexDirection:"column",justifyContent:"space-between"}}>
                      <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:8,color,letterSpacing:1}}>FORMULA / RULE</div>
                      <div style={{fontSize:14,fontWeight:600,color:"#e4e4e7",textAlign:"center",lineHeight:1.4}}>{card.title}</div>
                      <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:8,color:"#52525b",textAlign:"right"}}>tap to reveal →</div>
                    </div>
                    {/* Back */}
                    <div className="card-back" style={{background:"#18181b",border:`1px solid ${color}`}}>
                      <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:8,color,letterSpacing:1,marginBottom:6}}>{card.title.toUpperCase()}</div>
                      {card.content.split("\n").map((line,j)=>(
                        <div key={j} style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10,color:line.startsWith("⚠")?"#f59e0b":line.startsWith("✓")?"#22c55e":"#a1a1aa",lineHeight:1.65,marginBottom:1}}>{line}</div>
                      ))}
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* Topic breakdown table */}
      <div style={{marginTop:fcSection?0:8}}>
        <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:9,color:"#52525b",letterSpacing:2,textTransform:"uppercase",marginBottom:10}}>
          Topic Breakdown · {SECTION_MAP[section]}
        </div>
        {topicGroups.map(([g,count])=>(
          <div key={g} style={{display:"flex",alignItems:"center",gap:10,padding:"6px 0",borderBottom:"1px solid #131316"}}>
            <span style={{fontSize:12,color:"#a1a1aa",flex:1}}>{g}</span>
            <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:9,color:"#52525b"}}>{count}q</span>
            <div style={{width:64,height:3,background:"#27272a",borderRadius:2}}>
              <div style={{width:`${Math.min(100,count/sectionQs.length*100*4)}%`,height:"100%",background:color,borderRadius:2}}/>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(GMATPlanner));
</script>
</body>
</html>
