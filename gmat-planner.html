t"},"ans":"B","exp":""},{"n":390,"s":"Data","t":"Data Sufficiency","d":"H","topic":"Arithmetic","q":"At a certain clothing store, customers who buy 2 shirts pay the regular price for the first shirt\nand a discounted price for the second shirt. The store makes the same profit from the sale of\n2 shirts that it makes from the sale of 1 shirt at the regular price. For a customer who buys 2\nshirts, what is the discounted price of the second shirt?\n1. The regular price of each of the 2 shirts the customer buys at the clothing store is $16.\n2. The cost to the clothing store of each of the 2 shirts the","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"B","exp":""},{"n":391,"s":"Data","t":"Data Sufficiency","d":"H","topic":"Arithmetic","q":"What is the median number of employees assigned per project for the projects at Company Z?\n1. 25 percent of the projects at Company Z have 4 or more employees assigned to each\nproject.\n2. 35 percent of the projects at Company Z have 2 or fewer employees assigned to each\nproject.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"C","exp":""},{"n":392,"s":"Data","t":"Data Sufficiency","d":"H","topic":"Arithmetic","q":"Last year, a certain company began manufacturing Product X and sold every unit of Product X\nthat it produced. Last year, the company\u2019s total expenses for manufacturing Product X were\nequal to $100,000 plus 5 percent of the company\u2019s total revenue from all units of Product X\nsold. If the company made a profit on Product X last year, did the company sell more than\n21,000 units of Product X last year?\n1. The company\u2019s total revenue from the sale of Product X last year was greater than\n$110,000.\n2. ","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"B","exp":""},{"n":393,"s":"Data","t":"Data Sufficiency","d":"H","topic":"Arithmetic","q":"Beginning in January of last year, Carl made deposits of $120 into his account on the 15th of\neach month for several consecutive months and then made withdrawals of $50 from the\naccount on the 15th of each of the remaining months of last year. There were no other\ntransactions in the account last year. If the closing balance of Carl\u2019s account for May of last","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"C","exp":""},{"n":394,"s":"Data","t":"Data Sufficiency","d":"H","topic":"Arithmetic","q":"What amount did Jean earn from the commission on her sales in the first half of 1988?\n1. In 1988, Jean\u2019s commission was 5 percent of the total amount of her sales.\n2. The amount of Jean\u2019s sales in the second half of 1988 averaged $10,000 per month more\nthan in the first half.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"E","exp":""},{"n":395,"s":"Data","t":"Data Sufficiency","d":"H","topic":"Arithmetic","q":"In a certain business, production index p is directly proportional to efficiency index e, which is\nin turn directly proportional to investment index i. What is p if i = 70?\n1. e = 0.5 whenever i = 60.\n2. p = 2.0 whenever i = 50.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"B","exp":""},{"n":396,"s":"Data","t":"Data Sufficiency","d":"H","topic":"Arithmetic","q":"The annual rainfall in a city over the past 50 years is its historical average rainfall (HAR). The\ngraph above shows the annual rainfall in City X over a seven-year period. All figures are\nrounded to the nearest integer.\nIs it true that the rounded HAR for City X is 47 mm or greater?\n1. In the seven-year period in City X, the annual rainfall was greater than the HAR in exactly\ntwo of the consecutive years.\n2. In the seven-year period in City X, the annual rainfall was less than the HAR in exactl","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"A","exp":""},{"n":397,"s":"Data","t":"Data Sufficiency","d":"H","topic":"Arithmetic","q":"Five coffee-chicory blends\u2014J, K, L, M, and N\u2014are all priced differently. The blends are such\nthat the greater the proportion of coffee, the more expensive the blend, and the greater the\nproportion of chicory, the stronger the flavor of the blend. If the five blends were ranked in\norder of cost per kilogram, which would fall in the middle?\n1. Blend L has a higher proportion of coffee than the other blends except for Blend M.\n2. Blend K and Blend N both have a stronger flavor than Blend J.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"C","exp":""},{"n":398,"s":"Data","t":"Data Sufficiency","d":"H","topic":"Arithmetic","q":"Last summer, as with every summer, Oshin and Reena made exactly one long trip together to a\ntown neither of them had visited before. For their long summer trips, Oshin and Reena have\nalways chosen to visit a town that Reena would have liked to visit\u2014unless Oshin had been to\nthat town before. Reena had visited Town F and Town G before, and Oshin had never visited\nTown J or Town K. Did Oshin and Reena visit one of these four towns last summer?\n1. Reena had never visited Town J, and Oshin had never","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"E","exp":""},{"n":399,"s":"Data","t":"Data Sufficiency","d":"H","topic":"Arithmetic","q":"For a new project, an organization is creating a three-member team from among its\nemployees. Selection of members for the team conforms to exactly two rules: no selected\nmember can be working on more than one other project at the time of selection, and at least\none of the selected members must have an MBA degree. The organization has selected Paula\nand Quincy for the team. Neither of these will be replaced before the third member is selected.\nThe organization is about to make the third selection","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"A","exp":""},{"n":400,"s":"Data","t":"Data Sufficiency","d":"H","topic":"Arithmetic","q":"All the T-shirts a clothing store stocks are plain, and they are all in one of exactly four colors:\nblue, green, red, and yellow. On any given day, the store sells about twice as many blue T-shirts\nas it does green T-shirts. Last week, did the store sell more blue T-shirts than red T-shirts?\n1. Last week, the store sold fewer blue T-shirts than red T-shirts and green T-shirts\ncombined.\n2. Last week, the store sold more blue T-shirts than half the total number of red T-shirts and\nyellow T-shirts ","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"E","exp":""},{"n":401,"s":"Data","t":"Data Sufficiency","d":"H","topic":"Arithmetic","q":"The table above shows the sales forecast from January to June of last year, by the sales team\nof Company X, for the number of units of Product Z each month.\nWas the actual number of units of Product Z sold in March less than the number sold in April?\n1. Twelve units of Product Z were sold in March.\n2. From January through June of last year, there was a constant, linear relationship between\nthe forecast and actual number of units of Product Z sold.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"B","exp":""},{"n":402,"s":"Data","t":"Data Sufficiency","d":"H","topic":"Arithmetic","q":"Chris was in an electronic appliances store to buy an LED computer monitor. Chris\u2019s purchase\ncriteria included screen size, which must be at least 32 inches, and price, which must not\nexceed $400. A friend made two recommendations: Monitor A and Monitor B. Chris liked both\nmonitors. Did Chris more likely buy Monitor A, Monitor B, or neither?\n1. Monitor A\u2019s screen size was more than 32 inches and it cost less than Monitor B.\n2. Monitor B cost $390 and its screen size was less than that of Monitor","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"E","exp":""},{"n":403,"s":"Data","t":"Data Sufficiency","d":"H","topic":"Arithmetic","q":"A certain pizzeria has more than fifty types of pizza on its menu. The chart above shows the\nrevenue share, in the pizzeria\u2019s total revenue in the last month, of its four most popular pizza\ntypes. Each pizza type has only a single size and a single price.\nWhich was their best-selling pizza last month in terms of number of pizzas sold?\n1. The number of customers who ordered at least one Pep-Peroni pizza last month was\ngreater than the number of customers who ordered at least one of any other pizz","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"B","exp":""},{"n":404,"s":"Data","t":"Data Sufficiency","d":"H","topic":"Arithmetic","q":"In any twenty-four-hour period, a certain faulty clock gains anywhere from one second to a\nmaximum of three minutes. The clock did not stop or lose time since noon the day before\nyesterday. At exactly noon today, did the clock show the correct time to an accuracy of five\nminutes?\n1. The clock was set to the correct time the day before yesterday at exactly noon.\n2. At exactly noon yesterday, the clock was set back by one minute.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"C","exp":""},{"n":405,"s":"Data","t":"Data Sufficiency","d":"H","topic":"Arithmetic","q":"The couple decide one day that they will definitely go to the beach the next evening if it is\nsunny without rain at the time they plan to go, and that they will definitely not go if such is not\nthe case. The next morning, the hour-by-hour weather forecast says that in the evening, it will\nbe sunny without rain. Will the couple go to the beach that evening?\n1. It is raining on the morning and in the afternoon of the day of their planned beach\nouting.\n2. The couple always believe that the weather ","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"E","exp":""},{"n":406,"s":"Data","t":"Data Sufficiency","d":"H","topic":"Arithmetic","q":"A small library has books on twenty different subjects including, most prominently, history.\nOne afternoon, a librarian arbitrarily picks up 100 books for reshelving from among the\nbooks returned that day. All the books returned that day were borrowed during the past\nthree weeks. Are fewer than 20 percent of the books the librarian picks up on history?\n1. Fewer than 20 percent of the books in the library are on history.\n2. During the past three weeks, exactly 15 books on history were borrowed fr","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"B","exp":""},{"n":407,"s":"Data","t":"Data Sufficiency","d":"H","topic":"Arithmetic","q":"Four book lovers have recently met and are not sure of the topics that interest the others. The\ntable above indicates the topics that interest each of them with check marks and those that do\nnot with cross marks (Xs).\nOne of these persons will.pngt another of these persons two books, each on a different one of\nthe listed topics. Will at least one of the two books fall under the recipient\u2019s broad topic of\ninterest?\n1. One topic is science fiction and the other is humor.\n2. The intended recipient ","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"D","exp":""},{"n":620,"s":"Verb","t":"Critical Reasoning","d":"E","topic":"Critical Reasoning \u2014 Strengthen","q":"Arts advocate: Few universities require that students who are specializing in science and\ntechnology take many art courses. However, real progress in science and technology requires\nan element of creativity, which the arts foster. Thus, to help science and technology students\nsucceed in their careers, universities should increase the number of art courses required for\nthem.\nWhich of the following would, if true, most strengthen the argument above?","opts":{"A":"Universities required more art courses for science and technology students in the past.","B":"Participation in art courses increases students\u2019 creative thinking in their science and","C":"More students who are interested in art would specialize in science and technology if the","D":"Some of the most prominent scientists began their careers as artists.","E":"Discussion of science and technology topics in art courses increases creative thinking"},"ans":"B","exp":"Argument Evaluation\nSituation\n\nThe arts advocate argues that universities should increase the number of art\ncourses required for students specializing in science and technology, with the\ngoal of helping these students succeed in their careers. Few universities\nrequire students in these fields to take many art courses.\n\nReasoning\n\nWhat piece of information, if true and added to the argument, would most\nstrengthen it? One of the arts advocate\u2019s premises is that progress in science\nand technology requires creativity. Another premise is that courses in the arts\nfoster creativity. The conclusion is that universities should, for the sake of\npromoting career success, require students specializing in science and\ntechnology to take more courses in art. Suppose that participation in art\ncourses enriches students\u2019 participation in the science and technology courses:\nthat would be a further reason for universities to require that the students\ntake more art courses.\n\nA. This does not indicate that increasing art offerings now for science and technology\nstudents is the most prudent course of action. Universities\u2019 past decision to offer fewer\nart courses for science and technology students may ha"},{"n":621,"s":"Verb","t":"Critical Reasoning","d":"E","topic":"Critical Reasoning \u2014 Assumption","q":"Ramirez: The film industry claims that pirated DVDs, which are usually cheaper than\nlegitimate DVDs and become available well before a film\u2019s official DVD release date, adversely\naffect its bottom line. But the industry should note what the spread of piracy indicates:\nconsumers want lower prices and faster DVD releases. Lowering prices of DVDs and releasing\nthem sooner would mitigate piracy\u2019s negative effect on film industry profits.\nThe argument above relies on which of the following assumption","opts":{"A":"Releasing legitimate DVDs earlier would not cause any reduction in the revenue the film","B":"Some people who would otherwise purchase pirated DVDs would be willing to purchase","C":"The film industry will in the future be able to produce DVDs more cheaply than is","D":"Some current sellers of pirated DVDs would likely discontinue their businesses if"},"ans":"B","exp":"Argument Construction\nSituation\n\nPirated DVDs of films are released earlier than the film\u2019s official DVD release\nday. They are also sold more cheaply. These practices cut into the revenue\nexpected from a film\u2019s official DVD sales. According to Ramirez, the prevalence\nof piracy indicates that consumers want lower prices and earlier releases.\nRamirez concludes that if the official DVDs were sold more cheaply and\nreleased earlier, the impact of piracy on film industry profits might be reduced.\n\nReasoning\n\nWhat must Ramirez assume for the argument to be logically correct? To evaluate\nwhich answer choice the argument relies on assuming, ask yourself about each\nanswer choice, \u201cIf this statement were false, then would the argument\u2019s\nconclusion also have to be false?\u201d If the answer is yes, then the argument must\nbe making that assumption. For example, suppose the statement made in\nanswer choice B were false. That would mean that none of the people who\nwould otherwise purchase pirated DVDs would be willing to purchase\nlegitimate DVDs even if these were released earlier and at a significantly lower\nprice. If that were so, then the measures Ramirez suggests would not mitigate\npiracy.\n\nA. This"},{"n":622,"s":"Verb","t":"Critical Reasoning","d":"E","topic":"Critical Reasoning \u2014 Explain","q":"Harunia Province has a relatively dry climate and is attracting a fast-growing population that\nhas put increasing demands on its water supply. The two companies that supply water to the\nregion have struggled to keep up with demand and still remain profitable. Yet now they are\nasking Harunian authorities to write residential water-use regulations that could reduce their\nrevenues and restrict their future flexibility in supplying water profitably.\nWhich of the following would, if true, most logica","opts":{"A":"The companies are planning large water-transportation and irrigation systems that","B":"The companies believe regulation is inevitable and that having it in place now will allow","C":"Few, if any, Harunian government officials have investments in the companies or serve on","D":"The companies believe that the population is not likely to continue to grow.","E":"Long-term climate projections suggest that greater rainfall will eventually increase the"},"ans":"B","exp":"Argument Construction\nSituation\n\nTwo water-supply companies are asking the authorities in Harunia Province to\nregulate residential water use, even though regulation could reduce their\nrevenues and restrict their flexibility in supplying water profitably in the\nfuture.\n\nReasoning\n\nWhich piece of information would most help explain why the companies are\nadvocating water-use regulations that would restrict their operations? The\ncompanies are already struggling to keep up with demand from a fast-growing\npopulation in the region. So why would they advocate regulations that could, at\nleast in the immediate term, reduce their profits and restrict them? Is there any\n\n\f\nadvantage that the companies perceive\u2014an advantage that would outweigh\nany disadvantages\u2014in getting regulations instituted soon?\nA. It is unclear how this information bears on the companies\u2019 request for regulations in\nHarunia Province, since neighboring provinces seem primarily involved.\nB. Correct. The companies presumably must strategically plan their capital investments to\ncope with increasing water demand in Harunia Province and to receive adequate return\non that investment. In that context it seems critically important "},{"n":623,"s":"Verb","t":"Critical Reasoning","d":"E","topic":"Critical Reasoning \u2014 Strengthen","q":"Loss of the Gocha mangrove forests has caused coastal erosion, reducing fish populations and\nrequiring the Gocha Fishing Cooperative (GFC) to partially fund dredging and new shore\nfacilities. However, as part of its subsidiary businesses, the GFC has now invested in a program\nto replant significant parts of the coast with mangrove trees. Given income from a controlled\nharvest of wood with continuing replanting, the mangrove regeneration effort makes it more\nlikely that the cooperative will incre","opts":{"A":"The cost of dredging and shore facilities was shared with the local government.","B":"The GFC will be able to hire local workers to assist with the mangrove replanting.","C":"The GFC derives 10 percent of its revenue from salt-production facilities in an area","D":"Mangrove forests tend to increase the commercial fish populations in coastal fishing","E":"A controlled harvesting of mangrove wood by the GFC would have little effect on coastal"},"ans":"D","exp":"Argument Evaluation\nSituation\n\nA subsidiary business of the Gocha Fishing Cooperative (GFC) has invested in a\nprogram to replant significant parts of the coast with mangrove trees.\n\nReasoning\n\nWhat additional information, if true, would most strengthen the argument\u2019s\nsupport for the conclusion that the mangrove regeneration effort will increase the\nGFC\u2019s net income? If the regeneration effort helped the GFC\u2019s fishing\noperations, this could lead to an increase in GFC\u2019s income.\n\n\f\nA. If the local government helped with the cost of dredging and shore facilities, that would\nhelp reduce the GFC\u2019s costs, but that is not directly related to the impact of the GFC\u2019s\nmangrove regeneration effort on GFC\u2019s net income.\nB. It is unclear whether hiring local workers to assist with mangrove replanting would be\nless costly than hiring workers from elsewhere, so it is unclear whether this would help\nthe GFC increase its net income.\nC. The information provided does not indicate whether the mangrove regeneration effort\nwill have any effect on its salt-production facilities, or any revenue or profit that it derives\nfrom these facilities, so this does not strengthen the argument.\nD. Correct. If the mang"},{"n":624,"s":"Verb","t":"Critical Reasoning","d":"E","topic":"Critical Reasoning \u2014 Critical Reasoning","q":"Executives at the Fizzles Beverage Company plan to boost profits in Country X on their range\nof fruit-flavored drinks by introducing new flavors based on tropical fruits that are little\nknown there. The executives reason that since the fruit drinks of other companies have none\nof these flavors, Fizzles will not have to compete for customers and thus will be able to sell the\ndrinks at a higher price.\nWhich of the following, if true, presents the most serious potential weakness of the plan?","opts":{"A":"The new fruit drinks would be priced significantly higher than other Fizzles fruit drinks","B":"In a telephone survey, at least one of the consumers contacted said that they preferred"},"ans":"D","exp":"Situation\n\nFizzle Beverage Company\u2019s executives plan to offer drinks with tropical fruit\nflavors that are little known in Country X in the hope that doing so will boost\nprofits in that country. They reason that because their competitors in that\ncountry do not offer drinks with these flavors, Fizzle will be able to sell the\ndrinks at a premium price.\n\n\f\nReasoning\n\nWhat casts the most doubt on the claim that the executives\u2019 plan will effectively\nallow them to sell fruit-flavored drinks at a higher price? The executives believe\nthat the lack of a direct competitor to these drinks will allow the company to\nsell the drinks for a higher price. But any information indicating that something\nother than the specific fruit flavor of the drink drives sales of fruit-flavored\ndrinks would cast doubt on the plan.\n\nA. We have already been told that the prices will be higher. The question is whether they will\nbe able to sell the drink successfully at these higher prices as a result of the plan.\nB. This provides at least some very slight support for the belief that the plan would succeed\n(if no one at all preferred the new drinks, then the plan would almost certainly fail);\nhowever, the question ask"},{"n":625,"s":"Verb","t":"Critical Reasoning","d":"E","topic":"Critical Reasoning \u2014 Explain","q":"Economist: In 2015, the average per-person amount paid for goods and services purchased\nby consumers in Country X was the equivalent of $17,570 in United States dollars, just 30\npercent of the corresponding figure of $58,566 for Country Y. Yet in 2015, there was already a\nsubstantial middle class in Country X that had discretionary income for middle-class\nconsumer goods such as new vehicles, computers, or major household appliances, while a\nsignificant portion of the middle class in Country Y di","opts":{"A":"There are many consumer goods, such as household appliances, that are produced in","B":"The volume of trade between Country X and Country Y is increasing rapidly in both","C":"The economy of Country Y is recovering from a downturn that affected both Country Y","D":"Country X residents pay much less than their Country Y counterparts for housing,","E":"In Country Y as well as in Country X, there are few assembly-line jobs in factories that pay"},"ans":"D","exp":"Argument Construction\nSituation\n\nAn economist points out that even though in 2015 the average per-person\namount paid for goods and services in Country X was only 30 percent of the\ncorresponding figure in Country Y, a substantial middle class in Country X had\ndiscretionary income for consumer goods, whereas a substantial portion of\nthe middle class in Country Y did not.\n\nReasoning\n\nWhat, if true, would most help explain the discrepancies described by the\neconomist? Information indicating that residents in Country X pay much less\nfor nondiscretionary items than do residents of Country Y would help explain\nwhy, even though people in Country Y pay on average three times more for\ngoods and services than people in Country X, Country X has a more substantial\nmiddle class capable of buying discretionary goods than does Country Y.\n\nA. That many consumer goods produced in Country X are intended to be sold in Country Y\ndoes not help explain why many people in Country Y are not able to afford such goods.\nB. An increasing volume of trade between Country X and Country Y\u2014which, for all we know,\nis perfectly balanced\u2014would not help explain any discrepancies between the two\ncountries.\nC. That the e"},{"n":626,"s":"Verb","t":"Critical Reasoning","d":"E","topic":"Critical Reasoning \u2014 Inference","q":"Neuroscientist: Memory evolved to help animals react appropriately to situations they\nencounter by drawing on the past experience of similar situations. But this does not require\nthat animals perfectly recall every detail of all their experiences. Instead, to function well,\nmemory should generalize from past experiences that are similar to the current one.\nThe neuroscientist\u2019s statements, if true, most strongly support which of the following\nconclusions?","opts":{"A":"At least some animals perfectly recall every detail of at least some past experiences.","B":"Perfectly recalling every detail of all their past experiences could help at least some","C":"Generalizing from past experiences requires clear memories of most if not all the details","D":"Recalling every detail of all past experiences would be incompatible with any ability to","E":"Animals can often react more appropriately than they otherwise would to situations they"},"ans":"E","exp":"Argument Construction\nSituation\n\nA neuroscientist claims that memory evolved to help animals learn how to\nreact appropriately by generalizing from past experiences but that this does\nnot require animals to remember all details of those experiences.\n\nReasoning\n\nWhat conclusion would the neuroscientist\u2019s theory about memory most strongly\nsupport? The neuroscientist asserts that the evolutionary function of memory\nis to help animals learn to react appropriately by drawing on generalizations\nfrom similar experiences they have had. If memory is to serve this function,\ndrawing on generalizations must actually help animals learn to react more\nappropriately than they otherwise would, even when they do not remember all\nthe details of past experiences.\n\nA. Even if no animal ever recalls all the details of any past experience, animals could still\nlearn through generalizations, as the neuroscientist claims.\nB. This statement could be false even if all of what the neuroscientist says is true. Even if it\nwere never helpful for any animal to recall every detail of all its past experiences, animals\ncould still benefit by learning through generalizations.\nC. Generalizations from experiences might b"},{"n":627,"s":"Verb","t":"Critical Reasoning","d":"E","topic":"Critical Reasoning \u2014 Critical Reasoning","q":"In Country X\u2019s last election, the Reform Party beat its main opponent, the Conservative Party,\nalthough pollsters, employing in-person interviews shortly before the vote, had projected a\nConservative Party victory. Afterward, the pollsters determined that, unlike Conservative Party","opts":{},"ans":"C","exp":"Argument Evaluation\nSituation\n\nPollsters, using in-person interviews shortly before the last election in Country\nX, incorrectly predicted that the Conservative Party would win that election,\nwhereas the Reform Party won instead. The pollsters determined that Reform\nParty supporters, unlike Conservative Party supporters, are less likely to give\ntheir party preference in person than in telephone interviews.\n\nReasoning\n\nWhat additional information, if true, would most strengthen the support, in light\nof the given information, for the prediction that using only telephone interviews\nwould result in more accurate projections in the next election in Country X? Even\nif in telephone interviews pollsters are more likely to get accurate information\nabout which party a person interviewed supports, the pollsters\u2019 projections\nmay not be accurate if the pollsters are unable to determine whether that\nperson is actually likely to vote. So, information indicating that pollsters will be\nable to determine the likelihood that a person will vote would strengthen\nsupport for the conclusion.\n\nA. If this larger number of voters in the next election is not anticipated by pollsters, then it\nmay affect the ac"},{"n":628,"s":"Verb","t":"Critical Reasoning","d":"E","topic":"Critical Reasoning \u2014 Weaken","q":"A company that manufactures plastic products from recyclable plastic is, surprisingly,\nunconcerned that economic conditions may worsen, despite analysts\u2019 belief that consumers\nwould then consider ecofriendly plastic products an expensive luxury. But the company\nreasons that it will be able to lower its prices because, in a weakened economy, other\necofriendly plastic manufacturers are likely to fail. Demand among manufacturers for\nrecyclable plastics as raw materials would then plummet, creating ","opts":{"A":"Smaller ecofriendly plastic manufacturers are more likely to fail in a weakened economy","B":"Some retailers whose sales include various companies\u2019 ecofriendly plastic products have","C":"Consumers would likely soon learn of the oversupply of recyclable plastics and cease","D":"Retailers, including retailers that cater to consumers seeking certain types of ecofriendly","E":"The plastics used by the company in its products were, after a recent investigation by a"},"ans":"C","exp":"Argument Evaluation\nSituation\n\nA company that manufactures products from recyclable plastics believes that if\neconomic conditions worsen, it will be able to lower its prices. It believes its\ncosts will decline because other ecofriendly plastic manufacturers will fail,\nthereby reducing the demand for recyclable plastics as raw materials.\n\nReasoning\n\nWhat would most weaken the reasoning? Suppose the company\u2019s costs did not\ndecline and the company consequently could not reduce its prices. Even if\ndemand for recyclable plastics as raw materials weakens in an economic\ndownturn, the company\u2019s costs may nonetheless not decline if for some reason\nthe supply of recyclable plastics also declines. If so, then the company may well\nnot be able to lower its prices and stay profitable.\n\nA. We are not told whether the company in question is a smaller ecofriendly plastic\nmanufacturer or a larger one. Given that, the fact that smaller such companies are more\nlikely to fail than larger ones may strengthen the argument rather than weaken it\n(assuming the company in question is a larger such company).\nB. If some retailers whose sales include various companies\u2019 ecofriendly plastic products\nhave struggle"},{"n":629,"s":"Verb","t":"Critical Reasoning","d":"E","topic":"Critical Reasoning \u2014 Critical Reasoning","q":"Researchers asked volunteers to imagine they were running a five-kilometer race against 50\npeople and then against 500 people, races in each of which the top 10 percent would receive a\n$1,000 prize. Asked about the effort they would apply in the respective cases, the volunteers\nindicated, on average, that they would run slower in the race against the greater number of\npeople. A likely explanation of this result is that those of the volunteers who were most\ncomparatively inclined\u2014those who most t","opts":{},"ans":"D","exp":"Argument Construction\nSituation\n\nVolunteers were asked how much effort they would expend when running a\nfive-kilometer race against 50 people and how much they would expend in\nsuch a race against 500 people, when the prize for each race is $1,000 for\nfinishing in the top 10 percent. The volunteers indicated, on average, that they\nwould run more slowly in the race against 500 people than in the race against\n50 people. This result is likely because comparatively inclined volunteers\nbelieved that extreme effort would not have been worthwhile in the race\nagainst 500 competitors.\n\nReasoning\n\nWhat would most help to justify the explanation proposed above? If\ncomparatively inclined volunteers thought it was at least as likely that they\nwould finish in the top 10 percent in the race against 500 as in the race against\n50, the proposed explanation would fail. Thus, it would help justify the\nexplanation if we knew that the comparatively inclined volunteers believed\nthey were less likely to win in the race against 500 than in the race against 50.\n\nA. If one knew that the volunteers who were most comparatively inclined had the greatest\ndesire to win the $1,000, one might actually be more puzzle"},{"n":630,"s":"Verb","t":"Critical Reasoning","d":"E","topic":"Critical Reasoning \u2014 Complete","q":"According to a study, after a week of high-altitude living, twenty men had slimmed down. The\nmen, middle-aged residents of low-altitude areas, had been taken to a research station at\n2,650 meters (8,694 feet) above sea level. They had unrestricted access to food and were\nforbidden vigorous exercise, yet they lost an average of 1.5 kilograms (3.3 pounds) during\ntheir one-week stay. Clearly, the lower availability of oxygen at higher altitudes, or hypobaric\nhypoxia, can be said to have caused the ","opts":{"A":"a decrease in oxygen intake has been shown to depress appetite","B":"the men all participated in the same kinds of exercise during their stay","C":"the foods available to the men had fewer calories than the foods they usually ate","D":"exercise at higher altitudes is more difficult than exercise at lower altitudes is","E":"several weeks after returning home, the men still weighed less than they had before the"},"ans":"A","exp":"Argument Construction\nSituation\n\nTwenty middle-aged men lived at a high-altitude research station for one week.\nThey had unrestricted access to food but did no vigorous exercise. By the end\nof their stay, they had lost an average 1.5 kilograms (3.3 pounds) of weight.\n\nReasoning\n\nWhich additional information, if true, would most help support the claim that\nlower availability of oxygen at higher altitudes caused the weight loss? The\npuzzlement arises from the fact that the twenty men had free access to food\nand did no vigorous exercise. And consuming less of the types of food they\nwould normally eat would have caused weight loss. But suppose one or both\nof these behaviors had not occurred?\n\nA. Correct. This information helps support the explanatory hypothesis that lower oxygen\nlevels accounted for the weight loss. The men\u2019s intake of oxygen certainly decreased at an\naltitude of 2,650 meters (8694 feet), since they normally lived in low-altitude areas.\nMoreover, reduced appetite would provide a mechanism by which weight loss could have\noccurred.\nB. The men were forbidden vigorous exercise, and we can assume that, in a research\ncontext, they followed this restriction. Mild exercise wou"},{"n":631,"s":"Verb","t":"Critical Reasoning","d":"E","topic":"Critical Reasoning \u2014 Assumption","q":"Editorial: Our city\u2019s public transportation agency is facing a budget shortfall. The fastestgrowing part of the budget has been employee retirement benefits, which are exceptionally\ngenerous. Unless the budget shortfall is resolved, transportation service will be cut, and many\ntransportation employees will lose their jobs. Thus, it would be in the employees\u2019 best interest\nfor their union to accept cuts in retirement benefits.\nWhich of the following is an assumption the editorial\u2019s argument requi","opts":{"A":"The transportation employees\u2019 union should not accept cuts in retirement benefits if","B":"The only feasible way for the agency to resolve the budget shortfall would involve cutting","C":"Other things being equal, it is in the transportation employees\u2019 interest to have","D":"Cutting the retirement benefits would help resolve the agency\u2019s budget shortfall.","E":"The transportation employees\u2019 union will not accept cuts in retirement benefits if doing"},"ans":"D","exp":"Argument Construction\nSituation\n\nAn editorial indicates that the fastest growing part of a particular city\u2019s public\ntransportation agency\u2019s budget is employee retirement benefits. The agency\u2019s\nbudget has a shortfall. If the shortfall is not resolved, transportation service\nwill be cut, and many of the employees will lose their jobs.\n\nReasoning\n\nWhat must be true if we are to accept the editorial\u2019s conclusion, that it is in the\nemployees\u2019 best interest to accept cuts in retirement benefits? If cutting the\nemployees\u2019 retirement benefits would not be sufficient to resolve the budget\nshortfall, then it may well not be in the employees\u2019 best interest to accept such\ncuts. The reasons given for accepting the cuts are related to the undesirable\nconsequences of a continued shortfall.\n\nA. The argument is about whether the union\u2019s accepting the cuts is in fact in the employees\u2019\nbest interest and does not require any assumption about whether employees should\naccept what is in their best interest.\nB. This is incompatible with an assumption made by the argument. The argument assumes\nthat cutting the retirement benefits of the employees would help resolve the budget\nshortfall.\n\n\f\nC. The argument "},{"n":632,"s":"Verb","t":"Critical Reasoning","d":"E","topic":"Critical Reasoning \u2014 Critical Reasoning","q":"Researchers hope to find clues about the A\u2019mk peoples who lived in the Kaumpta region about\none thousand years ago but who left few obvious traces. The researchers plan to hire the few\nremaining shamans of the modern-day indigenous people in Kaumpta, who are believed to be\ndescended from the A\u2019mk, to lead them to ancestral sites that may be the remains of A\u2019mk","opts":{},"ans":"B","exp":"Situation\n\nResearchers wish to find sites of an ancient people, the A\u2019mk, who lived in the\nKaumpta region one thousand years ago. Indigenous people believed to be\ndescended from the A\u2019mk live in that region today. Their shamans, as youths,\nwere taught about such sites. To discover some of these sites, the researchers\nplan to hire the shamans.\n\nReasoning\n\nWhat must be true for the success of the researchers\u2019 plan to find the sites by\nrelying on the shamans\u2019 assistance? The plan would fail, for example, if there\nwere no such sites in the Kaumpta region. Therefore, the researchers\u2019 plan\ndepends on assuming that Kaumpta have some such sites\u2014but not that most\nof the sites are there. The plan also requires that the shamans collectively have\nreasonably accurate recall of what they learned about the sites as youths.\n\nA. The researchers hope to find buildings or ceremonial spaces or both. However, the plan\ndoes not require ceremonial spaces to be found or that the researchers have evidence of\nthem.\nB. Correct. If the shamans collectively have no \u201creasonably accurate memory\u201d of what they\nlearned of the location of such sites, then the researchers\u2019 plan is not a useful one and\ncan have no rea"},{"n":633,"s":"Verb","t":"Critical Reasoning","d":"E","topic":"Critical Reasoning \u2014 Strengthen","q":"Astronomer: Most stars are born in groups of thousands, each star in a group forming from\nthe same parent cloud of gas. Each cloud has a unique, homogeneous chemical composition.\nTherefore, whenever two stars have the same chemical composition as each other, they must\nhave originated from the same cloud of gas.\nWhich of the following, if true, would most strengthen the astronomer\u2019s argument?","opts":{"A":"In some groups of stars, not every star originated from the same parent cloud of gas.","B":"Clouds of gas of similar or identical chemical composition may be remote from each","C":"Whenever a star forms, it inherits the chemical composition of its parent cloud of gas.","D":"Many stars in vastly different parts of the universe are quite similar in their chemical","E":"Astronomers can at least sometimes precisely determine whether a star has the same"},"ans":"C","exp":"Argument Evaluation\nSituation\n\nMost stars are born in groups, any one of which forms from a parent gas cloud\nwith a unique, homogenous chemical composition.\n\nReasoning\n\nWhat would be additional evidence that any two stars with the same chemical\ncomposition originated from the same gas cloud? The implicit reasoning is that\nsince the chemical composition of each gas cloud is unique and homogenous,\nany two stars that formed from gas with the same chemical composition must\nhave originated from the same cloud. The astronomer then infers that if two\nstars have the same composition now, they must have originated from the\nsame cloud. This inference requires the assumption that the composition each\nstar has now depends only on the composition of the cloud in which it\noriginated. Any evidence that supports this assumption will strengthen the\nargument.\n\nA. Whether or not stars born in different clouds of gas are ever in the same \u201cgroup\u201d is not\nclearly relevant to whether or not they ever have the same chemical composition.\nB. How remote clouds of similar compositions are from each other is not clearly relevant to\nwhether stars that have the same chemical composition may have formed from diffe"},{"n":634,"s":"Verb","t":"Critical Reasoning","d":"E","topic":"Critical Reasoning \u2014 Critical Reasoning","q":"With employer-paid training, workers have the potential to become more productive not only\nin their present employment but also in any number of jobs with different employers. To\nincrease the productivity of their workforce, many firms are planning to maintain or even\nincrease their investments in worker training. But some training experts object that if a\ntrained worker is hired away by another firm, the employer that paid for the training has\nmerely subsidized a competitor. They note that such","opts":{"A":"Firms that promise opportunities for advancement to their employees get, on average,","B":"In many industries, employees who take continuing-education courses are more","C":"More and more educational and training institutions are offering reduced tuition fees to","D":"Research shows that workers whose training is wholly or partially subsidized by their"},"ans":"E","exp":"Situation\n\nMany firms pay to train their workers in order to increase their workforces\u2019\nproductivity. But in recent years, firms have been increasingly hiring away from\neach other workers who have had such training.\n\nReasoning\n\nWhat would most help address the concern that firms that pay to train workers\nare thereby subsidizing competitors that hire away those workers? In order for\nthe employer-paid training to be worthwhile for a given firm despite the risk of\nsubsidizing competitors that may hire away the trained workers, that firm has\nto gain more benefits from the training than it loses by subsidizing such\ncompetitors. Any evidence that this is true for most firms would help to\naddress the experts\u2019 concern.\n\n\f\nA. A typical firm does not necessarily want larger numbers of applications from unqualified\nworkers. And if hired, those workers can still be hired away by competitors after the firm\nhas paid to train them, just as the experts warned.\nB. This suggests that in many industries, companies, rather than investing in employee\ntraining, prefer to hire employees who already have specifically relevant training\n(perhaps funded by other companies). If anything, this slightly support"},{"n":635,"s":"Verb","t":"Critical Reasoning","d":"E","topic":"Critical Reasoning \u2014 Critical Reasoning","q":"In emerging economies in Africa and other regions, large foreign banks that were set up\nduring the colonial era have long played a major economic role. These institutions have\ntended to confine their business to the wealthier of banks\u2019 potential customers. But\ndevelopment of these countries\u2019 economies requires financing of the small businesses that\ndominate their manufacturing, farming, and services sectors. So economic growth will be\nlikely to occur if local banks take on this portion of the fi","opts":{"A":"local banks tend not to strive as much as large foreign banks to diversify their","B":"small farming and manufacturing businesses contribute to economic growth if they","C":"large foreign banks in emerging economies could, with local employees and appropriate","D":"some small businesses are among the wealthier customers of foreign banks in emerging","E":"local banks in emerging economies tend to be less risk-averse than foreign banks"},"ans":"B","exp":"Argument Construction\nSituation\n\nLarge foreign banks have long played an economic role in emerging\neconomies, but they have typically confined their business to wealthier\ncustomers. Economic development in these countries requires the financing of\nsmall businesses that dominate their manufacturing, farming, and services\nsectors.\n\nReasoning\n\nWhat would most help support the claim that growth in emerging economies will\nlikely occur if local banks help finance small businesses in the relevant sectors of\nthese emerging markets? If it were the case that these small businesses would\n\n\f\nactually be likely to contribute to economic growth, given adequate investment\ncapital, then economic growth would indeed be likely to occur if local banks\nprovided the investment capital.\nA. It could be the case that whatever sorts of investments local banks make\u2014diversified or\nnot\u2014economic growth will not tend to occur; for instance, it could be that the businesses\nthey invest in do not use the capital wisely. So, this claim does not help support the\nconclusion.\nB. Correct. If small farming and manufacturing businesses will contribute to economic\ngrowth if they obtain adequate investment capital, then we"},{"n":636,"s":"Verb","t":"Critical Reasoning","d":"E","topic":"Critical Reasoning \u2014 Complete","q":"Exporters in Country X are facing lower revenues due to a shortage of the large metal\nshipping containers in which they send their goods by sea to other countries. Fewer\ncontainers arrive in Country X due to reductions in imports. This has meant lost orders, costly\ndelays, and a scramble for alternatives, such as air freight, all of which are costlier. Moreover,\nthe revenues of exporters in Country X will probably continue to decline in the near future.\nThis is because other countries are likely","opts":{"A":"production of shipping containers in Country X is growing rapidly as a response to the","B":"shipping companies are willing to move containers from country to country only when","C":"the cost of shipping alternatives such as air freight is likely to stabilize in the near future","D":"consumers in Country X are purchasing more products than ever before","E":"the worldwide demand for goods made in Country X has only recently begun to rise after"},"ans":"B","exp":"Argument Construction\n\n\f\nSituation\n\nExporters in Country X are finding that there is an insufficient number of\nshipping containers for them to use for their exports, because the number of\nsuch containers arriving in Country X has declined because of reduced\nimports. Also, alternative methods of shipping are relatively costly.\nFurthermore, other countries will likely find shipping goods to Country X to be\nless and less profitable.\n\nReasoning\n\nWhat would most support the prediction that Country X\u2019s exporters\u2019 revenues will\nlikely see further declines in revenue in the near future? If the number of\nshipping containers available to exporters is likely to decrease, then the\nprediction would have further support. We know that other countries\nexporting to Country X will find it increasingly unprofitable, so there is reason\nto believe their exports will decline further\u2014meaning there will be fewer\nimports into Country X, which means fewer shipping containers arriving in\nCountry X carrying imported goods, unless the shipping containers shipped in\nthe future are less full than when they are shipped now. If shipping companies\nare willing to move such containers to another country only when the"},{"n":637,"s":"Verb","t":"Critical Reasoning","d":"E","topic":"Critical Reasoning \u2014 Strengthen","q":"Candle Corporation\u2019s television stations are likely to have more income from advertisers than\npreviously. This is because advertisers prefer to reach people in the 18- to 49-year-old age\ngroup and the number of people in that group watching Candle television is increasing.\nFurthermore, among Candle viewers, the percentage of viewers 18 to 49 years old is\nincreasing.\nWhich of the following, if true, would most strengthen the argument that Candle Corporation\nwill receive more income from advertise","opts":{},"ans":"A","exp":"Argument Evaluation\nSituation\n\nBoth the number and the percentage of Candle television viewers who are 18\nto 49 years old are increasing. Advertisers prefer to reach people in this age\ngroup.\n\nReasoning\n\nWhat evidence, when combined with the cited facts, would most support the\nprediction that Candle will receive more income from advertisers? The argument\nassumes that the increasing number and percentage of Candle viewers in the\nage group that advertisers prefer to reach will probably encourage advertisers\nto spend more on advertising with Candle. This assumption could be\nsupported by evidence that the advertisers realize that Candle is getting more\nviewers in that preferred age range or by evidence that this awareness will\ninfluence the advertisers\u2019 purchase of advertising time.\n\nA. Correct. Advertisers monitoring demographics will probably realize that Candle has\nincreasing numbers of viewers in their preferred age range. If they purchase advertising\nto reach viewers in that age range, then they will probably purchase more advertising\ntime with Candle.\nB. This gives advertisers less reason to advertise on Candle to reach viewers over 49 years\nold. Other things being equal, that ma"},{"n":638,"s":"Verb","t":"Critical Reasoning","d":"E","topic":"Critical Reasoning \u2014 Inference","q":"A provincial government plans to raise the gasoline tax to give people an incentive to drive\nless, reducing traffic congestion in the long term. However, skeptics point out that most people\nin the province live in areas where cars are the only viable transportation to jobs and stores\nand therefore cannot greatly change their driving habits in response to higher gasoline prices.\nIn light of the skeptics\u2019 objection, which of the following, if true, would most logically support\nthe prediction that ","opts":{"A":"The revenue from the tax will be used to make public transportation a viable means of","B":"The tax will encourage many residents to switch to more fuel-efficient cars, reducing air","C":"Because gasoline has been underpriced for decades, the province has many","D":"Most residents who cannot greatly change their driving habits could compensate for high","E":"Traffic congestion is an especially serious problem for people for whom cars are the only"},"ans":"A","exp":"Situation\n\nA provincial government plans to raise the gasoline tax in order to reduce\ntraffic congestion by discouraging people from driving. But skeptics point out\nthat most people in the province have no viable form of transportation other\nthan driving.\n\nReasoning\n\nWhat would suggest that raising the gasoline tax will reduce traffic congestion\neven though most people in the province have no viable form of transportation\nother than driving? The skeptics point out that since most people in the\nprovince have no way to reach jobs or stores except by car, they will not be\nable to reduce their driving much even if the gasoline tax increases. Any\nevidence that raising the gasoline tax would reduce traffic congestion despite\nthis obstacle would help to support the plan in light of the skeptics\u2019 objection.\n\nA. Correct. If the tax will fund these public transit improvements, then far more people will\nhave a viable means of transportation other than driving, undermining the basis of the\nskeptics\u2019 objection.\nB. People switching to fuel-efficient cars would not reduce traffic congestion.\nC. This essentially only tends to support the skeptics\u2019 objection. Unless the plan somehow\nhelps to allevi"},{"n":639,"s":"Verb","t":"Critical Reasoning","d":"E","topic":"Critical Reasoning \u2014 Weaken","q":"Editorial: The roof of Northtown\u2019s municipal equipment-storage building collapsed under the\nweight of last week\u2019s heavy snowfall. The building was constructed recently and met local\nbuilding-safety codes in every particular, except that the nails used for attaching roof supports\nto the building\u2019s columns were of a smaller size than the codes specify for this purpose.\nClearly, this collapse exemplifies how even a single, apparently insignificant departure from\nsafety standards can have severe con","opts":{"A":"The only other buildings to suffer roof collapses from the weight of the snowfall were","B":"The amount of snow that accumulated on the roof of the equipment-storage building was","C":"Because the equipment-storage building was not intended for human occupation, some","D":"The municipality of Northtown itself has the responsibility for ensuring that buildings","E":"Because the equipment-storage building was used for storing snow-removal equipment,"},"ans":"B","exp":"Argument Evaluation\nSituation\n\nThe roof of a recently constructed building collapsed under heavy snowfall.\nThe only way the building did not meet safety standards was that some nails\nfor the roof supports were smaller than prescribed by the building codes.\n\nReasoning\n\nWhat would make it less likely that the building\u2019s collapse resulted from a single,\napparently minor departure from safety standards? The building met safety\nstandards except for the size of the nails. So if the collapse exemplifies how a\ndeparture from safety standards can have severe consequences, as the\nconclusion claims, then the size of the nails had to be responsible for the\ncollapse. Thus, evidence that a factor other than the size of the nails could fully\naccount for the collapse would weaken the argument.\n\nA. This suggests that the snow would not have been heavy enough to collapse the roof if the\nconstruction had completely met the safety standards, so it strengthens, rather than\nweakens, the argument.\nB. Correct. This suggests that the snow could have collapsed the roof even if the nails had\nmet the safety standards, thus casting doubt on the assumption that the nails\u2019 inadequacy\nwas responsible for the coll"},{"n":640,"s":"Verb","t":"Critical Reasoning","d":"E","topic":"Critical Reasoning \u2014 Complete","q":"Political theorist: Even with the best spies, area experts, and satellite surveillance, foreign\npolicy assessments can still lack important information. In such circumstances intuitive\njudgment is vital. A national leader with such judgment can make good decisions about\nforeign policy even when current information is incomplete, since __________.\nWhich of the following, if true, most logically completes the argument?","opts":{"A":"the central reason for failure in foreign policy decision making is the absence of critical","B":"those leaders whose foreign policy decisions have been highly ranked have also been","C":"both intuitive judgment and good information are required for sound decision-making","D":"good foreign policy decisions often lead to improved methods of gathering information","E":"intuitive judgment can produce good decisions based on past experience, even when"},"ans":"E","exp":"Argument Construction\nSituation\n\nNational leaders sometimes must make foreign policy decisions while lacking\nimportant information.\n\nReasoning\n\nWhat would most help support the claim that a national leader with intuitive\njudgment can make good foreign policy decisions without complete information?\nThe word since preceding the blank indicates that the blank should be filled\nwith a premise supporting the statement immediately before the blank. So, an\nobservation that supports the claim that a national leader with intuitive\njudgment can make good foreign policy decisions without complete\ninformation would logically complete the argument.\n\nA. This gives us no reason to suppose that intuitive judgment helps national leaders avoid\nsuch failures.\nB. This does not specify who ranked the foreign policy decisions, nor how they determined\nthe rankings, so it gives us no reason to accept those rankings. For all we know, the\nanonymous rankers may have used the dubious rankings they created as the sole\nevidence for their so-called findings about which leaders have good intuitive judgment.\nC. This implies that intuitive judgment alone is inadequate without good information, so it\nundermines rathe"},{"n":641,"s":"Verb","t":"Critical Reasoning","d":"E","topic":"Critical Reasoning \u2014 Strengthen","q":"Supply shortages and signs of growing demand are driving cocoa prices upward. Unusually\nsevere weather in cocoa-producing regions\u2014too much rain in Brazil and too little in West\nAfrica\u2014has limited production. Further, Europe and North America recently reported\nstronger demand for cocoa. In the first quarter, grinding of cocoa beans\u2014the first stage in\nprocessing cocoa for chocolate\u2014rose 8.1 percent in Europe and 16 percent in North America.\nAnalysts have concluded that cocoa\u2019s price will continue ","opts":{"A":"Ground cocoa beans can be stored for long periods before they spoil.","B":"Several European and North American manufacturers that use cocoa have recently","C":"It takes new cocoa trees five or six years before they start bearing fruit.","D":"Governments in Europe and North America are likely to change current restrictions on","E":"Historically, cocoa production has varied widely from year to year."},"ans":"C","exp":"Argument Evaluation\nSituation\n\nThere has been limited production of cocoa beans due to severe weather and\nalso increased demand for cocoa; as a result, cocoa prices have risen.\n\nReasoning\n\nWhat would help support the analysts\u2019 inference that cocoa prices will continue to\nrise at least into the near future? If the price of cocoa is to continue to rise, then\nthe conditions that have led to the recent increase in price must not be\nameliorated. They would be ameliorated if demand for cocoa beans declined,\ne.g., because price increases made people less likely to want ground cocoa;\nthey would also be ameliorated if supply increased, e.g., because many new\ncocoa trees were planted and very quickly started bearing fruit. If we had\nreason to believe that one or more of these ameliorating factors is unlikely to\nhappen, then we have more reason to think that prices might stay high, and\npossibly even rise further.\n\nA. That ground cocoa beans can be stored for long periods without spoiling does not tell us\nwhether supply and demand conditions will stay stable, improve, or get worse.\nB. The fact that these manufacturers have recently improved their processing capacity might\nhelp explain why the "},{"n":642,"s":"Verb","t":"Critical Reasoning","d":"E","topic":"Critical Reasoning \u2014 Explain","q":"During the earliest period of industrialization in Britain, steam engines were more expensive\nto build and operate than either windmills or water mills, the other practicable sources of\npower for factories. Yet despite their significant cost disadvantage, steam-powered factories\nwere built in large numbers well before technical improvements brought their cost down.\nFurthermore, they were built even in regions where geographical conditions permitted the\nconstruction of wind- and water-powered fac","opts":{"A":"In many areas of Britain, there were fewer steam-powered factories than wind- or waterpowered factories in the earliest period of industrialization.","B":"Unlike wind- or water-powered factories, steam-powered factories were fueled with coal,","C":"It was both difficult and expensive to convert a factory from wind power or water power"},"ans":"E","exp":"Argument Construction\nSituation\n\nAlthough steam engines were more expensive than windmills and water mills\nin early industrial Britain, many steam-powered factories were built even in\nregions where the construction of wind- and water-powered factories was\ngeographically feasible.\n\nReasoning\n\nWhy might steam-powered factories have proliferated despite their cost\ndisadvantage? Early industrialists would have needed some positive reason to\nchoose steam over less expensive power sources for their factories. For\nexample, steam engines might have operated faster or more effectively than\nwindmills or water mills. Or steam engines might have received government\nsubsidies. Or conditions restricting the number or locations of windmills and\nwater mills might have forced industrialists to use steam power instead.\n\nA. This suggests that the steam-powered factories did not initially proliferate as widely as\nthey might have, but it does not explain why they proliferated to the extent that they did.\nB. The inconvenience of transporting coal for steam-powered factories would have made\nthose factories less likely to proliferate, not more likely.\nC. The difficulty of converting factories to steam pow"},{"n":643,"s":"Verb","t":"Critical Reasoning","d":"E","topic":"Critical Reasoning \u2014 Critical Reasoning","q":"Snowmaking machines work by spraying a mist that freezes immediately on contact with cold\nair. Because the sudden freezing kills bacteria, QuickFreeze is planning to market a wastewater\npurification system that works on the same principle. The process works only when\ntemperatures are cold, however, so municipalities using it will still need to maintain a\nconventional system.\nWhich of the following, if true, provides the strongest grounds for a prediction that\nmunicipalities will buy QuickFreeze\u2019","opts":{"A":"Bacteria are not the only impurities that must be removed from wastewater.","B":"Many municipalities have old wastewater purification systems that need to be replaced.","C":"Conventional wastewater purification systems have not been fully successful in killing","D":"During times of warm weather, when it is not in use, QuickFreeze\u2019s purification system","E":"Places where the winters are cold rarely have a problem of water shortage."},"ans":"C","exp":"Situation\n\nQuickFreeze is planning to market wastewater purification systems that work\nby spraying a mist that freezes on contact with cold air. The sudden freezing\nkills bacteria. Because the system works only at cold temperatures,\nmunicipalities using it will still need to maintain a conventional system.\n\nReasoning\n\nWhich statement provides the strongest grounds for thinking that at least some\nmunicipalities will buy the purification system despite the need to maintain a\nconventional purification system as well? The passage tells us why a municipality\nusing a QuickFreeze wastewater purification system would still need a\nconventional system. But why would a municipality want the QuickFreeze\nsystem in addition to a conventional system? If conventional systems are not\nfully effective at cold temperatures, the QuickFreeze system would allow\nmunicipalities that sometimes experience cold temperatures to purify their\nwastewater more effectively.\n\nA. This neither weakens nor strengthens the prediction. There is no basis in the passage for\ndetermining whether the QuickFreeze system could help remove impurities other than\nbacteria from wastewater. If it did, the effect of this information "},{"n":644,"s":"Verb","t":"Critical Reasoning","d":"E","topic":"Critical Reasoning \u2014 Boldface","q":"Plant scientists have used genetic engineering on seeds to produce crop plants that are\nhighly resistant to insect damage. Unfortunately, the seeds themselves are quite expensive,\nand the plants require more fertilizer and water to grow well than normal ones. Accordingly,\nfor most farmers the savings on pesticides would not compensate for the higher seed\ncosts and the cost of additional fertilizer. However, since consumer demand for grains,\nfruits, and vegetables grown without the use of pestici","opts":{"A":"The first supplies a context for the argument; the second is the argument\u2019s main","B":"The first introduces a development that the argument predicts will have a certain","C":"The first presents a development that the argument predicts will have a certain outcome;","D":"The first provides evidence to support a prediction that the argument seeks to defend;","E":"The first and the second each provide evidence to support the argument\u2019s main"},"ans":"C","exp":"Argument Construction\nSituation\n\nSeeds genetically engineered by plant scientists produce crops that are highly\nresistant to insect damage, and such crops can be grown with less use of\npesticides. The seeds would be costly to use, and the savings on pesticides\nwould not be sufficient, in themselves, to increase most farmers\u2019 profitability.\nNonetheless, consumer demand for pesticide-free food materials is increasing,\nso genetically engineered seeds are likely to become widely used.\n\nReasoning\n\nWhat function is served by the statement that plant scientists have used genetic\nengineering on seeds to produce insect-resistant crop plants? What function is\nserved by the statement that for most farmers the savings on pesticides would not\noutweigh other associated costs? The first statement describes an innovation\u2014\ngenetically engineered seeds\u2014that allows crops to be grown with little or no\nuse of pesticides. The second statement notes that savings on pesticide use\nwould not outweigh the higher costs of the genetically engineered seeds. The\nargument\u2019s main conclusion, however, is the prediction, expressed in the\nsecond clause of the final sentence of the passage, that use of such geneticall"},{"n":645,"s":"Verb","t":"Critical Reasoning","d":"E","topic":"Critical Reasoning \u2014 Complete","q":"Which of the following most logically completes the passage?\nLeptin, a protein occurring naturally in the blood, appears to regulate how much fat the body\ncarries by speeding up the metabolism and decreasing the appetite when the body has too\nmuch fat. Mice that do not naturally produce leptin have more fat than other mice, but they\nlose fat rapidly when they are given leptin injections. Unfortunately, however, leptin cannot be\nused as a dietary supplement to control fat, since __________.","opts":{},"ans":"A","exp":"Argument Construction\nSituation\n\nLeptin, a protein naturally occurring in the bloodstream, speeds up\nmetabolism to induce loss of excessive fat. Mice that lack leptin have more fat\nthan other mice, but they lose fat when given leptin injections. However, leptin\ncannot be used as a dietary supplement to control fat.\n\nReasoning\n\nWhat would explain the fact that a dietary supplement of leptin will not help to\ncontrol fat? Leptin injected into the bloodstream\u2014but not leptin taken as a\ndietary supplement\u2014helps control fat. So, leptin taken as a dietary supplement\nis either inactivated in the gastrointestinal system or for some other reason\nfails to enter the bloodstream.\n\nA. Correct. The digestive system breaks down proteins and would therefore break down\nleptin, which is a protein. This means that leptin given as a dietary supplement would\nnever reach the bloodstream.\nB. The question concerns leptin alone, and this new information fails to explain why leptin\ncannot help control fat if administered as a dietary supplement.\nC. It is unsurprising that this would be so, but this information does nothing to explain why\nleptin consumed as a supplement would fail to control fat.\n\n\f\nD. Presuma"},{"n":646,"s":"Verb","t":"Critical Reasoning","d":"E","topic":"Critical Reasoning \u2014 Explain","q":"Suncorp, a new corporation with limited funds, has been clearing large sections of the tropical\nAmazon forest for cattle ranching. This practice continues even though greater profits can be\nmade from rubber tapping, which does not destroy the forest, than from cattle ranching,\nwhich does destroy the forest.\nWhich of the following, if true, most helps to explain why Suncorp has been pursuing the less\nprofitable of the two economic activities mentioned above?","opts":{"A":"The soil of the Amazon forest is very rich in nutrients that are important in the","B":"Cattle-ranching operations that are located in tropical climates are more profitable than","C":"In certain districts, profits made from cattle ranching are more heavily taxed than profits","D":"Some of the cattle that are raised on land cleared in the Amazon are killed by wildcats.","E":"The amount of money required to begin a rubber-tapping operation is twice as high as"},"ans":"E","exp":"Argument Construction\nSituation\n\nSuncorp is a new corporation with limited funds. It has been clearing large\nsections of the tropical Amazon forest for ranching, even though rubbertapping would be more profitable.\n\nReasoning\n\nWhat would explain why Suncorp is clearing sections of the rain forest for\nranching, even though rubber tapping would be more profitable? Because\nSuncorp has limited funds, if rubber tapping has much higher start-up costs,\nSuncorp might not have enough money to start rubber-tapping operations. If\ncattle ranching has much lower start-up costs than rubber tapping, Suncorp\nmight be able to afford such an operation.\n\nA. This statement gives a reason why cattle ranching in the Amazon might be more\nprofitable than one might otherwise think it would be. However, we already know from\nthe passage that rubber tapping would be more profitable than cattle ranching. So, this\nanswer choice does not help explain why cattle ranching might be preferable to rubber\ntapping.\nB. The comparison between the profitableness of cattle ranching in tropical climates and in\ncold-weather climates is irrelevant. The passage only covers cattle ranching in the tropical\nAmazon forest. This ans"},{"n":647,"s":"Verb","t":"Critical Reasoning","d":"E","topic":"Critical Reasoning \u2014 Critical Reasoning","q":"Archaeologists use technology to analyze ancient sites. It is likely that this technology will\nadvance considerably in the near future, allowing archaeologists to gather more information\nthan is currently possible. If they study certain sites now, they risk contaminating or\ncompromising them for future studies. Therefore, in order to maximize the potential for\ngathering knowledge in the long run, a team of archaeologists plans to delay the examination\nof a newly excavated site.\nWhich of the foll","opts":{"A":"Whether any of the contents of the site will significantly deteriorate before the","B":"Whether there will continue to be improvements on the relevant technology","C":"Whether the team can study a site other than the newly excavated site for the time being","D":"Whether the site was inhabited by a very ancient culture","E":"Whether the anticipated technology will damage objects under study"},"ans":"A","exp":"Situation\n\nTo avoid prematurely compromising a newly excavated site, an archaeological\nteam plans to postpone examining it until more advanced technology is\ndeveloped that will let them gather more information from it. Their goal is to\nmaximize the potential for gathering knowledge.\n\nReasoning\n\nWhat would be most helpful to investigate in order to assess how likely it is that\ndelaying examination of the site will maximize the potential for gathering\nknowledge from it? In order to maximize (or even increase) the potential for\ngathering knowledge from the site by delaying its examination, the risk of\ncompromising the site by examining it now has to be greater than the risk that\nthe site will be compromised as much or more by delaying the examination.\nThe delay might also increase the risk that the site will never be examined at all\n\u2014for example, the team might lose its funding while it delays, or changes in\nlocal political conditions might prevent the site\u2019s future examination.\nInvestigating any of these risks could be helpful in assessing the likelihood that\nthe team\u2019s plan will achieve its goal.\n\nA. Correct. If any of the site\u2019s contents will significantly deteriorate before the te"},{"n":648,"s":"Verb","t":"Critical Reasoning","d":"E","topic":"Critical Reasoning \u2014 Strengthen","q":"More and more law firms specializing in corporate taxes are paid on a contingency-fee basis.\nUnder this arrangement, if a case is won, the firm usually receives more than it would have\nreceived if it had been paid on the alternate hourly rate basis. If the case is lost, the firm\nreceives nothing. Most firms are likely to make more under the contingency-fee arrangement.\nWhich of the following, if true, would most strengthen the prediction above?","opts":{},"ans":"D","exp":"Argument Evaluation\nSituation\n\nLaw firms of a certain type are increasingly working on a contingency-fee\nbasis, whereby the firm is only paid if the case is won. For the individual cases\nthat are thus taken and won, the payments are generally greater than the total\npayments would have been if the firms had been paid on an hourly basis.\nFurthermore, although cases taken on a contingency-fee basis present a\nsignificant risk of working for many hours on a case and not being paid, the\npassage claims that most firms are likely to make more money, on average,\nthan they would if they took their cases on an hourly basis.\n\nReasoning\n\nWhat would most strongly indicate that, despite the risks, the law firms working\non a contingency-fee basis are likely to make more money, on average, than they\nwould have otherwise? Our task is to find the statement that would most\nstrongly support this prediction. A primary risk of using contingency fees is\nthat a firm might have so many unsuccessful cases that the average revenue\n(and profit) is less than it would have been with hourly fees. Anything\nindicating that the firms might be able to reduce that risk would provide some\n\n\f\nsupport for the prediction "},{"n":649,"s":"Verb","t":"Critical Reasoning","d":"E","topic":"Critical Reasoning \u2014 Weaken","q":"Pretzel vendor: The new license fee for operating a pretzel stand outside the art museum is\nprohibitively expensive. Charging typical prices, I would need to sell an average of 25 pretzels\nper hour to break even. At my stand outside City Hall, with about as many passers-by as at the\nart museum, I average only 15 per hour. So I could not break even running a stand outside the\nart museum, much less turn a profit.\nWhich of the following, if true, most seriously weakens the pretzel vendor\u2019s argument","opts":{"A":"The pretzel vendor does not sell anything other than pretzels.","B":"People who visit the art museum are more likely to buy pretzels than are people who go","C":"The license fee for operating a pretzel stand outside City Hall will not increase.","D":"People who buy pretzels at pretzel stands are more likely to do so during the lunch hour","E":"The city will grant more licenses for pretzel stands outside the art museum than the"},"ans":"B","exp":"Argument Evaluation\nSituation\n\nBecause of a new license fee for operating a pretzel stand outside the art\nmuseum, a pretzel vendor would have to sell on average 25 pretzels per hour\nto break even, which is 10 more on average than the vendor sells outside\nCity Hall. But the museum would have no more passers-by than City Hall has.\nThe vendor concludes that a pretzel stand outside the museum would not\nbreak even.\n\nReasoning\n\nWhat additional information, if true, would most weaken the support, in light of\nthe given information, for the prediction that the vendor would not break even\nrunning a stand outside the art museum? The vendor\u2019s prediction that a pretzel\nstand outside the art museum would not break even is based on the following\nconsiderations: (1) the vendor would have to sell 10 more pretzels on average\nper hour than the vendor sells outside City Hall, and (2) there are no more\npassers-by outside the museum than outside City Hall. But what matters is not\nhow many potential customers pass by the art museum. What matters is how\nmany actual customers there will be. If the people who pass by the stand\noutside the museum are more likely to buy pretzels than the people who pass\nby th"},{"n":650,"s":"Verb","t":"Critical Reasoning","d":"E","topic":"Critical Reasoning \u2014 Explain","q":"Beginning in 1966, all new cars sold in Morodia were required to have safety belts and power\nsteering. Previously, most cars in Morodia were without these features. Safety belts help to\nprevent injuries in collisions, and power steering helps to avoid collisions in the first place.\nBut even though in 1966 one-seventh of the cars in Morodia were replaced with new cars, the\nnumber of car collisions and collision-related injuries did not decline.\nWhich of the following, if true about Morodia, most ","opts":{"A":"Because of a driver-education campaign, most drivers and passengers in cars that did","B":"Most of the new cars bought in 1966 were bought in the months of January and","C":"In 1965, substantially more than one-seventh of the cars in Morodia were replaced with","D":"An excessive reliance on the new safety features led many owners of new cars to drive","E":"The seat belts and power steering put into new cars sold in 1966 had to undergo strict"},"ans":"D","exp":"Argument Construction\nSituation\n\nStarting in 1966, new cars sold in Morodia were required to have safety belts\nand power steering. But the numbers of car collisions and collision-related\ninjuries did not decline that year.\n\nReasoning\n\nWhat could explain why the newly required safety features did not reduce the\nnumbe
