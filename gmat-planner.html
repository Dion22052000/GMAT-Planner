ata set is the greatest value in the data set minus the least value in the\ndata set, this problem can be solved if the least selling price and the greatest selling price of\nthe wallets sold by the store yesterday can be determined.\n1. This indicates that 10 of the wallets had a selling price of $24 each, but it does not\nindicate the least selling price or the greatest selling price of the wallets sold by the store\nyesterday; NOT sufficient.\n\n\f\n2. This indicates that L =\n\nG, where L represents the least selling price and G represents\n\nthe greatest selling price, but does not give enough information to determine G \u2212 L; NOT\nsufficient.\nTaking (1) and (2) together, the least and greatest selling prices of the wallets sold by the store\nyesterday could be $10 and $30 for a range of $30 \u2212 $10 = $20, or the least and greatest\nselling prices of the wallets sold by the store yesterday could be $20 and $60 for a range of\n$60 \u2212 $20 = $40.\nThe correct answer is E; both statements together are still not sufficient."},{"n":291,"s":"Data","t":"Data Sufficiency","d":"E","topic":"Algebra Simultaneous Equations","q":"Three houses are being sold through a real estate agent. What is the asking price for the\nhouse with the second-largest asking price?\n1. The difference between the greatest and the least asking price is $130,000.\n2. The difference between the two greater asking prices is $85,000.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"E","exp":"Let x, y, and z, where x \u2264 y \u2264 z, be the asking prices of the three houses. This problem can be\nsolved by determining the value of y.\n1. This indicates that z \u2212 x = $130,000, but it does not give the value of y; NOT sufficient.\n2. This indicates that z \u2212 y = $85,000, but it does not give the value of y; NOT sufficient.\nTaking (1) and (2) together, x, y, and z could be $100,000, $145,000, and $230,000,\nrespectively, in which case the second-largest asking price is $145,000, or they could be\n$200,000, $245,000, and $330,000, respectively, in which case the second-largest asking price\nis $245,000.\nThe correct answer is E; both statements together are still not sufficient."},{"n":292,"s":"Data","t":"Data Sufficiency","d":"E","topic":"Algebra Sets","q":"How many people in a group of 50 own neither a fax machine nor a laser printer?\n1. The total number of people in the group who own a fax machine or a laser printer or\nboth is less than 50.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"E","exp":"1. This indicates that the total number who own either a fax machine or a laser printer or\nboth is less than 50, but it does not indicate how much less than 50 the total number is.\nThus, the number of people in the group who own neither a fax machine nor a laser\nprinter cannot be determined; NOT sufficient.\n2. This indicates that, of the 50 people, 15 own both a fax machine and a laser printer, but it\ndoes not indicate how many own one or the other. Thus, the number of people in the\ngroup who own neither a fax machine nor a laser printer cannot be determined; NOT\nsufficient.\nTaking (1) and (2) together, it is known that 15 people own both a fax machine and a laser\nprinter and that the total number who own either a fax machine or a laser printer or both is\nless than 50, but the exact number who own neither still cannot be determined. For example,\nif 20 people own only a fax machine and 10 people own only a laser printer, then both (1) and\n(2) are true and the number of people who own neither a fax machine nor a laser printer is\n50 \u2212 20 \u2212 10 \u2212 15 = 5. However, if 10 people own only a fax machine and 10 people own only\n\n\f\na laser printer, then both (1) and (2) are true and the number "},{"n":293,"s":"Data","t":"Data Sufficiency","d":"E","topic":"Arithmetic Applied Problems; Percents","q":"A certain investment earned a fixed rate of 4 percent interest per year, compounded annually,\nfor five years. The interest earned for the third year of the investment was how many dollars\ngreater than that for the first year?\n1. The amount of the investment at the beginning of the second year was $4,160.00.\n2. The amount of the investment at the beginning of the third year was $4,326.40.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"D","exp":"This problem can be solved by determining the dollar amount of the interest earned for the\nthird year minus the dollar amount of interest earned in the first year, or, in symbols,\n[A(1.04)3 \u2212 A(1.04)2] \u2212 [A(1.04)1 \u2212 A], where A represents the dollar amount of the\ninvestment. This can be determined if the value of A can be determined.\n1. This indicates that A(1.04)1 = $4,160.00, since the amount of the investment at the\nbeginning of the second year is the same as the amount of the investment at the end of\nthe first year. Thus, the value of A can be determined by dividing 4,160.00 by 1.04;\nSUFFICIENT.\n2. This indicates that A(1.04)2 = $4,326.40, since the amount of the investment at the\nbeginning of the third year is the same as the amount of the investment at the end of the\nsecond year. Thus, the value of A can be determined by dividing 4,326.40 by (1.04)2;\nSUFFICIENT.\nThe correct answer is D; each statement alone is sufficient."},{"n":294,"s":"Data","t":"Data Sufficiency","d":"E","topic":"Arithmetic Applied Problems; Percents","q":"For a certain car repair, the total charge consisted of a charge for parts, a charge for labor,\nand a 6 percent sales tax on both the charge for parts and the charge for labor. If the charge\nfor parts, excluding sales tax, was $50.00, what was the total charge for the repair?\n1. The sales tax on the charge for labor was $9.60.\n2. The total sales tax was $12.60.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"D","exp":"To find the total charge, T, for the repair, requires determining the value, in dollars, of\nT = (1.06)(50 + L) = 53 + 1.06L, where L represents the charge, in dollars, for labor. This value\ncan be determined if the value of L can be determined.\n1. This indicates that 0.06L = 9.60, from which L can be determined by dividing 9.60 by 0.06;\nSUFFICIENT.\n2. This indicates that (0.06)(50 + L) = 12.60. So, 3.00 + 0.06L = 12.60, or 0.06L = 9.60, which\nis the same as the equation in (1); SUFFICIENT.\nThe correct answer is D; each statement alone is sufficient."},{"n":295,"s":"Data","t":"Data Sufficiency","d":"E","topic":"Arithmetic Applied Problems","q":"George has a total of B books in his library, 25 of which are hardcover fiction books. What is\nthe value of B?\n1. 40 of the B books are fiction and the rest are nonfiction.\n2. 60 of the B books are hardcovers and the rest are paperbacks.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"E","exp":"Since 25 of George\u2019s B books are hardcover fiction, it is reasonable to assume that some of\nGeorge\u2019s books might be paperback and some might be nonfiction. Therefore, the following\ntable might be useful in determining, if possible, the value of B.\nFiction\n\nNonfiction\nB\n\nHardcover Paperback Hardcover Paperback\n25\n1. If 40 of the B books are fiction, then 40 \u2013 25 = 15 are paperback fiction. This information\nis shown in the following table.\nFiction\n\nNonfiction\nB\n\nHardcover Paperback Hardcover Paperback\n25\n\n15\n\nThe rest are nonfiction, but there is no indication how many are nonfiction. Note that the\ntable has two blank cells under Nonfiction and these can be filled with any numbers,\nwhich implies that the value of B cannot be uniquely determined; NOT sufficient.\n2. If 60 of the B books are hardcovers, then 60 \u2013 25 = 35 are hardcover nonfiction. This\ninformation is shown in the following table.\nFiction\n\nNonfiction\nB\n\nHardcover Paperback Hardcover Paperback\n25\n\n35\n\nThe rest are paperbacks, but there is no indication of how many are paperbacks. The\ntable has two blank cells under Paperback, and these can be filled with any numbers,\nwhich implies that the value of B cannot be uniquely det"},{"n":296,"s":"Data","t":"Data Sufficiency","d":"E","topic":"Arithmetic Applied Problems; Percents","q":"In each of the last five years, Company K donated p percent of its annual profits to a certain\nscholarship fund. Did Company K donate more than $10,000 to the scholarship fund last\nyear?\n1. Two years ago, Company K had annual profits of $3 million and donated $15,000 to the\nscholarship fund.\n2. Last year, Company K had annual profits of $2.5 million.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"C","exp":"1. Although the given information allows the value of p to be determined (see further\nbelow), no information is available about Company K\u2019s profit last year; NOT sufficient.\n2. It is given that Company K\u2019s profit last year was $2.5 million. However, no information is\navailable about the value of p or how much Company K donated to the scholarship fund\nlast year; NOT sufficient.\nTaking (1) and (2) together, from (1) it follows that 15,000 is p% of 3 million, so 15,000 =\n(3,000,000), or p =\n\n= 0.5. Using the value of p and (2), it follows that\n\nthe amount Company K donated to the scholarship fund last year was (0.5%)\n($2.5 million) = (0.005)($2,500,000) = $12,500. Therefore, Company K donated more than\n$10,000 to the scholarship fund last year.\nTip: If a Data Insights problem asks a question about the value of something, it is not\nnecessary to determine a specific decimal, a reduced fraction, or any other representation for\nthis value if it is known that only one such value exists. Thus, in the previous paragraph, it is\nnot necessary to solve for p (it is enough to know that a unique value of p can be found), and\nit is not necessary to evaluate the product (p%)($2.5 million), since wh"},{"n":297,"s":"Data","t":"Data Sufficiency","d":"E","topic":"Arithmetic Order","q":"The people in a line waiting to buy tickets to a show are standing one behind the other. Adam\nand Beth are among the people in the line, and Beth is standing behind Adam with a number\nof people between them. If the number of people in front of Adam plus the number of people\nbehind Beth is 18, how many people in the line are behind Beth?\n1. There are a total of 32 people in the line.\n2. 23 people in the line are behind Adam.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"C","exp":"Beth is standing in line behind Adam with a number of people between them. Let x be the\nnumber of people ahead of Adam, let y be the number of people between Adam and Beth, and\nlet z be the number of people behind Beth. It is given that x + z = 18. Determine z.\n1. This indicates that there are 32 people in the line. Two of these people are Adam and\nBeth, so there are 30 other people in line besides Adam and Beth. Therefore,\nx + y + z = 30 and x + z = 18. From this, y = 12, but z cannot be determined uniquely. For\nexample, if x = 5, then z = 13, but if x = 10, then z = 8; NOT sufficient.\n2. This indicates that y + 1 + z = 23 because the people behind Adam consist of the people\nbetween Adam and Beth, Beth herself, and the people behind Beth. If, for example, y = 4,\nthen z = 18, but if y = 9, then z = 13; NOT sufficient.\n\n\f\nTaking (1) and (2) together, y = 12 from (1) and y + z = 22 from (2). Therefore, z = 10, and\nthere are 10 people in line behind Beth.\nThe correct answer is C; both statements together are sufficient."},{"n":298,"s":"Data","t":"Data Sufficiency","d":"E","topic":"Arithmetic Sets","q":"In a certain group of 50 people, how many are doctors who have a law degree?\n1. In the group, 36 people are doctors.\n2. In the group, 18 people have a law degree.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"E","exp":"1. Given that there are 36 people who are doctors, there is no information about how many\nof the 36 people have a law degree, and therefore it cannot be determined how many of\nthe 36 people are doctors with a law degree; NOT sufficient.\n2. Given that there are 18 people who have a law degree, there is no information about how\nmany of the 18 people are doctors, and therefore it cannot be determined how many of\nthe 18 people are doctors with a law degree; NOT sufficient.\nTaking (1) and (2) together, if n is the number of doctors with a law degree, the contingency\ntable below shows that more than one value of n is possible by assigning appropriate values\nin the column labeled \u201cnot a doctor.\u201d\ndoctor not a doctor total\nlaw degree\n\nn\n\n18\n\nno law degree 36 \u2212 n\ntotal\n\n36\n\n32\n14\n\n50\n\nFor example, the first table below gives n = 10 and the second table below gives n = 12.\ndoctor not a doctor total\nlaw degree\n\nn\n\n8\n\n18\n\nno law degree 36 \u2212 n\n\n6\n\n32\n\ntotal\n\n14\n\n50\n\n36\n\ndoctor not a doctor total\nlaw degree\n\nn\n\n6\n\n18\n\nno law degree 36 \u2212 n\n\n8\n\n32\n\ntotal\n\n14\n\n50\n\n36\n\nThe correct answer is E; both statements together are still not sufficient."},{"n":299,"s":"Data","t":"Data Sufficiency","d":"E","topic":"Arithmetic Sets","q":"Of a group of 50 households, how many have at least one cat or at least one dog, but not\nboth?\n1. The number of households that have at least one cat and at least one dog is 4.\n2. The number of households that have no cats and no dogs is 14.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"C","exp":"Using the labels on the Venn diagram above, w + x + y + z = 50. Determine the value of x + z.\n1. This indicates that y = 4, so w + x + z = 46, but the value of x + z cannot be uniquely\ndetermined; NOT sufficient.\n2. This indicates that w = 14, so x + y + z = 36, but the value of x + z cannot be uniquely\ndetermined; NOT sufficient.\nTaking (1) and (2) together, 14 + x + 4 + z = 50, so x + z = 50 \u2212 14 \u2212 4 = 32.\nThe correct answer is C; both statements together are sufficient."},{"n":300,"s":"Data","t":"Data Sufficiency","d":"E","topic":"Algebra Applied Problems","q":"Robin invested a total of $12,000 in two investments, X and Y, so that the investments earned\nthe same amount of simple annual interest. How many dollars did Robin invest in Investment\nY?\n1. Investment X paid 3 percent simple annual interest, and Investment Y paid 6 percent\nsimple annual interest.\n2. Robin invested more than $1,000 in Investment X.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"A","exp":"For Investments X and Y, let rX and rY be the annual percentage interest rates, respectively,\nand let x and y be the investment amounts, respectively and in dollars. Then x + y = 12,000\nand rX \u00b7 x = rY \u00b7 y. What is the value of y?\n1. Given that rX = 3 and rY = 6, then from rX \u00b7 x = rY \u00b7 y, it follows that 3x = 6y, or x = 2y.\nTherefore, x + y = 12,000 becomes 2y + y = 12,000, or 3y = 12,000, or y = 4,000;\nSUFFICIENT.\n2. Given that x > 1,000, it is not possible to determine the value of y. For example, y = 4,000\nis possible (choose rX = 3, rY = 6, and x = 8,000), and y = 6,000 is possible (choose rX = 3,\nrY = 3, and x = 6,000); NOT sufficient.\nThe correct answer is A; statement 1 alone is sufficient."},{"n":301,"s":"Data","t":"Data Sufficiency","d":"E","topic":"Arithmetic Probability","q":"In a real estate office that employs n salespeople, f of them are females and x of the females\nare new employees. What is the value of n?\n1. If an employee were randomly selected from the n employees, the probability of selecting\na female would be\n\n.\n\n2. If an employee were randomly selected from the f female employees, the probability of\nselecting a new employee would be\n\n.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"E","exp":"1. Given that\n\n, it is possible that n = 3 (choose f = 2 and x = 1), and it is possible that n\n\n= 6 (choose f = 4 and x = 2); NOT sufficient.\n2. Given that\n\n, the value of n cannot be determined because\n\nis true for each of\n\nthe two choices of values of n, f, and x that were used in (1); NOT sufficient.\nTaking (1) and (2) together is still not sufficient because both (1) and (2) hold for each of the\ntwo choices of values of n, f, and x that were used in (1).\nThe correct answer is E; both statements together are still not sufficient."},{"n":302,"s":"Data","t":"Data Sufficiency","d":"E","topic":"Arithmetic Percents","q":"Do at least 60 percent of the students in Pat\u2019s class walk to school?\n1. At least 60 percent of the female students in Pat\u2019s class walk to school.\n2. The number of students in Pat\u2019s class who walk to school is twice the number of students\nwho do not walk to school.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"B","exp":"This problem can be solved by determining the total number of students in Pat\u2019s class and the\nnumber who walk to school.\n1. This indicates that at least 60% of the female students in Pat\u2019s class walk to school.\nHowever, it does not give any information about the other students in Pat\u2019s class; NOT\nsufficient.\n2. Letting x represent the number of students in Pat\u2019s class who do not walk to school, this\nindicates that 2x students in Pat\u2019s class walk to school and that the total number of\nstudents in Pat\u2019s class is x + 2x = 3x. From this, the percent of students in Pat\u2019s class who\nwalk to school is\n\n%=\n\n%; SUFFICIENT.\n\nThe correct answer is B; statement 2 alone is sufficient."},{"n":303,"s":"Data","t":"Data Sufficiency","d":"E","topic":"Arithmetic Applied Problems","q":"A certain plumber charges $92 for each job completed in 4 hours or less and $23 per hour\nfor each job completed in more than 4 hours. If it took the plumber a total of 7 hours to\ncomplete two separate jobs, what was the total amount charged by the plumber for the two\njobs?\n1. The plumber charged $92 for one of the two jobs.\n2. The plumber charged $138 for one of the two jobs.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"B","exp":"Find the total amount charged for two jobs lasting a total of 7 hours if the plumber charges\n$92 for a job lasting 4 hours or less and $23 per hour for a job lasting more than 4 hours.\n1. This indicates that one of the two jobs lasted 4 hours or less. If that job lasted 2 hours,\nthen the other job lasted 5 hours, and the charge for that job would be ($23)(5) = $115,\nmaking the total for the two jobs $92 + $115 = $207. However, if the jobs lasted 1 hour\nand 6 hours, respectively, then the total charge for the two jobs would be $92 + (6)($23)\n= $92 + $138 = $230; NOT sufficient.\n\n\f\n2. This indicates that one job lasted\n\n= 6 hours. Therefore, the other job lasted for 1\n\nhour and the charge for that job was $92, making the total charge for the two jobs\n$92 + $138 = $230; SUFFICIENT.\nThe correct answer is B; statement 2 alone is sufficient."},{"n":304,"s":"Data","t":"Data Sufficiency","d":"E","topic":"Algebra Inequalities","q":"If x and y are positive numbers, is\n\n?\n\n1. x > 1\n2. x < y","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"B","exp":"Since y is positive, multiplying both sides of the inequality\n\nby y(y + 1) gives\n\ny(x + 1) > x(y + 1) or xy + y > xy + x, which is equivalent to y > x. So, determining whether the\ninequality\n\nis true is equivalent to determining whether the inequality y > x is true.\n\n1. This indicates that x > 1. If, for example, x = 3 and y = 4, then y > x is true. However, if\nx = 4 and y = 3, then y > x is not true; NOT sufficient.\n2. This indicates that x < y, so y > x is true; SUFFICIENT.\nThe correct answer is B; statement 2 alone is sufficient."},{"n":305,"s":"Data","t":"Data Sufficiency","d":"E","topic":"Arithmetic Sets","q":"Every object in a box is either a sphere or a cube, and every object in the box is either red or\ngreen. How many objects are in the box?\n1. There are six cubes and five green objects in the box.\n2. There are two red spheres in the box.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"E","exp":"This problem can be solved using a contingency table set up as shown below, where T\nrepresents the number to be determined.\ncube sphere total\nred\ngreen\ntotal\n\nT\n\n1. The following table displays the information that there are 6 cubes and 5 green objects:\n\n\f\ncube sphere total\nred\ngreen\n\n5\n\ntotal\n\n6\n\nT\n\nIt is obvious that there is not enough information to determine a unique value for T; NOT\nsufficient.\n2. The following table displays the information that there are 2 red spheres:\ncube sphere total\nred\n\n2\n\ngreen\ntotal\n\nT\n\nIt is obvious that there is not enough information to determine a unique value for T; NOT\nsufficient.\nThe following table displays the information from (1) and (2) taken together:\ncube sphere total\nred\n\n2\n\ngreen\ntotal\n\n5\n6\n\nT\n\nIt is obvious that there is still not enough information to determine a unique value for T.\nThe correct answer is E; both statements together are still not sufficient."},{"n":306,"s":"Data","t":"Data Sufficiency","d":"E","topic":"Algebra Applied Problems","q":"A certain truck uses\n\ngallons of fuel per mile when its speed is v miles per hour,\n\nwhere k is a constant. At what speed should the truck travel so that it uses\n\ngallon of fuel\n\nper mile?\n1. The value of k is\n\n.\n\n2. When the truck travels at 30 miles per hour, it uses\n\ngallon of fuel per mile.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"D","exp":"+ kv2 =\n\n.\n\n1. This indicates the value of k, and so the value of v can be determined by solving\n\n+\n\nThis problem can be solved by determining the positive value of v so that\n\nv2 =\n\nfor v; SUFFICIENT.\n\n2. This indicates that\n\n+ k(30)2 =\n\n. The value of k can be determined by solving this\n\nequation for k. Then that value of k can be substituted into\n\n+ kv2 =\n\n, which can\n\nthen be solved for the value of v; SUFFICIENT.\nThe correct answer is D; each statement alone is sufficient."},{"n":307,"s":"Data","t":"Data Sufficiency","d":"E","topic":"Algebra Simultaneous Equations","q":"If a school district paid a total of $35 per desk for x desks and a total of $30 per table for\ny tables, what was the total amount that the district paid for these desks and tables?\n1. The total amount the district paid for the y tables was $900.\n2. x = 90, and the total amount the district paid for the x desks was 3.5 times the total\namount the district paid for the y tables.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"B","exp":"Determine the value of 35x + 30y.\n1. Given that 30y = 900, it follows that y = 30. However, it is not possible to determine the\nvalue of 35x + 30y = 35x + 900 because more than one possible value of x is possible;\nNOT sufficient.\n2. Given that x = 90 and 35x = 3.5(30y), it follows that (35)(90) = (3.5)(30)y, or\n, and therefore 35x + 30y = 35(90) + 30(30); SUFFICIENT.\nThe correct answer is B; statement 2 alone is sufficient."},{"n":308,"s":"Data","t":"Data Sufficiency","d":"E","topic":"Algebra Simultaneous Equations","q":"Three children inherited a total of X dollars. If the oldest child inherited $7,000 more than the\nyoungest child, and the youngest child inherited $9,000 less than the middle child, what is the\nvalue of X?\n1. The middle child inherited $27,000.\n2. The youngest child and the middle child together inherited a total of $45,000.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"D","exp":"Let A, B, and C be the amounts inherited, respectively and in dollars, of the oldest, middle, and\nyoungest child. It is given that A = 7,000 + C and C = B \u2212 9,000. Then\nA = 7,000 + (B \u2212 9,000) = B \u2212 2,000. Determine the value of A + B + C, or equivalently,\ndetermine the value of (B \u2212 2,000) + B + (B \u2212 9,000) = 3B \u2212 11,000.\n1. Given that B = 27,000, it follows that 3B \u2212 11,000 = 70,000; SUFFICIENT.\n2. Given that B + C = 45,000, then, using C = B \u2212 9,000, it follows that\nB + (B \u2212 9,000) = 45,000, which can be solved to obtain B = 27,000. Therefore,\n3B \u2212 11,000 = 70,000; SUFFICIENT.\nThe correct answer is D; each statement alone is sufficient."},{"n":309,"s":"Data","t":"Data Sufficiency","d":"E","topic":"Algebra Simultaneous Equations","q":"If a building has 6,000 square meters of floor space, how many offices are in the building?\n1. Exactly\n\nof the floor space is not used for offices.\n\n2. There are exactly 20 executive offices, and each of these occupies 3 times as much floor\nspace as the average for all of the remaining offices.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"E","exp":"1. This says that exactly\nsince exactly\n\n(6,000) = 4,500 square meters of floor space are used for offices,\n\n(6,000) = 1,500 square meters of the floor space are not used for offices.\n\nNo information is given about the configuration of the 4,500 square meters used for\noffices. Therefore, the number of offices in the building cannot be determined; NOT\nsufficient.\n2. While this says there are exactly 20 executive offices and each occupies 3 times the\naverage space of the other offices, no information is given about how much of the\n6,000 square meters of floor space in the building is used for offices nor how the offices\nare configured. Therefore, the number of offices in the building cannot be determined;\nNOT sufficient.\nTaking (1) and (2) together, 4,500 square meters of space are used for offices which include\n20 executive offices, and each executive office occupies 3 times as much floor space as the\naverage of all of the remaining offices. However, no information is given about the actual size\nof an executive office or about the actual average size of the remaining offices. Therefore, the\nnumber of offices in the building cannot be determined. The examples in the table verify this"},{"n":310,"s":"Data","t":"Data Sufficiency","d":"E","topic":"Arithmetic Percents","q":"For which type of investment, J or K, is the annual rate of return greater?\n1. Type J returns $115 per $1,000 invested for any one-year period, and Type K returns\n$300 per $2,500 invested for any one-year period.\n2. The annual rate of return for an investment of Type K is 12%.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"A","exp":"Compare the annual rates of return for the investment types J and K.\n1. For Type J, the annual rate of return is $115 per $1,000 for any one-year period, which\ncan be converted to a percent. For Type K, the annual rate of return is $300 per $2,500\n\n\f\nfor any one-year period, which can also be converted to a percent. These two percents\ncan be compared to determine which is greater; SUFFICIENT.\n2. Type K has an annual rate of return of 12%, but no information is given about the annual\nrate of return for Type J; NOT sufficient.\nThe correct answer is A; statement 1 alone is sufficient."},{"n":311,"s":"Data","t":"Data Sufficiency","d":"E","topic":"Arithmetic Rate Problem","q":"If Car X followed Car Y across a certain bridge that is\n\nmile long, how many seconds did it\n\ntake Car X to travel across the bridge?\n1. Car X drove onto the bridge exactly 3 seconds after Car Y drove onto the bridge and\ndrove off the bridge exactly 2 seconds after Car Y drove off the bridge.\n2. Car Y traveled across the bridge at a constant speed of 30 miles per hour.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"C","exp":"Find the number of seconds that it took Car X to cross the -mile bridge.\n1. If Car X drove onto the bridge 3 seconds after Car Y and drove off the bridge 2 seconds\nafter Car Y, then Car X took 1 second less to cross the bridge than Car Y. Since there is no\ninformation on how long Car Y took to cross the bridge, there is no way to determine\nhow long Car X took to cross the bridge; NOT sufficient.\n2. If the speed of Car Y was 30 miles per hour, it took Car Y\n\nhour = 1 minute = 60\n\nseconds to cross the bridge. However, there is no information on how long Car X took to\ncross the bridge; NOT sufficient.\nTaking (1) and (2) together, Car X took 1 second less than Car Y to cross the bridge, and Car Y\ntook 60 seconds to cross the bridge, so Car X took 60 \u2013 1 = 59 seconds to cross the bridge.\nThe correct answer is C; both statements together are sufficient."},{"n":312,"s":"Data","t":"Data Sufficiency","d":"E","topic":"Arithmetic","q":"Will Candidate A win the most votes of any of the competing candidates in the upcoming\nelection?\n1. An opinion poll, Poll P, indicates that 60% of respondents prefer Candidate A over other\ncandidates competing in the upcoming election.\n2. An election-forecasting opinion poll is a method to estimate election outcomes based on a\nsample that is representative of the population of all of those legally entitled to vote.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"E","exp":""},{"n":313,"s":"Data","t":"Data Sufficiency","d":"E","topic":"Arithmetic","q":"The government of Nation X makes policy decisions intended to advance the public interest,\nsuch as policy decisions aiming to promote employment, economic flourishing, and\nenvironmental protection. A policy decision can involve a significant trade-off, i.e., it can entail\nforeseeably giving up part or all of one valued outcome in the pursuit of another valued\noutcome. Does a policy decision by Nation X to permit extensive clearcutting of forests\nprovide a valued outcome at the expense of another","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"C","exp":""},{"n":314,"s":"Data","t":"Data Sufficiency","d":"E","topic":"Arithmetic","q":"Is Sarah\u2019s mathematics test score higher than the class average?\n1. Sarah scored 90% on her mathematics test, answering 45 out of 50 questions correctly.\n2. Sarah\u2019s high percentage score indicates that she performed exceptionally well, with only a\nfew questions answered incorrectly.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"E","exp":""},{"n":315,"s":"Data","t":"Data Sufficiency","d":"E","topic":"Arithmetic","q":"On Day X, was the forecast temperature 36\u00b0C at noon?","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"C","exp":""},{"n":316,"s":"Data","t":"Data Sufficiency","d":"E","topic":"Arithmetic","q":"Benjamin is a salesman working for commission at a shoe store. For the first $1,000 worth of\nsales in a given month, he earns a commission of 2%. For any sales he makes after the first\n$1,000 in that month, he earns a commission of 4%. What is the total dollar value of sales\nmade by Benjamin in the month of March?\n1. Benjamin earned a commission of $120 in March.\n2. Benjamin doubled the dollar value of his sales in March compared to his sales in\nFebruary.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"A","exp":""},{"n":317,"s":"Data","t":"Data Sufficiency","d":"E","topic":"Arithmetic","q":"What is the length of Train A if it crosses Bridge X in 30 seconds from the moment it enters\nthe bridge to the moment its final carriage exits the bridge?\n1. Train B, which is 200 meters long, traveling at a constant speed of 20 meters per second,\ncrosses Bridge X in 40 seconds.\n2. The end of Train A, which is traveling at a constant speed, passes a pole in 10 seconds\nfrom the moment the train meets the pole.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"E","exp":""},{"n":318,"s":"Data","t":"Data Sufficiency","d":"E","topic":"Arithmetic","q":"Solomon leases space for his barber shop, and his landlord has recently increased the rent by\n40%. Solomon wants to increase his monthly revenue to pay the increased rent without\naffecting his net income. By what percentage must he increase his revenue?\n1. 20% of his previous monthly revenue was used to pay the rent before the landlord\nincreased it.\n2. The new rent is $50 more than the previous rent.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"A","exp":""},{"n":319,"s":"Data","t":"Data Sufficiency","d":"E","topic":"Arithmetic","q":"What is the ratio of the amount, by weight, of Metal A to Metal B in Alloy K?\n1. The ratio of Metal A to Metal B in Alloy K becomes 5:6 when 40 pounds of Metal A is\nadded to the alloy.\n2. The ratio of Metal A to Metal B in Alloy K becomes 7:6 when 60 pounds of Metal A is\nadded to the alloy.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"C","exp":""},{"n":320,"s":"Data","t":"Data Sufficiency","d":"E","topic":"Arithmetic","q":"Train A started from Station X toward Station Y traveling at a constant speed, and on the same\nday, on a parallel track, Train B started from Station Y toward Station X at a constant speed. At\nwhat time did Train A reach Station Y?\n1. The two trains met at 3:00 p.m. The distance traveled by Train A was twice the distance\ntraveled by Train B by the time they met.\n2. The ratio between the speeds of Trains A and B is 3:5. Train B started from Station Y at\n6:00 a.m.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"C","exp":""},{"n":321,"s":"Data","t":"Data Sufficiency","d":"E","topic":"Arithmetic","q":"Pipes A and B are the pipes that fill a tank. Pipes C and D are the pipes that empty the same\ntank. What is the capacity of the tank?\n1. Pipe A is twice as efficient as Pipe C, that is, the volume of water per hour that Pipe A\nmoves is twice the volume per hour that Pipe C moves. Pipe A and Pipe B are equally\nefficient. When Pipes C and D are closed, Pipes A and B together fill the empty tank in 5\nhours. Pipe C empties 6,000 liters per hour.\n2. Pipe B is three times as efficient as Pipe D.\nQuest","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"A","exp":""},{"n":322,"s":"Data","t":"Data Sufficiency","d":"M","topic":"Algebra Simultaneous Equations","q":"What is the total number of executives at Company P?","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"C","exp":"Let M be the number of male executives at Company P and let F be the number of female\nexecutives at Company P. Determine the value of M + F.\n\n\f\n1. Given that M =\n\nF, it is not possible to determine the value of M + F. For example, if M =\n\n3 and F = 5, then M =\n\nF and M + F = 8. However, if M = 6 and F = 10, then M =\n\nF and\n\nM + F = 16; NOT sufficient.\n2. Given that F = M + 4, it is not possible to determine the value of M + F. For example, if M =\n3 and F = 7, then F = M + 4 and M + F = 10. However, if M = 4 and F = 8, then F = M + 4\nand M + F = 12; NOT sufficient.\nTaking (1) and (2) together, then F = M + 4 and M =\n\nF, so F =\n\nF + 4. Now solve for F to get\n\nF = 4 and F = 10. Therefore, using F = 10 and F = M + 4, it follows that M = 6, and hence M +\nF = 6 + 10 = 16.\nThe correct answer is C; both statements together are sufficient."},{"n":323,"s":"Data","t":"Data Sufficiency","d":"M","topic":"Algebra Simultaneous Equations","q":"Jack picked 76 apples. Of these, he sold 4y apples to Juanita and 3t apples to Sylvia. If he kept\nthe remaining apples, how many apples did he keep? (t and y are positive integers.)\n1. y \u2265 15 and t = 2\n2. y = 17","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"C","exp":"Determine the value of the nonnegative integer 76 \u2212 4y \u2212 3t.\n1. Given that y \u2265 15 and t = 2, it follows that 76 \u2212 4y \u2212 3t = 76 \u2212 4y \u2212 6 = 70 \u2212 4y could have\nthe value 70 \u2212 4(15) = 10, 70 \u2212 4(16) = 6, or 70 \u2212 4(17) = 2; NOT sufficient.\n2. Given that y = 17, it follows that 76 \u2212 4y \u2212 3t = 76 \u2212 68 \u2212 3t = 8 \u2212 3t could have the value\n8 \u2212 3(1) = 5 or 8 \u2212 3(2) = 2; NOT sufficient.\nTaking (1) and (2) together, it follows that 76 \u2212 4y \u2212 3t = 76 \u2212 4(17) \u2212 3(2) = 2.\nThe correct answer is C; both statements together are sufficient."},{"n":324,"s":"Data","t":"Data Sufficiency","d":"M","topic":"Algebra Simultaneous Equations","q":"The total price of 5 pounds of regular coffee and 3 pounds of decaffeinated coffee was $21.50.\nWhat was the price of the 5 pounds of regular coffee?\n1. If the price of the 5 pounds of regular coffee had been reduced 10 percent and the price\nof the 3 pounds of decaffeinated coffee had been reduced 20 percent, the total price\nwould have been $18.45.\n2. The price of the 5 pounds of regular coffee was $3.50 more than the price of the\n3 pounds of decaffeinated coffee.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"D","exp":"Let $x be the price of 5 pounds of regular coffee and let $y be the price of 3 pounds of\ndecaffeinated coffee. Then x + y = 21.5, or y = 21.5 \u2013 x. Determine the value of x.\n1. Given that 0.9x + 0.8y = 18.45, the value of x can be determined because substituting\ny = 21.5 \u2013 x into 0.9x + 0.8y = 18.45 gives a single equation with unknown x, and that\nequation can be solved for a unique value of x; SUFFICIENT.\nAlternatively (see the Tip below), y = 21.5 \u2013 x and 0.9x + 0.8y = 18.45 are equations of\nnonparallel lines in the coordinate plane and thus have a single point of intersection. One\nway to ensure that the lines are not parallel is to solve each equation for y in terms of x\n\n\f\nand note that the coefficients of x are different. In this case, y = 21.5 \u2013 x gives a coefficient\nof x equal to \u22121 and 0.9x + 0.8y = 18.45 gives a coefficient of x equal to\n\n.\n\n2. Given that x = 3.5 + y, the value of x can be determined because substituting y = 21.5 \u2013 x\ninto x = 3.5 + y gives a single equation with unknown x, and that equation can be solved\nfor a unique value of x; SUFFICIENT.\nAlternatively (see the Tip below), y = 21.5 \u2013 x and x = 3.5 + y are equations of nonparallel\nlines in the coordinate p"},{"n":325,"s":"Data","t":"Data Sufficiency","d":"M","topic":"Algebra Ratios; Simultaneous Equations","q":"A certain painting job requires a mixture of yellow, green, and white paint. If 12 quarts of\npaint are needed for the job, how many quarts of green paint are needed?\n1. The ratio of the amount of green paint to the amount of yellow and white paint combined\nneeds to be 1 to 3.\n2. The ratio of the amount of yellow paint to the amount of green paint needs to be 3 to 2.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"A","exp":"This problem involves 3 quantities:\nThe number of quarts of yellow paint, represented by Y; the number of quarts of green paint,\nrepresented by G; and the number of quarts of white paint, represented by W.\nIt is given that Y + G + W = 12.\nThe task is to uniquely determine the value of G, which is possible only if there is enough\ninformation to eliminate Y and W from Y + G + W = 12, so that only G is left.\n1. Using the variables introduced above, this gives\n\n=\n\nor 3G = Y + W. Substituting 3G\n\nfor Y + W in Y + G + W = 12 gives 4G = 12, which yields a unique value of G; SUFFICIENT.\n2. Using the variables introduced above, this gives\n\n=\n\nor Y = G. Then, by substitution,\n\nG + G + W = 12. Because the value of W can vary, the value of G cannot be uniquely\ndetermined; NOT sufficient.\nThe correct answer is A; statement 1 alone is sufficient."},{"n":326,"s":"Data","t":"Data Sufficiency","d":"M","topic":"Algebra Ratios","q":"A company produces a certain toy in only 2 sizes, small or large, and in only 2 colors, red or\ngreen. If, for each size, there are equal numbers of red and green toys in a certain production\nlot, what fraction of the total number of green toys is large?\n1. In the production lot, 400 of the small toys are green.\n2. In the production lot,\n\nof the toys produced are small.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"B","exp":"Let x be the number of small toys of each color, and let y be the number of large toys of each\ncolor. The contingency table below gives a summary of the information given. Determine the\nvalue of\n\n.\nsmall large\n\ntotal\n\nred\n\nx\n\ny\n\nx+y\n\ngreen\n\nx\n\ny\n\nx+y\n\ntotal\n\n2x\n\n2y\n\n2x + 2y\n\n1. Given that x = 400, it is clearly not possible to determine the value of\n\n;\n\nNOT sufficient.\n2. Given that\n\nof the toys are small, then, because there are (2x + 2y) toys altogether and\n\n2x small toys, it follows that\nhence\n\n. Therefore, 3(2x) = 2(2x + 2y), or x = 2y, and\n; SUFFICIENT.\n\nThe correct answer is B; statement 2 alone is sufficient."},{"n":327,"s":"Data","t":"Data Sufficiency","d":"M","topic":"Algebra Simultaneous Equations","q":"Jones has worked at Firm X twice as many years as Green, and Green has worked at Firm X\nfour years longer than Smith. How many years has Green worked at Firm X?\n1. Jones has worked at Firm X 9 years longer than Smith.\n2. Green has worked at Firm X 5 years less than Jones.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"D","exp":"Let J, G, and S be the number of years Jones, Green, and Smith, respectively, have worked at\nFirm X. Then J = 2G and G = 4 + S. What is the value of G?\n1. Given that J = 9 + S, then from J = 2G, it follows that 2G = 9 + S. From G = 4 + S, it follows\nthat S = G \u2212 4, and therefore G \u2212 4 can be substituted for S in the equation 2G = 9 + S to\nobtain 2G = 9 + (G \u2212 4), or G = 5; SUFFICIENT.\n2. Given that G = J \u2212 5, it follows from J = 2G that G = 2G \u2212 5, or G = 5; SUFFICIENT.\nThe correct answer is D; each statement alone is sufficient."},{"n":328,"s":"Data","t":"Data Sufficiency","d":"M","topic":"Algebra Applied Problems; Proportions","q":"On June 1, Mary paid Omar $360 for rent and utilities for the month of June. Mary moved out\nearly, and Omar refunded the money she paid for utilities, but not for rent, for the days in June\nafter she moved out. How many dollars did Omar refund to Mary?\n1. Mary moved out on June 24.\n2. The amount Mary paid for utilities was less than\n\nthe amount Mary paid for rent.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"E","exp":"This problem could be solved by making a table of possible amounts Mary could have paid for\nrent and utilities for the month of June, such that they total $360, as shown below.\nRent Utilities\n$300\n\n$60\n\n$310\n\n$50\n\n$320\n\n$40\n\n$330\n\n$30\n\n$340\n\n$20\n\n$350\n\n$10\n\n1. Given that Mary moved out on June 24, Omar refunded the amount she paid for 6 days of\nutilities or\n\n=\n\nof the amount she paid for the whole month. As seen from the table,\n\nthis amount varies, so\n\nof the total amount varies. Therefore, the amount Omar\n\nrefunded to Mary cannot be uniquely determined; NOT sufficient.\nNote that a third column, as shown below, could be added to the table to confirm that\nof the amount she paid for utilities for the whole month varies. Adding this column will\naid in determining whether (1) and (2) together are sufficient. Amounts shown in\nboldface satisfy (1).\nRent Utilities\n\nUtilities\n\n$300\n\n$60\n\n$12\n\n$310\n\n$50\n\n$10\n\n$320\n\n$40\n\n$8\n\n$330\n\n$30\n\n$6\n\n$340\n\n$20\n\n$4\n\n$350\n\n$10\n\n$2\n\n2. Given that the amount Mary paid for utilities was less than\n\nthe amount she paid for\n\nrent, the amount Omar refunded to Mary cannot be uniquely determined. To verify this,\nanother column can be added to the table to show\n\nt"},{"n":329,"s":"Data","t":"Data Sufficiency","d":"M","topic":"Arithmetic Statistics","q":"The 10 students in a history class recently took an examination. What was the maximum score\non the examination?\n1. The mean of the scores was 75.\n2. The standard deviation of the scores was 5.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"E","exp":"1. Given that the mean of the scores was 75, then all 10 scores could have been 75 and the\nmaximum score would be 75. However, it is also possible that the scores were 74, 76, and\n8 scores of 75, and the maximum score would be 76; NOT sufficient.\n2. Given that the standard deviation of the scores was 5, it is not possible to determine the\nmaximum score because adding a fixed nonzero number to each of the scores will not\nchange the standard deviation but doing this will change the maximum score; NOT\nsufficient.\nTaking (1) and (2) together, it seems reasonable that the maximum still cannot be determined,\nbut since the method used in (2) above changes the mean, something more explicit is needed.\nThe standard deviation of the 10 scores is\n\n, where each \u201cdeviation\u201d is\n\nthe (unsigned) difference between the score and 75 (the mean of the scores). Thus, the\nstandard deviation of the 10 scores will be 5 if the sum of squares of the deviations is 250.\nThe following table shows two possibilities for the 10 scores, each with a mean of 75 and a\nstandard deviation of 5.\n\n\f\nScores\n\nDeviations\nfrom 75\n\n70, 70, 70, 70, 70 5, 5, 5, 5, 5\n80, 80, 80, 80, 80 5, 5, 5, 5, 5\n70, 70, 70, 70, 75 5, 5, 5, 5,"},{"n":330,"s":"Data","t":"Data Sufficiency","d":"M","topic":"Arithmetic Statistics","q":"Last school year, each of the 200 students at a certain high school attended the school for the\nentire year. If there were 8 cultural performances at the school during the last school year,","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"B","exp":"Determine the average number of students attending each of 8 cultural performances at a\nschool that has 200 students.\n1. This indicates that each student attended at least one cultural performance, but the\naverage number of students attending each performance cannot be uniquely determined.\nIt could be as low as\n\n= 25 students if each student attended exactly one\n\nperformance, or it could be as high as\n\n= 200 if each student attended every\n\nperformance; NOT sufficient.\n2. This indicates that, since the average number of performances attended per student was\n4,\n\n= 4, so the total attendance at the performances is (4)\n\n(200) = 800 students. It follows that the average number of students attending each\nperformance is\n\n= 100; SUFFICIENT.\n\nThe correct answer is B; statement 2 alone is sufficient."},{"n":331,"s":"Data","t":"Data Sufficiency","d":"M","topic":"Arithmetic Applied Problems","q":"A clothing manufacturer makes jackets that are wool or cotton or a combination of wool and\ncotton. The manufacturer has 3,000 pounds of wool and 2,000 pounds of cotton on hand. Is\nthis enough wool and cotton to make at least 1,000 jackets?\n1. Each wool jacket requires 4 pounds of wool, and no cotton.\n2. Each cotton jacket requires 6 pounds of cotton, and no wool.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"C","exp":"1. Given that each wool jacket requires 4 pounds of wool and no cotton, then at most a total\nof 750 wool jackets can be made (because\n\n= 750), and possibly no other jackets.\n\nTherefore, it is possible that there is enough wool and cotton to make at least\n1,000 jackets (for example, if there is enough cotton to make 250 cotton jackets), and it is\npossible that there is not enough wool and cotton to make at least 1,000 jackets (for\nexample, if there is less than the amount of cotton needed to make 250 cotton jackets);\nNOT sufficient.\n2. Given that each cotton jacket requires 6 pounds of cotton and no wool, then at most a\ntotal of 333 cotton jackets can be made (because rounding\n\ndown to the nearest\n\ninteger gives 333), and possibly no other jackets. Therefore, it is possible that there is\nenough wool and cotton to make at least 1,000 jackets (for example, if there is enough\nwool to make 667 wool jackets), and it is possible that there is not enough wool and\ncotton to make at least 1,000 jackets (for example, if there is less than the amount of wool\nneeded to make 667 wool jackets); NOT sufficient.\nTaking (1) and (2) together, there is enough wool and cotton to make 750 wool jackets a"},{"n":332,"s":"Data","t":"Data Sufficiency","d":"M","topic":"Arithmetic Applied Problems","q":"Each month, Jim receives a base salary plus a 10 percent commission on the price of each car\nhe sells that month. If Jim sold 15 cars last month, what was the total amount of base salary\nand commissions that Jim received that month?\n1. Last month, Jim\u2019s base salary was $3,000.\n2. Last month, Jim sold 3 cars whose prices totaled $60,000 and 5 cars whose prices totaled\n$120,000.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"E","exp":"Determine the total of Jim\u2019s base salary plus a 10% commission on the price of each of the\n15 cars he sold last month.\n1. This indicates that Jim\u2019s base salary was $3,000 but gives no information about the prices\nof the 15 cars he sold last month; NOT sufficient.\n2. This indicates that Jim\u2019s commission on 8 cars that he sold last month can be determined\nbut gives no information about his base salary or about the prices of the other 7 cars he\nsold last month; NOT sufficient.\nTaking (1) and (2) together gives Jim\u2019s base salary and information about the prices of 8 of\nthe 15 cars he sold last month but does not provide information about the selling prices of\nthe other 7 cars he sold.\nThe correct answer is E; both statements together are still not sufficient."},{"n":333,"s":"Data","t":"Data Sufficiency","d":"M","topic":"Arithmetic Percents","q":"By what percentage was the price of a certain television set discounted for a sale?\n1. The price of the television set before it was discounted for the sale was 25 percent\ngreater than the discounted price.\n2. The price of the television set was discounted by $60 for the sale.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"A","exp":"Let B represent the price, in dollars, for the television before the sale and let D represent the\ndiscounted price, in dollars. The percent by which B was discounted to obtain D can be\ndetermined if the value of\n\ncan be determined.\n\n1. This indicates that B is 25% greater than D, or that B = 1.25D. Then,\nSUFFICIENT.\n2. This indicates that D = B \u2212 60, but B is unknown. For example, B could be 100 and the\nvalue of\n\nwould be\n\n, or B could be 500 and the value of\n\nwould be\n\n; NOT sufficient.\nThe correct answer is A; statement 1 alone is sufficient."},{"n":334,"s":"Data","t":"Data Sufficiency","d":"M","topic":"Algebra First-Degree Equations","q":"A paint mixture was formed by mixing exactly 3 colors of paint. By volume, the mixture was\nx% blue paint, y% green paint, and z% red paint. If exactly 1 gallon of blue paint and 3 gallons\nof red paint were used, how many gallons of green paint were used?\n1. x = y\n2. z = 60","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"D","exp":"Letting T represent the total number of gallons of the paint in the mixture, and B, G, and R the\namounts of blue paint, green paint, and red paint, respectively, in the mixture, then B =\nG=\n\n, and R =\n\n. It is given that\n\n= 1 and\n\n,\n\n= 3, from which it follows\n\nthat z = 3x. Also, since there are exactly three colors of paint, x + y + z = 100 and B + G + R = T.\nDetermine the value of G, or equivalently, the value\n\n.\n\n1. Given that x = y and\n\n= 1, it follows that\n\n= 1; SUFFICIENT.\n\n2. Given that z = 60 and\n\n= 3, it follows that T = 5. Knowing that the total amount of\n\npaint in the mixture is 5 gallons of which 1 gallon is blue paint and 3 gallons are red\npaint, the amount of green paint can be determined; SUFFICIENT.\nThe correct answer is D; each statement alone is sufficient."},{"n":335,"s":"Data","t":"Data Sufficiency","d":"M","topic":"Algebra Simultaneous Equations","q":"For a basic monthly fee of F yen (\u00a5F), Naoko\u2019s first cell phone plan allowed him to use a\nmaximum of 420 minutes on calls during the month. Then, for each of x additional minutes he\nused on calls, he was charged \u00a5M, making his total charge for the month \u00a5T, where T = F + xM.\nWhat is the value of F?\n1. Naoko used 450 minutes on calls the first month, and the total charge for the month was\n\u00a513,755.\n2. Naoko used 400 minutes on calls the second month, and the total charge for the month\nwas \u00a513,125.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"B","exp":"1. Given that Naoko used 450 minutes and was charged \u00a513,125, it follows that\nF + (450 \u2212 420)M = 13,755, or F + 30M = 13,755. However, the value of F cannot be\ndetermined. For example, F = 13,005 and M = 25 is possible, and F = 13,035 and M = 24\nis possible; NOT sufficient.\n2. Given that Naoko used 400 minutes and was charged \u00a513,125, it follows that F = 13,125,\nsince Naoko did not use more than 420 minutes; SUFFICIENT.\nThe correct answer is B; statement 2 alone is sufficient."},{"n":336,"s":"Data","t":"Data Sufficiency","d":"M","topic":"Arithmetic Operations with Integers; Order","q":"Is the sum of the prices of the 3 books that Shana bought less than $48?\n1. The price of the most expensive of the 3 books that Shana bought is less than $17.\n2. The price of the least expensive of the 3 books that Shana bought is exactly $3 less than\nthe price of the second most expensive book.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"C","exp":"Let B1, B2, and B3 be the prices, in dollars and in numerical order, of the 3 books. Thus, B1 \u2264\nB2 \u2264 B3. Determine whether B1 + B2 + B3 < 48.\n1. Given that B3 < 17, it is possible that B1 + B2 + B3 < 48 (choose B1 = B2 = 15 and B3 =\n16), and it is possible that B1 + B2 + B3 > 48 (choose B1 = B2 = 16 and B3 = 16.5); NOT\nsufficient.\n2. Given that B1 = B2 \u2013 3, it is possible that B1 + B2 + B3 < 48 (choose B1 = 3, B2 = 6, and B3\n= 10), and it is possible that B1 + B2 + B3 > 48 (choose B1 = 3, B2 = 6, and B3 = 48); NOT\nsufficient.\nTaking (1) and (2) together, from (1) and the information given, it follows that B3 < 17 and B2\n\u2264 B3 < 17, or B2 < 17. Also, from B2 < 17 and (2), it follows that B1 < 17 \u2013 3, or B1 < 14.\nTherefore, B1 + B2 + B3 is the sum of 3 numbers\u2014a number less than 14, a number less than\n17, and a number less than 17\u2014and thus B1 + B2 + B3 < 14 + 17 + 17 = 48.\nThe correct answer is C; both statements together are sufficient."},{"n":337,"s":"Data","t":"Data Sufficiency","d":"M","topic":"Arithmetic Applied Problems","q":"A company makes and sells two products, P and Q. The costs per unit of making and selling\nProducts P and Q are $8.00 and $9.50, respectively, and the selling prices per unit of Products\nP and Q are $10.00 and $13.00, respectively. In one month, the company sold a total of 834\nunits of these products. Was the total profit on these items more than $2,000.00?\n1. During the month, more units of Product P than units of Product Q were sold.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"E","exp":"It is given that the profit on each unit of Product P is $10.00 \u2212 $8.00 = $2.00, and the profit on\neach unit of Product Q is $13.00 \u2212 $9.50 = $3.50. Also, if p and q represent the number of\nunits of Products P and Q made and sold, then it is given that p + q = 834. Determining if the\ntotal profit on these items was more than $2,000 requires determining how many units of at\nleast one of the products were sold.\n\n\f\n1. This indicates that p > q but does not give a specific value for p or q, NOT sufficient.\n2. This indicates that q \u2265 100 but does not give a specific value for q; NOT sufficient.\nTaking (1) and (2) together, p > q and q \u2265 100, so p > 100, but a specific value for p or q\ncannot be determined.\nThe correct answer is E; both statements together are still not sufficient."},{"n":338,"s":"Data","t":"Data Sufficiency","d":"M","topic":"Arithmetic Probability","q":"Jill has applied for a job with each of two different companies. What is the probability that she\nwill get job offers from both companies?\n1. The probability that she will get a job offer from neither company is 0.3.\n2. The probability that she will get a job offer from exactly one of the two companies is 0.5.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"C","exp":"Let P(2) be the probability that she will get a job offer from both companies, P(1) be the\nprobability that she will get a job offer from exactly one of the companies, and P(0) be the\nprobability that she will get a job offer from neither company. Then P(2) + P(1) + P(0) = 1.\nWhat is the value of P(2)?\n1. Given that P(0) = 0.3, it follows that P(2) + P(1) + 0.3 = 1, or P(2) + P(1) = 0.7. However,\nthe value of P(2) cannot be determined, since nothing is known about the value of P(1)\nother than 0 \u2264 P(1) \u2264 0.7; NOT sufficient.\n2. Given that P(1) = 0.5, it follows that P(2) + 0.5 + P(0) = 1, or P(2) + P(0) = 0.5. However,\nthe value of P(2) cannot be determined, since nothing is known about the value of P(0)\nother than 0 \u2264 P(1) \u2264 0.5; NOT sufficient.\nTaking (1) and (2) together, it follows that P(2) + 0.5 + 0.3 = 1, or P(2) = 0.2.\nThe correct answer is C; both statements together are sufficient."},{"n":339,"s":"Data","t":"Data Sufficiency","d":"M","topic":"Arithmetic Applied Problems","q":"A certain computer company produces two different monitors, P and Q. In 2010, what was the\nnet profit from the sale of the two monitors?\n1. Of the company\u2019s expenses in 2010, rent and utilities totaled $500,000.\n2. In 2010, the company sold 50,000 units of Monitor P at $300 per unit and 30,000 units of\nMonitor Q at $650 per unit.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"E","exp":"The net profit from the sale of the two monitors is the total revenue, $R, from the sale of the\ntwo monitors minus the total cost, $C, of the two monitors, or $R \u2212 $C. Determine the value of\nR \u2212 C.\n1. Given that the rent and utilities totaled $500,000, it is not possible to determine the value\nof R \u2212 C because we only know that C \u2265 500,000, and we do not know anything about the\nvalue of R; NOT sufficient.\n2. Given that $R = 50,000($300) + 30,000($650), it is not possible to determine the value of\nR \u2212 C because we do not know anything about the value of C; NOT sufficient.\nTaking (1) and (2) together, it is not possible to determine the value of R \u2212 C because from (2)\nthe value of R is fixed, and from both (1) and (2) we can only conclude that C \u2265 500,000, and\ntherefore more than one value of R \u2212 C is possible.\nThe correct answer is E; both statements together are still not sufficient."},{"n":340,"s":"Data","t":"Data Sufficiency","d":"M","topic":"Arithmetic","q":"A conveyor belt moves bottles at a constant speed of 120 centimeters per second. If the\nconveyor belt moves a bottle from a loading dock to an unloading dock, is the distance that\nthe conveyor belt moves the bottle less than 90 meters? (1 meter = 100 centimeters)\n1. It takes the conveyor belt less than 1.2 minutes to move the bottle from the loading dock\nto the unloading dock.\n2. It takes the conveyor belt more than 1.1 minutes to move the bottle from the loading\ndock to the unloading dock.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"A","exp":"Since the rate at which the conveyor belt moves is given as 120 centimeters per second, which\nis equivalent to\n\nmeters per second, the conveyor will move less than 90 meters if it\n\nmoves for less than\n\nseconds.\n\n1. This indicates that the length of time the conveyor belt moves is less than 1.2 minutes,\nwhich is equivalent to (1.2)(60) = 72 seconds and 72 < 75; SUFFICIENT.\n2. This indicates that the length of time the conveyor belt moves is more than 1.1 minutes,\nwhich is equivalent to (1.1)(60) = 66 seconds, but does not indicate how much more than\n66 seconds the conveyor moves. If the conveyor moves for 70 seconds (70 > 66), for\nexample, it moves less than 90 meters, since 70 < 75. However, if the conveyor belt moves\nfor 80 seconds (80 > 66), then it moves more than 90 meters, since 80 > 75; NOT\nsufficient.\nThe correct answer is A; statement 1 alone is sufficient."},{"n":341,"s":"Data","t":"Data Sufficiency","d":"M","topic":"Arithmetic","q":"In a product test of a common cold remedy, x percent of the patients tested experienced side\neffects from the use of the drug and y percent experienced relief of cold symptoms. What\npercent of the patients tested experienced both side effects and relief of cold symptoms?\n1. Of the 1,000 patients tested, 15 percent experienced neither side effects nor relief of cold\nsymptoms.\n2. Of the patients tested, 30 percent experienced relief of cold symptoms without side\neffects.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"E","exp":"The Venn diagram on the following page represents the numbers of patients who experienced\nneither, one, or both side effects and relief. In the diagram,\na = number who experienced side effects only,\nb = number who experienced both,\nc = number who experienced relief only,\nd = number who experienced neither,\nwhere T = a + b + c + d is the total number of patients. Note that a + b =\nT. Determine the value of\n\nT and b + c =\n\n.\n\n\f\n1. Given that 1,000 patients were tested and (0.15)(1,000) = 150 patients experienced\nneither side effects nor relief, it follows that a + b + c + d = 1,000 and d = 150. Therefore,\na + b + c + 150 = 1,000, or a + b + c = 850. However, there is no information about how\nthe remaining 850 patients are assigned to the other categories. Thus, the percent of\npatients who experienced both side effects and relief could be any value between 0% and\n85%; NOT sufficient.\n2. Given that 30% of the patients experienced relief without side effects, there is no\ninformation about how the remaining 70% of the patients are assigned to the other\ncategories. Thus, the percent of patients who experienced both side effects and relief\ncould be any value between 0% and 70%; NOT suffici"},{"n":342,"s":"Data","t":"Data Sufficiency","d":"M","topic":"Arithmetic","q":"Three roommates\u2014Bela, Gyorgy, and Janos\u2014together saved money for a trip. The amount\nthat Bela saved was equal to 8% of his monthly income. The amount that Gyorgy saved was\nexactly\n\nof the total amount saved by all 3 roommates. What was the total amount saved for\n\nthe trip by all 3 roommates?\n1. Bela had a monthly income of $2,000.\n2. Janos saved 1.5 times as much for the trip as Bela.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"C","exp":"Letting B, G, and J represent the amounts saved by Bela, Gyorgy, and Janos, respectively, then\nB = 0.08I, where I represents Bela\u2019s monthly income, G =\n\n(B + G + J), and G =\n\n(B + J).\n\nDetermine the value of B + G + J.\n1. This allows the value of B to be determined but gives no information about the values of\nG or J; NOT sufficient.\n\n\f\n2. This gives the relationship between the values of J and B but no information to determine\nthe value of either B or J; NOT sufficient.\nTaking (1) and (2) together, the values of both B and J can be determined, as can the value of G\nsince G =\n\n(B + J). Thus, the value of B + G + J can be determined.\n\nThe correct answer is C; both statements together are sufficient."},{"n":343,"s":"Data","t":"Data Sufficiency","d":"M","topic":"Arithmetic","q":"In each game of a certain tournament, a contestant either loses 3 points or gains 2 points. If\nPat had 100 points at the beginning of the tournament, how many games did Pat play in the\ntournament?\n1. At the end of the tournament, Pat had 104 points.\n2. Pat played fewer than 10 games.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"E","exp":"Pat either lost 3 points or gained 2 points in each game she played. Therefore, since she had\n100 points at the beginning of the tournament, her score at the end of the tournament was\n100 \u2212 3x + 2y, where x and y represent, respectively, the number of games in which she lost\n3 points and the number of games in which she gained 2 points. Determine the value of x + y.\n1. This indicates that 100 \u2212 3x + 2y = 104, but no information is given about the values of x\nor y. For example, the values of x and y could be 0 and 2, respectively, so that x + y = 2, or\nthe values of x and y could be 2 and 5, respectively, so that x + y = 7; NOT sufficient.\n2. This indicates that Pat played fewer than 10 games, but in each of the examples above,\nPat played fewer than 10 games; NOT sufficient.\nSince the examples given satisfy both (1) and (2), taking (1) and (2) together does not give\nenough information to determine the value of x + y.\nThe correct answer is E; both statements together are still not sufficient."},{"n":344,"s":"Data","t":"Data Sufficiency","d":"M","topic":"Arithmetic","q":"At the beginning of the year, the Finance Committee and the Planning Committee of a certain\ncompany each had n members, and no one was a member of both committees. At the end of\nthe year, 5 members left the Finance Committee and 3 members left the Planning Committee.\nHow many members did the Finance Committee have at the beginning of the year?\n1. The ratio of the total number of members who left at the end of the year to the total\nnumber of members at the beginning of the year was 1:6.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"D","exp":"1. It is given that\n\n, since a total of 3 + 5 = 8 members left at the end of the year and\n\nthere were a total of n + n = 2n members at the beginning of the year. It follows that (8)\n(6) = (2n)(1), or n = 24; SUFFICIENT.\n2. It is given that n \u2212 3 = 21, since 3 members from the original n members left the Planning\nCommittee at the end of the year. It follows that n = 21 + 3 = 24; SUFFICIENT.\nThe correct answer is D; each statement alone is sufficient."},{"n":345,"s":"Data","t":"Data Sufficiency","d":"M","topic":"Arithmetic","q":"Max purchased a guitar for a total of $624, which consisted of the price of the guitar and the\nsales tax. Was the sales tax rate greater than 3 percent?\n1. The price of the guitar that Max purchased was less than $602.\n2. The sales tax for the guitar that Max purchased was less than $30.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"A","exp":"Letting P be the price, in dollars, of the guitar and r% be the sales tax rate, it is given that P\n= 624. Determine if r > 3.\n1. Given that P < 602, then 624 = P\nTherefore,\nr > 100\n\n>\n\n\u22121=\n\n< 602\n=\n\n>\n\n, and so 1 +\n\n>\n\n.\n\n, because (11)(100) > (3)(301), and so\n\n= 3; SUFFICIENT.\n\n2. Given that the sales tax was less than $30, it is not possible to determine whether the\nsales tax rate was greater than 3%. Since (0.03)($624) = $18.72, a 3% sales tax rate on\nthe price corresponds to a sales tax that is less than $18.72, since the price is less than\n$624. Therefore, it is possible that the sales tax is less than $30 and the sales tax rate is\nless than 3%, since any sales tax rate less than 3% would give a sales tax that is less than\n$18.72 (and hence less than $30).\nHowever, it is also possible that the sales tax is less than $30 and the sales tax rate is 4%\n(which is greater than 3%), since a 4% sales tax rate implies P\n\n= 624, or P =\n\n= 600, and thus the sales tax would be 0.04($600) = $24 < $30; NOT sufficient.\nThe correct answer is A; statement 1 alone is sufficient."},{"n":346,"s":"Data","t":"Data Sufficiency","d":"M","topic":"Arithmetic","q":"Was the number of books sold at Bookstore X last week greater than the number of books\nsold at Bookstore Y last week?\n1. Last week, more than 1,000 books were sold at Bookstore X on Saturday and fewer than\n1,000 books were sold at Bookstore Y on Saturday.\n2. Last week, less than 20 percent of the books sold at Bookstore X were sold on Saturday\nand more than 20 percent of the books sold at Bookstore Y were sold on Saturday.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"C","exp":"Determine if Bookstore X sold more books last week than Bookstore Y.\n1. This indicates that Bookstore X sold more books on Saturday than Bookstore Y, but it\ngives no information about the numbers of books sold by the two bookstores on the\nother days of last week; NOT sufficient.\n2. This gives information about the percents of the books sold last week that were sold on\nSaturday, but it gives no information about the actual numbers of books sold at the two\nbookstores last week. Therefore, a comparison of the numbers of books sold last week\nby Bookstore X and Bookstore Y is not possible; NOT sufficient.\nTaking (1) and (2) together, if x represents the number of books that Bookstore X sold on\nSaturday and TX represents the total number of books that Bookstore X sold last week, then\nx > 1,000 and x < 0.2TX. It follows that 1,000 < 0.2TX, and so TX > 5,000. Similarly, if y\nrepresents the number of books that Bookstore Y sold on Saturday and TY represents the\ntotal number of books that Bookstore Y sold last week, then y < 1,000 and y > 0.2TY. It follows\n\n\f\nthat 0.2TY < 1,000, and so TY < 5,000. Combining the inequalities gives TY < 5,000 < TX, and so\nTY < TX, which means that Bookstore X "},{"n":347,"s":"Data","t":"Data Sufficiency","d":"M","topic":"Arithmetic","q":"From May 1 to May 30 in the same year, the balance in a checking account increased. What\nwas the balance in the checking account on May 30?\n1. If, during this period of time, the increase in the balance in the checking account had been\n12 percent, then the balance in the account on May 30 would have been $504.\n2. During this period of time, the increase in the balance in the checking account was 8\npercent.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"C","exp":"1. Given that the amount on May 30 would have been $504 if the increase had been 12%, it\nfollows that the amount on May 1 was $\n\n= $450. However, the balance on May 30\n\ncannot be determined because the (actual) percent increase is not given. For example, if\nthe increase had been 10%, then the balance on May 30 would have been (1.1)($450) =\n$495, which is different from $504; NOT sufficient.\n2. Given that the increase was 8%, the amount on May 30 could be $108 (if the amount on\nMay 1 was $100), and the amount on May 30 could be $216 (if the amount on May 1 was\n$200); NOT sufficient.\nTaking (1) and (2) together, it follows that the amount on May 30 was ($450)(1.08) = $486.\nThe correct answer is C; both statements together are sufficient."},{"n":348,"s":"Data","t":"Data Sufficiency","d":"M","topic":"Arithmetic","q":"A merchant discounted the sale price of a coat and the sale price of a sweater. Which of the\ntwo articles of clothing was discounted by the greater dollar amount?\n1. The percent discount on the coat was 2 percentage points greater than the percent\ndiscount on the sweater.\n2. Before the discounts, the sale price of the coat was $10 less than the sale price of the\nsweater.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"E","exp":"1. Given that the discount on the coat was 2 percentage points greater than the discount on\nthe sweater, the sweater could have been discounted by the greater dollar amount ($30\nsweater with 10% discount is a discount of $3; $20 coat with 12% discount is a discount\nof $2.40), and the coat could have been discounted by the greater dollar amount ($110\nsweater with 10% discount is a discount of $11; $100 coat with 12% discount is a\ndiscount of $12); NOT sufficient.\n2. Given that the coat\u2019s sale price was $10 less than the sweater\u2019s sale price, the same\nexamples used to show that (1) is not sufficient can be used for (2); NOT sufficient.\nTaking (1) and (2) together is of no more help than either (1) or (2) taken separately because\nthe same examples used to show that (1) is not sufficient also show that (2) is not sufficient.\nThe correct answer is E; both statements together are still not sufficient."},{"n":349,"s":"Data","t":"Data Sufficiency","d":"M","topic":"Arithmetic","q":"If the positive integer n is added to each of the integers 69, 94, and 121, what is the value of n?\n1. 69 + n and 94 + n are the squares of two consecutive integers.\n2. 94 + n and 121 + n are the squares of two consecutive integers.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"D","exp":""},{"n":350,"s":"Data","t":"Data Sufficiency","d":"M","topic":"Arithmetic","q":"If a merchant purchased a sofa from a manufacturer for $400 and then sold it, what was the\nselling price of the sofa?\n1. The selling price of the sofa was greater than 140 percent of the purchase price.\n2. The merchant\u2019s gross profit from the purchase and sale of the sofa was\n\nof the selling\n\nprice.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"B","exp":""},{"n":351,"s":"Data","t":"Data Sufficiency","d":"M","topic":"Arithmetic","q":"Last year, in a certain housing development, the average (arithmetic mean) price of 20 new\nhouses was $160,000. Did more than 9 of the 20 houses have prices that were less than the\naverage price last year?\n1. Last year, the greatest price of one of the 20 houses was $219,000.\n2. Last year, the median of the prices of the 20 houses was $150,000.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"B","exp":""},{"n":352,"s":"Data","t":"Data Sufficiency","d":"M","topic":"Arithmetic","q":"For a certain city\u2019s library, the average cost of purchasing each new book is $28. The library\nreceives $15,000 from the city each year; the library also receives a bonus of $2,000 if the\ntotal number of items checked out over the course of the year exceeds 5,000. Did the library\nreceive the bonus last year?","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"D","exp":""},{"n":353,"s":"Data","t":"Data Sufficiency","d":"M","topic":"Arithmetic","q":"If x is a number in the list above, what is the median of the list?\n1. x > 7\n2. The median of the list equals the arithmetic mean of the list.","opts":{"A":"(1) alone sufficient","B":"(2) alone sufficient","C":"Both together sufficient","D":"Each alone sufficient","E":"Neither sufficient"},"ans":"A","exp":""},{"n":354,"s":"Data","t":"Data Sufficiency","d":"M","topic":"Arithmetic","q":"Three dice, each of which has its 6 sides numbered 1 through 6, are tossed.
