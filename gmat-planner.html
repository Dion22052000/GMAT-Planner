const RAW_QUESTIONS = [{"n":1,"s":"Quan","t":"Problem Solving","d":"E","topic":"Arithmetic Statistics","q":"The numbers of cars sold at a certain dealership on six of the last seven business days were 4,\n7, 2, 8, 3, and 6, respectively. If the number of cars sold on the seventh business day was\neither 2, 4, or 5, for which of the three values does the average (arithmetic mean) number of\ncars sold per business day, for the seven business days, equal the median number of cars sold\nper day for the seven days?\nI. 2\nII. 4\nIII. 5","opts":{"A":"II only","B":"III only","C":"I and II only","D":"II and III only","E":"I, II, and III"},"ans":"B","exp":"Listed in numerical order, the given numbers are 2, 3, 4, 6, 7, and 8. If the 7th number were 2\nor 4, then the numbers in numerical order would be 2, 2, 3, 4, 6, 7, and 8 or 2, 3, 4, 4, 6, 7, and\n8. In either case the median would be 4 and the average would be\n=\n\nor\n\n=\n\n, neither of which\n\nequals 4. So, for neither of the values in Statement I or II does the average equal the median. If\nthe 7th number were 5, then the numbers in numerical order would be 2, 3, 4, 5, 6, 7, and 8.\nThe median would be 5 and the average would be\n\n=\n\n= 5.\n\nThus, for the value in Statement III, the average equals the mean.\nThe correct answer is B."},{"n":2,"s":"Quan","t":"Problem Solving","d":"E","topic":"Arithmetic Interpretation of Tables","q":"The table shows a summary of the ticket sales from four performances of a certain play. What\nis the difference between the maximum and the minimum ticket-sale revenue from a single\nperformance?","opts":{"A":"$4,000","B":"$5,100","C":"$6,200","D":"$7,000","E":"$9,600"},"ans":"D","exp":"For each performance, the product of the ticket price and the number of tickets sold is the\nticket-sale revenue. The following table shows these values.\nPerformance Time Ticket-sale Revenue\nThursday night\n\n200($40) = $8,000\n\nFriday night\n\n240($50) = $12,000\n\nSaturday afternoon 220($40) = $8,800\nSaturday night\n\n300($50) = $15,000\n\nFrom these values it follows that for a single performance, the maximum ticket-sale revenue is\n$15,000 and the minimum ticket-sale revenue is $8,000, and therefore the difference between\nthese two revenues is $15,000 \u2013 $8,000 = $7,000.\nThe correct answer is D."},{"n":3,"s":"Quan","t":"Problem Solving","d":"E","topic":"Arithmetic Statistics","q":"During a trip that they took together, Carmen, Juan, Maria, and Rafael drove an average\n(arithmetic mean) of 80 miles each. Carmen drove 72 miles, Juan drove 78 miles, and Maria\ndrove 83 miles. How many miles did Rafael drive?","opts":{"A":"80","B":"82","C":"85","D":"87","E":"89"},"ans":"D","exp":"Let C, J, M, and R be the numbers of miles, respectively, that Carmen, Juan, Maria, and Rafael\ndrove. Since the average of the numbers of miles they drove is 80, it follows that\n, or C + J + M + R = 4(80) = 320. It is given that C = 72, J = 78, and M = 83.\nTherefore, 72 + 78 + 83 + R = 320, or R = 87.\nThe correct answer is D."},{"n":4,"s":"Quan","t":"Problem Solving","d":"E","topic":"Algebra Applied Problems","q":"Each week, a clothing salesperson receives a commission equal to 15 percent of the first $500\nin sales and 20 percent of all additional sales that week. What commission would the\nsalesperson receive on total sales for the week of $1,300?","opts":{"A":"$195","B":"$227","C":"$235","D":"$260","E":"$335"},"ans":"C","exp":"The commission on the total sales can be calculated as follows:\n\n\f\ncommission on first $500 + commission on amount over $500\n=\n\n(0.15)($500) + (0.20)($1,300 \u2013 $500)\n$75\n\n=\n\n+ $160\n\nTherefore, the commission on the total sales is $75 + $160 = $235.\nThe correct answer is C."},{"n":5,"s":"Quan","t":"Problem Solving","d":"E","topic":"Arithmetic Applied Problems","q":"A certain restaurant that regularly advertises through the mail has 1,040 cover letters and\n3,000 coupons in stock. In its next mailing, each envelope will contain 1 cover letter and 2\ncoupons. If all of the cover letters in stock are used, how many coupons will remain in stock\nafter this mailing?","opts":{"A":"920","B":"1,040","C":"1,500","D":"1,960","E":"2,080"},"ans":"A","exp":"In the next mailing there will be 1,040 cover letters and 2(1,040) = 2,080 coupons. Therefore,\nafter the next mailing the number of coupons remaining in stock will be 3,000 \u2013 2,080 = 920.\nThe correct answer is A."},{"n":6,"s":"Quan","t":"Problem Solving","d":"E","topic":"Arithmetic Statistics","q":"List S consists of 10 consecutive odd integers, and list T consists of 5 consecutive even\nintegers. If the least integer in S is 7 more than the least integer in T, how much greater is the\naverage (arithmetic mean) of the integers in S than the average of the integers in T?","opts":{"A":"2","B":"7","C":"8"},"ans":"D","exp":"Let the integers in S be s, s + 2, s + 4,\u2026, s + 18, where s is odd. Let the integers in T be t, t + 2, t\n+ 4, t + 6, t + 8, where t is even. Given that s = t + 7, it follows that s \u2013 t = 7. The average of the\nintegers in S is\n\n= s + 9, and, similarly, the average of the integers in T is\n\n=\n\nt + 4. The difference in these averages is (s + 9) \u2013 (t + 4) = (s \u2013 t) + (9 \u2013 4) = 7 + 5 = 12. Thus,\nthe average of the integers in S is 12 greater than the average of the integers in T.\nThe correct answer is D."},{"n":7,"s":"Quan","t":"Problem Solving","d":"E","topic":"Arithmetic Percents","q":"The price of a coat in a certain store is $500. If the price of the coat is to be reduced by $150,\nby what percent is the price to be reduced?","opts":{"A":"10%","B":"15%","C":"20%","D":"25%","E":"30%"},"ans":"E","exp":""},{"n":9,"s":"Quan","t":"Problem Solving","d":"E","topic":"Arithmetic Applied Problems","q":"While a family was away on vacation, they paid a neighborhood boy $11 per week to mow\ntheir lawn and $4 per day to feed and walk their dog. If the family was away for exactly 3\nweeks, how much did they pay the boy for his services?","opts":{"A":"$45","B":"$54","C":"$71","D":"$95","E":"$117"},"ans":"E","exp":"A period of exactly 3 weeks consists of exactly 3(7) = 21 days. Therefore, the boy was paid for\n3 weeks of mowing the lawn and for 21 days of feeding and walking the dog, for a total pay of\n3($11) + 21($4) = $33 + $84 = $117.\n\n\f\nThe correct answer is E."},{"n":10,"s":"Quan","t":"Problem Solving","d":"E","topic":"Algebra First-Degree Equations","q":"Last year $48,000 of a certain store\u2019s profit was shared by its 2 owners and their 10\nemployees. Each of the 2 owners received 3 times as much as each of their 10 employees.\nHow much did each owner receive from the $48,000?","opts":{"A":"$12,000","B":"$9,000","C":"$6,000","D":"$4,000","E":"$3,000"},"ans":"B","exp":"Let A be the amount received by each owner and let B be the amount received by each\nemployee. From the given information, it follows that A = 3B and 2A + 10B = 48,000. Thus,\n2(3B) + 10B = 48,000, or 16B = 48,000, or B = 3,000. Therefore, the amount received by each\nowner was A = 3B = 3($3,000) = $9,000.\nThe correct answer is B."},{"n":11,"s":"Quan","t":"Problem Solving","d":"E","topic":"Arithmetic Operations with Rational Numbers","q":"On a vacation, Rose exchanged $500.00 for euros at an exchange rate of 0.80 euro per dollar\nand spent\n\nof the euros she received. If she exchanged the remaining euros for dollars at an","opts":{},"ans":"D","exp":"At the exchange rate of 0.80 euro per dollar, Rose exchanged $500.00 for (0.80)(500) =\n400 euros. She spent\n\n(400) = 300 euros, had 400 \u2013 300 = 100 euros left, and exchanged\n\nthem for dollars at the exchange rate of $1.20 per euro. Therefore, the dollar amount she\nreceived was (1.20)(100) = $120.00.\nThe correct answer is D."},{"n":12,"s":"Quan","t":"Problem Solving","d":"E","topic":"Arithmetic Ratio and Proportion","q":"Each of the 12 squares shown is labeled x, y, v, or w. What is the ratio of the number of these\nsquares labeled x or y to the number of these squares labeled v or w?","opts":{"A":"1:2","B":"2:3","C":"4:3","D":"3:2","E":"2:1"},"ans":"E","exp":"By a direct count, there are 8 squares labeled x or y (5 labeled x, 3 labeled y) and there are\n4 squares labeled v or w (2 labeled v, 2 labeled w). Therefore, the ratio of the number of\nsquares labeled x or y to the number of squares labeled v or w is 8:4, which reduces to 2:1.\nThe correct answer is E."},{"n":13,"s":"Quan","t":"Problem Solving","d":"E","topic":"Arithmetic; Algebra Interpretation of Tables; Applied Problems","q":"In the table above, what is the number of green marbles in Jar R?","opts":{"A":"70","B":"80","C":"90","D":"100","E":"110"},"ans":"D","exp":"First, set up an equation to find the total number of marbles in the three jars as follows:\nx + y + y + z + x + z = 80 + 120 + 160\n2x + 2y + 2z = 360\n\ncombine the like terms\n\nx + y + z = 180\n\ndivide both sides by 2\n\nThen, since it can be seen from the table that the number of green marbles in Jar R is z, solve\nfor z to answer the problem. To do this most efficiently, use the information from the table for\nJar P, which is that x + y = 80.\nx + y + z = 180\n80 + z = 180 substitute 80 for x + y\nz = 100\nThe correct answer is D."},{"n":14,"s":"Quan","t":"Problem Solving","d":"E","topic":"Arithmetic Applied Problems; Properties of Numbers","q":"Bouquets are to be made using white tulips and red tulips, and the ratio of the number of\nwhite tulips to the number of red tulips is to be the same in each bouquet. If there are 15\nwhite tulips and 85 red tulips available for the bouquets, what is the greatest number of\nbouquets that can be made using all the tulips available?","opts":{"A":"3","B":"5"},"ans":"B","exp":"Because all the tulips are to be used and the same number of white tulips will be in each\nbouquet, the number of white tulips in each bouquet times the number of bouquets must\nequal the total number of white tulips, or 15. Thus, the number of bouquets must be a factor\nof 15, and so the number must be 1, 3, 5, or 15. Also, the number of red tulips in each\nbouquet times the number of bouquets must equal the total number of red tulips, or 85. Thus,\nthe number of bouquets must be a factor of 85, and so the number must be 1, 5, 17, or 85.\nSince the number of bouquets must be 1, 3, 5, or 15, and the number of bouquets must be 1,\n5, 17, or 85, it follows that the number of bouquets must be 1 or 5, and thus the greatest\nnumber of bouquets that can be made is 5. Note that each of the 5 bouquets will have 3 white\ntulips, because (5)(3) = 15, and each of the 5 bouquets will have 17 red tulips, because (5)\n(17) = 85.\nThe correct answer is B."},{"n":15,"s":"Quan","t":"Problem Solving","d":"E","topic":"Arithmetic Statistics","q":"Over the past 7 weeks, the Smith family had weekly grocery bills of $74, $69, $64, $79, $64,\n$84, and $77. What was the Smiths\u2019 average (arithmetic mean) weekly grocery bill over the 7week period?","opts":{"A":"$64","B":"$70","C":"$73","D":"$74","E":"$85"},"ans":"C","exp":"The average weekly grocery bill over the 7-week period can be calculated by dividing the total\nof the 7 weekly grocery bills by 7.\n\nAn alternative method is suggested by the fact that the bills, in dollars, are close to 70. Note\nthat if all the bills were 70, then the average would be 70. This method makes use of the\namount by which the bills are over 70 or under 70.\n\n\f\nbill\n\namount over 70\n\namount under 70\n\n74\n\n4\n\n*\n\n69\n\n*\n\n1\n\n64\n\n*\n\n6\n\n79\n\n9\n\n*\n\n64\n\n*\n\n6\n\n84\n\n14\n\n*\n\n77\n\n7\n\n*\n\ntotal\n\n34\n\n13\n\nTherefore, since 34 > 13, the average is over 70 by\n\n= 3, so 73.\n\nTip: When calculating an average value where the values are roughly clustered together, it is\noften quicker to pick a fixed value and add to this fixed value the average of the signed\ndifferences from the fixed value. In the solution above, the fixed value was 70 and the signed\ndifferences are 4, \u22121, \u22126, 9, \u22126, 14, and 7.\nAdditional Example: Calculate the average of 99, 102, 101, 98, and 96. Letting 100 be the fixed\nvalue, the average can be calculated as follows:\n100 +\n\n= 100 \u2013\n\n= 100 \u2013 0.8 = 99.2\n\nNote that these values cluster more closely to 99 than to 100, but 100 is probably simpler to\nwork with.\nThe correct answer is C."},{"n":16,"s":"Quan","t":"Problem Solving","d":"E","topic":"Arithmetic Percents","q":"125% of 5 =","opts":{"A":"5.125","B":"5.25","C":"6","D":"6.125","E":"6.25"},"ans":"E","exp":""},{"n":17,"s":"Quan","t":"Problem Solving","d":"E","topic":"Arithmetic Statistics","q":"During a recent storm, 9 neighborhoods experienced power failures of durations 34, 29, 27,\n46, 18, 25, 12, 35, and 16 minutes, respectively. For these 9 neighborhoods, what was the\nmedian duration, in minutes, of the power failures?","opts":{"A":"34","B":"29","C":"27","D":"25","E":"18"},"ans":"C","exp":"To find the median of these 9 numbers, put the numbers in numerical order in a list and\ndetermine the middle value in the list:\n12, 16, 18, 25, 27, 29, 34, 35, 46\nFrom this list it follows that the median is 27.\nThe correct answer is C."},{"n":18,"s":"Quan","t":"Problem Solving","d":"E","topic":"Arithmetic Operations with Rational Numbers","q":"When traveling at a constant speed of 32 miles per hour, a certain motorboat consumes\n24 gallons of fuel per hour. What is the fuel consumption of this boat at this speed measured\nin miles traveled per gallon of fuel?\nA.\nB.\nC.\nD.\nE.","opts":{},"ans":"D","exp":"If the motorboat consumes 24 gallons of fuel in 1 hour, then it consumes 1 gallon of fuel in\nhour. If the motorboat travels 32 miles in 1 hour, then it travels\n\n=\n\nmiles in\n\nhour, which is the length of time it takes to consume 1 gallon of fuel. Thus, the motorboat\ntravels\n\nmiles per gallon of fuel.\n\nThe correct answer is D."},{"n":19,"s":"Quan","t":"Problem Solving","d":"E","topic":"Arithmetic Percents","q":"A technician makes a round trip to and from a certain service center by the same route. If the\ntechnician completes the drive to the center and then completes 10 percent of the drive from\nthe center, what percent of the round trip has the technician completed?","opts":{"A":"5%","B":"10%","C":"25%","D":"40%","E":"55%"},"ans":"E","exp":"In completing the drive to the service center, the technician has completed 50% of the round\ntrip. The drive from the center is the other 50% of the round trip. In completing 10% of the\ndrive from the center, the technician has completed an additional 10% of 50%, or 5% of the\nround trip. Thus, the technician has completed 50% + 5% = 55% of the round trip.\nThe correct answer is E."},{"n":20,"s":"Quan","t":"Problem Solving","d":"E","topic":"Algebra First-Degree Equations","q":"From 2000 to 2003, the number of employees at a certain company increased by a factor of\n. From 2003 to 2006, the number of employees at this company decreased by a factor of . If\nthere were 100 employees at the company in 2006, how many employees were there at the\ncompany in 2000?","opts":{"A":"200","B":"120","C":"100","D":"75","E":"60"},"ans":"B","exp":"Let N be the number of employees in 2000. In 2003 there were\nmore employees than in 2000, for a total of\n\nemployees. In 2006 there were\n\nfewer employees than in 2003, for a total of\nemployees. It is given that there were 100 employees in 2006, so\n, or\nThe correct answer is B."},{"n":21,"s":"Quan","t":"Problem Solving","d":"E","topic":"Algebra Statistics","q":"Which of the following statements must be true about the average (arithmetic mean) and the\nmedian of 5 consecutive integers?\nI. The average is one of the integers.\nII. The median is one of the integers.\nIII. The median equals the average.","opts":{"A":"I only","B":"II only","C":"III only","D":"I and II only","E":"I, II, and III"},"ans":"E","exp":"If n is the least of the 5 consecutive integers, then, in increasing order, the integers are\nn, n + 1, n + 2, n + 3, n + 4.\nStatement I must be true because the average of the integers is\n, or\n\n= n + 2, and n + 2 is one of the integers.\n\nStatement II must be true because the median is the middle number in the list, which is n + 2,\nand n + 2 is one of the integers.\nStatement III must be true because n + 2 is both the average and the median.\nThe correct answer is E."},{"n":22,"s":"Quan","t":"Problem Solving","d":"E","topic":"Algebra First-Degree Equations","q":"A collection of 16 coins, each with a face value of either 10 cents or 25 cents, has a total face\nvalue of $2.35. How many of the coins have a face value of 25 cents?","opts":{"A":"3","B":"5","C":"7","D":"9","E":"11"},"ans":"B","exp":"Let x represent the number of coins each with a face value of 25 cents. Then, since there are\n16 coins in all, 16 \u2013 x represents the number of coins each with a face value of 10 cents. The\ntotal face value of the coins is $2.35 or 235 cents so,\n25x + 10(16 \u2013 x) = 235\n\ngiven\n\n25x + 160 \u2013 10x = 235\n\ndistributive property\n\n15x + 160 = 235\n15x = 75\nx=5\n\ncombine like terms\nsubtract 160 from both sides\ndivide both sides by 15\n\nTherefore, 5 of the coins have a face value of 25 cents.\nThe correct answer is B."},{"n":23,"s":"Quan","t":"Problem Solving","d":"E","topic":"Arithmetic Applied Problems","q":"A retailer purchased eggs at $2.80 per dozen and sold the eggs at 3 eggs for $0.90. What was\nthe retailer\u2019s gross profit from purchasing and selling 5 dozen eggs? (1 dozen eggs = 12 eggs)","opts":{"A":"$0.90"},"ans":"C","exp":"The retailer\u2019s cost was $2.80 per dozen eggs and the retailer\u2019s revenue was $0.90 per 3 eggs,\nor 4($0.90) = $3.60 per dozen eggs. Therefore, the retailer\u2019s profit for 5 dozen eggs\u2014revenue\nminus cost for 5 dozen eggs\u2014was 5($3.60 \u2212 $2.80) = 5($0.80) = $4.00.\nThe correct answer is C."},{"n":24,"s":"Quan","t":"Problem Solving","d":"E","topic":"Arithmetic Probability","q":"In a set of 24 cards, each card is numbered with a different positive integer from 1 to 24. One\ncard will be drawn at random from the set. What is the probability that the card drawn will\nhave either a number that is divisible by both 2 and 3 or a number that is divisible by 7?\nA.\nB.\nC.\nD.\nE.","opts":{},"ans":"C","exp":"The desired probability is N divided by 24, where N is the number of positive integers from 1\nthrough 24 that are either divisible by both 2 and 3, or divisible by 7. Since an integer is\ndivisible by both 2 and 3 if and only if the integer is divisible by 6, it follows that N is the\nnumber of positive integers from 1 through 24 that are either divisible by 6 or divisible by 7.\nThere are 4 numbers from 1 through 24 that are divisible by 6, namely 6, 12, 18, and 24.\nThere are 3 numbers from 1 through 24 that are divisible by 7, namely 7, 14, and 21. Since\nthese numbers are all different from each other, it follows that N = 4 + 3 = 7 and the desired\nprobability is\n\n.\n\nThe correct answer is C."},{"n":25,"s":"Quan","t":"Problem Solving","d":"E","topic":"Algebra Applied Problems","q":"As a salesperson, Phyllis can choose one of two methods of annual payment: either an annual\nsalary of $35,000 with no commission or an annual salary of $10,000 plus a 20% commission\non her total annual sales. What must her total annual sales be to give her the same annual pay\nwith either method?","opts":{"A":"$100,000","B":"$120,000","C":"$125,000","D":"$130,000","E":"$132,000"},"ans":"C","exp":"Letting s be Phyllis\u2019s total annual sales needed to generate the same annual pay with either\nmethod, the given information can be expressed as $35,000 = $10,000 + 0.2s. Solve this\nequation for s.\n$35,000 = $10,000 + 0.2s\n\n\f\n$25,000 = 0.2s\n$125,000 = s\nThe correct answer is C."},{"n":26,"s":"Quan","t":"Problem Solving","d":"E","topic":"Algebra Inequalities","q":"If 1 < x < y < z, which of the following has the greatest value?","opts":{"A":"z(x + 1)","B":"z(y + 1)","C":"x(y + z)","D":"y(x + z)","E":"z(x + y)"},"ans":"E","exp":"This problem can be solved by calculating each of the options for a fixed and appropriate\nchoice of values of the variables. For example, if x = 2, y = 3, and z = 4, then 1 < x < y < z and\nthe values of the options are as follows:\nA. z(x + 1) = 4(2 + 1) = 12\nB. z(y + 1) = 4(3 + 1) = 16\nC. x(y + z) = 2(3 + 4) = 14\nD. y(x + z) = 3(2 + 4) = 18\nE. z(x + y) = 4(2 + 3) = 20\nAlternatively, this problem can also be solved algebraically.\nAnswer choice E is greater than each of answer choice A and B:\nz(x + 1) = zx + z\n\n<\n\nzx + zy = z(x + y)\n\nAnswer choice A\n\nuse 1 < y\n\nAnswer choice E\n\nz(y + 1) = zy + z\n\n<\n\nzy + zx = z(y + 1)\n\nAnswer choice B\n\nuse 1 < x\n\nAnswer choice E\n\nAnswer choice E is greater than each of answer choice C and D:\nx(y + z) = xy + xz\n\n<\n\nzy + xz = z(y + x)\n\nAnswer choice C\n\nuse x < z\n\nAnswer choice E\n\ny(x + z) = yx + yz\n\n<\n\nzx + yz = z(x + y)\n\nAnswer choice D\n\nuse y < z\n\nAnswer choice E\n\nThe correct answer is E."},{"n":27,"s":"Quan","t":"Problem Solving","d":"E","topic":"Arithmetic Operations with Integers","q":"Set X consists of eight consecutive integers. Set Y consists of all the integers that result from\nadding 4 to each of the integers in Set X and all the integers that result from subtracting 4\nfrom each of the integers in Set X. How many more integers are there in Set Y than in Set X?","opts":{"A":"0","B":"4","C":"8","D":"12"},"ans":"C","exp":"Since the 8 consecutive integers in Set X are not specified, let Set X = {3, 4, 5, 6, 7, 8, 9, 10}. The\nfollowing table shows Set X and Set Y whose elements were obtained by adding 4 to each\nelement of Set X and subtracting 4 from each element of Set X. The elements of Set Y that are\nalso in Set X are marked with an asterisk, *. There are 8 unmarked elements in Set Y, so Set Y\nhas 8 more elements than Set X.\nSet X\n\nSet Y\nAdd 4 Subtract 4\n\n3\n\n7*\n\n\u20131\n\n4\n\n8*\n\n0\n\n5\n\n9*\n\n1\n\n6\n\n10*\n\n2\n\n7\n\n11\n\n3*\n\n8\n\n12\n\n4*\n\n9\n\n13\n\n5*\n\n10\n\n14\n\n6*\n\nThe correct answer is C."},{"n":28,"s":"Quan","t":"Problem Solving","d":"E","topic":"Arithmetic Estimation","q":"Of the following, which is the closest to\n\n?","opts":{"A":"10","B":"12","C":"13","D":"14","E":"15"},"ans":"B","exp":"Replace the three numbers appearing in the expression with three nearby integers that allow\nthe arithmetic operations to be carried out easily to get an approximation.\n\nThe correct answer is B."},{"n":29,"s":"Quan","t":"Problem Solving","d":"E","topic":"Algebra Simultaneous First-Degree Equations","q":"Thabo owns exactly 140 books, and each book is either paperback fiction, paperback\nnonfiction, or hardcover nonfiction. If he owns 20 more paperback nonfiction books than\nhardcover nonfiction books, and twice as many paperback fiction books as paperback\nnonfiction books, how many hardcover nonfiction books does Thabo own?","opts":{"A":"10","B":"20","C":"30","D":"40","E":"50"},"ans":"B","exp":"Let F represent the number of paperback fiction books that Thabo owns; Np, the number of\npaperback nonfiction books; and Nh, the number of hardcover nonfiction books. It is given\nthat F + Np + Nh = 140, Np = Nh + 20, and F = 2Np = 2(Nh + 20). It follows that\nF + Np + Nh = 140 given\n2(Nh + 20) + (Nh + 20) + Nh = 140 by substitution\n4Nh + 60\n\n= 140 combine like terms\n\n4Nh = 80 subtract 60 from both sides\nNh = 20 divide both sides by 4\nThe correct answer is B."},{"n":30,"s":"Quan","t":"Problem Solving","d":"E","topic":"Arithmetic Statistics","q":"If the average (arithmetic mean) of the four numbers 3, 15, 32, and (N + 1) is 18, then N =","opts":{"A":"19","B":"20","C":"21","D":"22","E":"29"},"ans":"C","exp":"From the given information and the definition of average, it follows that\n\nMultiplying both sides of the last equation by 4 gives 51 + N = 72. Therefore, N = 72 \u2013 51 = 21.\nThe correct answer is C."},{"n":31,"s":"Quan","t":"Problem Solving","d":"E","topic":"Algebra Arithmetic; Simplifying Algebraic Expressions; Percents","q":"If x > 0,\n\nis what percent of x?","opts":{"A":"6%","B":"25%","C":"37%","D":"60%","E":"75%"},"ans":"A","exp":"Because we want a percent, use a common denominator of 100 to combine the two terms.\n, which is 6% of x.\nThe correct answer is A."},{"n":32,"s":"Quan","t":"Problem Solving","d":"E","topic":"Arithmetic Applied Problems","q":"During a certain time period, Car X traveled north along a straight road at a constant rate of 1\nmile per minute and used fuel at a constant rate of 5 gallons every 2 hours. During this time\nperiod, if Car X used exactly 3.75 gallons of fuel, how many miles did Car X travel?","opts":{"A":"36","B":"37.5","C":"40","D":"80","E":"90"},"ans":"E","exp":"The car used fuel at the rate of 5 gallons every 2 hours, and thus after using 3.75 gallons of\nfuel, the car had traveled for (3.75)\n\nhours. One way to obtain this value is indicated by the\n\ncalculations in the following table.\n5 gal\n\ncorresponds to 2 hr\n\nGiven\n\n1 gal\n\ncorresponds to\n\nDivide by 5\n\n3.75 gal corresponds to\n\nSince (3.75)\n\n=\n\nhr\n\n(3.75)\n\nhr\n\nMultiply by 3.75\n\nhours = 90 minutes, the car drove for 90 minutes at a rate of\n\n1 mile per minute. Therefore, the total distance the car drove was distance = rate \u00d7 time =\n\n\f\n(90 min) = 90 miles.\nThe correct answer is E."},{"n":33,"s":"Quan","t":"Problem Solving","d":"E","topic":"Algebra Applied Problems; Percents","q":"Cheryl purchased 5 identical hollow pine doors and 6 identical solid oak doors for the house\nshe is building. The regular price of each solid oak door was twice the regular price of each\nhollow pine door. However, Cheryl was given a discount of 25% off the regular price of each\nsolid oak door. If the regular price of each hollow pine door was $40, what was the total price\nof all 11 doors?","opts":{"A":"$320","B":"$540","C":"$560","D":"$620","E":"$680"},"ans":"C","exp":"The price of each pine door is $40, so the price of 5 pine doors is 5($40) = $200. The price of\neach oak door is twice that of a pine door, and thus $80, which becomes (0.75)($80) = $60\nwhen the 25% discount is applied. Therefore, the price of 6 oak doors at the 25% discount is\n6($60) = $360, and hence the total price of all 11 doors is $200 + $360 = $560.\nThe correct answer is C."},{"n":34,"s":"Quan","t":"Problem Solving","d":"E","topic":"Arithmetic Applied Problems","q":"A certain store will order 25 crates of apples. The apples will be of three different varieties\u2014\nMcIntosh, Rome, and Winesap\u2014and each crate will contain apples of only one variety. If the\nstore is to order more crates of Winesap than crates of McIntosh and more crates of Winesap\nthan crates of Rome, what is the least possible number of crates of Winesap that the store will\norder?","opts":{"A":"7","B":"8","C":"9","D":"10","E":"11"},"ans":"C","exp":"Let M, R, and W be the numbers of crates, respectively, of McIntosh, Rome, and Winesap\napples. From the given information, it follows that M + R + W = 25 and M \u2264 R < W. Find the\nleast possible value of W such that positive integer values of M, R, and W satisfy these two\nconditions.\nSince the values 8, 8, and 9 for M, R, and W satisfy these two conditions, W = 9 is possible.\nThus, the least possible value of W is less than or equal to 9. It is not possible for the value of\nW to be less than 9, since if the value of W were less than 9, then M + R + W < 25. This is\nbecause in this case, the greatest possible values of M, R, and W would be 7, 7, and 8, which\nhave a sum less than 25. Therefore, the least possible value of W is 9.\nThe correct answer is C."},{"n":35,"s":"Quan","t":"Problem Solving","d":"E","topic":"Arithmetic Profit and Loss","q":"A bicycle store purchased two bicycles, one for $250 and the other for $375, and sold both\nbicycles at a total gross profit of $250. If the store sold one of the bicycles for $450, which of\nthe following could be the store\u2019s gross profit from the sale of the other bicycle?","opts":{"A":"$75","B":"$100","C":"$125","D":"$150","E":"$175"},"ans":"E","exp":"Let $450 and $R be the individual revenues from selling the two bicycles. Then the unknown\nprofit from selling one of the bicycles is either $R \u2013 $250 or $R \u2013 $375.\ntotal profit = (total revenue) \u2013 (total cost)\n$250\n\n= ($450 + $R) \u2013 ($250 + $375)\n\n$250 = $R \u2013 $175\n$425 = $R\nFrom this it follows that the unknown profit is either $425 \u2013 $250 = $175 or $425 \u2013 $375 =\n$50.\nThe correct answer is E."},{"n":36,"s":"Quan","t":"Problem Solving","d":"E","topic":"Algebra Simplifying Algebraic Expressions","q":"If k2 = m2, which of the following must be true?","opts":{"A":"k = m","B":"k = \u2212m","C":"k = |m|","D":"k = \u2212|m|","E":"|k| = |m|"},"ans":"E","exp":"One method of solving this problem is to take the nonnegative square root of both sides of the\nequation k2 = m2 and then since\n= |u| for all real numbers u, it follows that |k| =\n=\n= |m|.\nThe table below shows that each of the other answer choices can be true but can also be false.\nFor each pair of values for k and m, it is true that k2 = m2.\n\n\f\nTrue for False for\nk\n\nm\n\nk\n\nm\n\nAk=m\n\n3\n\n3\n\n3\n\n\u20133\n\nB k = \u2013m\n\n\u20133\n\n3\n\n3\n\n3\n\nC k = |m|\n\n3 \u20133\n\n\u20133\n\n\u20133\n\nD k = \u2013|m| \u20133 \u20133\n\n3\n\n\u20133\n\nThe correct answer is E."},{"n":37,"s":"Quan","t":"Problem Solving","d":"E","topic":"Arithmetic Ratio and Proportion","q":"Makoto, Nishi, and Ozuro were paid a total of $780 for waxing the floors at their school. Each\nwas paid in proportion to the number of hours he or she worked. If Makoto worked 15 hours,\nNishi worked 20 hours, and Ozuro worked 30 hours, how much was Makoto paid?","opts":{"A":"$52","B":"$117","C":"$130"},"ans":"D","exp":"Makoto, Nishi, and Ozuro worked a total of 15 + 20 + 30 = 65 hours and were paid a total of\n$780. Since Makoto worked 15 of the 65 hours and he was paid in proportion to the number\nof hours he worked, his pay was\n\n($780). To determine which of the answer choices equals\n\nthis amount of money, note that\n\ncan be reduced to\n\nby dividing the numerator and\n\ndenominator by 5. Also note that 780 can be factored as (10)(78) = (10)(2)(39) = (10)(2)(3)\n(13). Then calculate\n\n= (3)(10)(2)(3) = 180.\n\nTip: In problems requiring calculations with fractions, it can be helpful to reduce fractions and\nutilize cancellation as much as possible.\nThe correct answer is D."},{"n":38,"s":"Quan","t":"Problem Solving","d":"E","topic":"Arithmetic Exponents","q":"If x is a positive integer and 4x \u2212 3 = y, which of the following CANNOT be a value of y?\nA.\n\n1\n\nB.\n\n7\n\nC. 13\nD. 61\nE. 253","opts":{"C":"13","D":"61","E":"253"},"ans":"B","exp":"This can be solved by calculating the value of 4x \u2013 3 for the first few positive integer values of\nx.\nx\n\n4x\n\n4x \u2013 3\n\n1\n\n4\n\n1\n\nA\n\n2\n\n16\n\n13\n\nC\n\n3\n\n64\n\n61\n\nD\n\n4\n\n256\n\n253\n\nE\n\nanswer choice\n\nAlternatively, this can be solved by observing that 4x always has units digit 4 or 6\u2014the\nproduct of two integers with units digit 4 has units digit 6, the product of two integers with\nunits digit 6 has units digit 4, etc.\u2014and therefore any integer that does not have units digit 4 \u2212\n3 = 1 or 6 \u2212 3 = 3 cannot be the value of 4x \u2212 3 for some positive integer value of x.\nThe correct answer is B."},{"n":39,"s":"Quan","t":"Problem Solving","d":"E","topic":"Algebra Operations with Rational Numbers","q":"If (1 \u2013 1.25)N = 1, then N =","opts":{"A":"\u2013400","B":"\u2013140","E":"400"},"ans":"C","exp":"Since (1 \u2013 1.25)N = \u20130.25N =\n\nN, the equation becomes \u2013\n\nN = 1, which has solution N = \u2013\n\n4.\nThe correct answer is C."},{"n":40,"s":"Quan","t":"Problem Solving","d":"E","topic":"Arithmetic Operations with Rational Numbers","q":"The quotient when a certain number is divided by\n\nis . What is the number?\n\nA.\nB.\nC. 3\nD. 6\nE.","opts":{"C":"3","D":"6"},"ans":"C","exp":"Let N be the unknown number. The quotient when N is divided by\n\nis\n\n, which equals\n\n(invert and multiply). Since this quotient equals , it follows that\nTherefore,\n\n.\n\n= 3.\n\nTip: Sometimes a correct method of calculation will be intuitively evident if difficult-toconceptualize numbers are replaced with easy-to-conceptualize numbers. For example, if the\nfirst sentence had instead been \u201cThe quotient when a certain number is divided by 2 is 3\u201d (i.e.,\nafter dividing a certain number by 2, the result is 3), then it may be intuitively evident that the\nnumber can be obtained by multiplying 2 and 3. Thus, for this problem, the number can be\nobtained by multiplying\n\nand .\n\nThe correct answer is C."},{"n":41,"s":"Quan","t":"Problem Solving","d":"E","topic":"Arithmetic Applied Problems","q":"The price of gasoline at a service station increased from $1.65 per gallon last week to $1.82\nper gallon this week. Sally paid $26.40 for gasoline last week at the station. How much more\nwill Sally pay this week at the station for the same amount of gasoline?","opts":{"A":"$1.70","B":"$2.55","C":"$2.64","D":"$2.72","E":"$2.90"},"ans":"D","exp":"Since $1.82 \u2013 $1.65 = $0.17, Sally paid $0.17 per gallon more this week than last week.\nTherefore, the total additional amount that Sally paid this week over last week is the number\nof gallons Sally purchased times $0.17.\nNumber of gallons purchased last week:\n\n=\n\nNumber of gallons purchased this week:\nTotal additional amount paid this week:\n\n= ($0.17)(16) = $2.72.\n\nOne way to lessen the arithmetic computations is to work with integers and factor.\n\n\f\n=\n\nmultiply numerator and denominator by 1,000 for ease of\ncalculation\n\n=\n\nfactor\n\n=\n\nidentify common factors\n\n=\n\ncancel common factors\n\n=\n\nmultiply\n\n=\n\ndivide numerator and denominator by 10\n\n= 2.72\n\ndivide\n\nThe correct answer is D."},{"n":42,"s":"Quan","t":"Problem Solving","d":"E","topic":"Arithmetic Interpretation of Tables","q":"Based on the rates above, how much would Company X charge a customer with a low-use\ncontract for using 95 message units in a month?","opts":{"A":"$9.30","B":"$11.30","C":"$12.88","D":"$14.88","E":"$16.18"},"ans":"A","exp":"The low-use contract charge for using 95 message units in a month is the monthly rate plus\nthe charge for messages in excess of 75.\nMonthly rate\n\n+ Charge for excess = Total charge\n\n(100% \u2212 20%)($10) + (95 \u2013 75)($0.065) =\n(0.8)($10)\n\n+ (20)($0.065)\n\n=\n\n$8.00\n\n+ $1.30\n\n= $9.30\n\n\f\nNote that the product (20)(0.065) can be obtained by multiplying 0.065 by 10 and then\ndoubling the result.\nThe correct answer is A."},{"n":43,"s":"Quan","t":"Problem Solving","d":"E","topic":"Algebra Simultaneous Equations","q":"If 2x + y = 7 and x + 2y = 5, then","opts":{"A":"1","E":"4"},"ans":"B","exp":"Adding the equations 2x + y = 7 and x + 2y = 5 gives 3x + 3y = 12, or x + y = 4. Dividing both\nsides of the last equation by 3 gives\nThe correct answer is B."},{"n":44,"s":"Quan","t":"Problem Solving","d":"E","topic":"Arithmetic Ratio and Proportion","q":"City X has a population 4 times as great as the population of City Y, which has a population\ntwice as great as the population of City Z. What is the ratio of the population of City X to the\npopulation of City Z?","opts":{"A":"1:8","B":"1:4","C":"2:1","D":"4:1","E":"8:1"},"ans":"E","exp":"Let X, Y, and Z be the populations of Cities X, Y, and Z, respectively. It is given that X = 4Y, and\nY = 2Z or Z =\n\n. Then,\n\n=\n\n= (4Y)\n\n=\n\n.\n\nThe correct answer is E."},{"n":45,"s":"Quan","t":"Problem Solving","d":"E","topic":"Arithmetic Interpretation of Graphs and Tables","q":"The graph above shows the height of the tide, in feet, above or below a baseline. Which of the\nfollowing is closest to the difference, in feet, between the heights of the highest and lowest\ntides on July 13 at Bay Cove?","opts":{"A":"1.7"},"ans":"E","exp":"From the graph, the highest tide is 2.2 ft above the baseline and the lowest tide is 0.5 ft below\nthe baseline. Therefore, the difference between the heights of the highest tide and the lowest\ntide is [2.2 \u2013 (\u20130.5)] ft = (2.2 + 0.5) ft = 2.7 ft.\nThe correct answer is E."},{"n":47,"s":"Quan","t":"Problem Solving","d":"E","topic":"Arithmetic Applied Problems","q":"A manufacturer of a certain product can expect that between 0.3 percent and 0.5 percent of\nthe units manufactured will be defective. If the retail price is $2,500 per unit and the\nmanufacturer offers a full refund for defective units, how much money can the manufacturer\nexpect to need to cover the refunds on 20,000 units?","opts":{"A":"Between $15,000 and $25,000","B":"Between $30,000 and $50,000","C":"Between $60,000 and $100,000","D":"Between $150,000 and $250,000","E":"Between $300,000 and $500,000"},"ans":"D","exp":"The expected number of defective units is between 0.3% and 0.5% of 20,000, or between\n(0.003)(20,000) = 60 and (0.005)(20,000) = 100. Since each unit has a retail price of $2,500,\nthe amount of money needed to cover the refunds for the expected number of defective units\nis between 60($2,500) and 100($2,500), or between $150,000 and $250,000.\nThe correct answer is D."},{"n":48,"s":"Quan","t":"Problem Solving","d":"E","topic":"Arithmetic Estimation","q":"Which of the following is closest to\n\n?","opts":{"A":"20","B":"40","C":"60","D":"80","E":"100"},"ans":"A","exp":"Replace the numbers that appear with nearly equal values that are perfect squares and then\nevaluate the resulting expression:\n\nThe correct answer is A."},{"n":49,"s":"Quan","t":"Problem Solving","d":"E","topic":"Arithmetic Applied Problems; Percents","q":"The sum of the weekly salaries of 5 employees is $3,250. If each of the 5 salaries is to increase\nby 10 percent, then the average (arithmetic mean) weekly salary per employee will increase\nby","opts":{"A":"$52.50","B":"$55.00","C":"$57.50","D":"$62.50","E":"$65.00"},"ans":"E","exp":"Let S1, S2, S3, S4, and S5 be the salaries, in dollars, of the 5 employees. Since the sum of the\n5 salaries is 3,250, then S1 + S2 + S3 + S4 + S5 = 3,250 and the average salary is\n=\n\n= 650. After each salary is increased by 10%, the salaries\n\nwill be (1.1)S1, (1.1)S2, (1.1)S3, (1.1)S4, and (1.1)S5 and the average salary, in dollars, will be\n= 1.1 \u00d7\n= 1.1 \u00d7 650 = 715. Therefore, the increase in the average salary is $715 \u2013 $650 = $65.\nThe correct answer is E."},{"n":50,"s":"Quan","t":"Problem Solving","d":"E","topic":"Algebra Applied Problems","q":"Last week Chris earned x dollars per hour for the first 40 hours worked plus 22 dollars per\nhour for each hour worked beyond 40 hours. If last week Chris earned a total of 816 dollars\nby working 48 hours, what is the value of x?","opts":{},"ans":"D","exp":"Chris worked 40 hours at a rate of $x per hour, 48 \u2013 40 = 8 hours at a rate of $22 per hour,\nand earned a total of $816.\n40x + 8(22) = 816\n\ngiven information\n\n40x + 176 = 816\n\nmultiply 8 and 22\n\n40x = 640\nx = 16\n\nsubtract 176 from both sides\ndivide both sides by 40\n\nThe correct answer is D."},{"n":51,"s":"Quan","t":"Problem Solving","d":"E","topic":"Arithmetic Estimation","q":"The value of\n\nis closest to which of the following?","opts":{"A":"2","C":"1","E":"0"},"ans":"A","exp":"First, note that division by\n\nis the same as multiplication by\n\n=\n\n. Then, because the question asks for the value\n\n\u201cclosest to\u201d and not the exact value, estimate\n=\n\n\u2248\n\n\u2248\n\nand calculate\n\n= 2.\n\nAlternatively, calculate\nestimate\n\n(invert and multiply), so,\n\nusing the common denominator of 72,\n\n=\n\n+\n\n=\n\n, then\n\n= 1, then calculate 1(2) = 2.\n\nThe correct answer is A."},{"n":52,"s":"Quan","t":"Problem Solving","d":"E","topic":"Arithmetic Properties of Numbers","q":"The positive two-digit integers x and y have the same digits, but in reverse order. Which of the\nfollowing must be a factor of x + y?","opts":{"A":"6","B":"9","C":"10","D":"11","E":"14"},"ans":"D","exp":"Let m and n be digits. If x = 10m + n, then y = 10n + m. Adding x and y gives x + y = (10m + n) +\n(10n + m) = 11m + 11n = 11(m + n), and therefore 11 is a factor of x + y.\nThe correct answer is D."},{"n":53,"s":"Quan","t":"Problem Solving","d":"E","topic":"Arithmetic Sequences","q":"In a certain sequence of 8 numbers, each number after the first is 1 more than the previous\nnumber. If the first number is \u20135, how many of the numbers in the sequence are positive?","opts":{"A":"None","B":"One","C":"Two","D":"Three","E":"Four"},"ans":"C","exp":"The sequence consists of eight consecutive integers beginning with \u20135:\n\nIn this sequence exactly two of the numbers are positive.\nThe correct answer is C."},{"n":54,"s":"Quan","t":"Problem Solving","d":"E","topic":"Algebra Algebraic Expressions","q":"A total of s oranges are to be packaged in boxes that will hold r oranges each, with no oranges\nleft over. When n of these boxes have been completely filled, what is the number of boxes that\nremain to be filled?","opts":{"A":"s \u2013 nr","C":"rs \u2013 n"},"ans":"E","exp":"If s oranges are packed r oranges to a box with no oranges left over, then the number of\nboxes that will be filled is\n\n. If n of these boxes are already filled, then\n\n\u2013 n boxes remain to\n\nbe filled.\nThe correct answer is E."},{"n":55,"s":"Quan","t":"Problem Solving","d":"E","topic":"Algebra Inequalities","q":"If 0 < a < b < c, which of the following statements must be true?\nI. 2a > b + c\nII. c \u2013 a > b \u2013 a\nIII.","opts":{"A":"I only","B":"II only","C":"III only","D":"I and II","E":"II and III"},"ans":"B","exp":"Given 0 < a < b < c, Statement I is not necessarily true. If, for example, a = 1, b = 2, and c = 3,\nthen 0 < a < b < c, but 2a = 2(1) < 2 + 3 = b + c.\nGiven 0 < a < b < c, then c > b, and subtracting a from both sides gives c \u2212 a > b \u2212 a. Therefore,\nStatement II is true.\nGiven 0 < a < b < c, Statement III is not necessarily true. If, for example, a = 1, b = 2, and c = 3,\nthen 0 < a < b < c, but\n\n=\n\n>\n\n=\n\n.\n\nThe correct answer is B."},{"n":56,"s":"Quan","t":"Problem Solving","d":"E","topic":"Arithmetic Statistics","q":"The table shows the numbers of packages shipped daily by each of five companies during a 4day period. The standard deviation of the numbers of packages shipped daily during the\nperiod was greatest for which of the five companies?","opts":{"A":"A","B":"B","C":"C","D":"D","E":"E"},"ans":"B","exp":"Since the standard deviation of a data set is a measure of how widely the data are scattered\nabout their mean, find the mean number of packages shipped by each company and then\ncalculate the deviations of the company\u2019s data from its mean.\nFor Company A, the mean number of packages shipped is\n\n= 50 and the\n\ndeviations from this mean are \u22125, 5, 0, and 0. Note that the numbers of packages allow for\nquick calculations of the means. For example, for Company A the total number of packages is\nthe sum of 45 + 55 = 100 and 50 + 50 = 100, and for Company D the total number of\npackages is the sum of 39 + 41 = 80 and 42 + 38 = 80.\nThe following table shows the means and deviations for the 5 companies.\nmean deviations from mean\nCompany A\n\n50\n\n\u22125, 5, 0, 0\n\nCompany B\n\n20\n\n\u221210, 10, 10, \u221210\n\nCompany C\n\n30\n\n4, \u22122, \u22122, 0\n\nCompany D\n\n40\n\n\u22121, 2, 1, \u22122\n\nCompany E\n\n60\n\n\u221210, 0, 0, 10\n\n\f\nThis table shows that the magnitude of each of the 4 deviations for Company B is greater than\nor equal to the magnitude of any of the other deviations, which strongly suggests that the\nstandard deviation is greatest for Company B.\nFor those interested, the standard deviations can be calculated as\n\n.\n\nHowever, since we only"},{"n":57,"s":"Quan","t":"Problem Solving","d":"E","topic":"Algebra Applied Problems","q":"Company Q plans to make a new product next year and sell each unit of this new product at a\nselling price of $2. The variable costs per unit in each production run are estimated to be 40%\nof the selling price, and the fixed costs for each production run are estimated to be $5,040.\nBased on these estimated costs, how many units of the new product will Company Q need to\nmake and sell in order for their revenue to equal their total costs for each production run?","opts":{"A":"4,200","B":"3,150","C":"2,520","D":"2,100"},"ans":"A","exp":"Let x be the desired number of units to be sold at a price of $2 each. Then the revenue for\nselling these units is $2x, and the total cost for selling these units is (40%)($2.00)x = $0.80x\nplus a fixed cost of $5,040.\n\n\f\nrevenue = total cost\n2x = 0.8x + 5,040\n1.2x = 5,040\nx = 4,200\n\ngiven requirement\ngiven information\nsubtract 0.8x from both sides\ndivide both sides by 1.2\n\nThe correct answer is A."},{"n":58,"s":"Quan","t":"Problem Solving","d":"E","topic":"Arithmetic Rate","q":"A small business invests $9,900 in equipment to produce a product. Each unit of the product\ncosts $0.65 to produce and is sold for $1.20. How many units of the product must be sold\nbefore the revenue received equals the total expense of production, including the initial\ninvestment in equipment?","opts":{"A":"12,000","B":"14,500","C":"15,230","D":"18,000","E":"20,000"},"ans":"D","exp":"Let n be the number of units desired. Then, in dollars, the revenue received is 1.2n and the\ntotal expense is 9,900 + 0.65n. These two amounts are equal when 1.2n = 9,900 + 0.65n, or\n0.55n = 9,900. Therefore, n =\n\n= 18,000.\n\nThe correct answer is D."},{"n":59,"s":"Quan","t":"Problem Solving","d":"E","topic":"Arithmetic Percents","q":"According to the table shown, the estimated number of home-schooled students in State A is\napproximately what percent greater than the number in State D?","opts":{"A":"25%","B":"55%","C":"100%","D":"125%","E":"155%"},"ans":"D","exp":"The percent increase from the number in State D to the number in State A is\n=\n\nexpression for percent increase\n\n=\n\nreduce fraction\n\n=\n\nsubtract\n\n\u2248\n\napproximate\n\n= (1.25 \u00d7 100)%\n\ndivide\n\n= 125%\n\nmultiply\n\nThe correct answer is D."},{"n":60,"s":"Quan","t":"Problem Solving","d":"E","topic":"Algebra Applied Problems","q":"When n liters of fuel were added to a tank that was already\n\nfull, the tank was filled to\n\nof\n\nits capacity. In terms of n, what is the capacity of the tank, in liters?\nA.\nB.\nC.","opts":{},"ans":"D","exp":"Let C represent the capacity of the tank, in liters. It follows that\n\n\f\nC+n =\nn=\n\nn=\n\ngiven\n\nC\n\nC\u2212\n\nC\n\nC\n\nn=C\n\nsubtract\n\nC from both sides\n\ncombine like terms\n\ndivide both sides by\n\nThe correct answer is D."},{"n":61,"s":"Quan","t":"Problem Solving","d":"E","topic":"Arithmetic Applied Problems","q":"Kevin invested $8,000 for one year at a simple annual interest rate of 6 percent and invested\n$10,000 for one year at an annual interest rate of 8 percent compounded semiannually. What\nis the total amount of interest that Kevin earned on the two investments?","opts":{"A":"$880","B":"$1,088","C":"$1,253","D":"$1,280","E":"$1,296"},"ans":"E","exp":"Interest on $8,000 investment: For simple interest, recall that the amount of interest is\n(Principal) \u00d7 (Interest rate) \u00d7 (Time) = ($8,000)(0.06)(1)\n= $480\nInterest on $10,000 investment: For compound interest, recall that the amount of interest is\nthe final investment value minus the principal, which is equal to\nP = principal\n\n, where\n\n= $10,000\n\nr = annual interest rate = 0.08\nn = periods per year\n\n= 2\n\nt = number of years\n\n= 1\n\nSubstitute these values and calculate the result:\n\n\f\n10,000\n\n\u2212 10,000\n\n10,000(1.04)2 \u2013 10,000\n\narithmetic\n\n10,000(1.042 \u2013 1)\n\nfactor out 10,000\n\n10,000(1.0816 \u2013 1)\n\nsquare 1.04\n\n10,000(0.0816)\n\nsubtract\n\n816\n\nmultiply\n\nTherefore, the total amount of interest on the two investments is $480 + $816 = $1,296.\nTip: The algebraic identity (a + b)2 = a2 + 2ab + b2 is sometimes useful in squaring numbers\nquickly. For example, 1.042 = (1 + 0.04)2 can be obtained by adding the following three\nnumbers: square of 1, double the product of 1 and 0.04, and square of 0.04. Another example\nis 3052 = (300 + 5)2.\na\n\nb\n\na2\n\n2ab\n\nb2\n\n1\n\n0.04 1\n\n0.08\n\n0.0016\n\n300 5\n\n90,000 3,000 25\n\nThus, 1.042 can be calculated by 1 + 0.08 + 0.0016 and 3052 can be calculated by\n90,000 + 3,000"},{"n":62,"s":"Quan","t":"Problem Solving","d":"E","topic":"Algebra Algebraic Expressions","q":"The harvest yield from a certain apple orchard was 350 bushels of apples. If x of the trees in\nthe orchard each yielded 10 bushels of apples, what fraction of the harvest yield was from\nthese x trees?\nA.\nB.\nC. 10x\nD. 35 \u2013 x\nE. 350 \u2013 10x","opts":{"C":"10x","D":"35 \u2013 x","E":"350 \u2013 10x"},"ans":"A","exp":"Since each of the x trees yielded 10 bushels, the total number of bushels yielded by these\ntrees was 10x. Since the yield of the entire orchard was 350 bushels,\n\n=\n\nwas the\n\nfraction of the total yield from these x trees.\nThe correct answer is A."},{"n":63,"s":"Quan","t":"Problem Solving","d":"E","topic":"Algebra First-Degree Equations","q":"In a certain fraction, the denominator is 16 greater than the numerator. If the fraction is\nequivalent to 80 percent, what is the denominator of the fraction?","opts":{"A":"32","B":"64","C":"72","D":"80","E":"120"},"ans":"D","exp":"Let n be the numerator of the fraction. Then n + 16 is the denominator of the fraction. From\nthe given information it follows that\n=\n\n, which is solved below.\nconvert 80% to a fraction\n\n5n = 4(n + 16)\n\nclear fractions\n\n5n = 4n + 64\n\nsimplify\n\nn = 64\n\nsubtract 4n from both sides\n\nTherefore, the denominator of the fraction is n + 16 = 64 + 16 = 80.\nThe correct answer is D."},{"n":64,"s":"Quan","t":"Problem Solving","d":"E","topic":"Arithmetic Applied Problems","q":"Greg assembles units of a certain product at a factory. Each day he is paid $2.00 per unit for\nthe first 40 units that he assembles and $2.50 for each additional unit that he assembles that\nday. If Greg assembled at least 30 units on each of two days and was paid a total of $180.00\nfor assembling units on the two days, what is the greatest possible number of units that he\ncould have assembled on one of the two days?","opts":{"A":"48","B":"52","C":"56","D":"60","E":"64"},"ans":"C","exp":"Since the task is to find the greatest number of units Greg could have assembled on one of the\ndays, start by checking the answer choice with the greatest value (in this case, answer choice\nE).\n\n\f\nAnswer choice E Number of units assembled on day with greatest number: 64\nPay: 40($2.00) + 24($2.50) = $80.00 + $60.00 = $140.00\nPay for other day: $180.00 \u2013 $140.00 = $40\nNumber of units assembled on other day:\n\n= 20\n\nConclusion: Because 20 < 30, the greatest number is NOT 64.\nAnswer choice D\n\nNumber of units assembled on day with greatest number: 60\n\nPay: 40($2.00) + 20($2.50) = $80.00 + $50.00 = $130.00\nPay for other day: $180.00 \u2013 $130.00 = $50\nNumber of units assembled on other day:\n\n= 25\n\nConclusion: Because 25 < 30, the greatest number is NOT 60.\nAnswer choice C\n\nNumber of units assembled on day with greatest number: 56\n\nPay: 40($2.00) + 16($2.50) = $80.00 + $40.00 = $120.00\nPay for other day: $180.00 \u2013 $120.00 = $60\nNumber of units assembled on other day:\n\n= 30\n\nConclusion: Because 30 \u2265 30, the greatest number IS 56.\nNote that neither 48 nor 52 can be the greatest because 56 > 48 and 56 > 52.\nThe correct answer is C."},{"n":65,"s":"Quan","t":"Problem Solving","d":"E","topic":"Arithmetic Operations on Radical Expressions","q":"Which of the following is greatest?","opts":{},"ans":"B","exp":"Since all the expressions represent positive numbers, the expression that has the greatest\nsquared value will be the expression that has the greatest value.\n= 100 \u00d7 3 = 300 (not greatest)\n= 81 \u00d7 4 = 324 (greatest)\n= 64 \u00d7 5 = 320 (not greatest)\n= 49 \u00d7 6 = 294 (not greatest)\n\n\f\n= 36 \u00d7 7 = 252 (not greatest)\nThe correct answer is B."},{"n":66,"s":"Quan","t":"Problem Solving","d":"E","topic":"Algebra Applied Problems","q":"Al and Ben are drivers for SD Trucking Company. One snowy day, Ben left SD at 8:00 a.m.\nheading east and Al left SD at 11:00 a.m. heading west. At a particular time later that day, the\ndispatcher retrieved data from SD\u2019s vehicle tracking system. The data showed that, up to that\ntime, Al had averaged 40 miles per hour and Ben had averaged 20 miles per hour. It also\nshowed that Al and Ben had driven a combined total of 240 miles. At what time did the\ndispatcher retrieve data from the vehicle track","opts":{"A":"1:00 p.m.","B":"2:00 p.m.","C":"3:00 p.m.","D":"5:00 p.m.","E":"6:00 p.m."},"ans":"B","exp":"Let t be the number of hours after 8:00 a.m. that Ben drove. Then Al, who began 3 hours after\nBen began and thus drove 3 hours less than Ben, drove (t \u2013 3) hours. First, find the total\ndistance each drove in terms of t.\nrate time distance = rate \u00d7 time\nAl\n\n40\n\nBen 20\n\nt \u2212 3 40(t \u2013 3)\nt\n\n20t\n\nSince the combined total distance that Al and Ben drove was 240 miles, it follows that 40(t \u2013\n3) + 20t = 240. Solve for t.\n40(t \u2013 3) + 20t = 240\n60t \u2212 120 = 240\n\ngiven\nexpand and combine like terms\n\n60t = 360\n\nadd 120 to both sides\n\nt=6\n\ndivide both sides by 60\n\nTherefore, the data was retrieved 6 hours after 8:00 a.m., which was 2:00 p.m.\nThe correct answer is B."},{"n":67,"s":"Quan","t":"Problem Solving","d":"E","topic":"Arithmetic Applied Problems; Percents","q":"Of the land owned by a farmer, 90 percent was cleared for planting. Of the cleared land, 40\npercent was planted with soybeans and 50 percent of the cleared land was planted with\nwheat. If the remaining 720 acres of cleared land was planted with corn, how many acres did\nthe farmer own?","opts":{"A":"5,832","B":"6,480","C":"7,200","D":"8,000","E":"8,889"},"ans":"D","exp":"Corn was planted on 100% \u2013 (40% + 50%) = 10% of the cleared land, and the cleared land\nrepresents 90% of the farmer\u2019s land. Therefore, corn was planted on 10% of 90%, or (0.10)\n(0.90) = 0.09 = 9%, of the farmer\u2019s land. It is given that corn was planted on 720 acres, so if x\nis the number of acres the farmer owns, then 0.09x = 720 and\n\n.\n\nThe correct answer is D."},{"n":68,"s":"Quan","t":"Problem Solving","d":"E","topic":"Arithmetic Applied Problems; Sequences","q":"At the start of an experiment, a certain population consisted of 3 animals. At the end of each\nmonth after the start of the experiment, the population size was double its size at the\nbeginning of that month. Which of the following represents the population size at the end of\n10 months?\nA.\nB.\nC. 2(310)\nD. 3(210)\nE. 3(102)","opts":{"C":"2(310)","D":"3(210)","E":"3(102)"},"ans":"D","exp":"The population doubles each month, so multiply the previous month\u2019s population by 2 to get\nthe next month\u2019s population. Thus, at the end of the 1st month the population will be (3)(2), at\nthe end of the 2nd month the population will be (3)(2)(2), at the end of the 3rd month the\npopulation will be (3)(2)(2)(2), and so on. Therefore, at the end of the 10th month the\npopulation will be the product of 3 and ten factors of 2, which equals 3(210).\nThe correct answer is D."},{"n":69,"s":"Quan","t":"Problem Solving","d":"E","topic":"Arithmetic Operations with Rational Numbers","q":"If\n\nthen r =\nA.","opts":{},"ans":"C","exp":"=\n\n=\n\n1=\n\n3=r\nAlternatively,\n=\n\n=\n\n=\n\n=r\n3=r\nThe correct answer is C."},{"n":70,"s":"Quan","t":"Problem Solving","d":"E","topic":"Arithmetic Properties of Numbers","q":"If x and y are positive integers such that y is a multiple of 5 and 3x + 4y = 200, then x must be\na multiple of which of the following?","opts":{"A":"3","B":"6","C":"7","D":"8","E":"10"},"ans":"E","exp":"Since y is a multiple of 5, consider the following table:\ny\n\n4y\n\n3x = x =\n200 \u2013 4y\n\nIs x a positive\ninteger?\n\n5\n\n20\n\n180\n\n10 40\n\n160\n\nno\n\n15 60\n\n140\n\nno\n\n20 80\n\n120\n\n25 100\n\n100\n\nno\n\n30 120\n\n80\n\nno\n\n35 140\n\n60\n\n40 160\n\n40\n\nno\n\n45 180\n\n20\n\nno\n\n50 200\n\n0\n\n60\n\n40\n\n20\n\n0\n\nyes\n\nyes\n\nyes\n\nno\n\nThe only positive integers x that satisfy the 3x + 4y = 200, where y is a multiple of 5, are 60,\n40, and 20; each is a multiple of 10.\nNote: It is not necessary to perform all of the calculations shown here, nor is it necessary to\nfill out the table completely. Using \u201cnumber sense\u201d to see the patterns (e.g., numbers in the\nsecond column increase by 20 while numbers in the third column decrease by 20) will\nshorten the work considerably.\nThe correct answer is E."},{"n":71,"s":"Quan","t":"Problem Solving","d":"E","topic":"Arithmetic Operations with Radical Expressions","q":"Which of the following expressions can be written as an integer?\nI.\nII.\nIII.","opts":{"A":"None","B":"I only","C":"III only","D":"I and II","E":"I and III"},"ans":"E","exp":"Expression I represents an integer because\n\n. Expression II\nand 823 = 23 \u00d7 413 is not a perfect\n\ndoes not represent an integer because\n\nsquare. Regarding this last assertion, note that the square of any integer has the property that\neach of its distinct prime factors is repeated an even number of times. For example, 242 = (23\n\u00d7 3)2 = 26 \u00d7 32 has the prime factor 2 repeated 6 times and the prime factor 3 repeated twice.\nExpression III represents an integer, because\n\n.\n\nThe correct answer is E."},{"n":72,"s":"Quan","t":"Problem Solving","d":"E","topic":"Arithmetic Applied Problems","q":"Pumping alone at their respective constant rates, one inlet pipe fills an empty tank to\ncapacity in 3 hours and a second inlet pipe fills the same empty tank to\n\nof\n\nof capacity in 6\n\nhours. How many hours will it take both pipes, pumping simultaneously at their respective\nconstant rates, to fill the empty tank to capacity?","opts":{"A":"3.25","B":"3.6","C":"4.2","D":"4.4","E":"5.5"},"ans":"B","exp":"The first pipe can fill\n\nof the tank in 3 hours, which is equivalent to the rate of filling\n\nof the tank per hour. The second pipe can fill\nequivalent to the rate of filling\n\nof the tank in 6 hours, which is\n\nof the tank per hour. Together, they can fill the tank\n\n\f\nat a rate of\n\nof the tank per hour. Thus, when both pipes are used at the same\n\ntime, they will fill the tank in\n\nhours.\n\nThe correct answer is B."},{"n":73,"s":"Quan","t":"Problem Solving","d":"E","topic":"Algebra Inequalities","q":"If\n\n\u2013 2 < 0, which of the following specifies all the possible values of x?\nA.\nB.\nC.","opts":{},"ans":"C","exp":"The corresponding equality x2 \u2212 2 = 0 has two solutions, x =\nand x = \u2212 , and thus there\nare three intervals to test for inclusion in the solution of the inequality: x < \u2212 , \u2212\n<x<\n, and x >\n, labeled I1, I2, and I3, respectively, in the figure below.\n\nNext, choose a value from each of these intervals to test whether the inequality holds:\nFrom I1, for example, choose x = \u20132; the inequality becomes (\u20132)2 \u2013 2 < 0 (False).\nFrom I2, for example, choose x = 0; the inequality becomes (0)2 \u2013 2 < 0 (True).\nFrom I3, for example, choose x = 2; the inequality becomes (2)2 \u2013 2 < 0 (False).\nTherefore, the solution consists of only values in I2.\nAlternatively, the expression x2 \u2013 2 can be factored as (x \u2013\n)(x +\n). The value of the factor\n(x \u2013\n) is 0 at x =\n, negative for values of x less than\n, and positive for values of x\ngreater than\n. Similarly, the value of the factor (x +\n) is 0 at x = \u2013\n, negative for values\nof x less than \u2013\n, and positive for values of x greater than \u2013\n. Using the number line, this\ninformation can be summarized as shown below:\n\nThen, as shown below, vertical lines through the zeros partition the number line into three\nintervals I1, I2, and I3.\n\n\f\nI1: x < \u2013\n(x \u2013\nI2: \u2013\n(x \u2013\nI"},{"n":74,"s":"Quan","t":"Problem Solving","d":"E","topic":"Arithmetic Operations with Integers","q":"Shawana made a schedule for reading books during 4 weeks (28 days) of her summer\nvacation. She has checked out 12 books from the library. The number of pages in each book\nand the order in which she plans to read the books are shown in the table above. She will\nread exactly 50 pages each day. The only exception will be that she will never begin the next\nbook on the same day that she finishes the previous one, and therefore on some days she may\nread fewer than 50 pages. At the end of the 28th day,","opts":{"A":"7","B":"8","C":"9","D":"10","E":"11"},"ans":"B","exp":"Book 1: 6 days\u201450 pages on each of Days 1\u20135, 3 pages on Day 6 [5(50) + 3 = 253]\nBook 2: 3 days\u201450 pages on each of Days 7 and 8, 10 pages on Day 9 [2(50) + 10 = 110]\nBook 3: 3 days\u201450 pages on each of Days 10 and 11, 17 pages on Day 12 [2(50) + 17 = 117]\nBook 4: 4 days\u201450 pages on each of Days 13\u201315, 20 pages on Day 16 [3(50) + 20 = 170]\nBook 5: 4 days\u201450 pages on each of Days 17\u201319, 5 pages on Day 20 [3(50) + 5 = 155]\nBook 6: 1 day\u201450 pages on Day 21 [1(50) = 50]\nBook 7: 5 days\u201450 pages on each of Days 22\u201325, 5 pages on Day 26 [4(50) + 5 = 205]\nBook 8: 2 days\u201450 pages on Day 27, 20 pages on Day 28 [50 + 20 = 70]\nAt this point, Shawana has read on a total of 28 days and has finished 8 books.\nThe correct answer is B."},{"n":75,"s":"Quan","t":"Problem Solving","d":"E","topic":"Arithmetic Percents","q":"In Western Europe, x bicycles were sold in each of the years 1990 and 1993. The bicycle\nproducers of Western Europe had a 42 percent share of this market in 1990 and a 33 percent\nshare in 1993. Which of the following represents the decrease in the annual number of\nbicycles produced and sold in Western Europe from 1990 to 1993?","opts":{},"ans":"D","exp":"Of the x bicycles sold in Western Europe in 1990, 42% of them were produced in Western\nEurope. It follows that the number of bicycles produced and sold in Western Europe in 1990\nwas 0.42x. Similarly, of the x bicycles sold in Western Europe in 1993, 33% were produced in\nWestern Europe. It follows that the number of bicycles produced and sold in Western Europe\nin 1993 was 0.33x. Therefore, the decrease in the annual number of bicycles produced and\nsold in Western Europe from 1990 to 1993 was 0.42x \u2013 0.33x = 0.09x, which is 9% of x.\n\n\f\nThe correct answer is D."},{"n":76,"s":"Quan","t":"Problem Solving","d":"E","topic":"Algebra Properties of Numbers","q":"If k is a positive integer, what is the remainder when (k + 2)(k3 \u2013 k) is divided by 6?","opts":{"A":"0","B":"1","C":"2","D":"3","E":"4"},"ans":"A","exp":"Since k can be any positive integer, the remainder must be the same regardless of the value of\nk. If k = 2, for example, then (k + 2)(k3 \u2013 k) = (2 + 2)(23 \u2013 2) = (4)(6), which is a multiple of 6,\nand therefore, the remainder when divided by 6 is 0.\nAlternatively, factor the given expression:\n(k + 2)(k3 \u2013 k) = (k + 2)(k)(k2 \u2013 1)\n= (k + 2)(k)(k + 1)(k \u2013 1)\nNow, rearrange the factors in ascending order (k \u2013 1)(k)(k + 1)(k + 2), and observe that for\nany positive integer k, the factors are four consecutive integers, two of which are even and\none of which is divisible by 3. Therefore, (k + 2)(k3 \u2013 k) is divisible by both 2 and 3. Thus,\n(k + 2)(k3 \u2013 k) is divisible by 6 with 0 remainder.\nThe correct answer is A."},{"n":77,"s":"Quan","t":"Problem Solving","d":"E","topic":"Arithmetic Fractions","q":"Which of the following fractions is closest to ?\nA.\nB.\nC.\nD.\nE.","opts":{},"ans":"D","exp":"A fraction equals\n\nif its numerator is half its denominator. Thus, to compare the answer\n\nchoices with , rewrite\n\nto have the same denominators as the answer choices. This will\n\nallow for an easy determination of the distance to .\n\n\f\nanswer choice value rewrite of\n\ndistance to\n\nA\n\nB\n\nC\n\nD\n\nE\n\nClearly,\n\nis smaller than each of\n\n, and\n\nbecause the numerators are equal, and\n\nthus larger denominators correspond to smaller values. Also,\nTherefore,\n\nis smaller than\n\n.\n\nis closest to .\n\nThe correct answer is D."},{"n":78,"s":"Quan","t":"Problem Solving","d":"E","topic":"Algebra Simplifying Algebraic Expressions","q":"If p \u2260 0 and p \u2013\n\n=\n\n, then r =","opts":{"A":"p + 1","B":"2p \u2013 1","C":"p2 + 1","D":"2p2 \u2013 1","E":"p2 + p \u2013 1"},"ans":"D","exp":"p\u2013\n\n=\n\np2 \u2013 (1 \u2013 p2) = r\n2p2 \u2013 1 = r\n\ngiven\n\nmultiply both sides by p\ncombine like terms\n\nThe correct answer is D."},{"n":79,"s":"Quan","t":"Problem Solving","d":"E","topic":"Arithmetic Statistics","q":"If the range of the six numbers 4, 3, 14, 7, 10, and x is 12, what is the difference between the\ngreatest possible value of x and the least possible value of x?","opts":{"A":"0","B":"2","C":"12"},"ans":"D","exp":"The range of the six numbers 3, 4, 7, 10, 14, and x is 12. If x were neither the greatest nor the\nleast of the six numbers, then the greatest and least of the six numbers would be 14 and 3.\nBut this cannot be possible because the range of the six numbers would be 14 \u2013 3 = 11 and\nnot 12 as stated. Therefore, x must be either the greatest or the least of the six numbers. If x is\nthe greatest of the six numbers, then 3 is the least, and x \u2013 3 = 12. It follows that x = 15. On the\nother hand, if x is the least of the six numbers, then 14 is the greatest, and 14 \u2013 x = 12. It\nfollows that x = 2. Thus, there are only two possible values of x, namely 15 and 2, and so the\ndifference between the greatest and least possible values of x is 15 \u2013 2 = 13.\nThe correct answer is D."},{"n":80,"s":"Quan","t":"Problem Solving","d":"E","topic":"Algebra First-Degree Equations","q":"What number is 108 more than two-thirds of itself?","opts":{"A":"72","B":"144","C":"162","D":"216","E":"324"},"ans":"E","exp":"Let x be the number that is 108 more than two-thirds of itself. Then, 108 +\n\nx = x. Solve for x\n\nas follows:\n108 +\n\nx=x\n\n108 =\n\n324\n\n=x\n\nThe correct answer is E."},{"n":81,"s":"Quan","t":"Problem Solving","d":"E","topic":"Algebra Algebraic Expressions","q":"A service provider charges c dollars for the first 50 hours of service used per month and\n40 cents for each 30 minutes in excess of 50 hours used during the month. If x is an integer\ngreater than 50, which of the following expressions gives this service provider\u2019s charge, in\ndollars, for a month in which x hours of service were used?","opts":{"A":"c + 0.40x","B":"c + 0.80x","C":"c + 0.40(x \u2212 50)","D":"c + 0.80(x \u2212 50)","E":"c + 0.40(2x \u2212 50)"},"ans":"D","exp":"For x hours of service used in the month, the charge is c dollars for the first 50 hours used,\nleaving (x \u2212 50) hours to be charged at 40 cents per half hour, which is equivalent to 80 cents\nper hour. Therefore, the total charge, in dollars, for a month in which x hours of service were\nused is c + 0.80(x \u2212 50).\nThe correct answer is D."},{"n":82,"s":"Quan","t":"Problem Solving","d":"E","topic":"Arithmetic Measurement Conversion","q":"A salesperson who had been driving at a speed of 100 kilometers per hour slowed down to a\nspeed of 47 kilometers per hour. Approximately how many miles per hour was the speed\nreduced? (1 kilometer \u2248 0.625 mile)","opts":{"A":"29","B":"33","C":"53","D":"63","E":"75"},"ans":"B","exp":"(100 \u2212 47)\n53\n\namount of reduction\nsubtract\n1 km = 0.625 mi\n\n(50)(0.6)\n\nestimate\n\n30\n\nmultiply\n\nFrom the calculations it follows that speed was reduced, in miles per hour, by a little more\nthan 30; among the answer choices, only 33 is a reasonable choice. The exact value is 33.125,\nand this can be found by multiplying 53 and 0.625 or, since (53)\n\n= (53)\n\n,\n\ndividing 265 by 8.\nThe correct answer is B."},{"n":83,"s":"Quan","t":"Problem Solving","d":"E","topic":"Arithmetic Percents","q":"Company P had 15 percent more employees in December than it had in January. If Company P\nhad 460 employees in December, how many employees did it have in January?","opts":{"A":"391","B":"400","C":"410","D":"423","E":"445"},"ans":"B","exp":"It is given that 460 is 115% of the number of employees in January. Therefore, the number of\nemployees in January was\n\nThe correct answer is B."},{"n":84,"s":"Quan","t":"Problem Solving","d":"E","topic":"Arithmetic Inequalities","q":"The table above shows the numbers of hours of television programs that Jane recorded last\nweek and the numbers of hours she spent viewing these recorded programs. No recorded\nprogram was viewed more than once. If h is the number of hours of recorded programs she\nhad not yet viewed by the end of Friday, which of the following intervals represents all of the\npossible values of h?","opts":{"A":"0 \u2264 h \u2264 1","B":"1 \u2264 h \u2264 2","C":"2 \u2264 h \u2264 3","D":"0 \u2264 h \u2264 2","E":"1 \u2264 h \u2264 3"},"ans":"E","exp":"By the end of Friday, Jane had recorded a total of 4 + 2 = 6 hours of programs, and she had\nviewed between 1 + 2 = 3 hours and 2 + 3 = 5 hours of these programs. Therefore, the\nnumber of hours of recorded programs that Jane had not yet viewed by the end of Friday was\nbetween 6 \u2212 5 = 1 and 6 \u2212 3 = 3.\nThe correct answer is E."},{"n":85,"s":"Quan","t":"Problem Solving","d":"E","topic":"Algebra Applied Problems; First-Degree Equations","q":"A dance troupe has a total of 50 dancers split into 2 groups. The costumes worn by Group A\ncost $80 each, and those worn by Group B cost $90 each. If the total cost of all the costumes is\n$4,270, what is the total cost of the costumes worn by Group B?","opts":{"A":"$1,840","B":"$2,070","C":"$2,135","D":"$2,160","E":"$2,430"},"ans":"E","exp":"Let n be the number of dancers in Group B. Then the number of dancers in Group A is 50 \u2212 n,\nand we are given that (50 \u2212 n)($80) + (n)($90) = $4,270.\n(50 \u2212 n)(80) + 90n = 4,270\n(50 \u2212 n)(8) + 9n = 427\n400 \u2212 8n + 9n = 427\nn = 27\n\ngiven\ndivide both sides by 10\ndistributive law\ncombine like terms and subtract 400 from each side\n\nTherefore, the total cost of the costumes worn by Group B is 27($90) = $2,430.\nThe correct answer is E."},{"n":86,"s":"Quan","t":"Problem Solving","d":"E","topic":"Arithmetic Percents","q":"A doctor prescribed 18 cubic centimeters of a certain drug to a patient whose body weight\nwas 120 pounds. If the typical dosage is 2 cubic centimeters per 15 pounds of body weight, by\nwhat percent was the prescribed dosage greater than the typical dosage?\nA.\n\n8%\n\nB.\n\n9%\n\nC. 11%\nD. 12.5%\nE. 14.8%","opts":{"C":"11%","D":"12.5%","E":"14.8%"},"ans":"D","exp":"If the typical dosage is 2 cubic centimeters per 15 pounds of body weight, then the typical\ndosage for a person who weighs 120 pounds is 2\n\n= 2(8) = 16 cubic centimeters. The\n\nprescribed dosage of 18 cubic centimeters is, therefore,\n\n% or 12.5%\n\ngreater than the typical dosage.\nThe correct answer is D."},{"n":87,"s":"Quan","t":"Problem Solving","d":"E","topic":"Algebra Functions","q":"The function f is defined by f(x) =\n\u2013 10 for all positive numbers x. If u =\npositive numbers t and u, what is t in terms of u?\n\nfor some\n\nA.","opts":{},"ans":"D","exp":"Because f(x) =\nsubstitution, u =\n\n\u2013 10, it follows that f(t) =\n. The problem states that u = f(t), so by\n. To express t in terms of u, isolate t on one side of the equation:\nu\n\n=\n\ngiven\n\nu + 10 =\n\nadd 10 to both sides\n\n(u + 10)2 = t\n\nsquare both sides\n\nTherefore, t in terms of u is (u + 10)2.\nThe correct answer is D."},{"n":88,"s":"Quan","t":"Problem Solving","d":"E","topic":"Algebra Applied Problems","q":"John, Karen, and Luke collected cans of vegetables for a food drive. The number of cans that\nJohn collected was the number of cans that Karen collected and the number of cans that\nLuke collected. The number of cans that Luke collected was what fraction of the total number\nof cans that John, Karen, and Luke collected?\nA.\nB.\nC.\nD.\nE.","opts":{},"ans":"D","exp":"Let J, K, and L represent the number of cans collected, respectively, by John, Karen, and Luke.\nWe are given (i) J = K and (ii) J =\n\nL. Luke\u2019s fraction of the total number is\n\n. The\n\nvalue of this fraction can be found by expressing each of J, K, and L in terms of a single\nvariable and then canceling that variable. Since L appears twice in\n\nand J is already in\n\nterms of L by (ii), it will be quickest to express each of J, K, and L in terms of L. To obtain K in\nterms of L, first solve for K in equation (i) to get K = 2J and then substitute L for J to get K =\n2J = 2\n\n= L.\n\nUsing J =\n\nL and K =\n\nL, it follows that\n\n\f\nAlternatively, from the answer choices we can assume that\nvalue, and thus any values for J, K, and L that satisfy (i)\n\nhas a unique numerical\nand (ii)\n\ncan be used to\n\nfind this unique numerical value. For example, if we choose K = 2, then from (i) we have J = 1,\nand now using J = 1 and (ii) we get L = 3. Substituting K = 2, J = 1, and L = 3 into\ngives\n\n.\n\nThe correct answer is D."},{"n":89,"s":"Quan","t":"Problem Solving","d":"E","topic":"Arithmetic Properties of Integers","q":"The product P of two prime numbers is between 9 and 55. If one of the prime numbers is\ngreater than 2 but less than 6 and the other is greater than 13 but less than 25, then P =","opts":{"A":"15","B":"33","C":"34","D":"46","E":"51"},"ans":"E","exp":"The only prime numbers greater than 2 but less than 6 are 3 and 5. The only prime numbers\ngreater than 13 but le
